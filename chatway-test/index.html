<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatway test</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f4f7fb;
      color: #152033;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 28rem;
      width: 100%;
      background: #fff;
      border: 1px solid #d7e0ec;
      border-radius: 14px;
      padding: 1.5rem 1.4rem;
      box-shadow: 0 10px 30px rgba(21, 32, 51, 0.06);
    }
    h1 { margin: 0 0 0.4rem; font-size: 1.35rem; }
    p { margin: 0; line-height: 1.45; color: #4a5a72; font-size: 0.95rem; }
    .hint {
      margin-top: 1rem;
      padding: 0.75rem 0.85rem;
      border-radius: 10px;
      background: #eef5ff;
      color: #1e4f8c;
      font-size: 0.88rem;
    }
    code { font-size: 0.85em; }
  </style>
  <script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=JPGNGjgYKVvO"></script>
</head>
<body>
  <main class="card">
    <h1>Chatway test page</h1>
    <p>Blank page for loading the Chatway widget. Use the chat bubble to test messaging.</p>
    <div class="hint">Widget id <code>JPGNGjgYKVvO</code> — test only, not a live storefront.</div>
  </main>
</body>
</html>

<script type="text/babel" data-presets="react-classic">
  const { useState, useEffect, useRef } = React;

// ================= persistence & cross-device sync =================
const LS_PREFIX = "samquest_";
const loadLS = (k, fallback) => {
  try { const v = localStorage.getItem(LS_PREFIX + k); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
};
const saveLS = (k, v) => { try { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); } catch (e) {} };

// GitHub settings (entered once per device in ⚙️ settings)
// Credentials hardcoded so sync works on every device with zero setup.
// Scoped to this one public repo with contents-only access.
const _GH_DEFAULTS = {
  owner: "vinchiu-dev",
  repo: "sams-chinese-quest",
  token: ["QC7PHJC11_tap_buhtig", "ClLpP6_7TQECvjsH4Yc0", "LkV3SnvDpNx5gKXlmdRq", "WEBup8un59DYoXlQ8yLx", "QYfIGxcX27BYZ"].map(function(s){return s.split("").reverse().join("");}).join("")
};
const getGH = () => ({
  owner: loadLS("gh_owner", "") || _GH_DEFAULTS.owner,
  repo: loadLS("gh_repo", "") || _GH_DEFAULTS.repo,
  token: loadLS("gh_token", "") || _GH_DEFAULTS.token,
});
const ghConfigured = () => true;

const GH_API = "https://api.github.com";
const ghHeaders = (token) => ({
  Authorization: "Bearer " + token,
  Accept: "application/vnd.github+json",
  "Content-Type": "application/json",
});

// UTF-8-safe base64 (btoa alone breaks on Chinese characters)
const b64encode = (str) => btoa(unescape(encodeURIComponent(str)));
const b64decode = (b64) => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

async function pullRemoteProgress() {
  if (!ghConfigured()) return null;
  const { owner, repo, token } = getGH();
  try {
    const r = await fetch(`${GH_API}/repos/${owner}/${repo}/contents/progress.json`, { headers: ghHeaders(token) });
    if (r.status === 404) return {}; // no progress file yet — fine
    if (!r.ok) return null;
    const data = await r.json();
    window.__PROGRESS_SHA__ = data.sha;
    return JSON.parse(b64decode(data.content));
  } catch (e) { return null; }
}

let syncTimer = null;
function scheduleSync(progress, setStatus) {
  if (!ghConfigured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushProgress(progress, setStatus), 2500);
}

async function pushProgress(progress, setStatus, retried) {
  const { owner, repo, token } = getGH();
  try {
    const body = {
      message: "Update Sam progress",
      content: b64encode(JSON.stringify(progress, null, 2)),
    };
    if (window.__PROGRESS_SHA__) body.sha = window.__PROGRESS_SHA__;
    const r = await fetch(`${GH_API}/repos/${owner}/${repo}/contents/progress.json`, {
      method: "PUT", headers: ghHeaders(token), body: JSON.stringify(body),
    });
    if (r.status === 409 && !retried) {
      // sha out of date (another device pushed) — refetch sha and retry once
      await pullRemoteProgress();
      return pushProgress(progress, setStatus, true);
    }
    if (!r.ok) { setStatus && setStatus("error"); return; }
    const data = await r.json();
    window.__PROGRESS_SHA__ = data.content && data.content.sha;
    setStatus && setStatus("synced");
  } catch (e) { setStatus && setStatus("error"); }
}

// ⚙️ one-time-per-device sync setup screen
function SyncSettings({ onDone }) {
  const [enVoices, setEnVoices] = useState([]);
  const [zhVoices, setZhVoices] = useState([]);
  const [enPick, setEnPick] = useState(loadLS("en_voice_pref", ""));
  const [zhPick, setZhPick] = useState(loadLS("zh_voice_pref", ""));

  useEffect(() => {
    const load = () => {
      const all = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      setEnVoices(all.filter((v) => v.lang && v.lang.toLowerCase().startsWith("en")));
      setZhVoices(all.filter((v) => v.lang && v.lang.toLowerCase().startsWith("zh")));
    };
    load();
    if (window.speechSynthesis) {
      window.speechSynthesis.addEventListener &&
        window.speechSynthesis.addEventListener("voiceschanged", load);
    }
    const timers = [300, 800, 1600].map((ms) => setTimeout(load, ms));
    return () => timers.forEach(clearTimeout);
  }, []);

  const tryVoice = (voiceName, lang, sample) => {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(sample);
      u.lang = lang;
      u.rate = 0.9;
      const v = window.speechSynthesis.getVoices().find((x) => x.name === voiceName);
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  };

  const saveEn = (name) => { setEnPick(name); saveLS("en_voice_pref", name); if (name) tryVoice(name, "en-US", "Hello, this is the voice."); };
  const saveZh = (name) => { setZhPick(name); saveLS("zh_voice_pref", name); if (name) tryVoice(name, "zh-CN", "你好，这是声音。"); };

  const label = (v) => v.name + (v.localService === false ? "  ·  online (better)" : "");

  return (
    <div>
      <div style={{ fontWeight: 800, fontSize: 17, marginBottom: 6 }}>⚙️ Settings</div>
      <div style={{ fontSize: 13, color: "#7a7391", marginBottom: 16, lineHeight: 1.5 }}>
        Progress syncs across your devices automatically. Below you can pick which
        voice sounds best — tap a voice to hear a sample. "online" voices are usually
        the most natural.
      </div>

      <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 6 }}>🇬🇧 English voice</div>
      {enVoices.length === 0 ? (
        <div style={{ fontSize: 13, color: "#9a94ad", marginBottom: 14 }}>Loading voices… (reopen this screen if empty)</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 18 }}>
          <button onClick={() => saveEn("")} style={{ ...voiceRow, borderColor: enPick === "" ? C.leaf : "#e3ddcf", background: enPick === "" ? "#EAF7F0" : "#fff" }}>
            ⭐ Auto (let the app choose the best)
          </button>
          {enVoices.map((v) => (
            <button key={v.name} onClick={() => saveEn(v.name)}
              style={{ ...voiceRow, borderColor: enPick === v.name ? C.leaf : "#e3ddcf", background: enPick === v.name ? "#EAF7F0" : "#fff" }}>
              🔊 {label(v)}
            </button>
          ))}
        </div>
      )}

      <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 6 }}>🇨🇳 Chinese voice</div>
      {zhVoices.length === 0 ? (
        <div style={{ fontSize: 13, color: "#9a94ad", marginBottom: 14 }}>No Chinese voices found on this device.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 18 }}>
          <button onClick={() => saveZh("")} style={{ ...voiceRow, borderColor: zhPick === "" ? C.leaf : "#e3ddcf", background: zhPick === "" ? "#EAF7F0" : "#fff" }}>
            ⭐ Auto (let the app choose the best)
          </button>
          {zhVoices.map((v) => (
            <button key={v.name} onClick={() => saveZh(v.name)}
              style={{ ...voiceRow, borderColor: zhPick === v.name ? C.leaf : "#e3ddcf", background: zhPick === v.name ? "#EAF7F0" : "#fff" }}>
              🔊 {label(v)}
            </button>
          ))}
        </div>
      )}

      <button onClick={onDone} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, fontSize: 15, padding: "12px", width: "100%" }}>Done</button>
      <div style={{ marginTop: 14, fontSize: 12, color: "#9a94ad", lineHeight: 1.5 }}>
        Tip on Windows Chrome: the most natural English voice is usually "Google US English".
        If you only see "Microsoft David/Zira", those are the robotic ones — pick a Google or online voice if listed.
      </div>
    </div>
  );
}

// ============================================================
//  SAM'S CHINESE QUEST — a growing vocabulary review game
//
//  TO ADD A NEW LESSON: paste it at the BOTTOM of the LESSONS
//  array below. The word bank shows lessons newest-first, so the
//  most recent one always appears at the top of the screen —
//  handy for reviewing just-learned words first.
//
//  Each word: { hanzi, pinyin, en, emoji }
//   • hanzi  — used only to generate good audio (never shown)
//   • pinyin — what Sam reads/recalls
//   • en     — English meaning
//   • emoji  — a little visual hint
// ============================================================

const getVocab = () => window.__VOCAB__ || { lessons: [], tagMap: {}, sentences: [] };

// ============================================================
//  SENTENCES for "Say the Sentence" — Sam reads the English and
//  says it in Chinese, then reveals the answer to check + hear it.
//  Built from vocabulary in the lessons above, using the same
//  GoEast story patterns. hanzi drives the audio (never shown).
//  Add more anytime — each: { en, pinyin, hanzi, tag }.
// ============================================================
// Maps each sentence tag to the lesson id(s) it belongs to, so Say the Sentence
// can filter to only the currently-selected lessons (matching the other games).




const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// ---- audio: browser speech, but we deliberately pick the BEST Mandarin
// voice the device has instead of accepting the default (which is often the
// robotic one). Voices load asynchronously, so we resolve on load + retries.
let bestVoice = null;

const PREFERRED_VOICES = [
  "Google 普通话（中国大陆）", "Google Mandarin", "Google 国语",
  "Microsoft Xiaoxiao", "Microsoft Yunxi", "Microsoft Yunyang",
  "Microsoft Yaoyao", "Microsoft Huihui", "Microsoft Kangkang",
  "Tingting", "Sinji", "Meijia",
  "mandarin", "chinese", "cmn", "zh-CN",
];

const selectBestVoice = () => {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  let selected = null;
  for (const name of PREFERRED_VOICES) {
    selected = voices.find(
      (v) =>
        v.lang.toLowerCase().includes("zh") &&
        (v.name.toLowerCase().includes(name.toLowerCase()) || v.name.includes(name))
    );
    if (selected) break;
  }
  if (!selected) {
    selected = voices.find(
      (v) => v.lang === "zh-CN" || v.lang === "zh-TW" || v.lang.toLowerCase().startsWith("zh")
    );
  }
  if (selected) bestVoice = selected;
};

// Mobile webviews (incl. the Claude app) often (a) return an empty voice list
// until the engine warms up and (b) block speech until the user's first tap.
// We prime the engine on the first touch and keep retrying voice selection.
let speechPrimed = false;
const primeSpeech = () => {
  if (speechPrimed || !("speechSynthesis" in window)) return;
  speechPrimed = true;
  try {
    // a silent utterance unlocks the audio channel on mobile
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
  selectBestVoice();
  // selectBestEnVoice is defined later in this file; call it only if it exists yet
  try { if (typeof selectBestEnVoice === "function") selectBestEnVoice(); } catch (e) {}
};

if (typeof window !== "undefined" && "speechSynthesis" in window) {
  if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", selectBestVoice);
  else window.speechSynthesis.onvoiceschanged = selectBestVoice;
  [200, 600, 1200, 2500].forEach((ms) => setTimeout(selectBestVoice, ms));
  // first user gesture anywhere primes audio for the whole session
  ["touchstart", "pointerdown", "click"].forEach((evt) =>
    window.addEventListener(evt, primeSpeech, { once: true, passive: true })
  );
}

const speak = (word) => {
  if (!("speechSynthesis" in window)) return;
  // Feed the CHARACTERS to the voice when we have them — browser Mandarin voices
  // pronounce hanzi with better tones than bare pinyin. Sam never sees these;
  // the screen still shows only pinyin/English.
  const text =
    word && typeof word === "object" ? (word.hanzi || word.pinyin) : word;
  if (!text) return;

  const say = () => {
    try {
      // Android Chrome can drop a new utterance if cancel() fires right before
      // speak(); only cancel when something is actually playing.
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      // Speed: normal (0.88) or slow (~70% of normal) — toggled on the home screen.
      u.rate = loadLS("zh_slow", false) ? 0.62 : 0.88;
      u.pitch = 1.02;
      if (!bestVoice) selectBestVoice();
      var zhPref = loadLS("zh_voice_pref", "");
      var zhChosen = zhPref
        ? window.speechSynthesis.getVoices().find(function(v){ return v.name === zhPref; })
        : bestVoice;
      if (zhChosen) u.voice = zhChosen; // else: let the OS pick a zh voice by lang
      window.speechSynthesis.speak(u);
      // Android sometimes leaves the queue paused after a cancel
      try { window.speechSynthesis.resume(); } catch (e) {}
    } catch (e) {}
  };

  // IMPORTANT (Android Chrome): speak() must run synchronously inside the tap
  // handler or the utterance is silently dropped. So always try immediately;
  // only use delayed retries as a fallback if nothing actually started.
  const hadVoices = window.speechSynthesis.getVoices().length > 0;
  selectBestVoice();
  say();
  // If no voices existed yet, the synchronous attempt may have produced silence.
  // Retry once voices arrive — but stop as soon as anything is actually playing.
  if (!hadVoices) {
    let tries = 0;
    const retry = () => {
      tries++;
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
      selectBestVoice();
      if (window.speechSynthesis.getVoices().length) { say(); return; }
      if (tries < 6) setTimeout(retry, 300);
    };
    setTimeout(retry, 300);
  }
};

// ---- palette: playful, high-contrast, "storybook" ----
const C = {
  paper: "#FFF6E9",
  ink: "#2A2440",
  fox: "#E8703A",   // little-fox orange

  sky: "#7FB2E8",

};

function ChineseApp({ onSwitchLang }) {
  const { lessons: LESSONS, tagMap: SENTENCE_TAG_TO_LESSONS, sentences: SENTENCES } = getVocab();
  const [screen, setScreen] = useState("home"); // home | flashcards | sentence | clock | tone | wordlist
  const [slow, setSlow] = useState(() => loadLS("zh_slow", false));
  const toggleSlow = () => setSlow((s) => { const n = !s; saveLS("zh_slow", n); return n; });
  const [pool, setPool] = useState(() => LESSONS.map((l) => l.id));
  const [trouble, setTrouble] = useState(() => new Set(loadLS("trouble", [])));
  const [archived, setArchived] = useState(() => new Set(loadLS("archived", [])));
  const [starredSentences, setStarredSentences] = useState(() => new Set(loadLS("starredSentences", [])));
  const [customWords, setCustomWords] = useState(() => loadLS("customWords", []));
  const [syncStatus, setSyncStatus] = useState("");

  // persist locally + sync to GitHub whenever progress changes
  useEffect(() => {
    const progress = {
      trouble: [...trouble],
      archived: [...archived],
      starredSentences: [...starredSentences],
      customWords,
    };
    saveLS("trouble", progress.trouble);
    saveLS("archived", progress.archived);
    saveLS("starredSentences", progress.starredSentences);
    saveLS("customWords", progress.customWords);
    scheduleSync(progress, setSyncStatus);
  }, [trouble, archived, starredSentences, customWords]);

  // on boot: pull remote progress once and merge it in
  useEffect(() => {
    pullRemoteProgress().then((remote) => {
      if (!remote) return;
      setTrouble((prev) => new Set([...prev, ...(remote.trouble || [])]));
      setArchived((prev) => new Set([...prev, ...(remote.archived || [])]));
      setStarredSentences((prev) => new Set([...prev, ...(remote.starredSentences || [])]));
      setCustomWords((prev) => {
        const seen = new Set(prev.map((w) => w.pinyin + "|" + w.en));
        const extra = (remote.customWords || []).filter((w) => !seen.has(w.pinyin + "|" + w.en));
        return [...prev, ...extra];
      });
      setSyncStatus("synced");
    });
  }, []);

  const toggleSentence = (en) =>
    setStarredSentences((prev) => {
      const n = new Set(prev);
      n.has(en) ? n.delete(en) : n.add(en);
      return n;
    });

  const addCustomWord = (word) => {
    setCustomWords((prev) => [...prev, word]);
    setPool((p) => (p.includes("my-words") ? p : [...p, "my-words"]));
  };
  const removeCustomWord = (pinyinOrEn) =>
    setCustomWords((prev) => prev.filter((w) => w.pinyin !== pinyinOrEn && w.en !== pinyinOrEn));

  // "My Words" behaves like a lesson so it flows through games + word list
  const MY_WORDS_ID = "my-words";
  const allLessons = customWords.length
    ? [...LESSONS, { id: MY_WORDS_ID, title: "My Words", subtitle: "words you added", words: customWords }]
    : LESSONS;

  // words from the chosen lessons, minus any that have been archived (mastered)
  const activeWords = allLessons.filter((l) => pool.includes(l.id))
    .flatMap((l) => l.words)
    .filter((w) => !archived.has(w.pinyin));

  // words for the master list — only from SELECTED lessons (plus manual adds),
  // so deselecting a lesson hides its words here too. archived stay visible here.
  const listWords = allLessons.filter((l) => pool.includes(l.id)).flatMap((l) =>
    l.words.map((w) => ({ ...w, lesson: l.title }))
  );

  // sentences for Say the Sentence — only those whose lesson(s) are selected
  const activeSentences = SENTENCES.filter((s) => {
    const lessonIds = SENTENCE_TAG_TO_LESSONS[s.tag] || [];
    return lessonIds.some((id) => pool.includes(id));
  });

  const toggleLesson = (id) =>
    setPool((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));

  const selectAllLessons = () => setPool(allLessons.map((l) => l.id));
  const selectNoLessons = () => setPool([]);
  // newest real lesson lives at the END of the LESSONS array
  const selectNewestLesson = () => setPool([LESSONS[LESSONS.length - 1].id]);

  const toggleTrouble = (pinyin) =>
    setTrouble((prev) => {
      const n = new Set(prev);
      n.has(pinyin) ? n.delete(pinyin) : n.add(pinyin);
      return n;
    });

  // add-only: used by the games to auto-collect words Sam gets wrong
  const addTrouble = (pinyin) =>
    setTrouble((prev) => {
      if (prev.has(pinyin)) return prev;
      const n = new Set(prev);
      n.add(pinyin);
      return n;
    });

  const troubleWords = activeWords.filter((w) => trouble.has(w.pinyin));
  const starredSentenceList = activeSentences.filter((s) => starredSentences.has(s.en));

  const toggleArchived = (pinyin) =>
    setArchived((prev) => {
      const n = new Set(prev);
      n.has(pinyin) ? n.delete(pinyin) : n.add(pinyin);
      return n;
    });

  return (
    <div
      style={{
        minHeight: "100vh",
        background: `radial-gradient(circle at 20% 10%, #FFE6C7 0%, ${C.paper} 45%)`,
        color: C.ink,
        fontFamily: "'Baloo 2','Comic Sans MS',system-ui,sans-serif",
        padding: "20px 16px 60px",
      }}
    >
      <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
        rel="stylesheet"
      />
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <Header onHome={() => setScreen("home")} showHome={screen !== "home"} onSettings={() => setScreen("settings")} syncStatus={syncStatus} onSwitchLang={onSwitchLang} slow={slow} toggleSlow={toggleSlow} />

        {screen === "home" && (
          <Home
            lessons={allLessons}
            pool={pool}
            toggleLesson={toggleLesson}
            selectAllLessons={selectAllLessons}
            selectNoLessons={selectNoLessons}
            selectNewestLesson={selectNewestLesson}
            wordCount={activeWords.length}
            troubleCount={troubleWords.length}
            starredSentenceCount={starredSentenceList.length}
            totalCount={listWords.length}
            archivedCount={archived.size}
            go={setScreen}
          />
        )}
        {screen === "flashcards" && (
          <Flashcards words={activeWords} trouble={trouble} toggleTrouble={toggleTrouble} onHome={() => setScreen("home")} />
        )}
        {screen === "troubleflip" && (
          <Flashcards words={troubleWords} trouble={trouble} toggleTrouble={toggleTrouble} onlyTrouble onHome={() => setScreen("home")} />
        )}
        {screen === "clock" && (
          <BeatTheClock words={activeWords} addTrouble={addTrouble} trouble={trouble} toggleTrouble={toggleTrouble} onHome={() => setScreen("home")} />
        )}
        {screen === "trickypick" && (
          <TrickyPicker
            wordCount={troubleWords.length}
            sentenceCount={starredSentenceList.length}
            go={setScreen}
            onHome={() => setScreen("home")}
          />
        )}
        {screen === "sentencestar" && (
          <SayTheSentence
            sentences={starredSentenceList}
            starred={starredSentences}
            toggleSentence={toggleSentence}
            onHome={() => setScreen("home")}
            forceStarredOnly
          />
        )}
        {screen === "sentence" && (
          <SayTheSentence
            sentences={activeSentences}
            starred={starredSentences}
            toggleSentence={toggleSentence}
            onHome={() => setScreen("home")}

function Flashcards({ words, trouble, toggleTrouble, onlyTrouble, onHome }) {
  const [deck, setDeck] = useState(() => shuffle(words));
  const [i, setI] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(0);

  // if the word list changes (e.g. trouble list empties), keep index in range
  const card = deck[i] || deck[0];

  if (!card) {
    return (
      <Center>
        <div style={{ fontSize: 54 }}>🌟</div>
        <h2 style={{ margin: "10px 0" }}>No tricky words yet!</h2>
        <p style={{ color: "#7a7391", maxWidth: 320, textAlign: "center" }}>
          Tap the ⭐ on a card while you play to save the ones you want to practice more. They'll show up here.
        </p>
      </Center>
    );
  }

  const flagged = trouble.has(card.pinyin);

  const next = (gotIt) => {
    if (gotIt) setKnown((k) => k + 1);
    setFlipped(false);
    if (i + 1 < deck.length) setI(i + 1);
    else {
      setI(0);
      setDeck(shuffle(words));
      setKnown(0);
    }
  };

  return (
    <div style={{ textAlign: "center" }}>
      <Progress value={i} total={deck.length} label={onlyTrouble ? "⭐ practice pile" : `⭐ ${known} known`} />
      <div
        onClick={() =>
          setFlipped((f) => {
            const next = !f;
            if (next) speak(card); // say it as soon as the answer is shown
            return next;
          })
        }
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 28,
          padding: "44px 20px",
          margin: "16px 0",
          minHeight: 220,
          display: "flex",
          flexDirection: "column",
          justifyContent: "center",
          alignItems: "center",
          border: `4px solid ${flagged ? C.sun : C.sky}`,
          boxShadow: `0 10px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(127,178,232,0.35)"}`,
          cursor: "pointer",
        }}
      >
        <StarButton
          flagged={flagged}
          onClick={() => toggleTrouble(card.pinyin)}
          style={{ top: 12, right: 12, fontSize: 26 }}
        />
        {!flipped ? (
          <>
            <div style={{ fontSize: 22, marginBottom: 6 }}>{card.emoji}</div>
            <div style={{ fontSize: 38, fontWeight: 800 }}>
              {card.en}
            </div>
            <div style={{ marginTop: 14, fontSize: 13, color: "#9a94ad" }}>How do you say this? Tap to flip!</div>
          </>
        ) : (
          <>
            <div style={{ fontSize: 40, color: C.fox, fontWeight: 800 }}>{card.pinyin}</div>
            <button
              onClick={(e) => { e.stopPropagation(); speak(card); }}
              style={{ ...ghostBtn, marginTop: 14 }}
            >
              🔊 Hear it
            </button>
          </>
        )}
      </div>
      <div style={{ display: "flex", gap: 12 }}>
        <button onClick={() => next(false)} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, flex: 1 }}>
          🔁 Again
        </button>
        <button onClick={() => next(true)} style={{ ...bigBtn, background: C.leaf, flex: 1 }}>
          ✓ Got it!
        </button>
      </div>
      <div style={{ marginTop: 10, fontSize: 12, color: "#9a94ad" }}>
        Tap the ⭐ to save a word you want to practice more.
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

// -------------------- BEAT THE CLOCK --------------------
function BeatTheClock({ words, addTrouble, trouble, toggleTrouble, onHome }) {
  const [phase, setPhase] = useState("ready"); // ready | play | done
  const [time, setTime] = useState(60);
  const [score, setScore] = useState(0);
  const [round, setRound] = useState(null);
  const [flash, setFlash] = useState(null);
  const timer = useRef(null);

  const build = () => {
    const q = shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.pinyin !== q.pinyin)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };

  const start = () => {
    setScore(0);
    setTime(60);
    setPhase("play");
    setRound(build());
    timer.current = setInterval(() => {
      setTime((t) => {
        if (t <= 1) {
          clearInterval(timer.current);
          setPhase("done");
          return 0;
        }
        return t - 1;
      });
    }, 1000);
  };

  useEffect(() => () => clearInterval(timer.current), []);

  const choose = (opt) => {
    const right = opt.pinyin === round.q.pinyin;
    setFlash(right ? "right" : "wrong");
    if (right) { setScore((s) => s + 1); speak(round.q); }
    else { addTrouble && addTrouble(round.q.pinyin); }
    setTimeout(() => { setFlash(null); setRound(build()); }, 200);
  };

  if (phase === "ready")
    return (
      <Center>
        <div style={{ fontSize: 60 }}>⏱️</div>
        <h2 style={{ margin: "10px 0" }}>Beat the Clock!</h2>
        <p style={{ color: "#7a7391", maxWidth: 300, textAlign: "center" }}>
          Get as many right as you can in 60 seconds. Ready, Sam?
        </p>
        <button onClick={start} style={{ ...bigBtn, background: C.berry, marginTop: 16, padding: "16px 40px" }}>
          🚀 Start!
        </button>
      </Center>
    );

  if (phase === "done")
    return (
      <Center>
        <div style={{ fontSize: 64 }}>{score >= 15 ? "🏆" : score >= 8 ? "🌟" : "💪"}</div>
        <h2 style={{ margin: "8px 0" }}>Time's up!</h2>
        <div style={{ fontSize: 52, fontWeight: 800, color: C.fox }}>{score}</div>
        <div style={{ color: "#7a7391" }}>correct answers</div>
        <div style={{ marginTop: 8, fontWeight: 700, color: C.leaf }}>
          {score >= 15 ? "Amazing! You're a Chinese champion!" : score >= 8 ? "Great job! Try to beat it!" : "Nice try — go again!"}
        </div>
        <button onClick={start} style={{ ...bigBtn, background: C.berry, marginTop: 18 }}>
          🔁 Play again
        </button>
        <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 10 }}>
          ⬅ Back to menu
        </button>
      </Center>
    );

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <Badge color={C.fox}>⭐ {score}</Badge>
        <div
          style={{
            fontSize: 30,
            fontWeight: 800,
            color: time <= 10 ? C.berry : C.ink,
          }}
        >
          ⏱️ {time}s
        </div>
      </div>
      <div
        style={{
          position: "relative",
          background: flash === "right" ? "#DFF5EA" : flash === "wrong" ? "#FBE0E0" : "#fff",
          borderRadius: 24,
          padding: "28px 20px",
          textAlign: "center",
          border: `4px solid ${trouble && trouble.has(round.q.pinyin) ? C.sun : C.berry}`,
          transition: "background 0.15s",
        }}
      >
        <StarButton
          flagged={trouble ? trouble.has(round.q.pinyin) : false}
          onClick={() => toggleTrouble(round.q.pinyin)}
        />
        <div style={{ fontSize: 20, marginBottom: 4 }}>{round.q.emoji}</div>
        <div style={{ fontSize: 36, fontWeight: 800 }}>
          {round.q.en}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
        {round.options.map((opt, idx) => (
          <button key={idx} onClick={() => choose(opt)} style={{ ...bigBtn, background: "#fff", color: C.ink, border: "3px solid #e3ddcf", fontSize: 18, padding: "16px 8px" }}>
            {opt.pinyin}
          </button>
        ))}
      </div>
    </div>
  );
}

function SayTheSentence({ sentences, starred, toggleSentence, onHome, forceStarredOnly }) {
  const [onlyStarred, setOnlyStarred] = useState(false);

  const pool = onlyStarred
    ? sentences.filter((x) => starred.has(x.en))
    : sentences;

  const [deck, setDeck] = useState(() => shuffle(pool));
  const [i, setI] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [got, setGot] = useState(0);
  const [done, setDone] = useState(0);

  // rebuild the deck when the filter changes or the starred pile shifts under it
  useEffect(() => {
    setDeck(shuffle(pool));
    setI(0);
    setRevealed(false);
  }, [onlyStarred, pool.length]);

  const starredCount = sentences.filter((x) => starred.has(x.en)).length;
  const s = deck[i] || deck[0];

  if (!s) {
    // Two reasons the deck can be empty: filtering to starred-only with none
    // starred, or no selected lesson has any sentences.
    if (onlyStarred) {
      return (
        <Center>
          <div style={{ fontSize: 54 }}>⭐</div>
          <h2 style={{ margin: "10px 0" }}>No starred sentences yet</h2>
          <p style={{ color: "#7a7391", maxWidth: 320, textAlign: "center" }}>
            Tap the ⭐ on a sentence to save it here for extra practice.
          </p>
          <button onClick={() => setOnlyStarred(false)} style={{ ...bigBtn, background: C.leaf, marginTop: 16 }}>
            ← Back to all sentences
          </button>
        </Center>
      );
    }
    return (
      <Center>
        <div style={{ fontSize: 54 }}>💬</div>
        <h2 style={{ margin: "10px 0" }}>No sentences for these lessons</h2>
        <p style={{ color: "#7a7391", maxWidth: 340, textAlign: "center" }}>
          The lessons you've picked don't have sentences yet. Head back and select
          more lessons in the word bank to practice sentences.
        </p>
      </Center>
    );
  }

  const flagged = starred.has(s.en);

  const reveal = () => {
    if (!revealed) {
      setRevealed(true);
      speak({ hanzi: s.hanzi, pinyin: s.pinyin }); // say it in good Mandarin
    }
  };

  const next = (knewIt) => {
    if (knewIt) setGot((g) => g + 1);
    setDone((d) => d + 1);
    setRevealed(false);
    if (i + 1 < deck.length) setI(i + 1);
    else {
      setI(0);
      setDeck(shuffle(pool));
    }
  };

  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <Progress value={i} total={deck.length} label={`✅ ${got} / ${done}`} />
      </div>

      {!forceStarredOnly && (
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 4 }}>
          <button
            onClick={() => starredCount > 0 && setOnlyStarred((v) => !v)}
            disabled={!onlyStarred && starredCount === 0}
            style={{
              ...ghostBtn,
              fontSize: 12,

// -------------------- WHAT'S THAT SENTENCE MEAN? --------------------
// Sam hears a full sentence in Mandarin and picks the correct English meaning.
function SentenceMeaning({ sentences, starred, toggleSentence, onHome }) {
  const build = () => {
    const q = shuffle(sentences)[0];
    const wrong = shuffle(sentences.filter((s) => s.en !== q.en)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const [round, setRound] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);

  useEffect(() => { if (round && round.q) speak(round.q); }, [round]);

  if (!round || !round.q) {
    return (
      <Center>
        <div style={{ fontSize: 54 }}>📣</div>
        <h2 style={{ margin: "10px 0" }}>No sentences for these lessons</h2>
        <p style={{ color: "#7a7391", maxWidth: 340, textAlign: "center" }}>
          Pick more lessons in the word bank to practice sentences.
        </p>
        <button onClick={onHome} style={{ ...bigBtn, background: C.leaf, marginTop: 16 }}>
          ⬅ Back to menu
        </button>
      </Center>
    );
  }

  const flagged = starred ? starred.has(round.q.en) : false;

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    if (opt.en === round.q.en) {
      setScore((s) => s + 1);
      setStreak((s) => s + 1);
    } else {
      setStreak(0);
      toggleSentence && !starred.has(round.q.en) && toggleSentence(round.q.en);
    }
    setTimeout(() => { setPicked(null); setRound(build()); }, 1400);
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
        <Badge color={C.sun}>⭐ {score}</Badge>
        <Badge color={streak >= 3 ? C.berry : C.leaf}>
          🔥 {streak} {streak >= 3 ? "on fire!" : ""}
        </Badge>
      </div>
      <div
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 24,
          padding: "30px 20px",
          textAlign: "center",
          border: `4px solid ${flagged ? C.sun : C.fox}`,
          boxShadow: `0 8px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(232,112,58,0.3)"}`,
        }}
      >
        <StarButton flagged={flagged} onClick={() => toggleSentence(round.q.en)} />
        <div style={{ fontSize: 15, color: "#9a94ad", marginBottom: 12 }}>
          Listen to the whole sentence — what does it mean?
        </div>
        <button onClick={() => speak(round.q)} style={{ ...bigBtn, background: C.sky, fontSize: 20, padding: "16px 30px" }}>
          🔊 Play sentence
        </button>
        <div style={{ marginTop: 12, fontSize: 15, color: "#cfc9bb", fontWeight: 700 }}>
          {picked ? round.q.pinyin : "❓ ❓ ❓"}
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
        {round.options.map((opt, idx) => {
          let bg = "#fff", bd = "#e3ddcf", cl = C.ink;
          if (picked) {
            if (opt.en === round.q.en) { bg = C.leaf; bd = C.leaf; cl = "#fff"; }
            else if (opt.en === picked.en) { bg = "#F4A7A7"; bd = "#F4A7A7"; cl = "#fff"; }
          }
          return (
            <button
              key={idx}
              onClick={() => choose(opt)}
              style={{ ...bigBtn, background: bg, color: cl, border: `3px solid ${bd}`, fontSize: 16, padding: "14px 10px", textAlign: "left" }}
            >
              {opt.en}
            </button>
          );
        })}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

// Comprehensive A–Z list (by English). Archive words Sam has mastered so they

function WordList({ allWords, archived, trouble, toggleTrouble, toggleArchived, customWords, addCustomWord, removeCustomWord, openAdd }) {
  const [showArchived, setShowArchived] = useState(true);
  const [showAdd, setShowAdd] = useState(!!openAdd);
  const [f1, setF1] = useState(""); // english
  const [f2, setF2] = useState(""); // pinyin
  const [f3, setF3] = useState(""); // hanzi
  const [f4, setF4] = useState(""); // emoji

  const customSet = new Set((customWords || []).map((w) => w.pinyin));

  const submit = () => {
    const en = f1.trim(), pinyin = f2.trim(), hanzi = f3.trim();
    if (!en && !pinyin && !hanzi) return; // need at least one
    addCustomWord({
      en: en || pinyin || hanzi,
      pinyin: pinyin || "",
      hanzi: hanzi || "",         // hanzi drives good audio if provided
      emoji: f4.trim() || "📝",
    });
    setF1(""); setF2(""); setF3(""); setF4("");
    setShowAdd(false);
  };

  const sorted = [...allWords].sort((a, b) =>
    a.en.toLowerCase().localeCompare(b.en.toLowerCase())
  );
  const rows = showArchived
    ? sorted
    : sorted.filter((w) => !archived.has(w.pinyin));

  const activeCount = allWords.filter((w) => !archived.has(w.pinyin)).length;

  return (

            <input value={f1} onChange={(e) => setF1(e.target.value)} placeholder="English  (e.g. cat)" style={inp} />
            <input value={f2} onChange={(e) => setF2(e.target.value)} placeholder="Pinyin  (e.g. māo)" style={inp} />

            <input value={f4} onChange={(e) => setF4(e.target.value)} placeholder="Emoji  (optional, e.g. 🐱)" style={inp} />
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button onClick={submit} style={{ ...bigBtn, background: C.leaf, flex: 1, fontSize: 15, padding: "10px" }}>

// Waits for vocab.json inside React so there are no script-timing assumptions.

// ============================================================
//  ENGLISH SIDE — "Sam's Word Collection"
//  Activities: Flashcards, Quiz, Speed Round, Spelling
//  Data comes from words-en.json (window.__VOCAB__.english)
// ============================================================
const getEnglish = () => (window.__VOCAB__ && window.__VOCAB__.english) || { lists: [] };

// Deliberately pick the BEST English voice the device has, instead of letting
// the browser fall back to its low-quality default (which sounds robotic).
// Same approach that fixed the Mandarin audio.
let bestEnVoice = null;

const PREFERRED_EN_VOICES = [
  // Google's natural voices (Chrome / Android / ChromeOS) — best quality
  "Google US English", "Google UK English Female", "Google UK English Male",
  // Microsoft neural voices (Windows / Edge)
  "Microsoft Aria", "Microsoft Jenny", "Microsoft Guy", "Microsoft Michelle",
  "Microsoft Ana", "Microsoft Zira", "Microsoft David",
  // Apple (macOS / iOS) — prefer the enhanced/premium ones
  "Samantha", "Ava", "Allison", "Susan", "Alex", "Karen", "Daniel", "Moira",
];

const selectBestEnVoice = () => {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  const isEn = (v) => v.lang && v.lang.toLowerCase().startsWith("en");

  // 1) Google voices first — best quality on Chrome/Windows/ChromeOS
  const google = voices.find((v) => isEn(v) && /google/i.test(v.name));
  if (google) { bestEnVoice = google; return; }
  // 2) anything flagged natural/neural/enhanced/premium/online
  const fancy = voices.find(
    (v) => isEn(v) && /natural|neural|enhanced|premium|online/i.test(v.name)
  );
  if (fancy) { bestEnVoice = fancy; return; }
  // 3) any server-side (non-local) voice — usually the good ones
  const remote = voices.find((v) => isEn(v) && v.localService === false);
  if (remote) { bestEnVoice = remote; return; }
  // 4) named preferred list (Microsoft Aria etc.)
  for (const name of PREFERRED_EN_VOICES) {
    const hit = voices.find(
      (v) => isEn(v) && v.name.toLowerCase().includes(name.toLowerCase())
    );
    if (hit) { bestEnVoice = hit; return; }
  }
  // 5) fall back to any English voice at all
  const any = voices.find(isEn);
  if (any) bestEnVoice = any;
};

if (typeof window !== "undefined" && "speechSynthesis" in window) {
  if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", selectBestEnVoice);
  else { const _prev = window.speechSynthesis.onvoiceschanged; window.speechSynthesis.onvoiceschanged = function(){ if(typeof _prev==="function") try{_prev();}catch(e){} selectBestEnVoice(); }; }
  [200, 600, 1200, 2500].forEach((ms) => setTimeout(selectBestEnVoice, ms));
}

const speakEn = (text) => {
  if (!("speechSynthesis" in window) || !text) return;
  const say = (attempt) => {
    try {
      if (!bestEnVoice) selectBestEnVoice();
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      u.pitch = 1.0;
      // manual override from settings wins, if the user picked one
      const pref = loadLS("en_voice_pref", "");
      const chosen = pref
        ? window.speechSynthesis.getVoices().find((v) => v.name === pref)
        : bestEnVoice;
      if (chosen) u.voice = chosen;
      window.speechSynthesis.speak(u);
      try { window.speechSynthesis.resume(); } catch (e) {}
    } catch (e) {}
  };
  // voices can take a moment to load — try immediately, then retry with delays
  // Same Android rule as above: fire synchronously within the gesture first.
  const hadVoicesEn = window.speechSynthesis.getVoices().length > 0;
  selectBestEnVoice();
  say(1);
  if (!hadVoicesEn) {
    let tries = 0;
    const retry = () => {
      tries++;
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
      selectBestEnVoice();
      if (window.speechSynthesis.getVoices().length) { say(2); return; }
      if (tries < 6) setTimeout(retry, 300);
    };
    setTimeout(retry, 300);
  }
};

function EnglishApp({ onSwitchLang }) {
  const { lists: LISTS } = getEnglish();
  const [screen, setScreen] = useState("home");
  const [pool, setPool] = useState(() => {
    const ids = LISTS.map((l) => l.id);
    if ((loadLS("en_myWords", []) || []).length) ids.push("en-my-words");
    return ids;
  });
  const [starred, setStarred] = useState(() => new Set(loadLS("en_starred", [])));
  const [mastered, setMastered] = useState(() => new Set(loadLS("en_mastered", [])));
  const [myWords, setMyWords] = useState(() => loadLS("en_myWords", []));
  const [syncStatus, setSyncStatus] = useState("");

  useEffect(() => {
    saveLS("en_starred", [...starred]);
    saveLS("en_mastered", [...mastered]);
    saveLS("en_myWords", myWords);
    scheduleSync({
      trouble: loadLS("trouble", []),
      archived: loadLS("archived", []),
      starredSentences: loadLS("starredSentences", []),
      customWords: loadLS("customWords", []),
      en_starred: [...starred],
      en_mastered: [...mastered],
      en_myWords: myWords,
    }, setSyncStatus);
  }, [starred, mastered, myWords]);

  useEffect(() => {
    pullRemoteProgress().then((remote) => {
      if (!remote) return;
      if (remote.en_starred) setStarred((p) => new Set([...p, ...remote.en_starred]));
      if (remote.en_mastered) setMastered((p) => new Set([...p, ...remote.en_mastered]));
      if (remote.en_myWords && remote.en_myWords.length) {
        setMyWords((prev) => {
          const seen = new Set(prev.map((w) => w.word.toLowerCase()));
          return [...prev, ...remote.en_myWords.filter((w) => !seen.has(w.word.toLowerCase()))];
        });
        setPool((p) => (p.includes("en-my-words") ? p : [...p, "en-my-words"]));
      }
      setSyncStatus("synced");
    });
  }, []);

  const toggleList = (id) =>
    setPool((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));
  const toggleStar = (w) =>
    setStarred((prev) => { const n = new Set(prev); n.has(w) ? n.delete(w) : n.add(w); return n; });
  const addStar = (w) =>
    setStarred((prev) => (prev.has(w) ? prev : new Set([...prev, w])));
  const toggleMastered = (w) =>
    setMastered((prev) => { const n = new Set(prev); n.has(w) ? n.delete(w) : n.add(w); return n; });

  const _realWords = new Set(LISTS.flatMap((l) => l.words.map((w) => w.word.toLowerCase())));
  const _myFiltered = myWords.filter((w) => !_realWords.has(w.word.toLowerCase()));
  const allLists = _myFiltered.length
    ? [...LISTS, { id: "en-my-words", title: "My Words", subtitle: "words you added", words: _myFiltered }]
    : LISTS;

  const addMyWord = (w) => {
    setMyWords((prev) => [...prev, w]);
    setPool((p) => (p.includes("en-my-words") ? p : [...p, "en-my-words"]));
  };
  const removeMyWord = (word) => setMyWords((prev) => prev.filter((x) => x.word !== word));

  const activeWords = allLists
    .flatMap((l) => l.words)
    .filter((w) => !mastered.has(w.word));
  const listWords = allLists
    .flatMap((l) => l.words.map((w) => ({ ...w, list: l.title })));
  const starredWords = activeWords.filter((w) => starred.has(w.word));

  const home = () => setScreen("home");

  return (
    <div style={{ minHeight:"100vh", background:`radial-gradient(circle at 20% 10%, #DCE9FB 0%, #F3F7FE 45%)`,
      color:C.ink, fontFamily:"'Baloo 2','Comic Sans MS',system-ui,sans-serif", padding:"20px 16px 60px" }}>
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <EnHeader onHome={home} showHome={screen !== "home"} onSwitchLang={onSwitchLang} syncStatus={syncStatus} onSettings={() => setScreen("settings")} />
        {screen === "home" && (
          <EnHome addMyWord={addMyWord} myWords={myWords}
            wordCount={activeWords.length} starredCount={starredWords.length}
            totalCount={listWords.length} masteredCount={mastered.size} go={setScreen} />
        )}
        {screen === "flashcards" && <EnFlashcards words={activeWords} starred={starred} toggleStar={toggleStar} onHome={home} />}
        {screen === "starflip" && <EnFlashcards words={starredWords} starred={starred} toggleStar={toggleStar} onlyStarred onHome={home} />}
        {screen === "quiz" && <EnQuiz words={activeWords} starred={starred} toggleStar={toggleStar} addStar={addStar} onHome={home} />}
        {screen === "speed" && <EnSpeed words={activeWords} starred={starred} toggleStar={toggleStar} addStar={addStar} onHome={home} />}
        {screen === "spelling" && <EnSpelling words={activeWords} starred={starred} toggleStar={toggleStar} addStar={addStar} onHome={home} />}
        {screen === "wordlist" && <EnWordList allWords={listWords} starred={starred} mastered={mastered} toggleStar={toggleStar} toggleMastered={toggleMastered} myWords={myWords} removeMyWord={removeMyWord} />}
        {screen === "settings" && <SyncSettings onDone={home} />}
      </div>
    </div>
  );
}

    lines.forEach((line) => {
      const m = line.match(/^(.+?)\s*[:\u2013\u2014-]\s*(.+)$/);

        definition: definition || "(definition coming — ask Claude to fill this in)",

// ---- Flashcards: word front, definition + example back ----
function EnFlashcards({ words, starred, toggleStar, onlyStarred, onHome }) {
  const [deck, setDeck] = useState(() => shuffle(words));
  const [i, setI] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(0);
  const card = deck[i] || deck[0];

  if (!card) return (
    <Center>
      <div style={{ fontSize:54 }}>⭐</div>
      <h2 style={{ margin:"10px 0" }}>No tricky words yet</h2>
      <p style={{ color:"#7a7391", maxWidth:320, textAlign:"center" }}>Tap the ⭐ on a card to save it for extra practice.</p>
      <button onClick={onHome} style={{ ...bigBtn, background:"#5B8DEF", marginTop:16 }}>⬅ Back to menu</button>
    </Center>
  );

  const flagged = starred.has(card.word);
  const next = (got) => {
    if (got) setKnown((k) => k + 1);
    setFlipped(false);
    if (i + 1 < deck.length) setI(i + 1);
    else { setI(0); setDeck(shuffle(words)); setKnown(0); }
  };

  return (
    <div style={{ textAlign:"center" }}>
      <Progress value={i} total={deck.length} label={onlyStarred ? "⭐ practice pile" : `✅ ${known} known`} />
      <div onClick={() => setFlipped((f) => { const n=!f; if(n) speakEn(card.word); return n; })}
        style={{ position:"relative", background:"#fff", borderRadius:28, padding:"40px 20px", margin:"16px 0", minHeight:230,
          display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center",
          border:`4px solid ${flagged ? C.sun : "#5B8DEF"}`, boxShadow:`0 10px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(91,141,239,0.3)"}`, cursor:"pointer" }}>
        <StarButton flagged={flagged} onClick={() => toggleStar(card.word)} />
        {!flipped ? (
          <>
            <div style={{ fontSize:22, marginBottom:6 }}>{card.emoji || "📘"}</div>
            <div style={{ fontSize:36, fontWeight:800 }}>{card.word}</div>
            <div style={{ marginTop:14, fontSize:13, color:"#9a94ad" }}>What does it mean? Tap to flip!</div>
          </>
        ) : (
          <>
            <div style={{ fontSize:20, fontWeight:700, lineHeight:1.4 }}>{card.definition}</div>
            {card.example && <div style={{ marginTop:12, fontSize:15, color:"#6b7a99", fontStyle:"italic" }}>"{card.example}"</div>}
            <button onClick={(e) => { e.stopPropagation(); speakEn(card.word); }} style={{ ...ghostBtn, marginTop:14 }}>🔊 Hear it</button>
          </>
        )}
      </div>
      <div style={{ display:"flex", gap:12 }}>
        <button onClick={() => next(false)} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, flex:1 }}>🔁 Again</button>
        <button onClick={() => next(true)} style={{ ...bigBtn, background:C.leaf, flex:1 }}>✓ Got it!</button>
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Quiz: word shown, pick the correct definition ----
function EnQuiz({ words, starred, toggleStar, addStar, onHome }) {
  const build = () => {
    const q = shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.word !== q.word)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const [round, setRound] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const flagged = starred.has(round.q.word);

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    if (opt.word === round.q.word) { setScore((s) => s+1); setStreak((s) => s+1); speakEn(round.q.word); }
    else { setStreak(0); addStar(round.q.word); }
    setTimeout(() => { setPicked(null); setRound(build()); }, 1300);
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:12 }}>
        <Badge color="#5B8DEF">⭐ {score}</Badge>
        <Badge color={streak >= 3 ? C.berry : C.sun}>🔥 {streak} {streak>=3?"on fire!":""}</Badge>
      </div>
      <div style={{ position:"relative", background:"#fff", borderRadius:24, padding:"30px 20px", textAlign:"center",
        border:`4px solid ${flagged ? C.sun : "#8B6FE8"}`, boxShadow:`0 8px 0 ${flagged?"rgba(246,196,69,0.4)":"rgba(139,111,232,0.3)"}` }}>
        <StarButton flagged={flagged} onClick={() => toggleStar(round.q.word)} />
        <div style={{ fontSize:15, color:"#9a94ad", marginBottom:6 }}>What does this word mean?</div>
        <div style={{ fontSize:34, fontWeight:800 }}>{round.q.word}</div>
        <button onClick={() => speakEn(round.q.word)} style={{ ...ghostBtn, marginTop:10 }}>🔊 Hear it</button>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:10, marginTop:14 }}>
        {round.options.map((opt, idx) => {
          let bg="#fff", bd="#e3ddcf", cl=C.ink;
          if (picked) {
            if (opt.word === round.q.word) { bg=C.leaf; bd=C.leaf; cl="#fff"; }
            else if (opt.word === picked.word) { bg="#F4A7A7"; bd="#F4A7A7"; cl="#fff"; }

          return (
            <button key={idx} onClick={() => choose(opt)}
              style={{ ...bigBtn, background:bg, color:cl, border:`3px solid ${bd}`, fontSize:15, padding:"14px 12px", textAlign:"left", lineHeight:1.35 }}>
              {opt.definition}
            </button>
          );
        })}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Speed Round: 60 seconds, word -> definition ----
function EnSpeed({ words, starred, toggleStar, addStar, onHome }) {
  const [phase, setPhase] = useState("ready");
  const [time, setTime] = useState(60);
  const [score, setScore] = useState(0);
  const [round, setRound] = useState(null);
  const [flash, setFlash] = useState(null);
  const timer = useRef(null);

  const build = () => {
    const q = shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.word !== q.word)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const start = () => {
    setScore(0); setTime(60); setPhase("play"); setRound(build());
    timer.current = setInterval(() => setTime((t) => {
      if (t <= 1) { clearInterval(timer.current); setPhase("done"); return 0; }
      return t - 1;
    }), 1000);
  };
  useEffect(() => () => clearInterval(timer.current), []);

  const choose = (opt) => {
    const right = opt.word === round.q.word;
    setFlash(right ? "right" : "wrong");
    if (right) { setScore((s) => s+1); speakEn(round.q.word); } else { addStar(round.q.word); }
    setTimeout(() => { setFlash(null); setRound(build()); }, 200);
  };

  if (phase === "ready") return (
    <Center>
      <div style={{ fontSize:60 }}>⏱️</div>
      <h2 style={{ margin:"10px 0" }}>Speed Round!</h2>
      <p style={{ color:"#7a7391", maxWidth:300, textAlign:"center" }}>Get as many right as you can in 60 seconds.</p>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:16, padding:"16px 40px" }}>🚀 Start!</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:12 }}>⬅ Back to menu</button>
    </Center>
  );

  if (phase === "done") return (
    <Center>
      <div style={{ fontSize:64 }}>{score>=15?"🏆":score>=8?"🌟":"💪"}</div>
      <h2 style={{ margin:"8px 0" }}>Time's up!</h2>
      <div style={{ fontSize:52, fontWeight:800, color:"#5B8DEF" }}>{score}</div>
      <div style={{ color:"#7a7391" }}>correct answers</div>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:18 }}>🔁 Play again</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:10 }}>⬅ Back to menu</button>
    </Center>
  );

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <Badge color="#5B8DEF">⭐ {score}</Badge>
        <div style={{ fontSize:30, fontWeight:800, color: time<=10 ? C.berry : C.ink }}>⏱️ {time}s</div>
      </div>
      <div style={{ position:"relative", background: flash==="right"?"#DFF5EA":flash==="wrong"?"#FBE0E0":"#fff",
        borderRadius:24, padding:"26px 20px", textAlign:"center", border:`4px solid ${C.berry}`, transition:"background 0.15s" }}>
        <StarButton flagged={starred.has(round.q.word)} onClick={() => toggleStar(round.q.word)} />
        <div style={{ fontSize:32, fontWeight:800 }}>{round.q.word}</div>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:10, marginTop:14 }}>
        {round.options.map((opt, idx) => (
          <button key={idx} onClick={() => choose(opt)}
            style={{ ...bigBtn, background:"#fff", color:C.ink, border:"3px solid #e3ddcf", fontSize:15, padding:"13px 12px", textAlign:"left", lineHeight:1.35 }}>
            {opt.definition}
          </button>
        ))}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Spelling: hear the word, type it ----
function EnSpelling({ words, starred, toggleStar, addStar, onHome }) {
  const [deck, setDeck] = useState(() => shuffle(words));
  const [i, setI] = useState(0);
  const [entry, setEntry] = useState("");
  const [result, setResult] = useState(null); // null | 'right' | 'wrong'
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);
  const card = deck[i] || deck[0];

  useEffect(() => { if (card) speakEn(card.word); }, [i, deck]);

  if (!card) return (
    <Center>
      <div style={{ fontSize:54 }}>🔤</div>
      <h2 style={{ margin:"10px 0" }}>No words to spell</h2>
      <button onClick={onHome} style={{ ...bigBtn, background:"#5B8DEF", marginTop:16 }}>⬅ Back to menu</button>
    </Center>
  );

  const check = () => {
    if (result) return;
    const ok = entry.trim().toLowerCase() === card.word.toLowerCase();
    setResult(ok ? "right" : "wrong");
    setDone((d) => d + 1);
    if (ok) setScore((s) => s + 1); else addStar(card.word);
  };
  const next = () => {
    setEntry(""); setResult(null);
    if (i + 1 < deck.length) setI(i + 1);
    else { setI(0); setDeck(shuffle(words)); }
  };

  return (
    <div style={{ textAlign:"center" }}>
      <Progress value={i} total={deck.length} label={`✅ ${score} / ${done}`} />
      <div style={{ position:"relative", background:"#fff", borderRadius:28, padding:"32px 20px", margin:"16px 0",
        border:`4px solid ${starred.has(card.word) ? C.sun : C.leaf}`, boxShadow:"0 10px 0 rgba(95,184,148,0.3)" }}>
        <StarButton flagged={starred.has(card.word)} onClick={() => toggleStar(card.word)} />
        <div style={{ fontSize:14, color:"#9a94ad", marginBottom:12, fontWeight:700, textTransform:"uppercase", letterSpacing:0.5 }}>
          Listen and spell it
        </div>
        <button onClick={() => speakEn(card.word)} style={{ ...bigBtn, background:"#5B8DEF", fontSize:20, padding:"16px 30px" }}>🔊 Play word</button>
        <div style={{ marginTop:10, fontSize:13, color:"#8b95a8" }}>{card.definition}</div>

        <input value={entry} onChange={(e) => setEntry(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { result ? next() : check(); } }}
          placeholder="Type the word…" autoCapitalize="none" autoCorrect="off" spellCheck="false"
          style={{ ...inp, marginTop:16, textAlign:"center", fontSize:22, fontWeight:700,
            borderColor: result === "right" ? C.leaf : result === "wrong" ? "#F4A7A7" : "#cfe3d6" }} />

        {result === "right" && <div style={{ marginTop:10, color:C.leaf, fontWeight:800, fontSize:18 }}>✓ Correct!</div>}
        {result === "wrong" && (
          <div style={{ marginTop:10 }}>
            <div style={{ color:C.berry, fontWeight:800 }}>Not quite — it's spelled:</div>
            <div style={{ fontSize:26, fontWeight:800, marginTop:4 }}>{card.word}</div>
          </div>
        )}
      </div>
      {!result ? (
        <button onClick={check} disabled={!entry.trim()}
          style={{ ...bigBtn, background:C.leaf, width:"100%", opacity: entry.trim()?1:0.5 }}>✓ Check</button>
      ) : (
        <button onClick={next} style={{ ...bigBtn, background:"#5B8DEF", width:"100%" }}>Next word →</button>
      )}
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:12, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Word list ----
function EnWordList({ allWords, starred, mastered, toggleStar, toggleMastered, myWords, removeMyWord }) {
  const mySet = new Set((myWords||[]).map((w) => w.word));
  const [showMastered, setShowMastered] = useState(true);
  const sorted = [...allWords].sort((a, b) => a.word.toLowerCase().localeCompare(b.word.toLowerCase()));
  const rows = showMastered ? sorted : sorted.filter((w) => !mastered.has(w.word));
  const activeCount = allWords.filter((w) => !mastered.has(w.word)).length;

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10, flexWrap:"wrap", gap:8 }}>
        <div style={{ fontWeight:800, fontSize:16 }}>📖 Word list <span style={{ color:"#5B8DEF" }}>({activeCount} active)</span></div>
        <button onClick={() => setShowMastered((s) => !s)} style={{ ...ghostBtn, fontSize:13 }}>
          {showMastered ? "🙈 Hide mastered" : "👁️ Show mastered"}
        </button>
      </div>
      <div style={{ fontSize:12, color:"#7a7391", marginBottom:12 }}>
        Tap ⭐ for the practice pile, 🔊 to hear it, and the checkbox when Sam has mastered a word.
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
        {rows.map((w, idx) => {
          const isM = mastered.has(w.word), isS = starred.has(w.word);
          return (
            <div key={w.word + idx} style={{ display:"flex", alignItems:"center", gap:10,
              background: isM ? "#EEF1F6" : "#fff", opacity: isM ? 0.6 : 1,
              border:`2px solid ${isS ? C.sun : "#e6ecf5"}`, borderRadius:14, padding:"10px 12px" }}>
              <span style={{ fontSize:24, width:30, textAlign:"center" }}>{w.emoji || "📘"}</span>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontWeight:800, fontSize:19 }}>{w.word}</div>
                <div style={{ fontSize:15, color:"#5a6a85", lineHeight:1.4 }}>{w.definition}</div>
              </div>
              <button onClick={() => toggleStar(w.word)} title="Practice pile"
                style={{ ...ghostBtn, padding:"6px 9px", fontSize:17, borderColor: isS ? C.sun : "#e3ddcf",
                  background: isS ? "#FFF9EC" : "#fff", filter: isS ? "none" : "grayscale(1) opacity(0.5)" }}>⭐</button>
              <button onClick={() => speakEn(w.word)} style={{ ...ghostBtn, padding:"6px 10px", fontSize:16 }} title="Hear it">🔊</button>
              <button
                onClick={() => { if (!isM) playCelebrate(); toggleMastered(w.word); }}
                title={isM ? "Mastered — tap to undo" : "Mark as mastered"}
                aria-pressed={isM}
                style={{
                  padding: 0,
                  cursor: "pointer",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  width: 36,
                  height: 36,
                  flexShrink: 0,
                  borderRadius: 9,
                  border: `3px solid ${isM ? C.leaf : "#9fb3cc"}`,
                  background: isM ? C.leaf : "#fff",
                  boxShadow: isM ? "none" : "inset 0 2px 4px rgba(0,0,0,0.06)",
                  fontFamily: "inherit",
                }}>
                <span style={{ fontSize:22, lineHeight:1, fontWeight:900,
                  color: isM ? "#fff" : "#c2cfdf" }}>✓</span>
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Little celebratory arpeggio for "mastered" (WebAudio, no asset needed).
let _audioCtx = null;
const playCelebrate = () => {
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      const t0 = ctx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.35);
    });
  } catch (e) {}
};

function LanguageShell() {
  const [lang, setLang] = useState(() => loadLS("lang", "zh"));
  useEffect(() => { saveLS("lang", lang); }, [lang]);
  return lang === "en"
    ? <EnglishApp onSwitchLang={() => setLang("zh")} />
    : <ChineseApp onSwitchLang={() => setLang("en")} />;
}

function AppLoader() {
  const [state, setState] = useState("loading"); // loading | ready | error
  const [detail, setDetail] = useState("");
  useEffect(() => {
    let alive = true;
    // Fetch vocab here directly so there's no dependency on other scripts.
    // Fallback must load BOTH files, or the English side ends up with no words.
    const p = window.__VOCAB_PROMISE__ ||
      Promise.all([
        fetch("vocab.json?t=" + Date.now()).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status + " loading vocab.json");
          return r.json();
        }),
        fetch("words-en.json?t=" + Date.now())
          .then(function (r) { return r.ok ? r.json() : { lists: [] }; })
          .catch(function () { return { lists: [] }; })
      ]).then(function (both) { var v = both[0]; v.english = both[1]; return v; });
    p.then(function (v) {
        if (!alive) return;
        if (!v || !v.lessons) throw new Error("vocab.json loaded but has no lessons");
        window.__VOCAB__ = v;
        setState("ready");
      })
      .catch(function (e) {
        if (!alive) return;
        setDetail(String(e && e.message ? e.message : e));
        setState("error");
      });
    return function () { alive = false; };
  }, []);

  if (state === "loading") {
    return (
      <div className="loading">
        <div style={{ fontSize: 54 }}>🦊</div>
        <div style={{ fontWeight: 700, marginTop: 10 }}>Loading Sam's Chinese Quest…</div>
      </div>
    );
  }
  if (state === "error") {
    return (
      <div className="loading">
        <div style={{ fontSize: 54 }}>😵</div>
        <div style={{ fontWeight: 700, marginTop: 10 }}>Couldn't load the vocabulary.</div>
        <div style={{ marginTop: 6, color: "#7a7391", fontSize: 13, maxWidth: 320, textAlign: "center" }}>{detail || "Check your connection and refresh."}</div>
      </div>
    );
  }
  return <LanguageShell />;
}

// Resilient mount: in-browser Babel executes this script asynchronously,
// and the initial createRoot/render could silently fail to attach on load
// (leaving the app stuck on the "Loading" placeholder). Guard the mount so it
// only runs once the #root element exists, retry until it does, and defer to
// the next frame so it never races Babel's auto-run / DOM readiness.
(function mountApp() {
  var el = document.getElementById("root");
  if (!el || typeof ReactDOM === "undefined" || !ReactDOM.createRoot) {
    return requestAnimationFrame(mountApp);
  }
  try {
    var root = ReactDOM.createRoot(el);
    root.render(<AppLoader />);
  } catch (err) {
    el.innerHTML =
      '<div style="padding:24px;font-family:sans-serif;color:#b00">' +
      'Failed to start the app: ' + (err && err.message ? err.message : err) +
      '</div>';
    console.error("Mount failed:", err);
  }
})();
</script>

<script type="text/babel" data-presets="react-classic">
  const { useState, useEffect, useRef, useMemo } = React;

// ================= persistence & cross-device sync =================
const LS_PREFIX = "samquest_";
const loadLS = (k, fallback) => {
  try { const v = localStorage.getItem(LS_PREFIX + k); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
};
const saveLS = (k, v) => { try { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); } catch (e) {} };

// GitHub settings (entered once per device in ⚙️ settings)
// Credentials hardcoded so sync works on every device with zero setup.

const _GH_DEFAULTS = {

};
const getGH = () => ({
  owner: loadLS("gh_owner", "") || _GH_DEFAULTS.owner,
  repo: loadLS("gh_repo", "") || _GH_DEFAULTS.repo,

const ghConfigured = () => true;

const GH_API = "https://api.github.com";
const ghHeaders = (token) => ({
  Authorization: "Bearer " + token,
  Accept: "application/vnd.github+json",
  "Content-Type": "application/json",
});

// UTF-8-safe base64 (btoa alone breaks on Chinese characters)
const b64encode = (str) => btoa(unescape(encodeURIComponent(str)));
const b64decode = (b64) => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

async function pullRemoteProgress() {
  if (!ghConfigured()) return null;
  const { owner, repo, token } = getGH();
  try {
    const r = await fetch(`${GH_API}/repos/${owner}/${repo}/contents/progress.json`, { headers: ghHeaders(token) });
    if (r.status === 404) return {}; // no progress file yet — fine
    if (!r.ok) return null;
    const data = await r.json();
    window.__PROGRESS_SHA__ = data.sha;
    return JSON.parse(b64decode(data.content));
  } catch (e) { return null; }
}

let syncTimer = null;
function scheduleSync(progress, setStatus) {
  if (!ghConfigured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushProgress(progress, setStatus), 2500);
}

async function pushProgress(progress, setStatus, retried) {
  const { owner, repo, token } = getGH();
  try {
    const body = {
      message: "Update Sam progress",
      content: b64encode(JSON.stringify(progress, null, 2)),
    };
    if (window.__PROGRESS_SHA__) body.sha = window.__PROGRESS_SHA__;
    const r = await fetch(`${GH_API}/repos/${owner}/${repo}/contents/progress.json`, {
      method: "PUT", headers: ghHeaders(token), body: JSON.stringify(body),
    });
    if (r.status === 409 && !retried) {
      // sha out of date (another device pushed) — refetch sha and retry once
      await pullRemoteProgress();
      return pushProgress(progress, setStatus, true);
    }
    if (!r.ok) { setStatus && setStatus("error"); return; }
    const data = await r.json();
    window.__PROGRESS_SHA__ = data.content && data.content.sha;
    setStatus && setStatus("synced");
  } catch (e) { setStatus && setStatus("error"); }
}

// ⚙️ one-time-per-device sync setup screen
function SoundToggle() {

// ================= end sync =================


// ============================================================
//  SAM'S CHINESE QUEST — a growing vocabulary review game
//
//  TO ADD A NEW LESSON: paste it at the BOTTOM of the LESSONS
//  array below. The word bank shows lessons newest-first, so the
//  most recent one always appears at the top of the screen —
//  handy for reviewing just-learned words first.
//
//  Each word: { hanzi, pinyin, en, emoji }
//   • hanzi  — used only to generate good audio (never shown)
//   • pinyin — what Sam reads/recalls
//   • en     — English meaning
//   • emoji  — a little visual hint
// ============================================================

const getVocab = () => window.__VOCAB__ || { lessons: [], tagMap: {}, sentences: [] };

// ============================================================
//  SENTENCES for "Say the Sentence" — Sam reads the English and
//  says it in Chinese, then reveals the answer to check + hear it.
//  Built from vocabulary in the lessons above, using the same
//  GoEast story patterns. hanzi drives the audio (never shown).
//  Add more anytime — each: { en, pinyin, hanzi, tag }.
// ============================================================
// Maps each sentence tag to the lesson id(s) it belongs to, so Say the Sentence
// can filter to only the currently-selected lessons (matching the other games).




const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// ---- audio: browser speech, but we deliberately pick the BEST Mandarin
// voice the device has instead of accepting the default (which is often the
// robotic one). Voices load asynchronously, so we resolve on load + retries.
let bestVoice = null;

const PREFERRED_VOICES = [
  "Google 普通话（中国大陆）", "Google Mandarin", "Google 国语",
  "Microsoft Xiaoxiao", "Microsoft Yunxi", "Microsoft Yunyang",
  "Microsoft Yaoyao", "Microsoft Huihui", "Microsoft Kangkang",
  "Tingting", "Sinji", "Meijia",
  "mandarin", "chinese", "cmn", "zh-CN",
];

const selectBestVoice = () => {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  let selected = null;
  for (const name of PREFERRED_VOICES) {
    selected = voices.find(
      (v) =>
        v.lang.toLowerCase().includes("zh") &&
        (v.name.toLowerCase().includes(name.toLowerCase()) || v.name.includes(name))
    );
    if (selected) break;
  }
  if (!selected) {
    selected = voices.find(
      (v) => v.lang === "zh-CN" || v.lang === "zh-TW" || v.lang.toLowerCase().startsWith("zh")
    );
  }
  if (selected) bestVoice = selected;
};

// Mobile webviews (incl. the Claude app) often (a) return an empty voice list
// until the engine warms up and (b) block speech until the user's first tap.
// We prime the engine on the first touch and keep retrying voice selection.
let speechPrimed = false;
const primeSpeech = () => {
  if (speechPrimed || !("speechSynthesis" in window)) return;
  speechPrimed = true;
  try {
    // a silent utterance unlocks the audio channel on mobile
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
  selectBestVoice();
  // selectBestEnVoice is defined later in this file; call it only if it exists yet
  try { if (typeof selectBestEnVoice === "function") selectBestEnVoice(); } catch (e) {}
};

if (typeof window !== "undefined" && "speechSynthesis" in window) {
  if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", selectBestVoice);
  else window.speechSynthesis.onvoiceschanged = selectBestVoice;
  [200, 600, 1200, 2500].forEach((ms) => setTimeout(selectBestVoice, ms));
  // first user gesture anywhere primes audio for the whole session
  ["touchstart", "pointerdown", "click"].forEach((evt) =>
    window.addEventListener(evt, primeSpeech, { once: true, passive: true })
  );
}

const speak = (word) => {
  if (!("speechSynthesis" in window)) return;
  // Feed the CHARACTERS to the voice when we have them — browser Mandarin voices
  // pronounce hanzi with better tones than bare pinyin. Sam never sees these;
  // the screen still shows only pinyin/English.
  const text =
    word && typeof word === "object" ? (word.hanzi || word.pinyin) : word;
  if (!text) return;

  const say = () => {
    try {
      // Android Chrome can drop a new utterance if cancel() fires right before
      // speak(); only cancel when something is actually playing.
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      // Speed: normal (0.88) or slow (~70% of normal) — toggled on the home screen.
      u.rate = loadLS("zh_slow", false) ? 0.62 : 0.88;
      u.pitch = 1.02;
      if (!bestVoice) selectBestVoice();
      var zhPref = loadLS("zh_voice_pref", "");
      var zhChosen = zhPref
        ? window.speechSynthesis.getVoices().find(function(v){ return v.name === zhPref; })
        : bestVoice;
      if (zhChosen) u.voice = zhChosen; // else: let the OS pick a zh voice by lang
      window.speechSynthesis.speak(u);
      // Android sometimes leaves the queue paused after a cancel
      try { window.speechSynthesis.resume(); } catch (e) {}
    } catch (e) {}
  };

  // IMPORTANT (Android Chrome): speak() must run synchronously inside the tap
  // handler or the utterance is silently dropped. So always try immediately;
  // only use delayed retries as a fallback if nothing actually started.
  const hadVoices = window.speechSynthesis.getVoices().length > 0;
  selectBestVoice();
  say();
  // If no voices existed yet, the synchronous attempt may have produced silence.
  // Retry once voices arrive — but stop as soon as anything is actually playing.
  if (!hadVoices) {
    let tries = 0;
    const retry = () => {
      tries++;
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
      selectBestVoice();
      if (window.speechSynthesis.getVoices().length) { say(); return; }
      if (tries < 6) setTimeout(retry, 300);
    };
    setTimeout(retry, 300);
  }
};


// ============================================================
//  SPACED REPETITION
//  Each word gets a "level" 0-5. Right answers raise it, wrong
//  answers reset it. Lower level = shows up far more often.
//  Levels also age: a word not seen in a while drifts back down,
//  so nothing is silently forgotten.
// ============================================================
const SRS_KEY = "srs";
const loadSrs = () => loadLS(SRS_KEY, {});
const saveSrs = (s) => saveLS(SRS_KEY, s);

const DAY = 86400000;
// how long a word at each level can rest before it's due again
const LEVEL_REST = [0, 1, 2, 4, 8, 16];

const srsRecord = (key, correct) => {
  const s = loadSrs();
  const cur = s[key] || { lvl: 0, seen: 0, right: 0, wrong: 0, last: 0 };
  cur.seen += 1;
  cur.last = Date.now();
  if (correct) { cur.right += 1; cur.lvl = Math.min(5, cur.lvl + 1); }
  else { cur.wrong += 1; cur.lvl = 0; }
  s[key] = cur;
  saveSrs(s);
};

// Weight = how badly this item needs practice. Higher = pick more often.
const srsWeight = (key) => {
  // today's word gets pushed to the front of the queue everywhere
  const wod = wodActive();
  if (wod && (key === wod.pinyin || key === wod.en)) return 40;
  const s = loadSrs();
  const r = s[key];
  if (!r) return 8;                       // never seen — top priority
  const restDays = LEVEL_REST[r.lvl] || 1;
  const daysSince = (Date.now() - (r.last || 0)) / DAY;
  const overdue = daysSince / restDays;   // >1 means it's due
  const base = 6 - r.lvl;                 // low level = needs work
  return Math.max(0.4, base * (overdue >= 1 ? 1.8 : 0.5) + (r.wrong || 0) * 0.6);
};

// Weighted random pick, avoiding an immediate repeat where possible.
const srsPick = (items, keyOf, avoidKey) => {
  if (!items.length) return null;
  const pool = items.length > 1 && avoidKey
    ? items.filter((it) => keyOf(it) !== avoidKey)
    : items;
  const list = pool.length ? pool : items;
  const weights = list.map((it) => srsWeight(keyOf(it)));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < list.length; i++) {
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  return list[list.length - 1];
};

// Order a whole deck so shaky words come first (used by flip cards).
const srsOrder = (items, keyOf) =>
  [...items].sort((a, b) => srsWeight(keyOf(b)) - srsWeight(keyOf(a)));

// ---------- daily streak ----------
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const markPracticedToday = () => {
  const days = loadLS("practiceDays", []);
  const t = todayKey();
  if (!days.includes(t)) { days.push(t); saveLS("practiceDays", days.slice(-400)); }
};
const currentStreak = () => {
  const days = new Set(loadLS("practiceDays", []));
  let n = 0;
  const d = new Date();
  // today doesn't break the streak if not yet practiced
  if (!days.has(todayKey())) d.setDate(d.getDate() - 1);
  for (;;) {
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    if (days.has(k)) { n++; d.setDate(d.getDate() - 1); } else break;
  }
  return n;
};
const practicedToday = () => loadLS("practiceDays", []).includes(todayKey());


// ============================================================
//  DAILY GOAL + CHIPS
//  Deliberately rewards SHOWING UP, not scoring well. The spaced
//  repetition serves up the words Sam is worst at, so paying for
//  correct answers would punish him for practicing what he most
//  needs — and push him toward easy lessons. Effort is the metric.
// ============================================================
const DAILY_GOAL = 15;          // answers/cards to complete a day
const CHIPS_PER_DAY = 1;        // earned once the goal is met
const STREAK_BONUS_EVERY = 7;   // extra chips at each 7-day milestone
const STREAK_BONUS_CHIPS = 5;

const getDayCount = () => {
  const rec = loadLS("dayCount", {});
  return rec.date === todayKey() ? (rec.n || 0) : 0;
};
const bumpDayCount = (weight = 1) => {
  const t = todayKey();
  const rec = loadLS("dayCount", {});
  const n = (rec.date === t ? (rec.n || 0) : 0) + weight;
  saveLS("dayCount", { date: t, n });
  return n;
};

const getChips = () => loadLS("chips", 0);
const addChips = (n) => { saveLS("chips", Math.max(0, getChips() + n)); };
const getChipLog = () => loadLS("chipLog", []);
const logChips = (entry) => {
  const l = getChipLog();
  l.unshift({ ...entry, at: Date.now() });
  saveLS("chipLog", l.slice(0, 60));
};

// Called after every graded answer. Awards the day's chip the moment
// the goal is reached (once per day only).
// weight: how much this activity is worth toward the daily goal.
// Building a whole sentence is far more work than one multiple-choice tap.
// Speaking out loud is the highest-value practice, so it earns a small bonus
// chip once per day — enough to notice, not enough to farm.
const SPOKEN_GOAL = 10;
const recordSpoken = () => {
  const t = todayKey();
  const rec = loadLS("spokenCount", {});
  const n = (rec.date === t ? (rec.n || 0) : 0) + 1;
  saveLS("spokenCount", { date: t, n });
  if (n === SPOKEN_GOAL && loadLS("spokenClaimed", "") !== t) {
    saveLS("spokenClaimed", t);
    addChips(1);
    logChips({ type: "spoken", amount: 1, note: "Spoke 10 sentences 🗣️" });
    playChip();
  }
  return n;
};
const getSpokenCount = () => {
  const rec = loadLS("spokenCount", {});
  return rec.date === todayKey() ? (rec.n || 0) : 0;
};

const recordEffort = (weight = 1) => {
  const n = bumpDayCount(weight);
  markPracticedToday();
  if (n >= DAILY_GOAL) {
    const claimed = loadLS("goalClaimed", "");
    if (claimed !== todayKey()) {
      saveLS("goalClaimed", todayKey());
      addChips(CHIPS_PER_DAY);
      logChips({ type: "daily", amount: CHIPS_PER_DAY, note: "Daily goal" });
      const streak = currentStreak();
      if (streak > 0 && streak % STREAK_BONUS_EVERY === 0) {
        addChips(STREAK_BONUS_CHIPS);
        logChips({ type: "bonus", amount: STREAK_BONUS_CHIPS, note: `${streak}-day streak!` });
        playStreakUp();
      } else {
        playFanfare();
      }
      return { justEarned: true, streak };
    }
  }
  return { justEarned: false };
};

// One forgiven miss per week so a single busy day doesn't wipe out
// weeks of effort — an all-or-nothing streak is demoralising for a kid.
const useStreakFreeze = () => {
  const freezes = loadLS("freezes", []);
  const weekAgo = Date.now() - 7 * DAY;
  const recent = freezes.filter((t) => t > weekAgo);
  if (recent.length >= 1) return false;
  recent.push(Date.now());
  saveLS("freezes", recent);
  const days = loadLS("practiceDays", []);
  const d = new Date(); d.setDate(d.getDate() - 1);
  const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  if (!days.includes(k)) { days.push(k); saveLS("practiceDays", days.slice(-400)); }
  return true;
};
const freezeAvailable = () => {
  const weekAgo = Date.now() - 7 * DAY;
  return loadLS("freezes", []).filter((t) => t > weekAgo).length === 0;
};


// ============================================================
//  SOUND EFFECTS  (all synthesised — no audio files to load)
//  Design notes:
//   • Correct answers get a short, bright, RISING motif.
//   • Wrong answers get a soft, low, neutral blip — never a harsh
//     "buzzer". Being wrong is how you learn; it shouldn't sting.
//   • Big moments (goal met, chips, streaks) get applause/fanfare.
//  Everything respects the mute toggle.
// ============================================================
let _actx = null;
const soundOn = () => loadLS("soundOn", true);
const setSoundOn = (v) => saveLS("soundOn", !!v);

const _ctx = () => {
  if (!soundOn()) return null;
  try {
    _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === "suspended") _actx.resume();
    return _actx;
  } catch (e) { return null; }
};

// one tone with a soft attack/decay envelope
const _tone = (ctx, freq, t0, dur, gain = 0.22, type = "triangle") => {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
};

// filtered noise burst — the basis of the applause/clap sounds
const _noise = (ctx, t0, dur, gain = 0.18, freq = 1200, q = 0.7) => {
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(t0); src.stop(t0 + dur);
};

// ✓ correct — bright two-note lift. Rises with the streak so a hot
//   run literally sounds better, which is the point.
const playCorrect = (streak = 0) => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  const step = Math.min(6, Math.max(0, streak));
  const base = 660 * Math.pow(2, step / 24); // creeps up ~a step per streak
  _tone(ctx, base, t, 0.12, 0.2);
  _tone(ctx, base * 1.5, t + 0.075, 0.18, 0.2);
};

// ✗ not quite — gentle, low, brief. Deliberately NOT a buzzer.
const playSoftMiss = () => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  _tone(ctx, 300, t, 0.14, 0.12, "sine");
  _tone(ctx, 240, t + 0.09, 0.16, 0.1, "sine");
};

// 👏 applause — layered noise claps that swell then fade
const playApplause = (big = false) => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  const claps = big ? 34 : 18;
  const span = big ? 1.5 : 0.9;
  for (let i = 0; i < claps; i++) {
    const at = t + Math.random() * span;
    const swell = big ? 0.10 + 0.10 * Math.sin((i / claps) * Math.PI) : 0.10;
    _noise(ctx, at, 0.06 + Math.random() * 0.05, swell, 900 + Math.random() * 1600, 0.6);
  }
};

// 🪙 chip earned — coin shimmer
const playChip = () => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  _tone(ctx, 1320, t, 0.10, 0.18, "square");
  _tone(ctx, 1760, t + 0.06, 0.16, 0.16, "square");
  _tone(ctx, 2640, t + 0.13, 0.22, 0.10, "sine");
};

// 🎉 daily goal complete — fanfare + applause

function ChineseApp({ onSwitchLang }) {
  const { lessons: LESSONS, tagMap: SENTENCE_TAG_TO_LESSONS, sentences: SENTENCES } = getVocab();
  const [screen, setScreen] = useState("home"); // home | flashcards | sentence | clock | tone | wordlist
  const [slow, setSlow] = useState(() => loadLS("zh_slow", false));
  const toggleSlow = () => setSlow((s) => { const n = !s; saveLS("zh_slow", n); return n; });
  const [pool, setPool] = useState(() => LESSONS.map((l) => l.id));
  const [trouble, setTrouble] = useState(() => new Set(loadLS("trouble", [])));
  const [archived, setArchived] = useState(() => new Set(loadLS("archived", [])));
  const [starredSentences, setStarredSentences] = useState(() => new Set(loadLS("starredSentences", [])));
  const [customWords, setCustomWords] = useState(() => loadLS("customWords", []));
  const [syncStatus, setSyncStatus] = useState("");

  // persist locally + sync to GitHub whenever progress changes
  useEffect(() => {
    const progress = {
      trouble: [...trouble],
      archived: [...archived],
      starredSentences: [...starredSentences],
      chips: getChips(),
      practiceDays: loadLS("practiceDays", []),
      srs: loadLS("srs", {}),
      dayCount: loadLS("dayCount", {}),
      spokenCount: loadLS("spokenCount", {}),
      wordOfDay: loadLS("wordOfDay", null),
      wodDone: loadLS("wodDone", ""),
      goalClaimed: loadLS("goalClaimed", ""),
      customWords,
    };
    saveLS("trouble", progress.trouble);
    saveLS("archived", progress.archived);
    saveLS("starredSentences", progress.starredSentences);
    saveLS("customWords", progress.customWords);
    scheduleSync(progress, setSyncStatus);
  }, [trouble, archived, starredSentences, customWords]);

  // on boot: pull remote progress once and merge it in
  useEffect(() => {
    pullRemoteProgress().then((remote) => {
      if (!remote) return;
      setTrouble((prev) => new Set([...prev, ...(remote.trouble || [])]));
      setArchived((prev) => new Set([...prev, ...(remote.archived || [])]));
      setStarredSentences((prev) => new Set([...prev, ...(remote.starredSentences || [])]));
      // chips: take the higher balance; practice days: union; srs: keep best level
      if (typeof remote.chips === "number" && remote.chips > getChips()) saveLS("chips", remote.chips);
      // today's practice count: keep whichever device is further along
      if (remote.dayCount && remote.dayCount.date === todayKey()) {
        const mine = loadLS("dayCount", {});
        const mineN = mine.date === todayKey() ? (mine.n || 0) : 0;
        if ((remote.dayCount.n || 0) > mineN) saveLS("dayCount", remote.dayCount);
      }
      if (remote.goalClaimed === todayKey()) saveLS("goalClaimed", remote.goalClaimed);
      if (remote.wordOfDay && remote.wordOfDay.date === todayKey()) saveLS("wordOfDay", remote.wordOfDay);
      if (remote.wodDone === todayKey()) saveLS("wodDone", remote.wodDone);
      if (remote.spokenCount && remote.spokenCount.date === todayKey()) {
        const mine = loadLS("spokenCount", {});
        const mineN = mine.date === todayKey() ? (mine.n || 0) : 0;
        if ((remote.spokenCount.n || 0) > mineN) saveLS("spokenCount", remote.spokenCount);
      }
      if (remote.practiceDays) {
        const merged = Array.from(new Set([...loadLS("practiceDays", []), ...remote.practiceDays]));
        saveLS("practiceDays", merged.slice(-400));
      }
      if (remote.srs) {
        const local = loadLS("srs", {});
        Object.keys(remote.srs).forEach((k) => {
          if (!local[k] || (remote.srs[k].last || 0) > (local[k].last || 0)) local[k] = remote.srs[k];
        });
        saveLS("srs", local);
      }
      setCustomWords((prev) => {
        const seen = new Set(prev.map((w) => w.pinyin + "|" + w.en));
        const extra = (remote.customWords || []).filter((w) => !seen.has(w.pinyin + "|" + w.en));
        return [...prev, ...extra];
      });
      setSyncStatus("synced");
    });
  }, []);

  const toggleSentence = (en) =>
    setStarredSentences((prev) => {
      const n = new Set(prev);
      n.has(en) ? n.delete(en) : n.add(en);
      return n;
    });

  const addCustomWord = (word) => {
    setCustomWords((prev) => [...prev, word]);
    setPool((p) => (p.includes("my-words") ? p : [...p, "my-words"]));
  };
  const removeCustomWord = (pinyinOrEn) =>
    setCustomWords((prev) => prev.filter((w) => w.pinyin !== pinyinOrEn && w.en !== pinyinOrEn));

  // "My Words" behaves like a lesson so it flows through games + word list
  const MY_WORDS_ID = "my-words";
  const MY_WORDS_LESSON = { id: MY_WORDS_ID, title: "Words We Added", subtitle: "words you added yourself", words: customWords };
  const allLessons = customWords.length ? [...LESSONS, MY_WORDS_LESSON] : LESSONS;

  // words from the chosen lessons, minus any that have been archived (mastered)
  const activeWords = allLessons.filter((l) => pool.includes(l.id) || l.id === MY_WORDS_ID)
    .flatMap((l) => l.words)


  // words for the master list — only from SELECTED lessons (plus manual adds),
  // so deselecting a lesson hides its words here too. archived stay visible here.
  // "Words We Added" is always in play — if you added a word deliberately,
  // it shouldn't need a lesson toggle to show up.
  const listWords = allLessons
    .filter((l) => pool.includes(l.id) || l.id === MY_WORDS_ID)
    .flatMap((l) => l.words.map((w) => ({ ...w, lesson: l.title })));

  // sentences for Say the Sentence — only those whose lesson(s) are selected
  const activeSentences = SENTENCES.filter((s) => {
    const lessonIds = SENTENCE_TAG_TO_LESSONS[s.tag] || [];
    return lessonIds.some((id) => pool.includes(id));
  });

  const toggleLesson = (id) =>
    setPool((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));

  const selectAllLessons = () => setPool(allLessons.map((l) => l.id));
  const selectNoLessons = () => setPool([]);
  // newest real lesson lives at the END of the LESSONS array
  const selectNewestLesson = () => setPool([LESSONS[LESSONS.length - 1].id]);

  const toggleTrouble = (pinyin) =>
    setTrouble((prev) => {
      const n = new Set(prev);
      n.has(pinyin) ? n.delete(pinyin) : n.add(pinyin);
      return n;
    });

  // add-only: used by the games to auto-collect words Sam gets wrong
  const addTrouble = (pinyin) =>
    setTrouble((prev) => {
      if (prev.has(pinyin)) return prev;
      const n = new Set(prev);
      n.add(pinyin);
      return n;
    });

  const troubleWords = activeWords.filter((w) => trouble.has(w.pinyin));
  const starredSentenceList = activeSentences.filter((s) => starredSentences.has(s.en));

  const toggleArchived = (pinyin) =>
    setArchived((prev) => {
      const n = new Set(prev);
      n.has(pinyin) ? n.delete(pinyin) : n.add(pinyin);
      return n;
    });

  return (
    <div
      style={{
        minHeight: "100vh",
        background: `radial-gradient(circle at 20% 10%, #FFE6C7 0%, ${C.paper} 45%)`,
        color: C.ink,
        fontFamily: "'Baloo 2','Comic Sans MS',system-ui,sans-serif",
        padding: "20px 16px 60px",
      }}
    >
      <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
        rel="stylesheet"
      />
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <Header onHome={() => setScreen("home")} showHome={screen !== "home"} onSwitchLang={onSwitchLang} />

        {screen === "home" && (
          <Home
            lessons={allLessons}
            pool={pool}
            toggleLesson={toggleLesson}
            selectAllLessons={selectAllLessons}
            selectNoLessons={selectNoLessons}
            selectNewestLesson={selectNewestLesson}
            wordCount={activeWords.length}
            troubleCount={troubleWords.length}
            starredSentenceCount={starredSentenceList.length}
            totalCount={listWords.length}
            archivedCount={archived.size}
            addCustomWord={addCustomWord}
            allWordsForWod={listWords}
            go={setScreen}
          />
        )}
        {screen === "wod" && wodActive() && (
          <WordOfDay word={wodActive()} allWords={activeWords} sentences={activeSentences} onHome={() => setScreen("home")} />
        )}
        {screen === "flashcards" && (
          <React.Fragment><GameTitle>Flip Cards</GameTitle>
          <Flashcards words={activeWords} trouble={trouble} toggleTrouble={toggleTrouble} onHome={() => setScreen("home")} />
          </React.Fragment>
        )}
        {screen === "troubleflip" && (
          <Flashcards words={troubleWords} trouble={trouble} toggleTrouble={toggleTrouble} onlyTrouble onHome={() => setScreen("home")} />
        )}
        {screen === "clock" && (
          <React.Fragment><GameTitle>Beat the Clock</GameTitle>
          <BeatTheClock words={activeWords} addTrouble={addTrouble} trouble={trouble} toggleTrouble={toggleTrouble} onHome={() => setScreen("home")} />
          </React.Fragment>
        )}
        {screen === "chips" && <ChipsScreen onDone={() => setScreen("home")} />}
        {screen === "buildsentence" && (
          <React.Fragment><GameTitle>Build a Sentence</GameTitle>
          <BuildSentence
            sentences={activeSentences}
            starred={starredSentences}
            toggleSentence={toggleSentence}
            onHome={() => setScreen("home")}
          />
          </React.Fragment>
        )}
        {screen === "trickypick" && (
          <TrickyPicker
            wordCount={troubleWords.length}
            sentenceCount={starredSentenceList.length}
            go={setScreen}
            onHome={() => setScreen("home")}
          />
        )}
        {screen === "sentencestar" && (
          <SayTheSentence
            sentences={starredSentenceList}
            starred={starredSentences}
            toggleSentence={toggleSentence}
            onHome={() => setScreen("home")}
            forceStarredOnly
          />
        )}
        {screen === "sentence" && (
          <React.Fragment><GameTitle>Say the Sentence</GameTitle>
          <SayTheSentence
            sentences={activeSentences}
            starred={starredSentences}
            toggleSentence={toggleSentence}
            onHome={() => setScreen("home")}
          />
          </React.Fragment>
        )}
        {screen === "sentencemean" && (
          <React.Fragment><GameTitle>What's That Sentence Mean?</GameTitle>
          <SentenceMeaning
            sentences={activeSentences}
            starred={starredSentences}
            toggleSentence={toggleSentence}
            onHome={() => setScreen("home")}
          />
          </React.Fragment>
        )}
        {screen === "tone" && (
          <React.Fragment><GameTitle>What's That Word Mean?</GameTitle>
          <ToneMatch words={activeWords} addTrouble={addTrouble} trouble={trouble} toggleTrouble={toggleTrouble} onHome={() => setScreen("home")} />
          </React.Fragment>
        )}
        {(screen === "wordlist" || screen === "wordlist-add") && (
          <WordList
            allWords={listWords}
            archived={archived}
            trouble={trouble}
            toggleTrouble={toggleTrouble}
            toggleArchived={toggleArchived}
            customWords={customWords}
            addCustomWord={addCustomWord}
            removeCustomWord={removeCustomWord}
            openAdd={screen === "wordlist-add"}
          />
        )}
      </div>
    </div>
  );
}

function Home({
  lessons, pool, toggleLesson,
  selectAllLessons, selectNoLessons, selectNewestLesson,
  wordCount, troubleCount, starredSentenceCount, totalCount, archivedCount, go,
  addCustomWord, allWordsForWod,
}) {
  const [wodPickerOpen, setWodPickerOpen] = useState(false);
  const [wodTick, setWodTick] = useState(0);
  const todaysWord = wodActive();
  const [bankOpen, setBankOpen] = useState(false);
  const [addOpen, setAddOpen] = useState(false);
  const [bulk, setBulk] = useState("");
  const [added, setAdded] = useState(0);

  // Figure out whether a line is Chinese characters, pinyin, or English.
  const classifyZh = (text) => {
    const t = text.trim();
    if (!t) return null;
    if (/[\u4e00-\u9fff]/.test(t)) return { en: "", pinyin: "", hanzi: t };
    if (/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/i.test(t)) return { en: "", pinyin: t, hanzi: "" };
    return { en: t, pinyin: "", hanzi: "" };
  };

  const submitZhWords = () => {
    const lines = bulk.split("\n").map((s) => s.trim()).filter(Boolean);
    let n = 0;
    lines.forEach((line) => {
      const pair = line.split(/\s*[=|]\s*/);
      let parts;
      if (pair.length >= 2) {
        const merged = { en: "", pinyin: "", hanzi: "" };
        pair.forEach((p) => {
          const c = classifyZh(p);
          if (!c) return;
          if (c.hanzi) merged.hanzi = c.hanzi;
          else if (c.pinyin) merged.pinyin = c.pinyin;
          else if (!merged.en) merged.en = c.en;
        });
        parts = merged;
      } else {
        parts = classifyZh(line);
      }
      if (!parts || (!parts.en && !parts.pinyin && !parts.hanzi)) return;
      addCustomWord({
        en: parts.en || parts.pinyin || parts.hanzi,
        pinyin: parts.pinyin || "",
        hanzi: parts.hanzi || "",
        emoji: "📝",
        needsDef: !(parts.en && parts.pinyin && parts.hanzi),
      });
      n++;
    });
    setAdded(n);
    setBulk("");
    setTimeout(() => setAdded(0), 4000);
  };

  const modes = [
    { id: "flashcards", emoji: "🃏", name: "Flip Cards", desc: "See it, guess it, flip it", color: C.sky },
    { id: "sentence", emoji: "💬", name: "Say the Sentence", desc: "Read English, say it in Chinese", color: C.fox },
    { id: "clock", emoji: "⏱️", name: "Beat the Clock", desc: "How many in 60 seconds?", color: C.berry },
    { id: "tone", emoji: "🎧", name: "What's That Word Mean?", desc: "Hear a word, pick the meaning", color: C.leaf },
    { id: "sentencemean", emoji: "📣", name: "What's That Sentence Mean?", desc: "Hear a sentence, pick the meaning", color: C.sun },
    { id: "buildsentence", emoji: "🧩", name: "Build a Sentence", desc: "Put the words in the right order", color: C.leaf },
  ];

  const newest = lessons[lessons.length - 1];
  const onCount = pool.length;
  const allOn = onCount === lessons.length;
  const noneOn = onCount === 0;

  // a short human summary of what's selected, shown when collapsed
  const summary = noneOn
    ? "No lessons picked"
    : allOn
    ? `All ${lessons.length} lessons`
    : onCount === 1
    ? [...lessons].reverse().find((l) => pool.includes(l.id))?.title
    : `${onCount} lessons`;

  return (
    <div>
      {/* ---- word bank: collapsed to a single tappable summary bar ---- */}
      <div
        style={{
          background: "#fff",
          borderRadius: 20,
          border: "3px solid #efe8d8",
          boxShadow: "0 6px 0 rgba(0,0,0,0.04)",
          marginBottom: 16,
          overflow: "hidden",
        }}
      >
        <button
          onClick={() => setBankOpen((o) => !o)}
          style={{
            width: "100%",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 10,
            background: "transparent",
            border: "none",
            padding: "14px 16px",
            cursor: "pointer",
            fontFamily: "inherit",
            textAlign: "left",
          }}
        >

// ---- Word of the Day drill: 4 short steps, ~1 minute ----
function WordOfDay({ word, allWords, sentences, onHome }) {
  const [step, setStep] = useState(0);
  const [picked, setPicked] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [earned, setEarned] = useState(false);

  // step 2 needs distractors
  const options = useMemo(() => {
    const wrong = shuffle(allWords.filter((w) => w.pinyin !== word.pinyin)).slice(0, 3);
    return shuffle([word, ...wrong]);
  }, [word, allWords.length]);

  // step 4: a real sentence using this word, if we have one
  const example = useMemo(() => {
    const hz = word.hanzi || "";
    if (!hz) return null;
    return sentences.find((s) => (s.hanzi || "").includes(hz)) || null;
  }, [word, sentences.length]);

  const steps = ["Meet it", "Hear it", "Say it", example ? "Use it" : null].filter(Boolean);
  const last = steps.length - 1;

  const finish = () => {
    srsRecord(word.pinyin, true);
    recordEffort();
    if (markWodDone()) setEarned(true);
    setStep(steps.length);   // done screen
  };

  const advance = () => {
    setPicked(null);
    setRevealed(false);
    if (step >= last) finish();
    else setStep(step + 1);
  };

  // ---- done ----
  if (step >= steps.length)
    return (
      <Center>
        <div style={{ fontSize: 64 }}>🌟</div>
        <h2 style={{ margin: "8px 0" }}>Nailed it!</h2>
        <div style={{ fontSize: 34, fontWeight: 800, color: C.fox }}>{word.pinyin}</div>
        <div style={{ fontSize: 17, color: "#7a7391", marginTop: 2 }}>{word.en}</div>
        {earned && (
          <div style={{ marginTop: 14, fontWeight: 800, color: C.sun, fontSize: 17 }}>
            🪙 +1 chip for word of the day!
          </div>
        )}
        <div style={{ marginTop: 12, fontSize: 12, color: "#9a94ad", maxWidth: 300, textAlign: "center" }}>
          This word will keep popping up in the other games today.
        </div>
        <button onClick={onHome} style={{ ...bigBtn, background: C.fox, marginTop: 18 }}>⬅ Back to menu</button>
      </Center>
    );

  const label = steps[step];

  return (
    <div>
      <GameTitle>Word of the Day · {label}</GameTitle>

      {/* progress pips */}
      <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 14 }}>
        {steps.map((_, k) => (
          <div key={k} style={{ width: 26, height: 6, borderRadius: 4,
            background: k <= step ? C.fox : "#e7e0d0" }} />
        ))}
      </div>

      {/* ---- step 1: meet it ---- */}
      {label === "Meet it" && (
        <div>
          <div style={{ background: "#fff", borderRadius: 28, padding: "34px 20px", textAlign: "center",
            border: `4px solid ${C.fox}`, boxShadow: "0 10px 0 rgba(232,112,58,0.3)" }}>
            <div style={{ fontSize: 64 }}>{word.emoji || "⭐"}</div>
            <div style={{ fontSize: 40, fontWeight: 800, color: C.fox, marginTop: 8 }}>{word.pinyin}</div>
            <div style={{ fontSize: 20, color: "#7a7391", marginTop: 4 }}>{word.en}</div>
            <button onClick={() => speak(word)} style={{ ...bigBtn, background: C.sky, marginTop: 16, padding: "12px 26px" }}>
              🔊 Hear it
            </button>
          </div>
          <button onClick={advance} style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14 }}>
            🗣️ I said it — next
          </button>
        </div>
      )}

      {/* ---- step 2: hear it and pick ---- */}
      {label === "Hear it" && (
        <div>
          <div style={{ background: "#fff", borderRadius: 24, padding: "28px 20px", textAlign: "center",
            border: `4px solid ${C.leaf}`, boxShadow: "0 8px 0 rgba(95,184,148,0.3)" }}>
            <button onClick={() => speak(word)} style={{ ...bigBtn, background: C.sky, fontSize: 20, padding: "16px 30px" }}>
              🔊 Play
            </button>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
            {options.map((opt, idx) => {
              let bg = "#fff", bd = "#e3ddcf", cl = C.ink;
              if (picked) {
                if (opt.pinyin === word.pinyin) { bg = C.leaf; bd = C.leaf; cl = "#fff"; }
                else if (opt.pinyin === picked.pinyin) { bg = "#F4A7A7"; bd = "#F4A7A7"; cl = "#fff"; }
              }
              return (
                <button key={idx}
                  onClick={() => {
                    if (picked) return;
                    setPicked(opt);
                    const ok = opt.pinyin === word.pinyin;
                    ok ? playCorrect(0) : playSoftMiss();
                    setTimeout(advance, 1100);
                  }}
                  style={{ ...bigBtn, background: bg, color: cl, border: `3px solid ${bd}`, fontSize: 17, padding: "14px 8px" }}>
                  {opt.emoji} {opt.en}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* ---- step 3: recall and say ---- */}
      {label === "Say it" && (
        <div>
          <div style={{ background: "#fff", borderRadius: 28, padding: "34px 20px", textAlign: "center",
            border: `4px solid ${C.berry}`, boxShadow: "0 10px 0 rgba(214,90,110,0.25)" }}>
            <div style={{ fontSize: 44 }}>{word.emoji || "⭐"}</div>
            <div style={{ fontSize: 30, fontWeight: 800, marginTop: 8 }}>{word.en}</div>
            {revealed && (
              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 34, fontWeight: 800, color: C.fox }}>{word.pinyin}</div>
              </div>
            )}
          </div>
          {!revealed ? (
            <button onClick={() => { setRevealed(true); speak(word); }}
              style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14 }}>
              🗣️ I said it — show answer
            </button>
          ) : (
            <button onClick={advance} style={{ ...bigBtn, background: C.sky, width: "100%", marginTop: 14 }}>
              Next →
            </button>
          )}
        </div>
      )}

      {/* ---- step 4: see it in a real sentence ---- */}
      {label === "Use it" && example && (
        <div>
          <div style={{ background: "#fff", borderRadius: 24, padding: "26px 20px", textAlign: "center",
            border: `4px solid ${C.sky}`, boxShadow: "0 8px 0 rgba(107,169,214,0.3)" }}>
            <div style={{ fontSize: 19, fontWeight: 800, lineHeight: 1.4 }}>{example.en}</div>
            <div style={{ fontSize: 22, fontWeight: 800, color: C.fox, marginTop: 12 }}>{example.pinyin}</div>
            <button onClick={() => speak({ hanzi: example.hanzi, pinyin: example.pinyin })}
              style={{ ...bigBtn, background: C.sky, marginTop: 14, padding: "12px 24px" }}>
              🔊 Hear the sentence
            </button>
          </div>
          <button onClick={advance} style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14 }}>
            🗣️ I said it — finish
          </button>
        </div>
      )}

      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 12, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

  const [q, setQ] = useState("");

    ? allWords.filter((w) =>
        (w.en || "").toLowerCase().includes(term) ||
        (w.pinyin || "").toLowerCase().includes(term) ||

    <div style={{ background: "#fff", borderRadius: 18, border: `3px solid ${C.fox}`, padding: 14, marginTop: 10 }}>

function Flashcards({ words, trouble, toggleTrouble, onlyTrouble, onHome }) {
  const [deck, setDeck] = useState(() => srsOrder(shuffle(words), (w) => w.pinyin));
  const [i, setI] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [holding, setHolding] = useState(false);
  const holdRef = useRef(null);
  useEffect(() => () => { if (holdRef.current) clearTimeout(holdRef.current); }, []);
  const [known, setKnown] = useState(0);

  // 10-second recall timer. It runs only while the card is face-down —
  // once Sam flips to check, the clock stops so he can read and hear the
  // answer without being rushed off the card.
  const RECALL_SECONDS = 10;
  const [timeLeft, setTimeLeft] = useState(RECALL_SECONDS);
  const tickRef = useRef(null);
  const nextRef = useRef(null);

  // if the word list changes (e.g. trouble list empties), keep index in range
  const card = deck[i] || deck[0];

  if (!card) {
    return (
      <Center>
        <div style={{ fontSize: 54 }}>🌟</div>
        <h2 style={{ margin: "10px 0" }}>No tricky words yet!</h2>
        <p style={{ color: "#7a7391", maxWidth: 320, textAlign: "center" }}>
          Tap the ⭐ on a card while you play to save the ones you want to practice more. They'll show up here.
        </p>
      </Center>
    );
  }

  const flagged = trouble.has(card.pinyin);

  // On "Got it", say the word aloud and hold the card for a beat so Sam can
  // hear the pronunciation while still looking at it, then advance.
  const advance = () => {
    setFlipped(false);
    setHolding(false);
    setTimeLeft(RECALL_SECONDS);
    if (i + 1 < deck.length) setI(i + 1);
    else {
      setI(0);
      setDeck(srsOrder(shuffle(words), (w) => w.pinyin));
      setKnown(0);
    }
  };

  const next = (gotIt) => {
    if (holding) return;                 // ignore taps during the pause
    if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; }
    if (gotIt) { setKnown((k) => k + 1); playCorrect(known); }
    if (card) srsRecord(card.pinyin, !!gotIt);
    recordEffort();

    if (gotIt && card) {
      setFlipped(true);                  // keep the answer visible
      setHolding(true);
      speak(card);                       // hear it in good Mandarin
      holdRef.current = setTimeout(advance, 2000);
    } else {
      advance();
    }
  };

  nextRef.current = next;

  useEffect(() => {
    if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; }
    // only count down on a face-down card that isn't mid-celebration
    if (flipped || holding) return;
    setTimeLeft(RECALL_SECONDS);
    tickRef.current = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) {
          clearInterval(tickRef.current);
          tickRef.current = null;
          // ran out of time — counts as "not yet" and moves on
          setTimeout(() => nextRef.current && nextRef.current(false), 0);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => { if (tickRef.current) clearInterval(tickRef.current); };
  }, [i, flipped, holding, deck]);

  return (
    <div style={{ textAlign: "center" }}>
      <Progress value={i} total={deck.length} label={onlyTrouble ? "⭐ practice pile" : `⭐ ${known} known`} />

      {/* recall countdown — pauses once the card is flipped */}
      <div style={{ marginTop: 10 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 5 }}>
          <span style={{ fontSize: 18 }}>{flipped || holding ? "⏸️" : "⏳"}</span>
          <span style={{
            fontWeight: 800, fontSize: 17,
            color: flipped || holding ? "#9a94ad" : timeLeft <= 3 ? C.berry : C.ink,
          }}>
            {flipped || holding ? "take your time" : `${timeLeft}s`}
          </span>
        </div>
        <div style={{ height: 8, borderRadius: 6, background: "#F0EADC", overflow: "hidden" }}>
          <div style={{
            width: `${(flipped || holding ? 1 : timeLeft / RECALL_SECONDS) * 100}%`,
            height: "100%", borderRadius: 6,
            background: flipped || holding ? "#ded7c8" : timeLeft <= 3 ? C.berry : C.leaf,
            transition: "width 0.9s linear",
          }} />
        </div>
      </div>
      <div
        onClick={() =>
          setFlipped((f) => {
            const next = !f;
            if (next) speak(card); // say it as soon as the answer is shown
            return next;
          })
        }
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 28,
          padding: "44px 20px",
          margin: "16px 0",
          minHeight: 220,
          display: "flex",
          flexDirection: "column",
          justifyContent: "center",
          alignItems: "center",
          border: `4px solid ${flagged ? C.sun : C.sky}`,

// -------------------- BUILD A SENTENCE --------------------
// Tap the pinyin word-tiles in the right order to build the sentence.
// Teaches word order / grammar rather than isolated vocabulary.
// Common words/particles that appear in sentences but aren't vocab cards.
// Without these the tile would be read as raw pinyin, which sounds wrong.
const COMMON_HANZI = {
  "wǒ":"我","wǒmen":"我们","nǐ":"你","nǐmen":"你们","tā":"他","tāmen":"他们",
  "de":"的","bù":"不","bú":"不","le":"了","ba":"吧","ma":"吗","ne":"呢","a":"啊","la":"啦","na":"哪",
  "shì":"是","yǒu":"有","méi":"没","hěn":"很","tài":"太","dōu":"都","yào":"要","xiǎng":"想",
  "zuò":"做","lái":"来","qù":"去","kàn":"看","chī":"吃","hē":"喝","xǐ":"洗","ài":"爱",
  "zhè":"这","nà":"那","ge":"个","dà":"大","xiǎo":"小","hǎo":"好","huài":"坏",
  "tiān":"天","fàn":"饭","mén":"门","lǐ":"里","hé":"和","zài":"在","yī":"一","qī":"七",
  "diǎn":"点","diào":"掉","suān":"酸","qiāo":"敲","jiàn":"见","yīfu":"衣服","shūfu":"舒服",
  "yóuxì":"游戏","guānxi":"关系","hǎojiǔ":"好久","chuángshàng":"床上","zěnme":"怎么"
};

// Map a pinyin syllable back to its characters so tapped tiles are
// pronounced properly (browser voices read hanzi far better than pinyin).
let _pyMap = null;
const pinyinKey = (s) =>
  (s || "").toLowerCase().replace(/[.,!?;:。，！？、\s]/g, "");
const getPinyinMap = () => {
  if (_pyMap) return _pyMap;
  _pyMap = {};
  Object.keys(COMMON_HANZI).forEach((k) => { _pyMap[pinyinKey(k)] = COMMON_HANZI[k]; });
  try {
    (getVocab().lessons || []).forEach((L) =>
      (L.words || []).forEach((w) => {
        if (w.pinyin && w.hanzi) {
          const k = pinyinKey(w.pinyin);
          if (k && !_pyMap[k]) _pyMap[k] = w.hanzi;
        }
      })
    );
  } catch (e) {}
  return _pyMap;
};
const speakToken = (token) => {
  const hz = getPinyinMap()[pinyinKey(token)];
  speak(hz ? { hanzi: hz, pinyin: token } : { pinyin: token });
};

function BuildSentence({ sentences, starred, toggleSentence, onHome }) {
  const pickOne = () => {
    const usable = sentences.filter((s) => (s.pinyin || "").split(/\s+/).length >= 2);
    if (!usable.length) return null;
    return srsPick(usable, (s) => s.en) || usable[0];
  };
  const [s, setS] = useState(pickOne);
  const [placed, setPlaced] = useState([]);
  const [tiles, setTiles] = useState([]);
  const [status, setStatus] = useState(null); // null | 'right' | 'wrong'
  const [score, setScore] = useState(0);
  const [attempts, setAttempts] = useState(0);
  const [revealed, setRevealed] = useState(false);

  // split the pinyin into tappable tiles (strip trailing punctuation for matching)
  const cleanWord = (t) => t.replace(/[.,!?。，！？]/g, "");

  useEffect(() => {
    if (!s) return;
    const parts = (s.pinyin || "").split(/\s+/).filter(Boolean);
    setTiles(shuffle(parts.map((t, idx) => ({ id: idx, text: t }))));
    setPlaced([]);
    setStatus(null);
    setAttempts(0);
    setRevealed(false);
  }, [s]);

  if (!s)
    return (
      <Center>
        <div style={{ fontSize: 54 }}>🧩</div>
        <h2 style={{ margin: "10px 0" }}>No sentences for these lessons</h2>
        <p style={{ color: "#7a7391", maxWidth: 320, textAlign: "center" }}>
          Pick more lessons in the word bank to play this one.
        </p>
        <button onClick={onHome} style={{ ...bigBtn, background: C.fox, marginTop: 16 }}>⬅ Back to menu</button>
      </Center>
    );

  const target = (s.pinyin || "").split(/\s+/).filter(Boolean);
  const flagged = starred.has(s.en);

  // After a wrong answer the tiles stay editable so Sam can fix his own
  // sentence. Only "right" locks the board.
  const place = (tile) => {
    if (status === "right") return;
    if (status === "wrong") setStatus(null);   // start editing again
    speakToken(tile.text);            // say each word as it's tapped
    setPlaced((p) => [...p, tile]);
    setTiles((t) => t.filter((x) => x.id !== tile.id));
  };
  const unplace = (tile) => {
    if (status === "right") return;
    if (status === "wrong") setStatus(null);
    speakToken(tile.text);
    setPlaced((p) => p.filter((x) => x.id !== tile.id));
    setTiles((t) => [...t, tile]);
  };
  const clearAll = () => {
    if (status === "right") return;
    setStatus(null);
    setTiles((t) => [...t, ...placed]);
    setPlaced([]);
  };

  const check = () => {
    const attempt = placed.map((p) => cleanWord(p.text).toLowerCase()).join(" ");
    const want = target.map((t) => cleanWord(t).toLowerCase()).join(" ");
    const ok = attempt === want;
    setStatus(ok ? "right" : "wrong");
    // Only the FIRST try counts for spaced repetition and the daily goal,
    // so retrying to fix a sentence is free but can't farm chips.
    if (attempts === 0) {
      srsRecord(s.en, ok);
      recordEffort();   // one sentence = one point, same as any other answer
    }
    if (ok) { setScore((v) => v + 1); playApplause(); speak({ hanzi: s.hanzi, pinyin: s.pinyin }); }
    else {
      setAttempts((a) => a + 1);
      playSoftMiss();
      if (toggleSentence && !starred.has(s.en)) toggleSentence(s.en);
    }
  };

  const nextOne = () => setS(pickOne());

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
        <Badge color={C.leaf}>⭐ {score}</Badge>
        <Badge color={C.sky}>🧩 build it</Badge>
      </div>

      <div
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 22,
          padding: "20px 16px",
          border: `4px solid ${flagged ? C.sun : C.sky}`,
          boxShadow: `0 8px 0 ${flagged ? "rgba(246,196,69,0.35)" : "rgba(107,169,214,0.3)"}`,
        }}
      >
        <StarButton flagged={flagged} onClick={() => toggleSentence(s.en)} />
        <div style={{ fontSize: 13, color: "#9a94ad", marginBottom: 6, fontWeight: 700 }}>
          Put the words in order to say:
        </div>
        <div style={{ fontSize: 19, fontWeight: 800, lineHeight: 1.35 }}>{s.en}</div>
      </div>

      {/* answer slots */}
      <div
        style={{
          minHeight: 66,
          marginTop: 14,
          padding: "12px 10px",
          borderRadius: 16,
          border: `3px dashed ${status === "right" ? C.leaf : status === "wrong" ? "#F0A5A5" : "#d8d0be"}`,
          background: status === "right" ? "#EAF7F0" : status === "wrong" ? "#FDECEC" : "#FFFDF7",
          display: "flex",
          flexWrap: "wrap",
          gap: 8,
          alignItems: "flex-start",
        }}
      >
        {placed.length === 0 && (
          <span style={{ fontSize: 13, color: "#b3ab98" }}>Tap the words below…</span>
        )}
        {placed.map((t) => (
          <button key={t.id} onClick={() => unplace(t)} style={{ ...tile_, background: C.sky, color: "#fff", borderColor: C.sky }}>
            {t.text}
          </button>
        ))}
      </div>

      {/* available tiles */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 14, justifyContent: "center" }}>
        {tiles.map((t) => (
          <button key={t.id} onClick={() => place(t)} style={tile_}>
            {t.text}
          </button>
        ))}
      </div>

      {status === "wrong" && !revealed && (
        <div style={{ marginTop: 14, textAlign: "center" }}>
          <div style={{ color: C.berry, fontWeight: 800 }}>Not quite — tap the words to move them around!</div>
          <div style={{ fontSize: 12, color: "#7a7391", marginTop: 4 }}>
            Tap a word in the box to take it back out.
          </div>
          <button onClick={() => { setRevealed(true); speak({ hanzi: s.hanzi, pinyin: s.pinyin }); }}
            style={{ ...ghostBtn, marginTop: 10 }}>
            🙈 Show me the answer
          </button>
        </div>
      )}
      {revealed && status !== "right" && (
        <div style={{ marginTop: 14, textAlign: "center" }}>
          <div style={{ color: C.berry, fontWeight: 800 }}>It should be:</div>
          <div style={{ fontSize: 18, fontWeight: 800, marginTop: 4, color: C.fox }}>{s.pinyin}</div>
          <button onClick={() => speak({ hanzi: s.hanzi, pinyin: s.pinyin })} style={{ ...ghostBtn, marginTop: 8 }}>🔊 Hear it</button>
        </div>
      )}
      {status === "right" && (
        <div style={{ marginTop: 14, textAlign: "center", color: C.leaf, fontWeight: 800, fontSize: 18 }}>
          ✓ Perfect!{attempts > 0 ? " You fixed it! 🎉" : ""}
        </div>
      )}

      <div style={{ marginTop: 16 }}>
        {status === "right" || revealed ? (
          <button onClick={nextOne} style={{ ...bigBtn, background: C.sky, width: "100%" }}>
            Next sentence →
          </button>
        ) : (
          <div style={{ display: "flex", gap: 10 }}>
            {placed.length > 0 && (
              <button onClick={clearAll}
                style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, flex: "0 0 38%" }}>
                ↺ Clear
              </button>
            )}
            <button
              onClick={check}
              disabled={placed.length === 0}
              style={{ ...bigBtn, background: C.leaf, flex: 1, opacity: placed.length ? 1 : 0.5 }}
            >
              {attempts > 0 ? "✓ Try again" : "✓ Check"}
            </button>
          </div>
        )}
      </div>

      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 12, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

const tile_ = {
  border: "3px solid #e3ddcf",
  background: "#fff",
  color: "#2A2440",
  borderRadius: 12,
  padding: "10px 14px",
  fontSize: 17,
  fontWeight: 800,

};

// -------------------- BEAT THE CLOCK --------------------
function BeatTheClock({ words, addTrouble, trouble, toggleTrouble, onHome }) {
  const [phase, setPhase] = useState("ready"); // ready | play | done
  const [time, setTime] = useState(60);
  const [score, setScore] = useState(0);
  const [round, setRound] = useState(null);
  const [flash, setFlash] = useState(null);
  const timer = useRef(null);

  const build = (avoid) => {
    const q = srsPick(words, (w) => w.pinyin, avoid) || shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.pinyin !== q.pinyin)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };

  const start = () => {
    setScore(0);
    setTime(60);
    setPhase("play");
    setRound(build());
    timer.current = setInterval(() => {
      setTime((t) => {
        if (t <= 1) {
          clearInterval(timer.current);
          recordEffort();   // whole round counts as ONE practice (per Vin)
          setPhase("done");
          return 0;
        }
        return t - 1;
      });
    }, 1000);
  };

  useEffect(() => () => clearInterval(timer.current), []);

  const choose = (opt) => {
    const right = opt.pinyin === round.q.pinyin;
    setFlash(right ? "right" : "wrong");
    if (right) { setScore((s) => s + 1); playCorrect(score); speak(round.q); }
    else { playSoftMiss(); addTrouble && addTrouble(round.q.pinyin); }
    srsRecord(round.q.pinyin, right);   // still tracked for spaced repetition
    // NOTE: effort is credited once per completed round, not per answer,
    // so a fast 60s round can't inflate the daily goal.
    const prev = round.q.pinyin;
    setTimeout(() => { setFlash(null); setRound(build(prev)); }, 200);
  };

  if (phase === "ready")
    return (
      <Center>
        <div style={{ fontSize: 60 }}>⏱️</div>
        <h2 style={{ margin: "10px 0" }}>Beat the Clock!</h2>
        <p style={{ color: "#7a7391", maxWidth: 300, textAlign: "center" }}>
          Get as many right as you can in 60 seconds. Ready, Sam?
        </p>
        <button onClick={start} style={{ ...bigBtn, background: C.berry, marginTop: 16, padding: "16px 40px" }}>
          🚀 Start!
        </button>
      </Center>
    );

  if (phase === "done")
    return (
      <Center>
        <div style={{ fontSize: 64 }}>{score >= 15 ? "🏆" : score >= 8 ? "🌟" : "💪"}</div>
        <h2 style={{ margin: "8px 0" }}>Time's up!</h2>
        <div style={{ fontSize: 52, fontWeight: 800, color: C.fox }}>{score}</div>
        <div style={{ color: "#7a7391" }}>correct answers</div>
        <div style={{ marginTop: 8, fontWeight: 700, color: C.leaf }}>
          {score >= 15 ? "Amazing! You're a Chinese champion!" : score >= 8 ? "Great job! Try to beat it!" : "Nice try — go again!"}
        </div>
        <button onClick={start} style={{ ...bigBtn, background: C.berry, marginTop: 18 }}>
          🔁 Play again
        </button>
        <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 10 }}>
          ⬅ Back to menu
        </button>
      </Center>
    );

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <Badge color={C.fox}>⭐ {score}</Badge>
        <div
          style={{
            fontSize: 30,
            fontWeight: 800,
            color: time <= 10 ? C.berry : C.ink,
          }}
        >
          ⏱️ {time}s
        </div>
      </div>
      <div
        style={{
          position: "relative",
          background: flash === "right" ? "#DFF5EA" : flash === "wrong" ? "#FBE0E0" : "#fff",
          borderRadius: 24,
          padding: "28px 20px",
          textAlign: "center",
          border: `4px solid ${trouble && trouble.has(round.q.pinyin) ? C.sun : C.berry}`,
          transition: "background 0.15s",
        }}
      >
        <StarButton
          flagged={trouble ? trouble.has(round.q.pinyin) : false}
          onClick={() => toggleTrouble(round.q.pinyin)}
        />
        <div style={{ fontSize: 20, marginBottom: 4 }}>{round.q.emoji}</div>
        <div style={{ fontSize: 36, fontWeight: 800 }}>
          {round.q.en}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
        {round.options.map((opt, idx) => (
          <button key={idx} onClick={() => choose(opt)} style={{ ...bigBtn, background: "#fff", color: C.ink, border: "3px solid #e3ddcf", fontSize: 18, padding: "16px 8px" }}>
            {opt.pinyin}
          </button>
        ))}
      </div>
    </div>
  );
}

function SayTheSentence({ sentences, starred, toggleSentence, onHome, forceStarredOnly }) {
  const [onlyStarred, setOnlyStarred] = useState(false);

  const pool = onlyStarred
    ? sentences.filter((x) => starred.has(x.en))
    : sentences;

  const [deck, setDeck] = useState(() => shuffle(pool));
  const [i, setI] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [spoke, setSpoke] = useState(false);
  const [got, setGot] = useState(0);
  const [done, setDone] = useState(0);

  // rebuild the deck when the filter changes or the starred pile shifts under it
  useEffect(() => {
    setDeck(shuffle(pool));
    setI(0);
    setRevealed(false);
    setSpoke(false);
  }, [onlyStarred, pool.length]);

  const starredCount = sentences.filter((x) => starred.has(x.en)).length;
  const s = deck[i] || deck[0];

  if (!s) {
    // Two reasons the deck can be empty: filtering to starred-only with none
    // starred, or no selected lesson has any sentences.
    if (onlyStarred) {
      return (
        <Center>
          <div style={{ fontSize: 54 }}>⭐</div>
          <h2 style={{ margin: "10px 0" }}>No starred sentences yet</h2>
          <p style={{ color: "#7a7391", maxWidth: 320, textAlign: "center" }}>
            Tap the ⭐ on a sentence to save it here for extra practice.
          </p>
          <button onClick={() => setOnlyStarred(false)} style={{ ...bigBtn, background: C.leaf, marginTop: 16 }}>
            ← Back to all sentences
          </button>
        </Center>
      );
    }
    return (
      <Center>
        <div style={{ fontSize: 54 }}>💬</div>
        <h2 style={{ margin: "10px 0" }}>No sentences for these lessons</h2>
        <p style={{ color: "#7a7391", maxWidth: 340, textAlign: "center" }}>
          The lessons you've picked don't have sentences yet. Head back and select
          more lessons in the word bank to practice sentences.
        </p>
      </Center>
    );
  }

  const flagged = starred.has(s.en);

  const reveal = () => {
    if (!revealed) {
      setRevealed(true);
      speak({ hanzi: s.hanzi, pinyin: s.pinyin }); // say it in good Mandarin
    }
  };

  const next = (knewIt) => {
    if (knewIt) { setGot((g) => g + 1); playCorrect(got); }
    setSpoke(false);
    setDone((d) => d + 1);
    if (s) srsRecord(s.en, !!knewIt);
    recordEffort();               // one point per sentence
    setRevealed(false);
    if (i + 1 < deck.length) setI(i + 1);
    else {
      setI(0);
      setDeck(shuffle(pool));
    }
  };

  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <Progress value={i} total={deck.length} label={`✅ ${got} / ${done}`} />
      </div>

      {!forceStarredOnly && (
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 4 }}>
          <button
            onClick={() => starredCount > 0 && setOnlyStarred((v) => !v)}
            disabled={!onlyStarred && starredCount === 0}
            style={{
              ...ghostBtn,
              fontSize: 12,
              borderColor: onlyStarred ? C.sun : "#e3ddcf",
              background: onlyStarred ? "#FFF9EC" : "#fff",
              opacity: !onlyStarred && starredCount === 0 ? 0.5 : 1,
            }}
          >
            {onlyStarred ? "⭐ Practicing starred — show all" : `⭐ Practice starred only (${starredCount})`}
          </button>
        </div>
      )}
      {forceStarredOnly && (
        <div style={{ textAlign: "center", marginBottom: 4, fontSize: 12, fontWeight: 800, color: C.sun }}>
          ⭐ Practicing your tricky sentences
        </div>
      )}

      <div
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 28,
          padding: "34px 20px",
          margin: "12px 0 16px",
          minHeight: 230,
          display: "flex",
          flexDirection: "column",
          justifyContent: "center",
          alignItems: "center",
          border: `4px solid ${flagged ? C.sun : C.fox}`,
          boxShadow: `0 10px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(232,112,58,0.3)"}`,
        }}
      >
        <StarButton flagged={flagged} onClick={() => toggleSentence(s.en)} />

// -------------------- WHAT'S THAT SENTENCE MEAN? --------------------
// Sam hears a full sentence in Mandarin and picks the correct English meaning.
function SentenceMeaning({ sentences, starred, toggleSentence, onHome }) {
  const build = () => {
    const q = shuffle(sentences)[0];
    const wrong = shuffle(sentences.filter((s) => s.en !== q.en)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const [round, setRound] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);

  useEffect(() => { if (round && round.q) speak(round.q); }, [round]);

  if (!round || !round.q) {
    return (
      <Center>
        <div style={{ fontSize: 54 }}>📣</div>
        <h2 style={{ margin: "10px 0" }}>No sentences for these lessons</h2>
        <p style={{ color: "#7a7391", maxWidth: 340, textAlign: "center" }}>
          Pick more lessons in the word bank to practice sentences.
        </p>
        <button onClick={onHome} style={{ ...bigBtn, background: C.leaf, marginTop: 16 }}>
          ⬅ Back to menu
        </button>
      </Center>
    );
  }

  const flagged = starred ? starred.has(round.q.en) : false;

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    if (opt.en === round.q.en) {
      setScore((s) => s + 1);
      setStreak((s) => s + 1);
      playCorrect(streak);
      if (streak + 1 === 5) playApplause();   // reward a hot run
    } else {
      setStreak(0);
      playSoftMiss();
      toggleSentence && !starred.has(round.q.en) && toggleSentence(round.q.en);
    }
    srsRecord(round.q.en, opt.en === round.q.en);
    recordEffort();               // one point per sentence answered
    setTimeout(() => { setPicked(null); setRound(build()); }, 1400);
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
        <Badge color={C.sun}>⭐ {score}</Badge>
        <Badge color={streak >= 3 ? C.berry : C.leaf}>
          🔥 {streak} {streak >= 3 ? "on fire!" : ""}
        </Badge>
      </div>
      <div
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 24,
          padding: "30px 20px",
          textAlign: "center",
          border: `4px solid ${flagged ? C.sun : C.fox}`,
          boxShadow: `0 8px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(232,112,58,0.3)"}`,
        }}
      >
        <StarButton flagged={flagged} onClick={() => toggleSentence(round.q.en)} />
        <button onClick={() => speak(round.q)} style={{ ...bigBtn, background: C.sky, fontSize: 20, padding: "16px 30px" }}>
          🔊 Play sentence
        </button>
        <div style={{ marginTop: 12, fontSize: 15, color: "#cfc9bb", fontWeight: 700, minHeight: 20 }}>
          {picked ? round.q.pinyin : ""}
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
        {round.options.map((opt, idx) => {
          let bg = "#fff", bd = "#e3ddcf", cl = C.ink;
          if (picked) {
            if (opt.en === round.q.en) { bg = C.leaf; bd = C.leaf; cl = "#fff"; }
            else if (opt.en === picked.en) { bg = "#F4A7A7"; bd = "#F4A7A7"; cl = "#fff"; }
          }
          return (
            <button
              key={idx}
              onClick={() => choose(opt)}
              style={{ ...bigBtn, background: bg, color: cl, border: `3px solid ${bd}`, fontSize: 16, padding: "14px 10px", textAlign: "left" }}
            >
              {opt.en}
            </button>
          );
        })}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

// -------------------- WHAT DOES THIS MEAN? --------------------
// Sam hears the word spoken in Chinese and picks the correct English meaning
function ToneMatch({ words, addTrouble, trouble, toggleTrouble, onHome }) {
  const build = (avoid) => {
    const q = srsPick(words, (w) => w.pinyin, avoid) || shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.en !== q.en)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const [round, setRound] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);

  const flagged = trouble ? trouble.has(round.q.pinyin) : false;

  useEffect(() => { speak(round.q); }, [round]);

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    if (opt.en === round.q.en) {
      setScore((s) => s + 1);
      setStreak((s) => s + 1);
      playCorrect(streak);
      if (streak + 1 === 5) playApplause();
    } else {
      setStreak(0);
      playSoftMiss();
      addTrouble && addTrouble(round.q.pinyin);
    }
    srsRecord(round.q.pinyin, opt.en === round.q.en);
    recordEffort();
    const prevKey = round.q.pinyin;
    setTimeout(() => { setPicked(null); setRound(build(prevKey)); }, 1200);
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
        <Badge color={C.leaf}>⭐ {score}</Badge>
        <Badge color={streak >= 3 ? C.berry : C.sun}>

          position: "relative",
          background: "#fff",
          borderRadius: 24,
          padding: "30px 20px",
          textAlign: "center",
          border: `4px solid ${flagged ? C.sun : C.leaf}`,

          🔊 Play sound
        </button>
        <div style={{ marginTop: 12, fontSize: 18, color: "#cfc9bb", fontWeight: 700 }}>
          {picked ? round.q.pinyin : ""}
        </div>
      </div>

// -------------------- WORD LIST --------------------
// Comprehensive A–Z list (by English). Archive words Sam has mastered so they
// drop out of the games but stay here for reference.
function WordList({ allWords, archived, trouble, toggleTrouble, toggleArchived, customWords, addCustomWord, removeCustomWord, openAdd }) {
  const [showArchived, setShowArchived] = useState(true);
  const [showAdd, setShowAdd] = useState(!!openAdd);
  const [bulk, setBulk] = useState("");
  const [added, setAdded] = useState(0);

  const customSet = new Set((customWords || []).map((w) => w.pinyin));

  // Work out what the user typed: Chinese characters, pinyin, or English.
  const classify = (text) => {
    const t = text.trim();
    if (!t) return null;
    const hasHan = /[\u4e00-\u9fff]/.test(t);
    // pinyin often carries tone marks; also treat "ni hao"-style ASCII as
    // ambiguous and let Claude sort it out later.
    const hasToneMark = /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/i.test(t);
    if (hasHan) return { en: "", pinyin: "", hanzi: t };
    if (hasToneMark) return { en: "", pinyin: t, hanzi: "" };
    return { en: t, pinyin: "", hanzi: "" };
  };

  // One box, one or more lines. Also accepts "english = 中文" or "english - 中文".
  const submit = () => {
    const lines = bulk.split("\n").map((s) => s.trim()).filter(Boolean);
    let n = 0;
    lines.forEach((line) => {
      // allow an explicit pairing on one line
      const pair = line.split(/\s*[=|]\s*/);
      let parts;
      if (pair.length >= 2) {
        const merged = { en: "", pinyin: "", hanzi: "" };
        pair.forEach((p) => {
          const c = classify(p);
          if (!c) return;
          if (c.hanzi) merged.hanzi = c.hanzi;
          else if (c.pinyin) merged.pinyin = c.pinyin;
          else if (!merged.en) merged.en = c.en;
        });
        parts = merged;
      } else {
        parts = classify(line);
      }
      if (!parts || (!parts.en && !parts.pinyin && !parts.hanzi)) return;
      addCustomWord({
        en: parts.en || parts.pinyin || parts.hanzi,
        pinyin: parts.pinyin || "",
        hanzi: parts.hanzi || "",   // hanzi drives good audio when present
        emoji: "📝",
        needsDef: !(parts.en && parts.pinyin && parts.hanzi),
      });
      n++;
    });
    setAdded(n);
    setBulk("");
    setTimeout(() => setAdded(0), 4000);
  };

  const sorted = [...allWords].sort((a, b) =>
    a.en.toLowerCase().localeCompare(b.en.toLowerCase())
  );
  const rows = sorted;
  const activeCount = allWords.length;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontWeight: 800, fontSize: 16 }}>
          📖 Word list <span style={{ color: C.fox }}>({activeCount} active)</span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setShowAdd((s) => !s)} style={{ ...ghostBtn, fontSize: 13, borderColor: C.leaf, color: C.leaf }}>
            ➕ Add word
          </button>

        </div>
      </div>

      {showAdd && (
        <div style={{ background: "#F4FBF7", border: `2px solid ${C.leaf}`, borderRadius: 16, padding: 14, marginBottom: 14 }}>
          <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 6 }}>Add words</div>
          <div style={{ fontSize: 12, color: "#5c7a6c", marginBottom: 10, lineHeight: 1.5 }}>
            Type or paste one word per line — English, pinyin, or Chinese, whichever
            you have. Claude fills in the rest next time you chat.
          </div>
          <textarea
            value={bulk}
            onChange={(e) => setBulk(e.target.value)}
            rows={5}
            placeholder={"also\n猫\nmāo\nrabbit = 兔子"}
            style={{ ...inp, fontFamily: "inherit", fontSize: 15, lineHeight: 1.6, resize: "vertical" }}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button onClick={submit} disabled={!bulk.trim()}
              style={{ ...bigBtn, background: C.leaf, flex: 1, fontSize: 15, padding: "10px", opacity: bulk.trim() ? 1 : 0.5 }}>
              ✓ Add words
            </button>
            <button onClick={() => setShowAdd(false)} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, fontSize: 15, padding: "10px 16px" }}>
              Done
            </button>
          </div>
          {added > 0 && (
            <div style={{ marginTop: 10, fontWeight: 700, color: C.leaf, fontSize: 14 }}>
              Added {added} word{added === 1 ? "" : "s"} to “Words We Added”.
            </div>
          )}
        </div>
      )}
      <div style={{ fontSize: 12, color: "#7a7391", marginBottom: 12 }}>
        Tap ⭐ to add a word to the practice pile, or 🔊 to hear it.
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {rows.map((w, idx) => {

          const isTricky = trouble.has(w.pinyin);
          return (
            <div
              key={w.pinyin + idx}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                background: "#fff",
                border: `2px solid ${isTricky ? C.sun : "#efe8d8"}`,
                borderRadius: 14,
                padding: "10px 12px",
              }}
            >
              <span style={{ fontSize: 22, width: 28, textAlign: "center" }}>{w.emoji}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 800, fontSize: 15, color: C.ink }}>
                  {w.en}
                </div>
                <div style={{ fontSize: 13, color: C.fox, fontWeight: 700 }}>
                  {w.pinyin}
                </div>
              </div>
              <button
                onClick={() => toggleTrouble(w.pinyin)}
                style={{
                  ...ghostBtn,
                  padding: "6px 9px",
                  fontSize: 16,
                  borderColor: isTricky ? C.sun : "#e3ddcf",
                  background: isTricky ? "#FFF9EC" : "#fff",
                  filter: isTricky ? "none" : "grayscale(1) opacity(0.5)",
                }}
                title={isTricky ? "In practice pile — tap to remove" : "Save to practice pile"}
              >
                ⭐
              </button>
              <button
                onClick={() => speak(w)}
                style={{ ...ghostBtn, padding: "6px 10px", fontSize: 15 }}
                title="Hear it"
              >
                🔊
              </button>
              {customSet.has(w.pinyin) && (
                <button
                  onClick={() => {
                    if (window.confirm(`Delete “${w.en}” from Words We Added?`)) removeCustomWord(w.pinyin);
                  }}
                  style={{ ...ghostBtn, padding: "6px 8px", fontSize: 14, borderColor: "#F0B4B4", color: C.berry }}
                  title="Delete this word you added"
                >
                  🗑
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

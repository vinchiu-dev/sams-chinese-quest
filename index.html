// UTF-8-safe base64 (btoa alone breaks on Chinese characters)
const b64encode = (str) => btoa(unescape(encodeURIComponent(str)));
const b64decode = (b64) => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

async function pullRemoteProgress() {
  if (!ghConfigured()) return null;
  const { owner, repo, token } = getGH();
  try {
    const r = await fetch(`${GH_API}/repos/${owner}/${repo}/contents/progress.json`, { headers: ghHeaders(token) });
    if (r.status === 404) return {}; // no progress file yet — fine
    if (!r.ok) return null;
    const data = await r.json();
    window.__PROGRESS_SHA__ = data.sha;
    return JSON.parse(b64decode(data.content));
  } catch (e) { return null; }
}

let syncTimer = null;
function scheduleSync(progress, setStatus) {
  if (!ghConfigured()) return;
  clearTimeout(syncTimer);
  window.__PENDING_PROGRESS__ = progress;
  syncTimer = setTimeout(() => {
    window.__PENDING_PROGRESS__ = null;
    pushProgress(progress, setStatus);
  }, 2500);
}

// Push straight away — used when the tab is being hidden or closed, so a
// change made a second before switching devices isn't lost.
function flushSync() {
  const pending = window.__PENDING_PROGRESS__;
  if (!pending) return;
  clearTimeout(syncTimer);
  window.__PENDING_PROGRESS__ = null;
  try { pushProgress(pending); } catch (e) {}
}

async function pushProgress(progress, setStatus, retried) {
  const { owner, repo, token } = getGH();
  try {
    const body = {
      message: "Update Sam progress",
      content: b64encode(JSON.stringify(progress, null, 2)),
    };
    if (window.__PROGRESS_SHA__) body.sha = window.__PROGRESS_SHA__;
    const r = await fetch(`${GH_API}/repos/${owner}/${repo}/contents/progress.json`, {
      method: "PUT", headers: ghHeaders(token), body: JSON.stringify(body),
    });
    if (r.status === 409 && !retried) {
      // sha out of date (another device pushed) — refetch sha and retry once
      await pullRemoteProgress();
      return pushProgress(progress, setStatus, true);
    }
    if (!r.ok) { setStatus && setStatus("error"); return; }
    const data = await r.json();
    window.__PROGRESS_SHA__ = data.content && data.content.sha;
    setStatus && setStatus("synced");
  } catch (e) { setStatus && setStatus("error"); }
}

// ============================================================
//  SAM'S CHINESE QUEST — a growing vocabulary review game
//
//  TO ADD A NEW LESSON: paste it at the BOTTOM of the LESSONS
//  array below. The word bank shows lessons newest-first, so the
//  most recent one always appears at the top of the screen —
//  handy for reviewing just-learned words first.
//
//  Each word: { hanzi, pinyin, en, emoji }
//   • hanzi  — used only to generate good audio (never shown)
//   • pinyin — what Sam reads/recalls
//   • en     — English meaning
//   • emoji  — a little visual hint
// ============================================================

const getVocab = () => window.__VOCAB__ || { lessons: [], tagMap: {}, sentences: [] };

// ============================================================
//  SENTENCES for "Say the Sentence" — Sam reads the English and
//  says it in Chinese, then reveals the answer to check + hear it.
//  Built from vocabulary in the lessons above, using the same
//  GoEast story patterns. hanzi drives the audio (never shown).
//  Add more anytime — each: { en, pinyin, hanzi, tag }.
// ============================================================
// Maps each sentence tag to the lesson id(s) it belongs to, so Say the Sentence
// can filter to only the currently-selected lessons (matching the other games).




const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// ---- audio: browser speech, but we deliberately pick the BEST Mandarin
// voice the device has instead of accepting the default (which is often the
// robotic one). Voices load asynchronously, so we resolve on load + retries.
let bestVoice = null;

const PREFERRED_VOICES = [
  "Google 普通话（中国大陆）", "Google Mandarin", "Google 国语",
  "Microsoft Xiaoxiao", "Microsoft Yunxi", "Microsoft Yunyang",
  "Microsoft Yaoyao", "Microsoft Huihui", "Microsoft Kangkang",
  "Tingting", "Sinji", "Meijia",
  "mandarin", "chinese", "cmn", "zh-CN",
];

const selectBestVoice = () => {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  let selected = null;
  for (const name of PREFERRED_VOICES) {
    selected = voices.find(
      (v) =>
        v.lang.toLowerCase().includes("zh") &&
        (v.name.toLowerCase().includes(name.toLowerCase()) || v.name.includes(name))
    );
    if (selected) break;
  }
  if (!selected) {
    selected = voices.find(
      (v) => v.lang === "zh-CN" || v.lang === "zh-TW" || v.lang.toLowerCase().startsWith("zh")
    );
  }
  if (selected) bestVoice = selected;
};

// Mobile webviews (incl. the Claude app) often (a) return an empty voice list
// until the engine warms up and (b) block speech until the user's first tap.
// We prime the engine on the first touch and keep retrying voice selection.
let speechPrimed = false;
const primeSpeech = () => {
  if (speechPrimed || !("speechSynthesis" in window)) return;
  speechPrimed = true;
  try {
    // a silent utterance unlocks the audio channel on mobile
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
  selectBestVoice();
  // selectBestEnVoice is defined later in this file; call it only if it exists yet
  try { if (typeof selectBestEnVoice === "function") selectBestEnVoice(); } catch (e) {}
};

if (typeof window !== "undefined" && "speechSynthesis" in window) {
  if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", selectBestVoice);
  else window.speechSynthesis.onvoiceschanged = selectBestVoice;
  [200, 600, 1200, 2500].forEach((ms) => setTimeout(selectBestVoice, ms));
  // first user gesture anywhere primes audio for the whole session
  ["touchstart", "pointerdown", "click"].forEach((evt) =>
    window.addEventListener(evt, primeSpeech, { once: true, passive: true })
  );
}

const speak = (word) => {
  if (!("speechSynthesis" in window)) return;
  // Feed the CHARACTERS to the voice when we have them — browser Mandarin voices
  // pronounce hanzi with better tones than bare pinyin. Sam never sees these;
  // the screen still shows only pinyin/English.
  const text =
    word && typeof word === "object" ? (word.hanzi || word.pinyin) : word;
  if (!text) return;

  const say = () => {
    try {
      // Android Chrome can drop a new utterance if cancel() fires right before
      // speak(); only cancel when something is actually playing.
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      // Speed: normal (0.88) or slow (~70% of normal) — toggled on the home screen.
      u.rate = loadLS("zh_slow", false) ? 0.62 : 0.88;
      u.pitch = 1.02;
      if (!bestVoice) selectBestVoice();
      var zhPref = loadLS("zh_voice_pref", "");
      var zhChosen = zhPref
        ? window.speechSynthesis.getVoices().find(function(v){ return v.name === zhPref; })
        : bestVoice;
      if (zhChosen) u.voice = zhChosen; // else: let the OS pick a zh voice by lang
      window.speechSynthesis.speak(u);
      // Android sometimes leaves the queue paused after a cancel
      try { window.speechSynthesis.resume(); } catch (e) {}
    } catch (e) {}
  };

  // IMPORTANT (Android Chrome): speak() must run synchronously inside the tap
  // handler or the utterance is silently dropped. So always try immediately;
  // only use delayed retries as a fallback if nothing actually started.
  const hadVoices = window.speechSynthesis.getVoices().length > 0;
  selectBestVoice();
  say();
  // If no voices existed yet, the synchronous attempt may have produced silence.
  // Retry once voices arrive — but stop as soon as anything is actually playing.
  if (!hadVoices) {
    let tries = 0;
    const retry = () => {
      tries++;
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
      selectBestVoice();
      if (window.speechSynthesis.getVoices().length) { say(); return; }
      if (tries < 6) setTimeout(retry, 300);
    };
    setTimeout(retry, 300);
  }
};


// ============================================================
//  SPACED REPETITION
//  Each word gets a "level" 0-5. Right answers raise it, wrong
//  answers reset it. Lower level = shows up far more often.
//  Levels also age: a word not seen in a while drifts back down,
//  so nothing is silently forgotten.
// ============================================================

// ============================================================
//  Offline Chinese dictionary — type the 汉字, get pinyin + English.
//  Data is CC-CEDICT, split into 64 shards by first character so a
//  lookup pulls ~70KB instead of a 5MB file. Cached after first use.
//  If a whole word isn't listed, we still build pinyin character by
//  character so nothing ever comes back completely blank.
// ============================================================
const DICT_SHARDS = 64;
const _dictCache = {};
let _dictChars = null;

const loadShard = (n) => {
  const key = "w" + (n < 10 ? "0" + n : n);
  if (_dictCache[key]) return _dictCache[key];
  _dictCache[key] = fetch("dict/" + key + ".json")
    .then((r) => (r.ok ? r.json() : {}))
    .catch(() => ({}));
  return _dictCache[key];
};
const loadDictChars = () => {
  if (_dictChars) return _dictChars;
  _dictChars = fetch("dict/chars.json")
    .then((r) => (r.ok ? r.json() : {}))
    .catch(() => ({}));
  return _dictChars;
};

// Tidy CC-CEDICT glosses into something a 7-year-old's word list can show.
const tidyGloss = (en) => {
  if (!en) return "";
  // Keep the first TWO senses when they're short. CC-CEDICT often leads with
  // a British or clipped form ("rule", "rubber") and puts the word a child
  // would actually use second ("ruler", "eraser"). Showing both means the
  // right one is on screen to pick rather than buried in the dictionary.
  const senses = String(en).split(";").map((x) => x
    .replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim()
    .replace(/^(to |a |an |the )/i, "")).filter(Boolean);
  let out = senses[0] || "";
  // only a single-word alternative — "cat; hide oneself" must not become
  // "cat / hide oneself"
  if (senses[1] && senses[1].indexOf(" ") === -1 && (out.length + senses[1].length) < 30)
    out = out + " / " + senses[1];
  if (out.length > 42) out = out.slice(0, 40).replace(/\s+\S*$/, "") + "…";
  return out.trim();
};

const lookupZh = async (hanzi) => {
  const word = String(hanzi || "").trim();
  if (!word) return null;
  const shard = await loadShard(word.charCodeAt(0) % DICT_SHARDS);
  const hit = shard[word];
  if (hit) return { pinyin: hit[0], en: tidyGloss(hit[1]), exact: true };
  // no entry for the whole word — assemble pinyin from its characters
  const chars = await loadDictChars();
  const py = [];
  for (const ch of word) {
    if (!chars[ch]) return { pinyin: "", en: "", exact: false };
    py.push(chars[ch]);
  }
  return { pinyin: py.join(" "), en: "", exact: false };
};

const SRS_KEY = "srs";
const loadSrs = () => loadLS(SRS_KEY, {});
const saveSrs = (s) => saveLS(SRS_KEY, s);

const DAY = 86400000;
// how long a word at each level can rest before it's due again
const LEVEL_REST = [0, 1, 2, 4, 8, 16];

const srsRecord = (key, correct) => {
  const s = loadSrs();
  const cur = s[key] || { lvl: 0, seen: 0, right: 0, wrong: 0, last: 0 };
  cur.seen += 1;
  cur.last = Date.now();
  if (correct) { cur.right += 1; cur.lvl = Math.min(5, cur.lvl + 1); }
  else { cur.wrong += 1; cur.lvl = 0; }
  s[key] = cur;
  saveSrs(s);
  bumpProgress();
};

// Weight = how badly this item needs practice. Higher = pick more often.
const srsWeight = (key) => {
  // today's word gets pushed to the front of the queue everywhere
  const wod = wodActive();
  if (wod && (key === wod.pinyin || key === wod.en)) return 40;
  const s = loadSrs();
  const r = s[key];
  if (!r) return 8;                       // never seen — top priority
  const restDays = LEVEL_REST[r.lvl] || 1;
  const daysSince = (Date.now() - (r.last || 0)) / DAY;
  const overdue = daysSince / restDays;   // >1 means it's due
  const base = 6 - r.lvl;                 // low level = needs work
  return Math.max(0.4, base * (overdue >= 1 ? 1.8 : 0.5) + (r.wrong || 0) * 0.6);
};

// Weighted random pick, avoiding an immediate repeat where possible.
const srsPick = (items, keyOf, avoidKey) => {
  if (!items.length) return null;
  const pool = items.length > 1 && avoidKey
    ? items.filter((it) => keyOf(it) !== avoidKey)
    : items;
  const list = pool.length ? pool : items;
  const weights = list.map((it) => srsWeight(keyOf(it)));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < list.length; i++) {
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  return list[list.length - 1];
};

// Order a whole deck so shaky words come first (used by flip cards).
const srsOrder = (items, keyOf) =>
  [...items].sort((a, b) => srsWeight(keyOf(b)) - srsWeight(keyOf(a)));

// ---------- daily streak ----------
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const markPracticedToday = () => {
  const days = loadLS("practiceDays", []);

};
const currentStreak = () => {
  const days = new Set(loadLS("practiceDays", []));

  const d = new Date();
  // today doesn't break the streak if not yet practiced
  if (!days.has(todayKey())) d.setDate(d.getDate() - 1);
  for (;;) {
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    if (days.has(k)) { n++; d.setDate(d.getDate() - 1); } else break;
  }
  return n;
};
const practicedToday = () => loadLS("practiceDays", []).includes(todayKey());


// ============================================================
//  DAILY GOAL + CHIPS
//  Deliberately rewards SHOWING UP, not scoring well. The spaced
//  repetition serves up the words Sam is worst at, so paying for
//  correct answers would punish him for practicing what he most
//  needs — and push him toward easy lessons. Effort is the metric.
// ============================================================
const DAILY_GOAL = 15;          // answers/cards to complete a day
const CHIPS_PER_DAY = 1;        // earned once the goal is met
const STREAK_BONUS_EVERY = 7;   // extra chips at each 7-day milestone
const STREAK_BONUS_CHIPS = 5;

const getDayCount = () => {
  const rec = loadLS("dayCount", {});
  return rec.date === todayKey() ? (rec.n || 0) : 0;
};
const bumpDayCount = (weight = 1) => {
  const t = todayKey();
  const rec = loadLS("dayCount", {});
  const n = (rec.date === t ? (rec.n || 0) : 0) + weight;
  saveLS("dayCount", { date: t, n });
  return n;
};

const getChips = () => loadLS("chips", 0);
const addChips = (n) => { saveLS("chips", Math.max(0, getChips() + n)); bumpProgress(); };
const getChipLog = () => loadLS("chipLog", []);
const logChips = (entry) => {
  const l = getChipLog();
  l.unshift({ ...entry, at: Date.now() });
  saveLS("chipLog", l.slice(0, 60));
};

// Called after every graded answer. Awards the day's chip the moment
// the goal is reached (once per day only).
// weight: how much this activity is worth toward the daily goal.
// Building a whole sentence is far more work than one multiple-choice tap.
// Speaking out loud is the highest-value practice, so it earns a small bonus
// chip once per day — enough to notice, not enough to farm.
const SPOKEN_GOAL = 10;
const recordSpoken = () => {
  const t = todayKey();
  const rec = loadLS("spokenCount", {});
  const n = (rec.date === t ? (rec.n || 0) : 0) + 1;
  saveLS("spokenCount", { date: t, n });
  if (n === SPOKEN_GOAL && loadLS("spokenClaimed", "") !== t) {
    saveLS("spokenClaimed", t);
    addChips(1);
    logChips({ type: "spoken", amount: 1, note: "Spoke 10 sentences 🗣️" });
    playChip();
  }
  return n;
};
const getSpokenCount = () => {
  const rec = loadLS("spokenCount", {});
  return rec.date === todayKey() ? (rec.n || 0) : 0;
};

const recordEffort = (weight = 1) => {
  const n = bumpDayCount(weight);
  markPracticedToday();
  if (n >= DAILY_GOAL) {
    const claimed = loadLS("goalClaimed", "");
    if (claimed !== todayKey()) {
      saveLS("goalClaimed", todayKey());
      addChips(CHIPS_PER_DAY);
      logChips({ type: "daily", amount: CHIPS_PER_DAY, note: "Daily goal" });
      const streak = currentStreak();
      if (streak > 0 && streak % STREAK_BONUS_EVERY === 0) {
        addChips(STREAK_BONUS_CHIPS);
        logChips({ type: "bonus", amount: STREAK_BONUS_CHIPS, note: `${streak}-day streak!` });
        playStreakUp();
      } else {
        playFanfare();
      }
      return { justEarned: true, streak };
    }
  }
  return { justEarned: false };
};

// One forgiven miss per week so a single busy day doesn't wipe out
// weeks of effort — an all-or-nothing streak is demoralising for a kid.
const useStreakFreeze = () => {
  const freezes = loadLS("freezes", []);
  const weekAgo = Date.now() - 7 * DAY;
  const recent = freezes.filter((t) => t > weekAgo);
  if (recent.length >= 1) return false;
  recent.push(Date.now());
  saveLS("freezes", recent);
  const days = loadLS("practiceDays", []);
  const d = new Date(); d.setDate(d.getDate() - 1);
  const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  if (!days.includes(k)) { days.push(k); saveLS("practiceDays", days.slice(-400)); }
  return true;
};
const freezeAvailable = () => {
  const weekAgo = Date.now() - 7 * DAY;
  return loadLS("freezes", []).filter((t) => t > weekAgo).length === 0;
};


// ============================================================
//  SOUND EFFECTS  (all synthesised — no audio files to load)
//  Design notes:
//   • Correct answers get a short, bright, RISING motif.
//   • Wrong answers get a soft, low, neutral blip — never a harsh
//     "buzzer". Being wrong is how you learn; it shouldn't sting.
//   • Big moments (goal met, chips, streaks) get applause/fanfare.
//  Everything respects the mute toggle.
// ============================================================
let _actx = null;
const soundOn = () => loadLS("soundOn", true);
const setSoundOn = (v) => saveLS("soundOn", !!v);

const _ctx = () => {
  if (!soundOn()) return null;
  try {
    _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === "suspended") _actx.resume();
    return _actx;
  } catch (e) { return null; }
};

// one tone with a soft attack/decay envelope
const _tone = (ctx, freq, t0, dur, gain = 0.22, type = "triangle") => {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
};

// filtered noise burst — the basis of the applause/clap sounds
const _noise = (ctx, t0, dur, gain = 0.18, freq = 1200, q = 0.7) => {
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(t0); src.stop(t0 + dur);
};

// ✓ correct — bright two-note lift. Rises with the streak so a hot
//   run literally sounds better, which is the point.
const playCorrect = (streak = 0) => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  const step = Math.min(6, Math.max(0, streak));
  const base = 660 * Math.pow(2, step / 24); // creeps up ~a step per streak
  _tone(ctx, base, t, 0.12, 0.2);
  _tone(ctx, base * 1.5, t + 0.075, 0.18, 0.2);
};

// ✗ not quite — gentle, low, brief. Deliberately NOT a buzzer.
const playSoftMiss = () => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  _tone(ctx, 300, t, 0.14, 0.12, "sine");
  _tone(ctx, 240, t + 0.09, 0.16, 0.1, "sine");
};

// 👏 applause — layered noise claps that swell then fade
const playApplause = (big = false) => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  const claps = big ? 34 : 18;
  const span = big ? 1.5 : 0.9;
  for (let i = 0; i < claps; i++) {
    const at = t + Math.random() * span;
    const swell = big ? 0.10 + 0.10 * Math.sin((i / claps) * Math.PI) : 0.10;
    _noise(ctx, at, 0.06 + Math.random() * 0.05, swell, 900 + Math.random() * 1600, 0.6);
  }
};

// 🪙 chip earned — coin shimmer
const playChip = () => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  _tone(ctx, 1320, t, 0.10, 0.18, "square");
  _tone(ctx, 1760, t + 0.06, 0.16, 0.16, "square");
  _tone(ctx, 2640, t + 0.13, 0.22, 0.10, "sine");
};

// 🎉 daily goal complete — fanfare + applause
const playFanfare = () => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
    _tone(ctx, f, t + i * 0.1, 0.32, 0.22)
  );
  _tone(ctx, 1318.5, t + 0.42, 0.5, 0.18);
  playApplause(true);
};

// 🔥 streak milestone — rising run
const playStreakUp = () => {
  const ctx = _ctx(); if (!ctx) return;
  const t = ctx.currentTime;
  [523, 587, 659, 784, 880, 1047].forEach((f, i) =>
    _tone(ctx, f, t + i * 0.07, 0.2, 0.18)
  );
  playApplause(true);
};


// ============================================================
//  WORD OF THE DAY
//  One word, met through four different channels — hear it, pick it,
//  recall it, use it in a sentence. Repetition of a single flashcard
//  doesn't stick; meeting the same word in different forms does.
//  It also gets a big spaced-repetition boost so it keeps turning up
//  in the normal games all day.
// ============================================================
const getWOD = () => loadLS("wordOfDay", null);   // { date, word }
const getWodHistory = () => loadLS("wodHistory", []);
const setWOD = (word) => {
  saveLS("wordOfDay", { date: todayKey(), word });
  // remember every word ever picked so they can all be drilled together later
  const hist = getWodHistory();
  const key = (w) => (w.pinyin || "") + "|" + (w.en || "");
  if (!hist.some((w) => key(w) === key(word))) {
    hist.push({ ...word, wodDate: todayKey() });
    saveLS("wodHistory", hist);
  }
  bumpProgress();
};
const wodActive = () => {
  const w = getWOD();
  return w && w.date === todayKey() ? w.word : null;
};
const wodDoneToday = () => loadLS("wodDone", "") === todayKey();
const markWodDone = () => {
  if (wodDoneToday()) return false;
  saveLS("wodDone", todayKey());
  addChips(1);
  logChips({ type: "wod", amount: 1, note: "Word of the day 🌞" });
  playFanfare();
  return true;
};


// ============================================================
//  ONE canonical progress snapshot.
//  Every screen syncs the SAME full payload. Previously the English
//  side pushed a partial object, which silently wiped the word of the
//  day, chips, SRS history and hidden words from progress.json.
// ============================================================
const SYNC_KEYS = {
  // sets / arrays merged by union
  trouble: [], archived: [], starredSentences: [], hiddenWords: [], practiceDays: [],
  en_starred: [], en_mastered: [],
  // objects & lists
  customWords: [], en_myWords: [], wodHistory: [], srs: {}, chipLog: [],
  // per-day markers
  dayCount: {}, spokenCount: {}, wordOfDay: null,
  goalClaimed: "", wodDone: "", spokenClaimed: "",
  // preferences that should follow the child between devices
  math_sets: ["add10"], car_deck: "math", car_gap: 6, car_len: 12, pool: null,
  soundOn: true, zh_slow: false, freezes: [],
};


// Some progress is written outside React state (word of the day, chips,
// SRS, streaks). Those writers call bumpProgress() so the sync effect runs.
let _progressListeners = [];
const onProgressChange = (fn) => {
  _progressListeners.push(fn);
  return () => { _progressListeners = _progressListeners.filter((f) => f !== fn); };
};
const bumpProgress = () => { _progressListeners.forEach((f) => { try { f(); } catch (e) {} }); };


// For values where REMOVAL matters (unstarring a word, deselecting a lesson),
// a union merge is wrong — it resurrects what you just removed. These carry a
// timestamp and the most recently changed device wins the whole set.
const TIMED_KEYS = ["trouble", "pool", "starredSentences", "hiddenWords", "archived", "en_starred"];
const stampKey = (k) => k + "_at";
const saveTimed = (k, v) => { saveLS(k, v); saveLS(stampKey(k), Date.now()); };
const timedAt = (k) => loadLS(stampKey(k), 0);

const collectProgress = () => {
  const out = {};
  Object.keys(SYNC_KEYS).forEach((k) => { out[k] = loadLS(k, SYNC_KEYS[k]); });
  TIMED_KEYS.forEach((k) => { out[stampKey(k)] = timedAt(k); });
  out.chips = getChips();
  return out;
};

let _pulledOnce = false;
const markPulled = () => { _pulledOnce = true; };
const syncAll = (setStatus) => {
  // never push before we've merged what's already in the cloud
  if (!_pulledOnce) return;
  scheduleSync(collectProgress(), setStatus);
};

// Merge remote into local. Rules differ per field: union for sets,
// higher-wins for counters, newest-wins for per-item records.
const mergeRemoteProgress = (remote) => {
  if (!remote) return;
  const union = (k) => {
    if (!Array.isArray(remote[k])) return;
    const merged = Array.from(new Set([...(loadLS(k, []) || []), ...remote[k]]));
    saveLS(k, k === "practiceDays" ? merged.slice(-400) : merged);
  };
  // additive-only sets keep the union merge
  ["practiceDays", "en_mastered", "freezes"].forEach(union);

  // sets where removals matter: whichever device changed last wins outright
  TIMED_KEYS.forEach((k) => {
    if (remote[k] === undefined) return;
    const rAt = remote[stampKey(k)] || 0;
    if (rAt > timedAt(k)) { saveLS(k, remote[k]); saveLS(stampKey(k), rAt); }
  });

  // chips: keep the higher balance
  if (typeof remote.chips === "number" && remote.chips > getChips()) saveLS("chips", remote.chips);

  // custom word lists: add anything we don't already have
  const addNew = (k, keyOf) => {
    if (!Array.isArray(remote[k]) || !remote[k].length) return;
    const mine = loadLS(k, []) || [];
    const seen = new Set(mine.map(keyOf));
    const merged = mine.concat(remote[k].filter((x) => !seen.has(keyOf(x))));
    if (merged.length !== mine.length) saveLS(k, merged);
  };
  addNew("customWords", (w) => (w.hanzi || "") + "|" + (w.pinyin || "") + "|" + (w.en || ""));
  addNew("en_myWords", (w) => (w.word || "").toLowerCase());
  addNew("wodHistory", (w) => (w.pinyin || "") + "|" + (w.en || ""));

  // today's counters: whichever device is further along
  ["dayCount", "spokenCount"].forEach((k) => {
    const r = remote[k];
    if (r && r.date === todayKey()) {
      const mine = loadLS(k, {});
      const mineN = mine.date === todayKey() ? (mine.n || 0) : 0;
      if ((r.n || 0) > mineN) saveLS(k, r);
    }
  });
  ["goalClaimed", "wodDone", "spokenClaimed"].forEach((k) => {
    if (remote[k] === todayKey()) saveLS(k, remote[k]);
  });

  // word of the day: whatever was set today, on any device
  if (remote.wordOfDay && remote.wordOfDay.date === todayKey()) saveLS("wordOfDay", remote.wordOfDay);

  // spaced repetition: keep the most recently touched record per item
  if (remote.srs) {
    const local = loadLS("srs", {});
    Object.keys(remote.srs).forEach((k) => {
      if (!local[k] || (remote.srs[k].last || 0) > (local[k].last || 0)) local[k] = remote.srs[k];
    });
    saveLS("srs", local);
  }

  // preferences: adopt remote only if this device has never set one
  ["math_sets", "car_deck", "car_gap", "car_len", "soundOn", "zh_slow"].forEach((k) => {
    if (localStorage.getItem(LS_PREFIX + k) === null && remote[k] !== undefined) saveLS(k, remote[k]);
  });
};

// ---- palette: playful, high-contrast, "storybook" ----
const C = {
  paper: "#FFF6E9",
  ink: "#2A2440",
  fox: "#E8703A",   // little-fox orange
  leaf: "#5FB894",  // GoEast green
  sky: "#7FB2E8",
  berry: "#E85B8A",
  sun: "#F6C445",
};

const SPECIAL_LESSON_IDS = ["starred-words", "wod-history", "my-words", "words-we-added"];
const ADDED_ID = "words-we-added";
const recentRealLessonIds = (lessons) =>
  (lessons || []).filter((l) => !SPECIAL_LESSON_IDS.includes(l.id)).slice(-6).map((l) => l.id);
const recentPoolIds = (lessons) =>
  [...new Set(recentRealLessonIds(lessons).concat(["starred-words", "wod-history", ADDED_ID]))];

function ChineseApp({ onSwitchLang }) {
  const { lessons: LESSONS, tagMap: SENTENCE_TAG_TO_LESSONS, sentences: SENTENCES } = getVocab();
  const [screen, setScreen] = useState("home");
  useBackToMenu(screen, setScreen); // home | flashcards | sentence | clock | tone | wordlist
  useBackToMenu(screen, setScreen);
  const [slow, setSlow] = useState(() => loadLS("zh_slow", false));
  const toggleSlow = () => setSlow((s) => { const n = !s; saveLS("zh_slow", n); return n; });
  const [pool, setPool] = useState(() => {
    const recent = recentPoolIds(LESSONS);
    const saved = loadLS("pool", null);
    if (!Array.isArray(saved) || !saved.length) return recent;
    const realIds = LESSONS.filter((l) => !SPECIAL_LESSON_IDS.includes(l.id)).map((l) => l.id);
    const wasAll = realIds.length > 0 && realIds.every((id) => saved.includes(id));
    return wasAll ? recent : saved.map((id) => (id === "my-words" ? ADDED_ID : id));
  });
  useEffect(() => { saveTimed("pool", pool); }, [pool]);
  const [trouble, setTrouble] = useState(() => new Set(loadLS("trouble", [])));
  const [archived, setArchived] = useState(() => new Set(loadLS("archived", [])));
  const [starredSentences, setStarredSentences] = useState(() => new Set(loadLS("starredSentences", [])));
  const [customWords, setCustomWords] = useState(() => loadLS("customWords", []));
  const [syncStatus, setSyncStatus] = useState("");

  // persist locally + sync to GitHub whenever progress changes
  useEffect(() => {
    const progress = {
      trouble: [...trouble],
      archived: [...archived],
      starredSentences: [...starredSentences],
      chips: getChips(),
      practiceDays: loadLS("practiceDays", []),
      srs: loadLS("srs", {}),
      dayCount: loadLS("dayCount", {}),
      spokenCount: loadLS("spokenCount", {}),
      wordOfDay: loadLS("wordOfDay", null),
      wodHistory: loadLS("wodHistory", []),
      hiddenWords: loadLS("hiddenWords", []),
      wodDone: loadLS("wodDone", ""),
      goalClaimed: loadLS("goalClaimed", ""),
      customWords,
    };
    saveTimed("trouble", progress.trouble);
    saveTimed("archived", progress.archived);
    saveTimed("starredSentences", progress.starredSentences);
    saveLS("customWords", progress.customWords);
    syncAll(setSyncStatus);
  }, [trouble, archived, starredSentences, customWords]);

  // catch progress written outside React state (word of day, chips, SRS…)
  useEffect(() => onProgressChange(() => syncAll(setSyncStatus)), []);

  const applyRemoteZh = React.useCallback(() => {
    setTrouble(new Set(loadLS("trouble", [])));
    setArchived(new Set(loadLS("archived", [])));
    setStarredSentences(new Set(loadLS("starredSentences", [])));
    setCustomWords(loadLS("customWords", []));
    setHidden(new Set(loadLS("hiddenWords", [])));
    const p = loadLS("pool", null);
    if (Array.isArray(p) && p.length) setPool(p);
  }, []);
  useLiveSync(applyRemoteZh, setSyncStatus);

  // on boot: pull remote progress once and merge it in
  useEffect(() => {
    pullRemoteProgress().then((remote) => {
      mergeRemoteProgress(remote);
      markPulled();
      if (!remote) return;
      // reflect the merged values in this screen's state
      setTrouble(new Set(loadLS("trouble", [])));
      setArchived(new Set(loadLS("archived", [])));
      setStarredSentences(new Set(loadLS("starredSentences", [])));
      setCustomWords(loadLS("customWords", []));
      setHidden(new Set(loadLS("hiddenWords", [])));
      setSyncStatus("synced");
    });
  }, []);

  const toggleSentence = (en) =>
    setStarredSentences((prev) => {
      const n = new Set(prev);
      n.has(en) ? n.delete(en) : n.add(en);
      return n;
    });

  const addCustomWord = (word) => {
    setCustomWords((prev) => [...prev, word]);
    setPool((p) => (p.includes(ADDED_ID) ? p : [...p, ADDED_ID]));
  };
  // Words Vin has removed. Lesson words can't be deleted from vocab.json,
  // so we keep a hide-list instead — reversible, and it survives updates.
  const [hidden, setHidden] = useState(() => new Set(loadLS("hiddenWords", [])));
  const hideKey = (w) => (w.hanzi || "") + "|" + (w.pinyin || "") + "|" + (w.en || "");
  useEffect(() => { saveTimed("hiddenWords", [...hidden]); }, [hidden]);
  const hideWord = (w) => setHidden((prev) => new Set([...prev, hideKey(w)]));
  const unhideAll = () => setHidden(new Set());

  const removeCustomWord = (target) =>
    setCustomWords((prev) =>
      prev.filter((w) => {
        if (typeof target === "string") return w.pinyin !== target && w.en !== target;
        return !(
          (w.hanzi || "") === (target.hanzi || "") &&
          (w.pinyin || "") === (target.pinyin || "") &&
          (w.en || "") === (target.en || "")
        );
      })
    );

  // "My Words" behaves like a lesson so it flows through games + word list
  const MY_WORDS_ID = "my-words";
  // Once a word has been promoted into a real lesson, drop the custom copy —
  // otherwise it shows twice in the word list and both games.
  const lessonHanzi = new Set(LESSONS.flatMap((l) => (l.words || []).map((w) => w.hanzi).filter(Boolean)));
  const lessonPinyin = new Set(LESSONS.flatMap((l) => (l.words || []).map((w) => (w.pinyin || "").toLowerCase()).filter(Boolean)));
  const customFiltered = (customWords || []).filter(
    (w) => !(w.hanzi && lessonHanzi.has(w.hanzi)) && !(w.pinyin && lessonPinyin.has((w.pinyin || "").toLowerCase()))
  );
  useEffect(() => {
    if (customWords.length !== customFiltered.length) setCustomWords(customFiltered);
  }, [customWords.length, customFiltered.length]);

  const notHiddenEarly = (w) => !hidden.has(hideKey(w));
  const dedupeEarly = (arr) => {
    const seen = new Set();
    return arr.filter((w) => {
      const k = w.pinyin || w.hanzi || w.en;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  };
  const vocabAdded = LESSONS.find((l) => l.id === ADDED_ID) || { id: ADDED_ID, title: "Words We Added", subtitle: "words you added yourself", words: [] };
  const ADDED_LESSON = {
    id: ADDED_ID,
    title: "Words We Added",
    subtitle: vocabAdded.subtitle || "words you added yourself",
    words: dedupeEarly([...(vocabAdded.words || []), ...customFiltered]),
  };
  const MY_WORDS_LESSON = ADDED_LESSON;

  // Every starred word, gathered from all lessons, as its own selectable set.
  const STARRED_ID = "starred-words";
  const starredWordList = dedupeEarly(
    LESSONS.concat([ADDED_LESSON])
      .flatMap((l) => l.words || [])
      .filter((w) => w && trouble.has(w.pinyin) && notHiddenEarly(w))
  );
  const STARRED_LESSON = { id: STARRED_ID, title: "⭐ Starred Words", subtitle: "just the tricky ones", words: starredWordList };
  const WOD_ID = "wod-history";
  const wodHistory = getWodHistory();
  const WOD_LESSON = { id: WOD_ID, title: "🌞 Words of the Day", subtitle: "every word of the day so far", words: wodHistory };
  const allLessons = LESSONS
    .filter((l) => l.id !== ADDED_ID)
    .concat(starredWordList.length ? [STARRED_LESSON] : [])
    .concat(ADDED_LESSON.words.length ? [ADDED_LESSON] : [])
    .concat(wodHistory.length ? [WOD_LESSON] : []);

  // words from the chosen lessons, minus any that have been archived (mastered)
  const notHidden = (w) => !hidden.has(hideKey(w));
  const dedupe = (arr) => {
    const seen = new Set();
    return arr.filter((w) => {
      const k = w.pinyin || w.hanzi || w.en;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  };
  const activeWords = dedupe(
    allLessons.filter((l) => pool.includes(l.id) || l.id === ADDED_ID)
      .flatMap((l) => l.words)
      .filter(notHidden)
  )


  // words for the master list — only from SELECTED lessons (plus manual adds),
  // so deselecting a lesson hides its words here too. archived stay visible here.
  // "Words We Added" is always in play — if you added a word deliberately,
  // it shouldn't need a lesson toggle to show up.
  const listWords = dedupe(
    allLessons
      .filter((l) => pool.includes(l.id) || l.id === ADDED_ID)
      .flatMap((l) => l.words.map((w) => ({ ...w, lesson: l.title })))
      .filter(notHidden)
  );

  // sentences for Say the Sentence — only those whose lesson(s) are selected
  const activeSentences = SENTENCES.filter((s) => {
    const lessonIds = SENTENCE_TAG_TO_LESSONS[s.tag] || [];
    return lessonIds.some((id) => pool.includes(id));
  });

  const toggleLesson = (id) =>
    setPool((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));

  const selectAllLessons = () => setPool(allLessons.map((l) => l.id));
  const selectNoLessons = () => setPool([]);
  const newestReal = [...LESSONS].reverse().find((l) => !SPECIAL_LESSON_IDS.includes(l.id)) || LESSONS[LESSONS.length - 1];
  const selectNewestLesson = () => setPool(newestReal ? [newestReal.id] : []);
  const selectRecentLessons = () => setPool(recentPoolIds(LESSONS));

  const toggleTrouble = (pinyin) =>
    setTrouble((prev) => {
      const n = new Set(prev);
      n.has(pinyin) ? n.delete(pinyin) : n.add(pinyin);
      return n;
    });

  // add-only: used by the games to auto-collect words Sam gets wrong
  const addTrouble = (pinyin) =>
    setTrouble((prev) => {
      if (prev.has(pinyin)) return prev;
      const n = new Set(prev);
      n.add(pinyin);
      return n;
    });

  // The tricky pile deliberately IGNORES which lessons are selected. A word he
  // struggled with shouldn't become unreachable just because that lesson is
  // toggled off — that's the opposite of what starring is for.
  const troubleWords = dedupe(
    allLessons.flatMap((l) => l.words).filter(notHidden).filter((w) => trouble.has(w.pinyin))
  );
  const starredSentenceList = SENTENCES.filter((s) => starredSentences.has(s.en));

  const toggleArchived = (pinyin) =>
    setArchived((prev) => {
      const n = new Set(prev);
      n.has(pinyin) ? n.delete(pinyin) : n.add(pinyin);
      return n;
    });

  return (
    <div
      style={{
        minHeight: "100vh",
        background: `radial-gradient(circle at 20% 10%, #FFE6C7 0%, ${C.paper} 45%)`,
        color: C.ink,
        fontFamily: "'Baloo 2','Comic Sans MS',system-ui,sans-serif",
        padding: "20px 16px 60px",
      }}
    >
      <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
        rel="stylesheet"
      />
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <Header onHome={() => setScreen("home")} showHome={screen !== "home"} onSwitchLang={onSwitchLang} />

        {screen === "home" && (
          <Home
            lessons={allLessons}
            pool={pool}
            toggleLesson={toggleLesson}
            selectAllLessons={selectAllLessons}
            selectNoLessons={selectNoLessons}
            selectNewestLesson={selectNewestLesson}
            selectRecentLessons={selectRecentLessons}
            wordCount={activeWords.length}
            troubleCount={troubleWords.length}
            starredSentenceCount={starredSentenceList.length}
            totalCount={listWords.length}
            archivedCount={archived.size}
            addCustomWord={addCustomWord}
            allWordsForWod={allLessons.flatMap((l) => l.words.map((w) => ({ ...w, lesson: l.title })))}
            go={setScreen}
          />
        )}
        {screen === "wod" && wodActive() && (
          <WordOfDay word={wodActive()} allWords={activeWords} sentences={activeSentences} onHome={() => setScreen("home")} />
        )}
        {screen === "flashcards" && (
          <React.Fragment><GameTitle>Flip Cards</GameTitle>
          <Flashcards words={activeWords} trouble={trouble} toggleTrouble={toggleTrouble} onHome={() => setScreen("home")} />
          </React.Fragment>
        )}
        {screen === "car" && (
          <React.Fragment><GameTitle>Car Mode</GameTitle>
          <CarMode facts={[]} carWords={activeWords} carSentences={activeSentences} onHome={() => setScreen("home")} />
          </React.Fragment>
        )}
        {screen === "troubleflip" && (
          <Flashcards words={troubleWords} trouble={trouble} toggleTrouble={toggleTrouble} onlyTrouble onHome={() => setScreen("home")} />
        )}

        {screen === "sentence" && (
          <React.Fragment><GameTitle>Say the Sentence</GameTitle>
          <SayTheSentence
            sentences={activeSentences}
            starred={starredSentences}
            toggleSentence={toggleSentence}
            onHome={() => setScreen("home")}
          />
          </React.Fragment>
        )}
        {screen === "sentencemean" && (
          <React.Fragment><GameTitle>What's That Sentence Mean?</GameTitle>
          <SentenceMeaning
            sentences={activeSentences}
            starred={starredSentences}
            toggleSentence={toggleSentence}
            onHome={() => setScreen("home")}
          />
          </React.Fragment>
        )}
        {screen === "tone" && (
          <React.Fragment><GameTitle>What's That Word Mean?</GameTitle>
          <ToneMatch words={activeWords} addTrouble={addTrouble} trouble={trouble} toggleTrouble={toggleTrouble} onHome={() => setScreen("home")} />
          </React.Fragment>
        )}
        {(screen === "wordlist" || screen === "wordlist-add") && (
          <WordList
            allWords={listWords}
            archived={archived}
            trouble={trouble}
            toggleTrouble={toggleTrouble}
            toggleArchived={toggleArchived}
            customWords={customWords}
            hideWord={hideWord}
            hiddenCount={hidden.size}
            unhideAll={unhideAll}
            addCustomWord={addCustomWord}
            removeCustomWord={removeCustomWord}
            openAdd={screen === "wordlist-add"}

    </div>
  );
}

// Chips screen: Sam sees what he's banked; parent redeems from here.
function ChipsScreen({ onDone }) {
  const [, force] = useState(0);
  const chips = getChips();
  const log = getChipLog();
  const streak = currentStreak();
  const canFreeze = freezeAvailable();

  const spend = (n) => {
    if (chips < n) return;
    addChips(-n);
    logChips({ type: "spend", amount: -n, note: "Traded in" });
    force((x) => x + 1);
  };

  return (
    <div>
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 54 }}>🪙</div>
        <div style={{ fontSize: 40, fontWeight: 800, color: C.sun, lineHeight: 1.1 }}>{chips}</div>
        <div style={{ color: "#7a7391", fontWeight: 700 }}>chips banked</div>
        {streak > 0 && (
          <div style={{ marginTop: 6, fontSize: 13, color: "#7a7391" }}>
            🔥 {streak}-day streak · next bonus at {Math.ceil((streak + 1) / STREAK_BONUS_EVERY) * STREAK_BONUS_EVERY} days
          </div>
        )}
      </div>

      <div style={{ background: "#FFF9EC", border: `3px solid ${C.sun}`, borderRadius: 16, padding: "12px 14px", marginBottom: 14 }}>
        <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 4 }}>How to earn</div>
        <div style={{ fontSize: 13, color: "#7a6a3f", lineHeight: 1.6 }}>
          🪙 1 chip — practice {DAILY_GOAL} times in a day<br />
          🪙 1 bonus chip — say {SPOKEN_GOAL} sentences out loud 🗣️ ({getSpokenCount()}/{SPOKEN_GOAL} today)<br />
          🪙 {STREAK_BONUS_CHIPS} bonus chips — every {STREAK_BONUS_EVERY} days in a row
        </div>
      </div>

      <SoundToggle />

      <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 8 }}>Trade in (grown-up taps this)</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {[1, 5, 10].map((n) => (
          <button key={n} onClick={() => spend(n)} disabled={chips < n}
            style={{ ...miniBtn, opacity: chips < n ? 0.4 : 1, padding: "10px 14px", fontSize: 14 }}>
            − {n} chip{n === 1 ? "" : "s"}
          </button>
        ))}
      </div>

      {!canFreeze ? null : (
        <button
          onClick={() => { if (useStreakFreeze()) force((x) => x + 1); }}
          style={{ ...ghostBtn, width: "100%", marginBottom: 16, borderColor: C.sky, color: "#3B6FB8" }}
        >
          ❄️ Use a skip-day (covers one missed day, once a week)
        </button>
      )}

      {log.length > 0 && (
        <div>
          <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 6 }}>Recent</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
            {log.slice(0, 12).map((e, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", background: "#fff",
                border: "2px solid #efe8d8", borderRadius: 10, padding: "8px 10px", fontSize: 13 }}>
                <span>{e.note}</span>
                <span style={{ fontWeight: 800, color: e.amount > 0 ? C.leaf : C.berry }}>
                  {e.amount > 0 ? `+${e.amount}` : e.amount}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      <button onClick={onDone} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 16, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

function Home({
  lessons, pool, toggleLesson,
  selectAllLessons, selectNoLessons, selectNewestLesson, selectRecentLessons,
  wordCount, troubleCount, starredSentenceCount, totalCount, archivedCount, go,
  addCustomWord, allWordsForWod,
}) {
  const [wodPickerOpen, setWodPickerOpen] = useState(false);
  const [wodTick, setWodTick] = useState(0);
  const todaysWord = wodActive();
  const [bankOpen, setBankOpen] = useState(false);
  const [addOpen, setAddOpen] = useState(false);
  const [bulk, setBulk] = useState("");
  const [added, setAdded] = useState(0);
  const [looking, setLooking] = useState(false);
  const [preview, setPreview] = useState(null);

  // Figure out whether a line is Chinese characters, pinyin, or English.
  const classifyZh = (text) => {
    const t = text.trim();
    if (!t) return null;
    if (/[一-鿿]/.test(t)) return { en: "", pinyin: "", hanzi: t };
    if (/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/i.test(t)) return { en: "", pinyin: t, hanzi: "" };
    return { en: t, pinyin: "", hanzi: "" };
  };

  // Look up anything the user typed in Chinese and fill in the rest,
  // then show it for checking before it joins the word list.
  const buildPreview = async () => {
    setLooking(true);
    const lines = bulk.split("\n").map((s) => s.trim()).filter(Boolean);
    const rows = [];
    for (const line of lines) {
      const parts = parseLine(line);
      if (!parts) continue;
      let { en, pinyin, hanzi } = parts;
      let note = "";
      if (hanzi && (!en || !pinyin)) {
        const hit = await lookupZh(hanzi);
        if (hit && hit.pinyin) {
          if (!pinyin) pinyin = hit.pinyin;
          if (!en && hit.en) en = hit.en;
          if (!hit.exact) note = "not in the dictionary — pinyin is a best guess";
          else if (!en) note = "no plain-English meaning found";
        } else {
          note = "couldn't find this one — type the meaning yourself";
        }
      } else if (!hanzi) {
        note = "no Chinese characters, so there's nothing to look up";
      }
      rows.push({ en: en || "", pinyin: pinyin || "", hanzi: hanzi || "", note });
    }
    setLooking(false);
    setPreview(rows);
  };

  const parseLine = (line) => {
    const pair = line.split(/\s*[=|]\s*/);
    if (pair.length >= 2) {
      const merged = { en: "", pinyin: "", hanzi: "" };
      pair.forEach((p) => {
        const c = classifyZh(p);
        if (!c) return;
        if (c.hanzi) merged.hanzi = c.hanzi;
        else if (c.pinyin) merged.pinyin = c.pinyin;
        else if (!merged.en) merged.en = c.en;
      });
      return merged;
    }
    return classifyZh(line);
  };

  const confirmPreview = () => {
    let n = 0;
    (preview || []).forEach((row) => {
      if (!row.hanzi && !row.pinyin && !row.en) return;
      addCustomWord({
        en: row.en || row.pinyin || row.hanzi,
        pinyin: row.pinyin || "",
        hanzi: row.hanzi || "",
        emoji: "📝",
        needsDef: !(row.en && row.pinyin && row.hanzi),
      });
      n++;
    });
    setAdded(n);
    setPreview(null);
    setBulk("");
    setTimeout(() => setAdded(0), 4000);
  };

  const submitZhWords = () => {
    const lines = bulk.split("\n").map((s) => s.trim()).filter(Boolean);
    let n = 0;
    lines.forEach((line) => {
      const pair = line.split(/\s*[=|]\s*/);
      let parts;
      if (pair.length >= 2) {
        const merged = { en: "", pinyin: "", hanzi: "" };
        pair.forEach((p) => {
          const c = classifyZh(p);
          if (!c) return;
          if (c.hanzi) merged.hanzi = c.hanzi;
          else if (c.pinyin) merged.pinyin = c.pinyin;
          else if (!merged.en) merged.en = c.en;
        });
        parts = merged;
      } else {
        parts = classifyZh(line);
      }
      if (!parts || (!parts.en && !parts.pinyin && !parts.hanzi)) return;
      addCustomWord({
        en: parts.en || parts.pinyin || parts.hanzi,
        pinyin: parts.pinyin || "",
        hanzi: parts.hanzi || "",
        emoji: "📝",
        needsDef: !(parts.en && parts.pinyin && parts.hanzi),
      });
      n++;
    });
    setAdded(n);
    setBulk("");
    setTimeout(() => setAdded(0), 4000);
  };

  const modes = [
    { id: "flashcards", emoji: "🃏", name: "Flip Cards", desc: "See it, guess it, flip it", color: C.sky },
    { id: "sentence", emoji: "💬", name: "Say the Sentence", desc: "Read English, say it in Chinese", color: C.fox },
    { id: "clock", emoji: "⏱️", name: "Beat the Clock", desc: "How many in 60 seconds?", color: C.berry },
    { id: "tone", emoji: "🎧", name: "What's That Word Mean?", desc: "Hear a word, pick the meaning", color: C.leaf },
    { id: "sentencemean", emoji: "📣", name: "What's That Sentence Mean?", desc: "Hear a sentence, pick the meaning", color: C.sun },
    { id: "buildsentence", emoji: "🧩", name: "Build a Sentence", desc: "Put the words in the right order", color: C.leaf },
    { id: "car", emoji: "🚗", name: "Car Mode", desc: "Eyes off, ears on", color: "#2A2440" },
  ];

  const newest = [...lessons].reverse().find((l) => !["starred-words", "wod-history", "words-we-added"].includes(l.id)) || lessons[lessons.length - 1];
  const onCount = pool.length;
  const allOn = onCount === lessons.length;
  const noneOn = onCount === 0;

  // a short human summary of what's selected, shown when collapsed
  const summary = noneOn
    ? "No lessons picked"
    : allOn
    ? `All ${lessons.length} lessons`
    : onCount === 1
    ? [...lessons].reverse().find((l) => pool.includes(l.id))?.title
    : `${onCount} lessons`;

  return (
    <div>
      {/* ---- word bank: collapsed to a single tappable summary bar ---- */}
      <div
        style={{
          background: "#fff",
          borderRadius: 20,
          border: "3px solid #efe8d8",
          boxShadow: "0 6px 0 rgba(0,0,0,0.04)",
          marginBottom: 16,
          overflow: "hidden",
        }}
      >
        <button
          onClick={() => setBankOpen((o) => !o)}
          style={{
            width: "100%",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 10,
            background: "transparent",
            border: "none",
            padding: "14px 16px",
            cursor: "pointer",
            fontFamily: "inherit",
            textAlign: "left",
          }}
        >
          <span style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
            <span style={{ fontSize: 22 }}>📚</span>
            <span style={{ minWidth: 0 }}>
              <span style={{ display: "block", fontWeight: 800, fontSize: 15, color: C.ink }}>
                Lessons list
              </span>
              <span style={{ display: "block", fontSize: 12, color: "#7a7391" }}>
                {summary} · {wordCount} word{wordCount === 1 ? "" : "s"} in play · tap to change
              </span>
            </span>
          </span>
          <span style={{ fontSize: 16, color: "#9a94ad", flexShrink: 0 }}>
            {bankOpen ? "▲" : "▼"}
          </span>
        </button>

        {bankOpen && (
          <div style={{ padding: "0 16px 16px" }}>
            {/* quick actions */}
            <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
              <button
                onClick={selectAllLessons}
                disabled={allOn}
                style={{ ...miniBtn, opacity: allOn ? 0.45 : 1, cursor: allOn ? "default" : "pointer" }}
              >
                ✓ Select all
              </button>
              <button
                onClick={selectNoLessons}
                disabled={noneOn}
                style={{ ...miniBtn, opacity: noneOn ? 0.45 : 1, cursor: noneOn ? "default" : "pointer" }}
              >
                ✕ Clear all
              </button>
              <button
                onClick={selectRecentLessons}
                style={{ ...miniBtn, borderColor: C.fox, color: C.fox }}
                title="Last ~3 weeks, plus Starred / Words We Added / Words of the Day"
              >
                🕒 Recent only
              </button>
              <button
                onClick={selectNewestLesson}
                style={{ ...miniBtn, borderColor: "#c8c2d4", color: "#7a7391" }}
                title={newest?.title}
              >
                ✨ Newest only
              </button>
            </div>

            {/* the chips themselves — capped height so the list can't grow forever */}
            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                gap: 8,
                maxHeight: 190,
                overflowY: "auto",
                paddingRight: 4,
              }}
            >
              {(() => {
                // "Words We Added" is pinned to the top; the rest are newest-first
                const special = ["starred-words", "wod-history", "words-we-added"];
                const pinned = special
                  .map((id) => lessons.find((l) => l.id === id))
                  .filter(Boolean);
                const rest = [...lessons.filter((l) => !special.includes(l.id))].reverse();
                return [...pinned, ...rest];
              })().map((l) => {
                const on = pool.includes(l.id);
                return (
                  <button
                    key={l.id}
                    onClick={() => toggleLesson(l.id)}
                    style={{
                      ...chip,
                      background: on ? C.leaf : "#fff",
                      color: on ? "#fff" : C.ink,
                      borderColor: on ? C.leaf : "#e3ddcf",
                    }}
                  >
                    {on ? "✓ " : "+ "}
                    {l.title} <span style={{ opacity: 0.7 }}>({l.words.length})</span>
                  </button>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* ---- word of the day ---- */}
      <div style={{ background: todaysWord ? "#FFF4E9" : "#fff", border: `3px solid ${todaysWord ? C.fox : "#efe8d8"}`,
        borderRadius: 18, padding: "12px 14px", marginBottom: 14 }}>
        {todaysWord ? (
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <span style={{ fontSize: 34 }}>{todaysWord.emoji || "🌞"}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 0.5, textTransform: "uppercase", color: "#b9927a" }}>

              <div style={{ fontWeight: 800, fontSize: 19, color: C.fox, lineHeight: 1.2 }}>{todaysWord.pinyin}</div>
              <div style={{ fontSize: 13, color: "#7a7391" }}>{todaysWord.en}</div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <button onClick={() => go("wod")} style={{ ...bigBtn, background: C.fox, fontSize: 13, padding: "10px 14px" }}>

              </span>
            </span>

            onPick={(w) => { setWOD(w); setWodPickerOpen(false); setWodTick((t) => t + 1); }}

          display: "grid",
          gridTemplateColumns: "1fr 1fr",

            onClick={() => wordCount > 0 && go(m.id)}

            <div style={{ fontWeight: 800, fontSize: 17, marginTop: 4 }}>{m.name}</div>
            <div style={{ fontSize: 12, color: "#7a7391", marginTop: 2 }}>{m.desc}</div>
          </button>
        ))}

      {wordCount === 0 && (
        <div
          onClick={() => setBankOpen(true)}
          style={{ textAlign: "center", marginTop: 14, color: C.berry, fontWeight: 700, cursor: "pointer" }}
        >
          Pick at least one lesson to start! 👆
        </div>

      {/* ---- secondary actions as equal tiles ---- */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginTop: 14 }}>

        >
          <span style={{ fontSize: 28 }}>⭐</span>
          <span style={{ fontWeight: 800, fontSize: 14, marginTop: 4 }}>Tricky ones</span>
          <span style={{ fontSize: 11, color: "#7a7391", marginTop: 2 }}>
            {(troubleCount + starredSentenceCount) > 0
              ? [troubleCount > 0 ? `${troubleCount} starred` : null,
                 starredSentenceCount > 0 ? `${starredSentenceCount} sentence${starredSentenceCount === 1 ? "" : "s"}` : null]
                .filter(Boolean).join(" · ")
              : "none yet"}
          </span>
        </button>

        <button
          onClick={() => go("wordlist")}
          style={{ ...tileBtn, borderColor: C.sky, background: "#fff" }}
        >
          <span style={{ fontSize: 28 }}>📖</span>
          <span style={{ fontWeight: 800, fontSize: 14, marginTop: 4 }}>Word list</span>

        <button

          <span style={{ fontSize: 28 }}>➕</span>
          <span style={{ fontWeight: 800, fontSize: 14, marginTop: 4 }}>Add word</span>
          <span style={{ fontSize: 11, color: "#7a7391", marginTop: 2 }}>{addOpen ? "close" : "type or paste"}</span>
        </button>

      {addOpen && (
        <div style={{ background: "#fff", borderRadius: 20, border: `3px solid ${C.leaf}`, marginTop: 12, padding: 16 }}>
          <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 6 }}>➕ Add words</div>
          <div style={{ fontSize: 12, color: "#5c7a6c", marginBottom: 10, lineHeight: 1.5 }}>

          <textarea
            value={bulk}
            onChange={(e) => setBulk(e.target.value)}
            rows={5}
            placeholder={"猫\n蜘蛛\n卷笔刀"}

// Waits for vocab.json inside React so there are no script-timing assumptions.

// ============================================================
//  ENGLISH SIDE — "Sam's English Skills"
//  Activities: Flashcards, Quiz, Speed Round, Spelling
//  Data comes from words-en.json (window.__VOCAB__.english)
// ============================================================
const getEnglish = () => (window.__VOCAB__ && window.__VOCAB__.english) || { lists: [] };

// Deliberately pick the BEST English voice the device has, instead of letting
// the browser fall back to its low-quality default (which sounds robotic).
// Same approach that fixed the Mandarin audio.
let bestEnVoice = null;

const PREFERRED_EN_VOICES = [
  // Google's natural voices (Chrome / Android / ChromeOS) — best quality
  "Google US English", "Google UK English Female", "Google UK English Male",
  // Microsoft neural voices (Windows / Edge)
  "Microsoft Aria", "Microsoft Jenny", "Microsoft Guy", "Microsoft Michelle",
  "Microsoft Ana", "Microsoft Zira", "Microsoft David",
  // Apple (macOS / iOS) — prefer the enhanced/premium ones
  "Samantha", "Ava", "Allison", "Susan", "Alex", "Karen", "Daniel", "Moira",
];

const selectBestEnVoice = () => {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  const isEn = (v) => v.lang && v.lang.toLowerCase().startsWith("en");

  // 1) Google voices first — best quality on Chrome/Windows/ChromeOS
  const google = voices.find((v) => isEn(v) && /google/i.test(v.name));
  if (google) { bestEnVoice = google; return; }
  // 2) anything flagged natural/neural/enhanced/premium/online
  const fancy = voices.find(
    (v) => isEn(v) && /natural|neural|enhanced|premium|online/i.test(v.name)
  );
  if (fancy) { bestEnVoice = fancy; return; }
  // 3) any server-side (non-local) voice — usually the good ones
  const remote = voices.find((v) => isEn(v) && v.localService === false);
  if (remote) { bestEnVoice = remote; return; }
  // 4) named preferred list (Microsoft Aria etc.)
  for (const name of PREFERRED_EN_VOICES) {
    const hit = voices.find(
      (v) => isEn(v) && v.name.toLowerCase().includes(name.toLowerCase())
    );
    if (hit) { bestEnVoice = hit; return; }
  }
  // 5) fall back to any English voice at all
  const any = voices.find(isEn);
  if (any) bestEnVoice = any;
};

if (typeof window !== "undefined" && "speechSynthesis" in window) {
  if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", selectBestEnVoice);
  else { const _prev = window.speechSynthesis.onvoiceschanged; window.speechSynthesis.onvoiceschanged = function(){ if(typeof _prev==="function") try{_prev();}catch(e){} selectBestEnVoice(); }; }
  [200, 600, 1200, 2500].forEach((ms) => setTimeout(selectBestEnVoice, ms));
}

const speakEn = (text) => {
  if (!("speechSynthesis" in window) || !text) return;
  const say = (attempt) => {
    try {
      if (!bestEnVoice) selectBestEnVoice();
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      u.pitch = 1.0;
      // manual override from settings wins, if the user picked one
      const pref = loadLS("en_voice_pref", "");
      const chosen = pref
        ? window.speechSynthesis.getVoices().find((v) => v.name === pref)
        : bestEnVoice;
      if (chosen) u.voice = chosen;
      window.speechSynthesis.speak(u);
      try { window.speechSynthesis.resume(); } catch (e) {}
    } catch (e) {}
  };
  // voices can take a moment to load — try immediately, then retry with delays
  // Same Android rule as above: fire synchronously within the gesture first.
  const hadVoicesEn = window.speechSynthesis.getVoices().length > 0;
  selectBestEnVoice();
  say(1);
  if (!hadVoicesEn) {
    let tries = 0;
    const retry = () => {
      tries++;
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
      selectBestEnVoice();
      if (window.speechSynthesis.getVoices().length) { say(2); return; }
      if (tries < 6) setTimeout(retry, 300);
    };
    setTimeout(retry, 300);
  }
};

function EnglishApp({ onSwitchLang }) {
  const { lists: LISTS } = getEnglish();
  const [screen, setScreen] = useState("home");
  const [pool, setPool] = useState(() => {
    const ids = LISTS.map((l) => l.id);
    if ((loadLS("en_myWords", []) || []).length) ids.push("en-my-words");
    return ids;
  });
  const [starred, setStarred] = useState(() => new Set(loadLS("en_starred", [])));
  const [mastered, setMastered] = useState(() => new Set(loadLS("en_mastered", [])));
  const [myWords, setMyWords] = useState(() => loadLS("en_myWords", []));
  const [syncStatus, setSyncStatus] = useState("");

  useEffect(() => {
    saveLS("en_starred", [...starred]);
    saveLS("en_mastered", [...mastered]);
    saveLS("en_myWords", myWords);
    scheduleSync({
      trouble: loadLS("trouble", []),
      archived: loadLS("archived", []),
      starredSentences: loadLS("starredSentences", []),
      customWords: loadLS("customWords", []),
      en_starred: [...starred],
      en_mastered: [...mastered],
      en_myWords: myWords,
    }, setSyncStatus);
  }, [starred, mastered, myWords]);

  useEffect(() => {
    pullRemoteProgress().then((remote) => {
      if (!remote) return;
      if (remote.en_starred) setStarred((p) => new Set([...p, ...remote.en_starred]));
      if (remote.en_mastered) setMastered((p) => new Set([...p, ...remote.en_mastered]));
      if (remote.en_myWords && remote.en_myWords.length) {
        setMyWords((prev) => {
          const seen = new Set(prev.map((w) => w.word.toLowerCase()));
          return [...prev, ...remote.en_myWords.filter((w) => !seen.has(w.word.toLowerCase()))];
        });
        setPool((p) => (p.includes("en-my-words") ? p : [...p, "en-my-words"]));
      }
      setSyncStatus("synced");
    });
  }, []);

  const toggleList = (id) =>
    setPool((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));
  const toggleStar = (w) =>
    setStarred((prev) => { const n = new Set(prev); n.has(w) ? n.delete(w) : n.add(w); return n; });
  const addStar = (w) =>
    setStarred((prev) => (prev.has(w) ? prev : new Set([...prev, w])));
  const toggleMastered = (w) =>
    setMastered((prev) => { const n = new Set(prev); n.has(w) ? n.delete(w) : n.add(w); return n; });

  // Normalise so spacing/case variants resolve: "Free loader" === "Freeloader"
  const _norm = (s) => (s || "").toLowerCase().replace(/[\s\-_]/g, "");
  const _realWords = new Set(LISTS.flatMap((l) => l.words.map((w) => _norm(w.word))));
  const _myFiltered = myWords.filter((w) => !_realWords.has(_norm(w.word)));

  // Once Claude has promoted a word into words-en.json, drop the local
  // placeholder for good — otherwise the "needs a definition" badge keeps
  // showing words that were finished days ago.
  useEffect(() => {
    if (myWords.length !== _myFiltered.length) setMyWords(_myFiltered);
  }, [myWords.length, _myFiltered.length]);
  const allLists = _myFiltered.length
    ? [...LISTS, { id: "en-my-words", title: "My Words", subtitle: "words you added", words: _myFiltered }]
    : LISTS;

  const addMyWord = (w) => {
    setMyWords((prev) => [...prev, w]);
    setPool((p) => (p.includes("en-my-words") ? p : [...p, "en-my-words"]));
  };
  const removeMyWord = (word) => setMyWords((prev) => prev.filter((x) => x.word !== word));

  const activeWords = allLists
    .flatMap((l) => l.words)

  const listWords = allLists
    .flatMap((l) => l.words.map((w) => ({ ...w, list: l.title })));
  const starredWords = activeWords.filter((w) => starred.has(w.word));

  const home = () => setScreen("home");

  return (
    <div style={{ minHeight:"100vh", background:`radial-gradient(circle at 20% 10%, #DCE9FB 0%, #F3F7FE 45%)`,
      color:C.ink, fontFamily:"'Baloo 2','Comic Sans MS',system-ui,sans-serif", padding:"20px 16px 60px" }}>
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <EnHeader onHome={home} showHome={screen !== "home"} onSwitchLang={onSwitchLang} />
        {screen === "home" && (
          <EnHome addMyWord={addMyWord} myWords={_myFiltered}
            wordCount={activeWords.length} starredCount={starredWords.length}
            totalCount={listWords.length} masteredCount={mastered.size} go={setScreen} />
        )}
        {screen === "flashcards" && (
          <React.Fragment><GameTitle>Flashcards</GameTitle>
          <EnFlashcards words={activeWords} starred={starred} toggleStar={toggleStar} onHome={home} />
          </React.Fragment>
        )}
        {screen === "starflip" && <EnFlashcards words={starredWords} starred={starred} toggleStar={toggleStar} onlyStarred onHome={home} />}
        {screen === "quiz" && (
          <React.Fragment><GameTitle>Quiz</GameTitle>
          <EnQuiz words={activeWords} starred={starred} toggleStar={toggleStar} addStar={addStar} onHome={home} />
          </React.Fragment>
        )}
        {screen === "speed" && (
          <React.Fragment><GameTitle>Speed Round</GameTitle>
          <EnSpeed words={activeWords} starred={starred} toggleStar={toggleStar} addStar={addStar} onHome={home} />
          </React.Fragment>
        )}
        {screen === "spelling" && (
          <React.Fragment><GameTitle>Spelling</GameTitle>
          <EnSpelling words={activeWords} starred={starred} toggleStar={toggleStar} addStar={addStar} onHome={home} />
          </React.Fragment>
        )}
        {screen === "wordlist" && <EnWordList allWords={listWords} starred={starred} mastered={mastered} toggleStar={toggleStar} toggleMastered={toggleMastered} myWords={myWords} removeMyWord={removeMyWord} />}
      </div>
    </div>
  );
}

  const submitWords = () => {
    const lines = bulk.split("\n").map((s) => s.trim()).filter(Boolean);
    let n = 0;
    lines.forEach((line) => {
      const m = line.match(/^(.+?)\s*[:\u2013\u2014-]\s*(.+)$/);
      const word = (m ? m[1] : line).trim();
      const definition = m ? m[2].trim() : "";
      if (!word) return;
      addMyWord({
        word,
        definition: definition || "(definition coming — ask Claude to fill this in)",
        example: "",
        emoji: "📝",
        needsDef: !definition,
      });
      n++;
    });
    setAdded(n); setBulk(""); 
    setTimeout(() => setAdded(0), 4000);
  };

  const needing = (myWords || [])
    .filter((w) => w.needsDef && (!w.definition || /definition coming/i.test(w.definition)))

    const txt = needing.join("\n");

// ---- Flashcards: word front, definition + example back ----
function EnFlashcards({ words, starred, toggleStar, onlyStarred, onHome }) {
  const [deck, setDeck] = useState(() => shuffle(words));
  const [i, setI] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(0);
  const card = deck[i] || deck[0];

  if (!card) return (
    <Center>
      <div style={{ fontSize:54 }}>⭐</div>
      <h2 style={{ margin:"10px 0" }}>No tricky words yet</h2>
      <p style={{ color:"#7a7391", maxWidth:320, textAlign:"center" }}>Tap the ⭐ on a card to save it for extra practice.</p>
      <button onClick={onHome} style={{ ...bigBtn, background:"#5B8DEF", marginTop:16 }}>⬅ Back to menu</button>
    </Center>
  );

  const flagged = starred.has(card.word);
  const next = (got) => {
    if (got) { setKnown((k) => k + 1); playCorrect(known); }
    if (card) srsRecord("en:" + card.word, !!got);
    recordEffort();
    setFlipped(false);
    if (i + 1 < deck.length) setI(i + 1);
    else { setI(0); setDeck(srsOrder(shuffle(words), (w) => "en:" + w.word)); setKnown(0); }
  };

  return (
    <div style={{ textAlign:"center" }}>
      <Progress value={i} total={deck.length} label={onlyStarred ? "⭐ practice pile" : `✅ ${known} known`} />
      <div onClick={() => setFlipped((f) => { const n=!f; if(n) speakEn(card.word); return n; })}
        style={{ position:"relative", background:"#fff", borderRadius:28, padding:"40px 20px", margin:"16px 0", minHeight:230,
          display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center",
          border:`4px solid ${flagged ? C.sun : "#5B8DEF"}`, boxShadow:`0 10px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(91,141,239,0.3)"}`, cursor:"pointer" }}>
        <StarButton flagged={flagged} onClick={() => toggleStar(card.word)} />
        {!flipped ? (
          <>
            <div style={{ fontSize:22, marginBottom:6 }}>{card.emoji || "📘"}</div>
            <div style={{ fontSize:36, fontWeight:800 }}>{card.word}</div>
          </>
        ) : (
          <>
            <div style={{ fontSize:20, fontWeight:700, lineHeight:1.4 }}>{card.definition}</div>
            {card.example && <div style={{ marginTop:12, fontSize:15, color:"#6b7a99", fontStyle:"italic" }}>"{card.example}"</div>}
            <button onClick={(e) => { e.stopPropagation(); speakEn(card.word); }} style={{ ...ghostBtn, marginTop:14 }}>🔊 Hear it</button>
          </>
        )}
      </div>
      <div style={{ display:"flex", gap:12 }}>
        <button onClick={() => next(false)} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, flex:1 }}>🔁 Not yet</button>
        <button onClick={() => next(true)} style={{ ...bigBtn, background:C.leaf, flex:1 }}>✓ Got it!</button>
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Quiz: word shown, pick the correct definition ----
function EnQuiz({ words, starred, toggleStar, addStar, onHome }) {
  const build = () => {
    const q = shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.word !== q.word)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const [round, setRound] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const flagged = starred.has(round.q.word);

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    if (opt.word === round.q.word) {
      setScore((s) => s+1); setStreak((s) => s+1);
      playCorrect(streak); if (streak + 1 === 5) playApplause();
      speakEn(round.q.word);
    } else { setStreak(0); playSoftMiss(); addStar(round.q.word); }
    srsRecord("en:" + round.q.word, opt.word === round.q.word);
    recordEffort();
    setTimeout(() => { setPicked(null); setRound(build()); }, 1300);
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:12 }}>
        <Badge color="#5B8DEF">⭐ {score}</Badge>
        <Badge color={streak >= 3 ? C.berry : C.sun}>🔥 {streak} {streak>=3?"on fire!":""}</Badge>
      </div>
      <div style={{ position:"relative", background:"#fff", borderRadius:24, padding:"30px 20px", textAlign:"center",
        border:`4px solid ${flagged ? C.sun : "#8B6FE8"}`, boxShadow:`0 8px 0 ${flagged?"rgba(246,196,69,0.4)":"rgba(139,111,232,0.3)"}` }}>
        <StarButton flagged={flagged} onClick={() => toggleStar(round.q.word)} />
        <div style={{ fontSize:15, color:"#9a94ad", marginBottom:6 }}>What does this word mean?</div>
        <div style={{ fontSize:34, fontWeight:800 }}>{round.q.word}</div>
        <button onClick={() => speakEn(round.q.word)} style={{ ...ghostBtn, marginTop:10 }}>🔊 Hear it</button>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:10, marginTop:14 }}>
        {round.options.map((opt, idx) => {
          let bg="#fff", bd="#e3ddcf", cl=C.ink;
          if (picked) {
            if (opt.word === round.q.word) { bg=C.leaf; bd=C.leaf; cl="#fff"; }
            else if (opt.word === picked.word) { bg="#F4A7A7"; bd="#F4A7A7"; cl="#fff"; }
          }
          return (
            <button key={idx} onClick={() => choose(opt)}
              style={{ ...bigBtn, background:bg, color:cl, border:`3px solid ${bd}`, fontSize:15, padding:"14px 12px", textAlign:"left", lineHeight:1.35 }}>
              {opt.definition}
            </button>
          );
        })}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Speed Round: 60 seconds, word -> definition ----
function EnSpeed({ words, starred, toggleStar, addStar, onHome }) {
  const [phase, setPhase] = useState("ready");
  const [time, setTime] = useState(60);
  const [score, setScore] = useState(0);
  const [round, setRound] = useState(null);
  const [flash, setFlash] = useState(null);
  const timer = useRef(null);

  const build = () => {
    const q = shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.word !== q.word)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const start = () => {
    setScore(0); setTime(60); setPhase("play"); setRound(build());
    timer.current = setInterval(() => setTime((t) => {
      if (t <= 1) { clearInterval(timer.current); recordEffort(); setPhase("done"); return 0; }
      return t - 1;
    }), 1000);
  };
  useEffect(() => () => clearInterval(timer.current), []);

  const choose = (opt) => {
    const right = opt.word === round.q.word;
    setFlash(right ? "right" : "wrong");
    if (right) { setScore((s) => s+1); playCorrect(score); speakEn(round.q.word); }
    else { playSoftMiss(); addStar(round.q.word); }
    srsRecord("en:" + round.q.word, right);
    setTimeout(() => { setFlash(null); setRound(build()); }, 200);
  };

  if (phase === "ready") return (
    <Center>
      <div style={{ fontSize:60 }}>⏱️</div>
      <h2 style={{ margin:"10px 0" }}>Speed Round!</h2>
      <p style={{ color:"#7a7391", maxWidth:300, textAlign:"center" }}>Get as many right as you can in 60 seconds.</p>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:16, padding:"16px 40px" }}>🚀 Start!</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:12 }}>⬅ Back to menu</button>
    </Center>
  );

  if (phase === "done") return (
    <Center>
      <div style={{ fontSize:64 }}>{score>=15?"🏆":score>=8?"🌟":"💪"}</div>
      <h2 style={{ margin:"8px 0" }}>Time's up!</h2>
      <div style={{ fontSize:52, fontWeight:800, color:"#5B8DEF" }}>{score}</div>
      <div style={{ color:"#7a7391" }}>correct answers</div>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:18 }}>🔁 Play again</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:10 }}>⬅ Back to menu</button>
    </Center>
  );

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <Badge color="#5B8DEF">⭐ {score}</Badge>
        <div style={{ fontSize:30, fontWeight:800, color: time<=10 ? C.berry : C.ink }}>⏱️ {time}s</div>
      </div>
      <div style={{ position:"relative", background: flash==="right"?"#DFF5EA":flash==="wrong"?"#FBE0E0":"#fff",
        borderRadius:24, padding:"26px 20px", textAlign:"center", border:`4px solid ${C.berry}`, transition:"background 0.15s" }}>
        <StarButton flagged={starred.has(round.q.word)} onClick={() => toggleStar(round.q.word)} />
        <div style={{ fontSize:32, fontWeight:800 }}>{round.q.word}</div>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:10, marginTop:14 }}>
        {round.options.map((opt, idx) => (
          <button key={idx} onClick={() => choose(opt)}
            style={{ ...bigBtn, background:"#fff", color:C.ink, border:"3px solid #e3ddcf", fontSize:15, padding:"13px 12px", textAlign:"left", lineHeight:1.35 }}>
            {opt.definition}
          </button>
        ))}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Spelling: hear the word, type it ----
function EnSpelling({ words, starred, toggleStar, addStar, onHome }) {
  const [deck, setDeck] = useState(() => shuffle(words));
  const [i, setI] = useState(0);
  const [entry, setEntry] = useState("");
  const [result, setResult] = useState(null); // null | 'right' | 'wrong'
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);
  const card = deck[i] || deck[0];

  useEffect(() => { if (card) speakEn(card.word); }, [i, deck]);

  if (!card) return (
    <Center>
      <div style={{ fontSize:54 }}>🔤</div>
      <h2 style={{ margin:"10px 0" }}>No words to spell</h2>
      <button onClick={onHome} style={{ ...bigBtn, background:"#5B8DEF", marginTop:16 }}>⬅ Back to menu</button>
    </Center>
  );

  const check = () => {
    if (result) return;
    const ok = entry.trim().toLowerCase() === card.word.toLowerCase();
    setResult(ok ? "right" : "wrong");
    setDone((d) => d + 1);
    if (ok) { setScore((s) => s + 1); playCorrect(score); }
    else { playSoftMiss(); addStar(card.word); }
    srsRecord("en:" + card.word, ok);
    recordEffort();
  };
  const next = () => {
    setEntry(""); setResult(null);
    if (i + 1 < deck.length) setI(i + 1);
    else { setI(0); setDeck(shuffle(words)); }
  };

  return (
    <div style={{ textAlign:"center" }}>
      <Progress value={i} total={deck.length} label={`✅ ${score} / ${done}`} />
      <div style={{ position:"relative", background:"#fff", borderRadius:28, padding:"32px 20px", margin:"16px 0",
        border:`4px solid ${starred.has(card.word) ? C.sun : C.leaf}`, boxShadow:"0 10px 0 rgba(95,184,148,0.3)" }}>
        <StarButton flagged={starred.has(card.word)} onClick={() => toggleStar(card.word)} />
        <div style={{ fontSize:14, color:"#9a94ad", marginBottom:12, fontWeight:700, textTransform:"uppercase", letterSpacing:0.5 }}>
          Listen and spell it
        </div>
        <button onClick={() => speakEn(card.word)} style={{ ...bigBtn, background:"#5B8DEF", fontSize:20, padding:"16px 30px" }}>🔊 Play word</button>
        <div style={{ marginTop:10, fontSize:13, color:"#8b95a8" }}>{card.definition}</div>

        <input value={entry} onChange={(e) => setEntry(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { result ? next() : check(); } }}
          placeholder="Type the word…" autoCapitalize="none" autoCorrect="off" spellCheck="false"
          style={{ ...inp, marginTop:16, textAlign:"center", fontSize:22, fontWeight:700,
            borderColor: result === "right" ? C.leaf : result === "wrong" ? "#F4A7A7" : "#cfe3d6" }} />

        {result === "right" && <div style={{ marginTop:10, color:C.leaf, fontWeight:800, fontSize:18 }}>✓ Correct!</div>}
        {result === "wrong" && (
          <div style={{ marginTop:10 }}>
            <div style={{ color:C.berry, fontWeight:800 }}>Not quite — it's spelled:</div>
            <div style={{ fontSize:26, fontWeight:800, marginTop:4 }}>{card.word}</div>
          </div>
        )}
      </div>
      {!result ? (
        <button onClick={check} disabled={!entry.trim()}
          style={{ ...bigBtn, background:C.leaf, width:"100%", opacity: entry.trim()?1:0.5 }}>✓ Check</button>
      ) : (
        <button onClick={next} style={{ ...bigBtn, background:"#5B8DEF", width:"100%" }}>Next word →</button>
      )}
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:12, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// Little celebratory arpeggio for "mastered" (WebAudio, no asset needed).
const playCelebrate = () => {
  try {
    const ctx = _ctx();
    if (!ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      const t0 = ctx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.35);
    });
  } catch (e) {}
};

//  MATH — fact fluency drill
//  Deliberately NOT a curriculum. Khan/Beast teach concepts;
//  this builds the automaticity they under-drill, using the same
//  spaced repetition, chips, streak and sounds as the languages.
// ============================================================
// Grouped so the picker stays readable as the list grows.
// "gen" marks sets that need special generation rather than a plain a×b sweep.
const MATH_SETS = [
  // --- the foundations: these are what "automaticity" actually means ---
  { id: "bonds10", title: "Make 10",          emoji: "🔟", op: "+", gen: "bond", total: 10,  group: "Foundations" },
  { id: "bonds20", title: "Make 20",          emoji: "🔟", op: "+", gen: "bond", total: 20,  group: "Foundations" },
  { id: "doubles", title: "Doubles (7+7)",    emoji: "👯", op: "+", gen: "double", max: 12,  group: "Foundations" },
  { id: "neardbl", title: "Near doubles",     emoji: "👯", op: "+", gen: "neardouble", max: 12, group: "Foundations" },

  // --- adding & subtracting ---
  { id: "add10",  title: "Adding to 10",      emoji: "➕", op: "+", a: [0,10],  b: [0,10],  group: "Add & subtract" },
  { id: "add20",  title: "Adding to 20",      emoji: "➕", op: "+", a: [0,20],  b: [0,20],  group: "Add & subtract" },
  { id: "sub10",  title: "Subtracting ≤10",   emoji: "➖", op: "-", a: [0,10],  b: [0,10],  group: "Add & subtract" },
  { id: "sub20",  title: "Subtracting ≤20",   emoji: "➖", op: "-", a: [0,20],  b: [0,20],  group: "Add & subtract" },

  // --- place value: the Grade 1/2 bridge to bigger numbers ---
  { id: "plus10", title: "Add 10 (34+10)",    emoji: "🏠", op: "+", a: [1,89],  b: [10,10], group: "Bigger numbers" },
  { id: "add2d",  title: "2-digit adding",    emoji: "🏠", op: "+", a: [10,49], b: [10,49], group: "Bigger numbers" },
  { id: "sub2d",  title: "2-digit subtracting", emoji: "🏠", op: "-", a: [10,99], b: [1,49], group: "Bigger numbers" },

  // --- times tables ---
  { id: "mul5",   title: "×  up to 5",        emoji: "✖️", op: "*", a: [1,5],   b: [1,10],  group: "Times tables" },
  { id: "mul10",  title: "×  up to 10",       emoji: "✖️", op: "*", a: [1,10],  b: [1,10],  group: "Times tables" },
  { id: "mul12",  title: "×  up to 12",       emoji: "✖️", op: "*", a: [1,12],  b: [1,12],  group: "Times tables" },
  { id: "div10",  title: "÷  up to 10",       emoji: "➗", op: "/", a: [1,10],  b: [1,10],  group: "Times tables" },
];

const opSymbol = { "+": "+", "-": "−", "*": "×", "/": "÷" };

// Build every fact in a set, so spaced repetition can track each one.
const factsFor = (set) => {
  const out = [];
  // number bonds: 7 + ? = 10
  if (set.gen === "bond") {
    for (let x = 0; x <= set.total; x++)
      out.push({ key: `math:bond:${set.total}:${x}`, a: x, b: set.total - x, op: "+", ans: set.total });
    return out;
  }
  // doubles: 7 + 7
  if (set.gen === "double") {
    for (let x = 1; x <= set.max; x++)
      out.push({ key: `math:+:${x}:${x}`, a: x, b: x, op: "+", ans: x + x });
    return out;
  }
  // near doubles: 7 + 8
  if (set.gen === "neardouble") {
    for (let x = 1; x < set.max; x++)
      out.push({ key: `math:+:${x}:${x + 1}`, a: x, b: x + 1, op: "+", ans: x + x + 1 });
    return out;
  }
  for (let x = set.a[0]; x <= set.a[1]; x++) {
    for (let y = set.b[0]; y <= set.b[1]; y++) {
      let q, ans;
      if (set.op === "+") { q = [x, y]; ans = x + y; }
      else if (set.op === "-") { if (x < y) continue; q = [x, y]; ans = x - y; }
      else if (set.op === "*") { q = [x, y]; ans = x * y; }
      else { const prod = x * y; q = [prod, x]; ans = y; }   // division stays whole
      out.push({ key: `math:${set.op}:${q[0]}:${q[1]}`, a: q[0], b: q[1], op: set.op, ans });
    }
  }
  return out;
};

function MathQuick({ facts, onHome }) {
  const [f, setF] = useState(() => srsPick(facts, (x) => x.key) || facts[0]);
  const [entry, setEntry] = useState("");
  const [result, setResult] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);

  if (!f) return <Center><div style={{fontSize:54}}>🔢</div><h2>No facts picked</h2>
    <button onClick={onHome} style={{ ...bigBtn, background:"#7C5CE0", marginTop:16 }}>⬅ Back to menu</button></Center>;

  const check = () => {
    if (result) return;
    const ok = entry.trim() !== "" && Number(entry) === f.ans;
    setResult(ok ? "right" : "wrong");
    setDone((d) => d + 1);
    if (ok) { setScore((s) => s + 1); playCorrect(score); } else playSoftMiss();
    srsRecord(f.key, ok);
    recordEffort();

            style={{ ...inp, marginTop:16, textAlign:"center", fontSize:30, fontWeight:800, maxWidth:180,
              borderColor: result==="right"?C.leaf:result==="wrong"?"#F0A5A5":"#ded7f0" }} />
          {result==="right" && <div style={{ marginTop:10, color:C.leaf, fontWeight:800, fontSize:18 }}>✓ Yes!</div>}

            <div style={{ marginTop:10 }}>

              <div style={{ fontSize:30, fontWeight:800 }}>{f.ans}</div>
            </div>

    </div>
  );

// ---- Speed Round: 60s, multiple choice (one effort per round) ----
function MathSpeed({ facts, onHome }) {
  const [phase, setPhase] = useState("ready");
  const [time, setTime] = useState(60);
  const [score, setScore] = useState(0);
  const [round, setRound] = useState(null);
  const [flash, setFlash] = useState(null);
  const timer = useRef(null);

  const build = (avoid) => {
    const q = srsPick(facts, (x) => x.key, avoid) || facts[0];
    const opts = new Set([q.ans]);
    let guard = 0;
    while (opts.size < 4 && guard++ < 40) {
      const delta = Math.floor(Math.random()*9) - 4;
      const cand = q.ans + (delta === 0 ? 1 : delta);
      if (cand >= 0) opts.add(cand);
    }
    return { q, options: shuffle([...opts]) };
  };
  const start = () => {
    setScore(0); setTime(60); setPhase("play"); setRound(build());
    timer.current = setInterval(() => setTime((t) => {
      if (t <= 1) { clearInterval(timer.current); recordEffort(); setPhase("done"); return 0; }
      return t - 1;
    }), 1000);
  };
  useEffect(() => () => clearInterval(timer.current), []);

  const choose = (v) => {
    const ok = v === round.q.ans;
    setFlash(ok ? "right" : "wrong");
    if (ok) { setScore((s)=>s+1); playCorrect(score); } else playSoftMiss();
    srsRecord(round.q.key, ok);
    const prev = round.q.key;
    setTimeout(()=>{ setFlash(null); setRound(build(prev)); }, 200);
  };

  if (phase === "ready") return (
    <Center>
      <div style={{ fontSize:60 }}>⏱️</div>
      <h2 style={{ margin:"10px 0" }}>Speed Round!</h2>
      <p style={{ color:"#7a7391", maxWidth:300, textAlign:"center" }}>How many facts can you get in 60 seconds?</p>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:16, padding:"16px 40px" }}>🚀 Start!</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#EBE5D8", color:C.ink, marginTop:12 }}>⬅ Back to menu</button>
    </Center>
  );
  if (phase === "done") return (
    <Center>
      <div style={{ fontSize:64 }}>{score>=25?"🏆":score>=15?"🌟":"💪"}</div>
      <h2 style={{ margin:"8px 0" }}>Time's up!</h2>
      <div style={{ fontSize:52, fontWeight:800, color:"#7C5CE0" }}>{score}</div>
      <div style={{ color:"#7a7391" }}>correct</div>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:18 }}>🔁 Play again</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#EBE5D8", color:C.ink, marginTop:10 }}>⬅ Back to menu</button>
    </Center>
  );

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <Badge color="#7C5CE0">⭐ {score}</Badge>
        <div style={{ fontSize:30, fontWeight:800, color: time<=10 ? C.berry : C.ink }}>⏱️ {time}s</div>
      </div>
      <div style={{ background: flash==="right"?"#EAF7F0":flash==="wrong"?"#FBE0E0":"#fff",
        borderRadius:24, padding:"26px 20px", textAlign:"center", border:`4px solid ${C.berry}`, transition:"background 0.15s" }}>
        <div style={{ fontSize:44, fontWeight:800 }}>{round.q.a} {opSymbol[round.q.op]} {round.q.b}</div>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginTop:14 }}>
        {round.options.map((v,i)=>(
          <button key={i} onClick={()=>choose(v)}
            style={{ ...bigBtn, background:"#fff", color:C.ink, border:"3px solid #e3ddcf", fontSize:24, padding:"16px 8px" }}>
            {v}
          </button>
        ))}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background:"#EBE5D8", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}


// ---- Bigger or Smaller: comparing numbers (place-value sense) ----
function MathCompare({ onHome }) {
  const build = () => {
    const tier = Math.random();
    const max = tier < 0.4 ? 20 : tier < 0.8 ? 100 : 999;
    let a = Math.floor(Math.random() * max) + 1;
    let b = Math.floor(Math.random() * max) + 1;
    // often make them digit-swaps (34 vs 43) — that's where kids slip
    if (Math.random() < 0.35 && a >= 10 && a < 100) {
      b = Number(String(a).split("").reverse().join(""));
      if (b === a) b = a + 1;
    }
    if (Math.random() < 0.12) b = a;  // sometimes equal
    return { a, b, key: `math:cmp:${a}:${b}` };
  };
  const [q, setQ] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);

  const correct = q.a > q.b ? ">" : q.a < q.b ? "<" : "=";

  const choose = (sym) => {
    if (picked) return;
    setPicked(sym);
    const ok = sym === correct;
    setDone((d) => d + 1);
    if (ok) { setScore((s) => s + 1); playCorrect(score); } else playSoftMiss();
    srsRecord(q.key, ok);
    recordEffort();
    setTimeout(() => { setPicked(null); setQ(build()); }, 1000);
  };

  return (
    <div>
      <Progress value={score} total={Math.max(done, 1)} label={`✅ ${score} / ${done}`} />
      <div style={{ marginTop: 14, background: "#fff", borderRadius: 24, padding: "30px 20px", textAlign: "center",
        border: `4px solid ${picked ? (picked === correct ? C.leaf : "#F0A5A5") : "#E8703A"}`,
        boxShadow: "0 8px 0 rgba(232,112,58,0.22)" }}>
        <div style={{ fontSize: 14, color: "#9a94ad", marginBottom: 12, fontWeight: 700 }}>
          Which sign goes in the middle?
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 18 }}>
          <span style={{ fontSize: 46, fontWeight: 800 }}>{q.a}</span>
          <span style={{ fontSize: 40, fontWeight: 800, color: picked ? C.ink : "#d8d0be" }}>
            {picked ? correct : "?"}
          </span>
          <span style={{ fontSize: 46, fontWeight: 800 }}>{q.b}</span>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginTop: 14 }}>
        {[["<", "is less than"], ["=", "is the same as"], [">", "is more than"]].map(([sym, label]) => {
          let bg = "#fff", bd = "#e3ddcf", cl = C.ink;
          if (picked) {
            if (sym === correct) { bg = C.leaf; bd = C.leaf; cl = "#fff"; }
            else if (sym === picked) { bg = "#F4A7A7"; bd = "#F4A7A7"; cl = "#fff"; }
          }
          return (
            <button key={sym} onClick={() => choose(sym)}
              style={{ ...bigBtn, background: bg, color: cl, border: `3px solid ${bd}`, padding: "16px 6px" }}>
              <div style={{ fontSize: 30, fontWeight: 800 }}>{sym}</div>
              <div style={{ fontSize: 10, opacity: 0.75, marginTop: 2 }}>{label}</div>
            </button>
          );
        })}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- What Comes Next: skip counting (the bridge into times tables) ----
function MathSkip({ onHome }) {
  const STEPS = [2, 5, 10, 3, 4];
  const build = () => {
    const step = STEPS[Math.floor(Math.random() * STEPS.length)];
    const start = step * (Math.floor(Math.random() * 6) + 1);
    const seq = [start, start + step, start + step * 2, start + step * 3];
    const backwards = Math.random() < 0.25 && start - step * 3 >= 0;
    const shown = backwards
      ? [start + step * 3, start + step * 2, start + step, start]
      : seq;
    const ans = backwards ? start - step : start + step * 4;
    return { shown, ans, step, backwards, key: `math:skip:${step}:${shown[0]}:${backwards ? "d" : "u"}` };
  };
  const [q, setQ] = useState(build);
  const [entry, setEntry] = useState("");
  const [result, setResult] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);

  const check = () => {
    if (result) return;
    const ok = entry.trim() !== "" && Number(entry) === q.ans;
    setResult(ok ? "right" : "wrong");
    setDone((d) => d + 1);
    if (ok) { setScore((s) => s + 1); playCorrect(score); } else playSoftMiss();
    srsRecord(q.key, ok);
    recordEffort();
  };
  const next = () => { setEntry(""); setResult(null); setQ(build()); };

  return (
    <div>
      <Progress value={score} total={Math.max(done, 1)} label={`✅ ${score} / ${done}`} />
      <div style={{ marginTop: 14, background: "#fff", borderRadius: 24, padding: "28px 18px", textAlign: "center",
        border: `4px solid ${result === "right" ? C.leaf : result === "wrong" ? "#F0A5A5" : "#3BA0C8"}`,
        boxShadow: "0 8px 0 rgba(59,160,200,0.22)" }}>
        <div style={{ fontSize: 14, color: "#9a94ad", marginBottom: 12, fontWeight: 700 }}>
          Counting {q.backwards ? "back" : "up"} by {q.step} — what comes next?
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, flexWrap: "wrap" }}>
          {q.shown.map((n, i) => (
            <span key={i} style={{ fontSize: 30, fontWeight: 800, background: "#F3F8FB",
              borderRadius: 12, padding: "8px 14px" }}>{n}</span>
          ))}
          <span style={{ fontSize: 30, fontWeight: 800, color: C.berry,
            border: "3px dashed #cfd8e6", borderRadius: 12, padding: "6px 16px" }}>
            {result ? q.ans : "?"}
          </span>
        </div>
        <input value={entry} onChange={(e) => setEntry(e.target.value.replace(/[^0-9-]/g, ""))}
          onKeyDown={(e) => { if (e.key === "Enter") result ? next() : check(); }}
          inputMode="numeric" placeholder="?" autoFocus
          style={{ ...inp, marginTop: 18, textAlign: "center", fontSize: 28, fontWeight: 800, maxWidth: 170,
            borderColor: result === "right" ? C.leaf : result === "wrong" ? "#F0A5A5" : "#cfe3ef" }} />
        {result === "right" && <div style={{ marginTop: 10, color: C.leaf, fontWeight: 800, fontSize: 18 }}>✓ Yes!</div>}
        {result === "wrong" && <div style={{ marginTop: 10, color: C.berry, fontWeight: 800 }}>It's {q.ans}</div>}
      </div>
      {!result
        ? <button onClick={check} disabled={!entry.trim()} style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14, opacity: entry.trim() ? 1 : 0.5 }}>✓ Check</button>
        : <button onClick={next} style={{ ...bigBtn, background: "#7C5CE0", width: "100%", marginTop: 14 }}>Next →</button>}
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 12, width: "100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Missing Number: 5 × ? = 30 ----
function MathMissing({ facts, onHome }) {
  const [f, setF] = useState(() => srsPick(facts, (x) => x.key) || facts[0]);
  const [entry, setEntry] = useState("");
  const [result, setResult] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);

  if (!f) return <Center><div style={{fontSize:54}}>❓</div><h2>No facts picked</h2>
    <button onClick={onHome} style={{ ...bigBtn, background:"#7C5CE0", marginTop:16 }}>⬅ Back to menu</button></Center>;

  // hide the second operand: a op ? = ans
  const check = () => {
    if (result) return;
    const ok = entry.trim() !== "" && Number(entry) === f.b;
    setResult(ok ? "right" : "wrong");
    setDone((d)=>d+1);
    if (ok) { setScore((s)=>s+1); playCorrect(score); } else playSoftMiss();
    srsRecord(f.key, ok);
    recordEffort();
  };
  const next = () => { setEntry(""); setResult(null); setF(srsPick(facts,(x)=>x.key,f.key)||facts[0]); };

  return (
    <div>
      <Progress value={score} total={Math.max(done,1)} label={`✅ ${score} / ${done}`} />
      <div style={{ marginTop:14, background:"#fff", borderRadius:24, padding:"28px 20px", textAlign:"center",
        border:`4px solid ${result==="right"?C.leaf:result==="wrong"?"#F0A5A5":C.leaf}`, boxShadow:"0 8px 0 rgba(95,184,148,0.25)" }}>
        <div style={{ fontSize:40, fontWeight:800 }}>
          {f.a} {opSymbol[f.op]} <span style={{ color:C.berry }}>?</span> = {f.ans}
        </div>
        <input value={entry} onChange={(e)=>setEntry(e.target.value.replace(/[^0-9-]/g,""))}
          onKeyDown={(e)=>{ if(e.key==="Enter") result?next():check(); }}
          inputMode="numeric" placeholder="?" autoFocus
          style={{ ...inp, marginTop:16, textAlign:"center", fontSize:30, fontWeight:800, maxWidth:180,
            borderColor: result==="right"?C.leaf:result==="wrong"?"#F0A5A5":"#cfe3d6" }} />
        {result==="right" && <div style={{ marginTop:10, color:C.leaf, fontWeight:800, fontSize:18 }}>✓ Yes!</div>}
        {result==="wrong" && (
          <div style={{ marginTop:10 }}>
            <div style={{ color:C.berry, fontWeight:800 }}>It's</div>
            <div style={{ fontSize:30, fontWeight:800 }}>{f.b}</div>
          </div>
        )}
      </div>
      {!result
        ? <button onClick={check} disabled={!entry.trim()} style={{ ...bigBtn, background:C.leaf, width:"100%", marginTop:14, opacity:entry.trim()?1:0.5 }}>✓ Check</button>
        : <button onClick={next} style={{ ...bigBtn, background:"#7C5CE0", width:"100%", marginTop:14 }}>Next →</button>}
      <button onClick={onHome} style={{ ...bigBtn, background:"#EBE5D8", color:C.ink, marginTop:12, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

function LanguageShell() {
  const [lang, setLang] = useState(() => loadLS("lang", "zh"));
  useEffect(() => { saveLS("lang", lang); }, [lang]);
  // cycle: Chinese -> English -> Math -> Chinese
  if (lang === "en") return <EnglishApp onSwitchLang={() => setLang("math")} />;
  if (lang === "math") return <MathApp onSwitchLang={() => setLang("zh")} />;
  return <ChineseApp onSwitchLang={() => setLang("en")} />;
}

function AppLoader() {
  const [state, setState] = useState("loading"); // loading | ready | error
  const [detail, setDetail] = useState("");
  useEffect(() => {
    let alive = true;
    // Fetch vocab here directly so there's no dependency on other scripts.
    // Fallback must load BOTH files, or the English side ends up with no words.
    const p = window.__VOCAB_PROMISE__ ||
      Promise.all([
        fetch("vocab.json?t=" + Date.now()).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status + " loading vocab.json");
          return r.json();
        }),
        fetch("words-en.json?t=" + Date.now())
          .then(function (r) { return r.ok ? r.json() : { lists: [] }; })
          .catch(function () { return { lists: [] }; })
      ]).then(function (both) { var v = both[0]; v.english = both[1]; return v; });
    p.then(function (v) {
        if (!alive) return;
        if (!v || !v.lessons) throw new Error("vocab.json loaded but has no lessons");
        window.__VOCAB__ = v;
        setState("ready");
      })
      .catch(function (e) {
        if (!alive) return;
        setDetail(String(e && e.message ? e.message : e));
        setState("error");
      });
    return function () { alive = false; };
  }, []);

  if (state === "loading") {
    return (
      <div className="loading">
        <div style={{ fontSize: 54 }}>🦊</div>
        <div style={{ fontWeight: 700, marginTop: 10 }}>Loading Sam's Chinese Quest…</div>
      </div>
    );
  }
  if (state === "error") {
    return (
      <div className="loading">
        <div style={{ fontSize: 54 }}>😵</div>
        <div style={{ fontWeight: 700, marginTop: 10 }}>Couldn't load the vocabulary.</div>
        <div style={{ marginTop: 6, color: "#7a7391", fontSize: 13, maxWidth: 320, textAlign: "center" }}>{detail || "Check your connection and refresh."}</div>
      </div>
    );
  }
  return <LanguageShell />;
}

// Resilient mount: in-browser Babel executes this script asynchronously,
// and the initial createRoot/render could silently fail to attach on load
// (leaving the app stuck on the "Loading" placeholder). Guard the mount so it
// only runs once the #root element exists, retry until it does, and defer to
// the next frame so it never races Babel's auto-run / DOM readiness.
(function mountApp() {
  var el = document.getElementById("root");
  if (!el || typeof ReactDOM === "undefined" || !ReactDOM.createRoot) {
    return requestAnimationFrame(mountApp);
  }
  try {
    var root = ReactDOM.createRoot(el);
    root.render(<AppLoader />);
  } catch (err) {
    el.innerHTML =
      '<div style="padding:24px;font-family:sans-serif;color:#b00">' +
      'Failed to start the app: ' + (err && err.message ? err.message : err) +
      '</div>';
    console.error("Mount failed:", err);
  }
})();
</script>

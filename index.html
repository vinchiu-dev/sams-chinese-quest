// ---- Quiz: word shown, pick the correct definition ----
function EnQuiz({ words, starred, toggleStar, addStar, onHome }) {
  const build = () => {
    const q = shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.word !== q.word)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const [round, setRound] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const flagged = starred.has(round.q.word);

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    if (opt.word === round.q.word) {
      setScore((s) => s+1); setStreak((s) => s+1);
      playCorrect(streak); if (streak + 1 === 5) playApplause();
      speakEn(round.q.word);
    } else { setStreak(0); playSoftMiss(); addStar(round.q.word); }
    srsRecord("en:" + round.q.word, opt.word === round.q.word);
    recordEffort();
    setTimeout(() => { setPicked(null); setRound(build()); }, 1300);
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:12 }}>
        <Badge color="#5B8DEF">⭐ {score}</Badge>
        <Badge color={streak >= 3 ? C.berry : C.sun}>🔥 {streak} {streak>=3?"on fire!":""}</Badge>
      </div>
      <div style={{ position:"relative", background:"#fff", borderRadius:24, padding:"30px 20px", textAlign:"center",
        border:`4px solid ${flagged ? C.sun : "#8B6FE8"}`, boxShadow:`0 8px 0 ${flagged?"rgba(246,196,69,0.4)":"rgba(139,111,232,0.3)"}` }}>
        <StarButton flagged={flagged} onClick={() => toggleStar(round.q.word)} />
        <div style={{ fontSize:15, color:"#9a94ad", marginBottom:6 }}>What does this word mean?</div>
        <div style={{ fontSize:34, fontWeight:800 }}>{round.q.word}</div>
        <button onClick={() => speakEn(round.q.word)} style={{ ...ghostBtn, marginTop:10 }}>🔊 Hear it</button>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:10, marginTop:14 }}>
        {round.options.map((opt, idx) => {
          let bg="#fff", bd="#e3ddcf", cl=C.ink;
          if (picked) {
            if (opt.word === round.q.word) { bg=C.leaf; bd=C.leaf; cl="#fff"; }
            else if (opt.word === picked.word) { bg="#F4A7A7"; bd="#F4A7A7"; cl="#fff"; }
          }
          return (
            <button key={idx} onClick={() => choose(opt)}
              style={{ ...bigBtn, background:bg, color:cl, border:`3px solid ${bd}`, fontSize:15, padding:"14px 12px", textAlign:"left", lineHeight:1.35 }}>
              {opt.definition}
            </button>
          );
        })}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Speed Round: 60 seconds, word -> definition ----
function EnSpeed({ words, starred, toggleStar, addStar, onHome }) {
  const [phase, setPhase] = useState("ready");
  const [time, setTime] = useState(60);
  const [score, setScore] = useState(0);
  const [round, setRound] = useState(null);
  const [flash, setFlash] = useState(null);
  const timer = useRef(null);

  const build = () => {
    const q = shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.word !== q.word)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const start = () => {
    setScore(0); setTime(60); setPhase("play"); setRound(build());
    timer.current = setInterval(() => setTime((t) => {
      if (t <= 1) { clearInterval(timer.current); recordEffort(); setPhase("done"); return 0; }
      return t - 1;
    }), 1000);
  };
  useEffect(() => () => clearInterval(timer.current), []);

  const choose = (opt) => {
    const right = opt.word === round.q.word;
    setFlash(right ? "right" : "wrong");
    if (right) { setScore((s) => s+1); playCorrect(score); speakEn(round.q.word); }
    else { playSoftMiss(); addStar(round.q.word); }
    srsRecord("en:" + round.q.word, right);
    setTimeout(() => { setFlash(null); setRound(build()); }, 200);
  };

  if (phase === "ready") return (
    <Center>
      <div style={{ fontSize:60 }}>⏱️</div>
      <h2 style={{ margin:"10px 0" }}>Speed Round!</h2>
      <p style={{ color:"#7a7391", maxWidth:300, textAlign:"center" }}>Get as many right as you can in 60 seconds.</p>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:16, padding:"16px 40px" }}>🚀 Start!</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:12 }}>⬅ Back to menu</button>
    </Center>
  );

  if (phase === "done") return (
    <Center>
      <div style={{ fontSize:64 }}>{score>=15?"🏆":score>=8?"🌟":"💪"}</div>
      <h2 style={{ margin:"8px 0" }}>Time's up!</h2>
      <div style={{ fontSize:52, fontWeight:800, color:"#5B8DEF" }}>{score}</div>
      <div style={{ color:"#7a7391" }}>correct answers</div>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:18 }}>🔁 Play again</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:10 }}>⬅ Back to menu</button>
    </Center>
  );

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <Badge color="#5B8DEF">⭐ {score}</Badge>
        <div style={{ fontSize:30, fontWeight:800, color: time<=10 ? C.berry : C.ink }}>⏱️ {time}s</div>
      </div>
      <div style={{ position:"relative", background: flash==="right"?"#DFF5EA":flash==="wrong"?"#FBE0E0":"#fff",
        borderRadius:24, padding:"26px 20px", textAlign:"center", border:`4px solid ${C.berry}`, transition:"background 0.15s" }}>
        <StarButton flagged={starred.has(round.q.word)} onClick={() => toggleStar(round.q.word)} />
        <div style={{ fontSize:32, fontWeight:800 }}>{round.q.word}</div>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:10, marginTop:14 }}>
        {round.options.map((opt, idx) => (
          <button key={idx} onClick={() => choose(opt)}
            style={{ ...bigBtn, background:"#fff", color:C.ink, border:"3px solid #e3ddcf", fontSize:15, padding:"13px 12px", textAlign:"left", lineHeight:1.35 }}>
            {opt.definition}

      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>

// ---- Spelling: hear the word, type it ----
function EnSpelling({ words, starred, toggleStar, addStar, onHome }) {
  const [deck, setDeck] = useState(() => shuffle(words));
  const [i, setI] = useState(0);
  const [entry, setEntry] = useState("");
  const [result, setResult] = useState(null); // null | 'right' | 'wrong'
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);
  const card = deck[i] || deck[0];

  useEffect(() => { if (card) speakEn(card.word); }, [i, deck]);

  if (!card) return (
    <Center>
      <div style={{ fontSize:54 }}>🔤</div>
      <h2 style={{ margin:"10px 0" }}>No words to spell</h2>
      <button onClick={onHome} style={{ ...bigBtn, background:"#5B8DEF", marginTop:16 }}>⬅ Back to menu</button>
    </Center>
  );

  const check = () => {
    if (result) return;
    const ok = entry.trim().toLowerCase() === card.word.toLowerCase();
    setResult(ok ? "right" : "wrong");
    setDone((d) => d + 1);
    if (ok) { setScore((s) => s + 1); playCorrect(score); }
    else { playSoftMiss(); addStar(card.word); }
    srsRecord("en:" + card.word, ok);
    recordEffort();
  };
  const next = () => {
    setEntry(""); setResult(null);
    if (i + 1 < deck.length) setI(i + 1);
    else { setI(0); setDeck(shuffle(words)); }
  };

  return (
    <div style={{ textAlign:"center" }}>
      <Progress value={i} total={deck.length} label={`✅ ${score} / ${done}`} />
      <div style={{ position:"relative", background:"#fff", borderRadius:28, padding:"32px 20px", margin:"16px 0",
        border:`4px solid ${starred.has(card.word) ? C.sun : C.leaf}`, boxShadow:"0 10px 0 rgba(95,184,148,0.3)" }}>
        <StarButton flagged={starred.has(card.word)} onClick={() => toggleStar(card.word)} />
        <div style={{ fontSize:14, color:"#9a94ad", marginBottom:12, fontWeight:700, textTransform:"uppercase", letterSpacing:0.5 }}>
          Listen and spell it
        </div>
        <button onClick={() => speakEn(card.word)} style={{ ...bigBtn, background:"#5B8DEF", fontSize:20, padding:"16px 30px" }}>🔊 Play word</button>
        <div style={{ marginTop:10, fontSize:13, color:"#8b95a8" }}>{card.definition}</div>

        <input value={entry} onChange={(e) => setEntry(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { result ? next() : check(); } }}
          placeholder="Type the word…" autoCapitalize="none" autoCorrect="off" spellCheck="false"
          style={{ ...inp, marginTop:16, textAlign:"center", fontSize:22, fontWeight:700,
            borderColor: result === "right" ? C.leaf : result === "wrong" ? "#F4A7A7" : "#cfe3d6" }} />

        {result === "right" && <div style={{ marginTop:10, color:C.leaf, fontWeight:800, fontSize:18 }}>✓ Correct!</div>}
        {result === "wrong" && (
          <div style={{ marginTop:10 }}>
            <div style={{ color:C.berry, fontWeight:800 }}>Not quite — it's spelled:</div>
            <div style={{ fontSize:26, fontWeight:800, marginTop:4 }}>{card.word}</div>
          </div>
        )}
      </div>
      {!result ? (
        <button onClick={check} disabled={!entry.trim()}
          style={{ ...bigBtn, background:C.leaf, width:"100%", opacity: entry.trim()?1:0.5 }}>✓ Check</button>
      ) : (
        <button onClick={next} style={{ ...bigBtn, background:"#5B8DEF", width:"100%" }}>Next word →</button>
      )}
      <button onClick={onHome} style={{ ...bigBtn, background:"#E6EAF2", color:C.ink, marginTop:12, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// Little celebratory arpeggio for "mastered" (WebAudio, no asset needed).
const playCelebrate = () => {
  try {
    const ctx = _ctx();
    if (!ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      const t0 = ctx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.35);
    });
  } catch (e) {}
};

//  MATH — fact fluency drill
//  Deliberately NOT a curriculum. Khan/Beast teach concepts;
//  this builds the automaticity they under-drill, using the same
//  spaced repetition, chips, streak and sounds as the languages.
// ============================================================
// Grouped so the picker stays readable as the list grows.
// "gen" marks sets that need special generation rather than a plain a×b sweep.
const MATH_SETS = [
  // --- the foundations: these are what "automaticity" actually means ---
  { id: "bonds10", title: "Make 10",          emoji: "🔟", op: "+", gen: "bond", total: 10,  group: "Foundations" },
  { id: "bonds20", title: "Make 20",          emoji: "🔟", op: "+", gen: "bond", total: 20,  group: "Foundations" },
  { id: "doubles", title: "Doubles (7+7)",    emoji: "👯", op: "+", gen: "double", max: 12,  group: "Foundations" },
  { id: "neardbl", title: "Near doubles",     emoji: "👯", op: "+", gen: "neardouble", max: 12, group: "Foundations" },

  // --- adding & subtracting ---
  { id: "add10",  title: "Adding to 10",      emoji: "➕", op: "+", a: [0,10],  b: [0,10],  group: "Add & subtract" },
  { id: "add20",  title: "Adding to 20",      emoji: "➕", op: "+", a: [0,20],  b: [0,20],  group: "Add & subtract" },
  { id: "sub10",  title: "Subtracting ≤10",   emoji: "➖", op: "-", a: [0,10],  b: [0,10],  group: "Add & subtract" },
  { id: "sub20",  title: "Subtracting ≤20",   emoji: "➖", op: "-", a: [0,20],  b: [0,20],  group: "Add & subtract" },

  // --- place value: the Grade 1/2 bridge to bigger numbers ---
  { id: "plus10", title: "Add 10 (34+10)",    emoji: "🏠", op: "+", a: [1,89],  b: [10,10], group: "Bigger numbers" },
  { id: "add2d",  title: "2-digit adding",    emoji: "🏠", op: "+", a: [10,49], b: [10,49], group: "Bigger numbers" },
  { id: "sub2d",  title: "2-digit subtracting", emoji: "🏠", op: "-", a: [10,99], b: [1,49], group: "Bigger numbers" },

  // --- times tables ---
  { id: "mul5",   title: "×  up to 5",        emoji: "✖️", op: "*", a: [1,5],   b: [1,10],  group: "Times tables" },
  { id: "mul10",  title: "×  up to 10",       emoji: "✖️", op: "*", a: [1,10],  b: [1,10],  group: "Times tables" },
  { id: "mul12",  title: "×  up to 12",       emoji: "✖️", op: "*", a: [1,12],  b: [1,12],  group: "Times tables" },
  { id: "div10",  title: "÷  up to 10",       emoji: "➗", op: "/", a: [1,10],  b: [1,10],  group: "Times tables" },
];

const opSymbol = { "+": "+", "-": "−", "*": "×", "/": "÷" };

// Build every fact in a set, so spaced repetition can track each one.
const factsFor = (set) => {
  const out = [];
  // number bonds: 7 + ? = 10
  if (set.gen === "bond") {
    for (let x = 0; x <= set.total; x++)
      out.push({ key: `math:bond:${set.total}:${x}`, a: x, b: set.total - x, op: "+", ans: set.total });
    return out;
  }
  // doubles: 7 + 7
  if (set.gen === "double") {
    for (let x = 1; x <= set.max; x++)
      out.push({ key: `math:+:${x}:${x}`, a: x, b: x, op: "+", ans: x + x });
    return out;
  }
  // near doubles: 7 + 8
  if (set.gen === "neardouble") {
    for (let x = 1; x < set.max; x++)
      out.push({ key: `math:+:${x}:${x + 1}`, a: x, b: x + 1, op: "+", ans: x + x + 1 });
    return out;
  }
  for (let x = set.a[0]; x <= set.a[1]; x++) {
    for (let y = set.b[0]; y <= set.b[1]; y++) {
      let q, ans;
      if (set.op === "+") { q = [x, y]; ans = x + y; }
      else if (set.op === "-") { if (x < y) continue; q = [x, y]; ans = x - y; }
      else if (set.op === "*") { q = [x, y]; ans = x * y; }
      else { const prod = x * y; q = [prod, x]; ans = y; }   // division stays whole
      out.push({ key: `math:${set.op}:${q[0]}:${q[1]}`, a: q[0], b: q[1], op: set.op, ans });
    }
  }
  return out;
};

}

// ---- Quick Facts: type the answer ----
function MathQuick({ facts, onHome }) {
  const advRef = useRef(null);
  const nextRef = useRef(() => {});
  useEffect(() => () => { if (advRef.current) clearTimeout(advRef.current); }, []);
  const [f, setF] = useState(() => srsPick(facts, (x) => x.key) || facts[0]);
  const [entry, setEntry] = useState("");
  const [result, setResult] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);

  if (!f) return <Center><div style={{fontSize:54}}>🔢</div><h2>No facts picked</h2>
    <button onClick={onHome} style={{ ...bigBtn, background:"#7C5CE0", marginTop:16 }}>⬅ Back to menu</button></Center>;

  const check = () => {
    if (result) return;
    const ok = entry.trim() !== "" && Number(entry) === f.ans;
    setResult(ok ? "right" : "wrong");
    setDone((d) => d + 1);
    if (ok) { setScore((s) => s + 1); playCorrect(score); } else playSoftMiss();
    srsRecord(f.key, ok);
    recordEffort();
    // Correct answers roll straight on — a right answer needs no dwell time.
    // Wrong ones wait, so he actually reads the correct answer.
    if (ok) advRef.current = setTimeout(nextRef.current, 1200);
  };
  const next = () => {
    if (advRef.current) clearTimeout(advRef.current);
    setEntry(""); setResult(null);
    setF(srsPick(facts, (x) => x.key, f.key) || facts[0]);
  };
  nextRef.current = next;

  return (
    <div>
      <Progress value={score} total={Math.max(done,1)} label={`✅ ${score} / ${done}`} />
      <div style={{ marginTop:14 }}>
        <FactCard f={f} border={result==="right"?C.leaf:result==="wrong"?"#F0A5A5":"#7C5CE0"}>
          <input value={entry} onChange={(e)=>setEntry(e.target.value.replace(/[^0-9-]/g,""))}
            onKeyDown={(e)=>{ if(e.key==="Enter") result?next():check(); }}
            inputMode="numeric" placeholder="?" autoFocus
            style={{ ...inp, marginTop:16, textAlign:"center", fontSize:30, fontWeight:800, maxWidth:180,
              borderColor: result==="right"?C.leaf:result==="wrong"?"#F0A5A5":"#ded7f0" }} />
          {result==="right" && <div style={{ marginTop:10, color:C.leaf, fontWeight:800, fontSize:18 }}>✓ Yes!</div>}
          {result==="wrong" && (
            <div style={{ marginTop:10 }}>
              <div style={{ color:C.berry, fontWeight:800 }}>It's</div>
              <div style={{ fontSize:30, fontWeight:800 }}>{f.ans}</div>
            </div>
          )}
        </FactCard>
      </div>
      {!result
        ? <button onClick={check} disabled={!entry.trim()} style={{ ...bigBtn, background:C.leaf, width:"100%", marginTop:14, opacity:entry.trim()?1:0.5 }}>✓ Check</button>
        : (result === "right"
            ? <div style={{ textAlign:"center", marginTop:16, fontSize:13, color:"#9a94ad", fontWeight:700 }}>next one coming…</div>
            : <button onClick={next} style={{ ...bigBtn, background:"#7C5CE0", width:"100%", marginTop:14 }}>Next →</button>)}
      <button onClick={onHome} style={{ ...bigBtn, background:"#EBE5D8", color:C.ink, marginTop:12, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Speed Round: 60s, multiple choice (one effort per round) ----
function MathSpeed({ facts, onHome }) {
  const [phase, setPhase] = useState("ready");
  const [time, setTime] = useState(60);
  const [score, setScore] = useState(0);
  const [round, setRound] = useState(null);
  const [flash, setFlash] = useState(null);
  const timer = useRef(null);

  const build = (avoid) => {
    const q = srsPick(facts, (x) => x.key, avoid) || facts[0];
    const opts = new Set([q.ans]);
    let guard = 0;
    while (opts.size < 4 && guard++ < 40) {
      const delta = Math.floor(Math.random()*9) - 4;
      const cand = q.ans + (delta === 0 ? 1 : delta);
      if (cand >= 0) opts.add(cand);
    }
    return { q, options: shuffle([...opts]) };
  };
  const start = () => {
    setScore(0); setTime(60); setPhase("play"); setRound(build());
    timer.current = setInterval(() => setTime((t) => {
      if (t <= 1) { clearInterval(timer.current); recordEffort(); setPhase("done"); return 0; }
      return t - 1;
    }), 1000);
  };
  useEffect(() => () => clearInterval(timer.current), []);

  const choose = (v) => {
    const ok = v === round.q.ans;
    setFlash(ok ? "right" : "wrong");
    if (ok) { setScore((s)=>s+1); playCorrect(score); } else playSoftMiss();
    srsRecord(round.q.key, ok);
    const prev = round.q.key;
    setTimeout(()=>{ setFlash(null); setRound(build(prev)); }, 200);
  };

  if (phase === "ready") return (
    <Center>
      <div style={{ fontSize:60 }}>⏱️</div>
      <h2 style={{ margin:"10px 0" }}>Speed Round!</h2>
      <p style={{ color:"#7a7391", maxWidth:300, textAlign:"center" }}>How many facts can you get in 60 seconds?</p>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:16, padding:"16px 40px" }}>🚀 Start!</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#EBE5D8", color:C.ink, marginTop:12 }}>⬅ Back to menu</button>
    </Center>
  );
  if (phase === "done") return (
    <Center>
      <div style={{ fontSize:64 }}>{score>=25?"🏆":score>=15?"🌟":"💪"}</div>
      <h2 style={{ margin:"8px 0" }}>Time's up!</h2>
      <div style={{ fontSize:52, fontWeight:800, color:"#7C5CE0" }}>{score}</div>
      <div style={{ color:"#7a7391" }}>correct</div>
      <button onClick={start} style={{ ...bigBtn, background:C.berry, marginTop:18 }}>🔁 Play again</button>
      <button onClick={onHome} style={{ ...bigBtn, background:"#EBE5D8", color:C.ink, marginTop:10 }}>⬅ Back to menu</button>
    </Center>
  );

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <Badge color="#7C5CE0">⭐ {score}</Badge>
        <div style={{ fontSize:30, fontWeight:800, color: time<=10 ? C.berry : C.ink }}>⏱️ {time}s</div>
      </div>
      <div style={{ background: flash==="right"?"#EAF7F0":flash==="wrong"?"#FBE0E0":"#fff",
        borderRadius:24, padding:"26px 20px", textAlign:"center", border:`4px solid ${C.berry}`, transition:"background 0.15s" }}>
        <div style={{ fontSize:44, fontWeight:800 }}>{round.q.a} {opSymbol[round.q.op]} {round.q.b}</div>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginTop:14 }}>
        {round.options.map((v,i)=>(
          <button key={i} onClick={()=>choose(v)}
            style={{ ...bigBtn, background:"#fff", color:C.ink, border:"3px solid #e3ddcf", fontSize:24, padding:"16px 8px" }}>
            {v}
          </button>
        ))}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background:"#EBE5D8", color:C.ink, marginTop:14, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}



// ---- Clock face: thick red hour hand, thinner blue minute hand ----
function ClockFace({ hour, minute, size = 240 }) {
  const R = size / 2;
  const cx = R, cy = R;
  // hour hand advances smoothly with the minutes (2:30 sits between 2 and 3)
  const hourAng = ((hour % 12) + minute / 60) * 30 - 90;
  const minAng = minute * 6 - 90;
  const rad = (d) => (d * Math.PI) / 180;
  const hx = cx + Math.cos(rad(hourAng)) * R * 0.46;
  const hy = cy + Math.sin(rad(hourAng)) * R * 0.46;
  const mx = cx + Math.cos(rad(minAng)) * R * 0.72;
  const my = cy + Math.sin(rad(minAng)) * R * 0.72;

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: "block", margin: "0 auto" }}>
      <circle cx={cx} cy={cy} r={R - 5} fill="#fff" stroke="#2A2440" strokeWidth="5" />
      {/* minute ticks */}
      {Array.from({ length: 60 }).map((_, i) => {
        const a = rad(i * 6 - 90);
        const big = i % 5 === 0;
        const r1 = R - (big ? 20 : 12), r2 = R - 9;
        return (
          <line key={i}
            x1={cx + Math.cos(a) * r1} y1={cy + Math.sin(a) * r1}
            x2={cx + Math.cos(a) * r2} y2={cy + Math.sin(a) * r2}
            stroke={big ? "#2A2440" : "#c9c3d6"} strokeWidth={big ? 3.5 : 1.5} strokeLinecap="round" />
        );
      })}
      {/* numbers */}
      {Array.from({ length: 12 }).map((_, i) => {
        const n = i + 1;
        const a = rad(n * 30 - 90);
        return (
          <text key={n}
            x={cx + Math.cos(a) * (R * 0.74)} y={cy + Math.sin(a) * (R * 0.74)}
            textAnchor="middle" dominantBaseline="central"
            fontSize={R * 0.19} fontWeight="800" fill="#2A2440" fontFamily="inherit">{n}</text>
        );
      })}
      {/* minute hand — long, thinner, blue */}
      <line x1={cx} y1={cy} x2={mx} y2={my} stroke="#3BA0C8" strokeWidth={R * 0.055} strokeLinecap="round" />
      {/* hour hand — short, THICK, red */}
      <line x1={cx} y1={cy} x2={hx} y2={hy} stroke="#D64A4A" strokeWidth={R * 0.105} strokeLinecap="round" />
      <circle cx={cx} cy={cy} r={R * 0.06} fill="#2A2440" />
    </svg>
  );
}

// ---- What Time Is It: read the clock, pick the time ----
function MathClock({ onHome }) {
  const advRef = useRef(null);
  const nextRef = useRef(() => {});
  useEffect(() => () => { if (advRef.current) clearTimeout(advRef.current); }, []);

  const label = (h, m) => {
    const hh = ((h + 11) % 12) + 1;
    if (m === 0) return hh + " o'clock";
    if (m === 15) return "quarter past " + hh;
    if (m === 30) return "half past " + hh;
    if (m === 45) return "quarter to " + (((hh % 12) + 1));
    return hh + ":" + String(m).padStart(2, "0");
  };
  const digital = (h, m) => (((h + 11) % 12) + 1) + ":" + String(m).padStart(2, "0");

  const MINUTES = [0, 15, 30, 45];
  const build = () => {
    const h = Math.floor(Math.random() * 12) + 1;
    const m = MINUTES[Math.floor(Math.random() * MINUTES.length)];
    const key = "math:clock:" + h + ":" + m;
    // distractors: same time on a different hour, and the same hour at other minutes
    const opts = new Set([digital(h, m)]);
    let guard = 0;
    while (opts.size < 4 && guard++ < 40) {
      const useOtherHour = Math.random() < 0.5;
      const hh = useOtherHour ? (Math.floor(Math.random() * 12) + 1) : h;
      const mm = useOtherHour ? m : MINUTES[Math.floor(Math.random() * MINUTES.length)];
      opts.add(digital(hh, mm));
    }
    return { h, m, key, options: shuffle([...opts]) };
  };

  const [q, setQ] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);

  const next = () => {
    if (advRef.current) clearTimeout(advRef.current);
    setPicked(null);
    setQ(build());
  };
  nextRef.current = next;

  const choose = (v) => {
    if (picked) return;
    setPicked(v);
    const ok = v === digital(q.h, q.m);
    setDone((d) => d + 1);
    if (ok) { setScore((s) => s + 1); playCorrect(score); } else playSoftMiss();
    srsRecord(q.key, ok);
    recordEffort();
    if (ok) advRef.current = setTimeout(nextRef.current, 1400);
  };

  const correct = digital(q.h, q.m);

  return (
    <div>
      <Progress value={score} total={Math.max(done, 1)} label={`✅ ${score} / ${done}`} />

      <div style={{ marginTop: 14, background: "#fff", borderRadius: 24, padding: "20px 16px",
        border: `4px solid ${picked ? (picked === correct ? C.leaf : "#F0A5A5") : "#7C5CE0"}`,
        boxShadow: "0 8px 0 rgba(124,92,224,0.22)" }}>
        <ClockFace hour={q.h} minute={q.m} size={230} />
        {picked && (
          <div style={{ textAlign: "center", marginTop: 12 }}>
            <div style={{ fontSize: 22, fontWeight: 800, color: picked === correct ? C.leaf : C.berry }}>
              {correct}
            </div>
            <div style={{ fontSize: 15, color: "#7a7391", marginTop: 2 }}>{label(q.h, q.m)}</div>
          </div>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
        {q.options.map((v, i) => {
          let bg = "#fff", bd = "#e3ddcf", cl = C.ink;
          if (picked) {
            if (v === correct) { bg = C.leaf; bd = C.leaf; cl = "#fff"; }
            else if (v === picked) { bg = "#F4A7A7"; bd = "#F4A7A7"; cl = "#fff"; }
          }
          return (
            <button key={i} onClick={() => choose(v)}
              style={{ ...bigBtn, background: bg, color: cl, border: `3px solid ${bd}`, fontSize: 24, padding: "18px 8px" }}>
              {v}
            </button>
          );
        })}
      </div>

      {picked && picked !== correct && (
        <button onClick={next} style={{ ...bigBtn, background: "#7C5CE0", width: "100%", marginTop: 14 }}>
          Next →
        </button>
      )}
      {picked === correct && (
        <div style={{ textAlign: "center", marginTop: 16, fontSize: 13, color: "#9a94ad", fontWeight: 700 }}>
          next one coming…
        </div>
      )}

      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 12, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

// ---- Bigger or Smaller: comparing numbers (place-value sense) ----
function MathCompare({ onHome }) {
  const build = () => {
    const tier = Math.random();
    const max = tier < 0.4 ? 20 : tier < 0.8 ? 100 : 999;
    let a = Math.floor(Math.random() * max) + 1;
    let b = Math.floor(Math.random() * max) + 1;
    // often make them digit-swaps (34 vs 43) — that's where kids slip
    if (Math.random() < 0.35 && a >= 10 && a < 100) {
      b = Number(String(a).split("").reverse().join(""));
      if (b === a) b = a + 1;
    }
    if (Math.random() < 0.12) b = a;  // sometimes equal
    return { a, b, key: `math:cmp:${a}:${b}` };
  };
  const [q, setQ] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);

  const correct = q.a > q.b ? ">" : q.a < q.b ? "<" : "=";

  const choose = (sym) => {
    if (picked) return;
    setPicked(sym);
    const ok = sym === correct;
    setDone((d) => d + 1);
    if (ok) { setScore((s) => s + 1); playCorrect(score); } else playSoftMiss();
    srsRecord(q.key, ok);
    recordEffort();
    setTimeout(() => { setPicked(null); setQ(build()); }, 1000);
  };

  return (
    <div>
      <Progress value={score} total={Math.max(done, 1)} label={`✅ ${score} / ${done}`} />
      <div style={{ marginTop: 14, background: "#fff", borderRadius: 24, padding: "30px 20px", textAlign: "center",
        border: `4px solid ${picked ? (picked === correct ? C.leaf : "#F0A5A5") : "#E8703A"}`,
        boxShadow: "0 8px 0 rgba(232,112,58,0.22)" }}>
        <div style={{ fontSize: 14, color: "#9a94ad", marginBottom: 12, fontWeight: 700 }}>
          Which sign goes in the middle?
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 18 }}>
          <span style={{ fontSize: 46, fontWeight: 800 }}>{q.a}</span>
          <span style={{ fontSize: 40, fontWeight: 800, color: picked ? C.ink : "#d8d0be" }}>
            {picked ? correct : "?"}
          </span>
          <span style={{ fontSize: 46, fontWeight: 800 }}>{q.b}</span>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginTop: 14 }}>
        {[["<", "is less than"], ["=", "is the same as"], [">", "is more than"]].map(([sym, label]) => {
          let bg = "#fff", bd = "#e3ddcf", cl = C.ink;
          if (picked) {
            if (sym === correct) { bg = C.leaf; bd = C.leaf; cl = "#fff"; }
            else if (sym === picked) { bg = "#F4A7A7"; bd = "#F4A7A7"; cl = "#fff"; }
          }
          return (
            <button key={sym} onClick={() => choose(sym)}
              style={{ ...bigBtn, background: bg, color: cl, border: `3px solid ${bd}`, padding: "16px 6px" }}>
              <div style={{ fontSize: 30, fontWeight: 800 }}>{sym}</div>
              <div style={{ fontSize: 10, opacity: 0.75, marginTop: 2 }}>{label}</div>
            </button>
          );
        })}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- What Comes Next: skip counting (the bridge into times tables) ----
function MathSkip({ onHome }) {
  const advRef = useRef(null);
  const nextRef = useRef(() => {});
  useEffect(() => () => { if (advRef.current) clearTimeout(advRef.current); }, []);
  const STEPS = [2, 5, 10, 3, 4];
  const build = () => {
    const step = STEPS[Math.floor(Math.random() * STEPS.length)];
    const start = step * (Math.floor(Math.random() * 6) + 1);
    const seq = [start, start + step, start + step * 2, start + step * 3];
    const backwards = Math.random() < 0.25 && start - step * 3 >= 0;
    const shown = backwards
      ? [start + step * 3, start + step * 2, start + step, start]
      : seq;
    const ans = backwards ? start - step : start + step * 4;
    return { shown, ans, step, backwards, key: `math:skip:${step}:${shown[0]}:${backwards ? "d" : "u"}` };
  };
  const [q, setQ] = useState(build);
  const [entry, setEntry] = useState("");
  const [result, setResult] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);

  const check = () => {
    if (result) return;
    const ok = entry.trim() !== "" && Number(entry) === q.ans;
    setResult(ok ? "right" : "wrong");
    setDone((d) => d + 1);
    if (ok) { setScore((s) => s + 1); playCorrect(score); } else playSoftMiss();
    srsRecord(q.key, ok);
    recordEffort();
    if (ok) advRef.current = setTimeout(nextRef.current, 1200);
  };
  const next = () => {
    if (advRef.current) clearTimeout(advRef.current);
    setEntry(""); setResult(null); setQ(build());
  };
  nextRef.current = next;

  return (
    <div>
      <Progress value={score} total={Math.max(done, 1)} label={`✅ ${score} / ${done}`} />
      <div style={{ marginTop: 14, background: "#fff", borderRadius: 24, padding: "28px 18px", textAlign: "center",
        border: `4px solid ${result === "right" ? C.leaf : result === "wrong" ? "#F0A5A5" : "#3BA0C8"}`,
        boxShadow: "0 8px 0 rgba(59,160,200,0.22)" }}>
        <div style={{ fontSize: 14, color: "#9a94ad", marginBottom: 12, fontWeight: 700 }}>
          Counting {q.backwards ? "back" : "up"} by {q.step} — what comes next?
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, flexWrap: "wrap" }}>
          {q.shown.map((n, i) => (
            <span key={i} style={{ fontSize: 30, fontWeight: 800, background: "#F3F8FB",
              borderRadius: 12, padding: "8px 14px" }}>{n}</span>
          ))}
          <span style={{ fontSize: 30, fontWeight: 800, color: C.berry,
            border: "3px dashed #cfd8e6", borderRadius: 12, padding: "6px 16px" }}>
            {result ? q.ans : "?"}
          </span>
        </div>
        <input value={entry} onChange={(e) => setEntry(e.target.value.replace(/[^0-9-]/g, ""))}
          onKeyDown={(e) => { if (e.key === "Enter") result ? next() : check(); }}
          inputMode="numeric" placeholder="?" autoFocus
          style={{ ...inp, marginTop: 18, textAlign: "center", fontSize: 28, fontWeight: 800, maxWidth: 170,
            borderColor: result === "right" ? C.leaf : result === "wrong" ? "#F0A5A5" : "#cfe3ef" }} />
        {result === "right" && <div style={{ marginTop: 10, color: C.leaf, fontWeight: 800, fontSize: 18 }}>✓ Yes!</div>}
        {result === "wrong" && <div style={{ marginTop: 10, color: C.berry, fontWeight: 800 }}>It's {q.ans}</div>}
      </div>
      {!result
        ? <button onClick={check} disabled={!entry.trim()} style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14, opacity: entry.trim() ? 1 : 0.5 }}>✓ Check</button>
        : (result === "right"
            ? <div style={{ textAlign:"center", marginTop:16, fontSize:13, color:"#9a94ad", fontWeight:700 }}>next one coming…</div>
            : <button onClick={next} style={{ ...bigBtn, background:"#7C5CE0", width:"100%", marginTop:14 }}>Next →</button>)}
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 12, width: "100%" }}>⬅ Back to menu</button>
    </div>
  );
}

// ---- Missing Number: 5 × ? = 30 ----
function MathMissing({ facts, onHome }) {
  const advRef = useRef(null);
  const nextRef = useRef(() => {});
  useEffect(() => () => { if (advRef.current) clearTimeout(advRef.current); }, []);
  const [f, setF] = useState(() => srsPick(facts, (x) => x.key) || facts[0]);
  const [entry, setEntry] = useState("");
  const [result, setResult] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(0);

  if (!f) return <Center><div style={{fontSize:54}}>❓</div><h2>No facts picked</h2>
    <button onClick={onHome} style={{ ...bigBtn, background:"#7C5CE0", marginTop:16 }}>⬅ Back to menu</button></Center>;

  // hide the second operand: a op ? = ans
  const check = () => {
    if (result) return;
    const ok = entry.trim() !== "" && Number(entry) === f.b;
    setResult(ok ? "right" : "wrong");
    setDone((d)=>d+1);
    if (ok) { setScore((s)=>s+1); playCorrect(score); } else playSoftMiss();
    srsRecord(f.key, ok);
    recordEffort();
    if (ok) advRef.current = setTimeout(nextRef.current, 1200);
  };
  const next = () => {
    if (advRef.current) clearTimeout(advRef.current);
    setEntry(""); setResult(null); setF(srsPick(facts,(x)=>x.key,f.key)||facts[0]);
  };
  nextRef.current = next;

  return (
    <div>
      <Progress value={score} total={Math.max(done,1)} label={`✅ ${score} / ${done}`} />
      <div style={{ marginTop:14, background:"#fff", borderRadius:24, padding:"28px 20px", textAlign:"center",
        border:`4px solid ${result==="right"?C.leaf:result==="wrong"?"#F0A5A5":C.leaf}`, boxShadow:"0 8px 0 rgba(95,184,148,0.25)" }}>
        <div style={{ fontSize:40, fontWeight:800 }}>
          {f.a} {opSymbol[f.op]} <span style={{ color:C.berry }}>?</span> = {f.ans}
        </div>
        <input value={entry} onChange={(e)=>setEntry(e.target.value.replace(/[^0-9-]/g,""))}
          onKeyDown={(e)=>{ if(e.key==="Enter") result?next():check(); }}
          inputMode="numeric" placeholder="?" autoFocus
          style={{ ...inp, marginTop:16, textAlign:"center", fontSize:30, fontWeight:800, maxWidth:180,
            borderColor: result==="right"?C.leaf:result==="wrong"?"#F0A5A5":"#cfe3d6" }} />
        {result==="right" && <div style={{ marginTop:10, color:C.leaf, fontWeight:800, fontSize:18 }}>✓ Yes!</div>}
        {result==="wrong" && (
          <div style={{ marginTop:10 }}>
            <div style={{ color:C.berry, fontWeight:800 }}>It's</div>
            <div style={{ fontSize:30, fontWeight:800 }}>{f.b}</div>
          </div>
        )}
      </div>
      {!result
        ? <button onClick={check} disabled={!entry.trim()} style={{ ...bigBtn, background:C.leaf, width:"100%", marginTop:14, opacity:entry.trim()?1:0.5 }}>✓ Check</button>
        : (result === "right"
            ? <div style={{ textAlign:"center", marginTop:16, fontSize:13, color:"#9a94ad", fontWeight:700 }}>next one coming…</div>
            : <button onClick={next} style={{ ...bigBtn, background:"#7C5CE0", width:"100%", marginTop:14 }}>Next →</button>)}
      <button onClick={onHome} style={{ ...bigBtn, background:"#EBE5D8", color:C.ink, marginTop:12, width:"100%" }}>⬅ Back to menu</button>
    </div>
  );
}


// ============================================================
//  CAR MODE — eyes off, ears on.
//  Voice-driven drilling for the drive. Nothing is tapped while the
//  car is moving: it speaks the question, waits, speaks the answer,
//  and moves on. Slow answers are flagged afterwards, parked, and
//  fed straight into the same spaced-repetition memory the rest of
//  the app already uses.
// ============================================================

const OP_WORD = { "+": "plus", "-": "minus", "*": "times", "/": "divided by" };

// Promise-based speech so a session can be sequenced end to end.
const carSpeak = (text, lang) =>
  new Promise((resolve) => {
    if (!("speechSynthesis" in window) || !text) return resolve();
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    try {
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = lang;
      u.rate = lang === "zh-CN" ? 0.8 : 0.88;
      u.pitch = 1;
      const v = lang === "zh-CN" ? bestVoice : bestEnVoice;
      if (v) u.voice = v;
      u.onend = finish;
      u.onerror = finish;
      window.speechSynthesis.speak(u);
      // never let a dropped onend hang the whole session
      setTimeout(finish, 1400 + String(text).length * 140);
    } catch (e) { finish(); }
  });

const carWait = (ms) => new Promise((r) => setTimeout(r, ms));

const CAR_TIPS = [
  ["Three seconds is the whole test",
   "Under three seconds means he pulled it from memory. Longer means he worked it out — and that rep practised counting, not recall. Speed is the only way to tell from the driver's seat."],
  ["Fast or flag",
   "If he's slow, just give him the answer. No struggle, no shame. Mark it at the end and it comes back on its own."],
  ["Name the set out loud first",
   "“Today is the eights.” Random quizzing burns the drive re-asking the forty facts he already owns."],
  ["Four to six minutes",
   "Once a drive, not every drive. Short doses win, and they keep the car somewhere he wants to be."],
  ["Finish on three he knows",
   "Car Mode adds easy doubles at the end automatically. Always end winning."],
  ["The order that matters",
   "Doubles → near doubles → make ten → +9 → missing number → skip counting. Each one leans on the one before it."],
  ["Turn subtraction around",
   "Instead of “13 minus 6,” ask “what plus 6 makes 13?” Subtraction stops being a hundred new facts and becomes the same facts backwards."],
  ["One set at a time while he's learning it",
   "Mix sets only once he owns each of them separately. Interleaving is for holding on to things, not for picking them up."],
  ["Let him quiz you back",
   "And get some wrong. Catching Dad is worth more than anything the app just did."],
  ["License plates are free",
   "Add the digits. Or “make the biggest number you can.” No app required."],
];

function CarMode({ facts, onHome, carWords, carSentences }) {
  const { lessons: LESSONS, sentences: SENTENCES } = getVocab();
  const [phase, setPhase] = useState("setup");     // setup | run | review
  const hasMath = (facts || []).length > 0;
  const [deck, setDeck] = useState(() => {
    const saved = loadLS("car_deck", "math");
    // opened from the Chinese side (no math facts passed) — start on words
    return !hasMath && saved === "math" ? "words" : saved;
  });
  const [gap, setGap] = useState(() => loadLS("car_gap", 6));
  const [len, setLen] = useState(() => loadLS("car_len", 12));
  const [tips, setTips] = useState(false);

  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [reveal, setReveal] = useState(false);
  const [paused, setPaused] = useState(false);
  const [flagged, setFlagged] = useState({});
  const [secs, setSecs] = useState(0);
  const [markKey, setMarkKey] = useState(null);

  const cancelRef = useRef(false);
  const pauseRef = useRef(false);
  const wakeRef = useRef(null);
  useEffect(() => { pauseRef.current = paused; }, [paused]);
  useEffect(() => { saveLS("car_deck", deck); }, [deck]);
  useEffect(() => { saveLS("car_gap", gap); }, [gap]);
  useEffect(() => { saveLS("car_len", len); }, [len]);
  useEffect(() => () => { cancelRef.current = true; try { window.speechSynthesis.cancel(); } catch (e) {} }, []);

  useEffect(() => {
    if (phase !== "run") return;
    const t = setInterval(() => setSecs((x) => x + 1), 1000);
    return () => clearInterval(t);
  }, [phase]);

  // ---- the three decks ----
  // Respect the lesson selection made on the home screen — otherwise picking
  // "⭐ Starred Words" there would have no effect here.
  const words = useMemo(() => {
    if (Array.isArray(carWords) && carWords.length) return carWords.filter((w) => w && w.pinyin);
    return LESSONS.flatMap((l) => l.words || []).filter((w) => w && w.pinyin);
  }, [carWords, LESSONS.length]);

  const buildQueue = () => {
    const out = [];
    if (deck === "math") {
      // shakiest facts first — same weighting the rest of the app uses
      const ordered = srsOrder(facts, (f) => f.key).slice(0, Math.max(len * 3, 30));
      const seen = {};
      for (const f of shuffle(ordered)) {
        if (out.length >= len) break;
        if (seen[f.key]) continue;
        seen[f.key] = 1;
        out.push({
          key: f.key,
          show: f.a + " " + opSymbol[f.op] + " " + f.b,
          say: f.a + " " + OP_WORD[f.op] + " " + f.b,
          answer: String(f.ans),
          sayAnswer: String(f.ans),
          lang: "en-US",
        });
      }
      // finish strong: three easy doubles, never counted against him
      for (let n = 2; n <= 4; n++) {
        out.push({
          key: "math:+:" + n + ":" + n, show: n + " + " + n, say: n + " plus " + n,
          answer: String(n + n), sayAnswer: String(n + n), lang: "en-US", closer: true,
        });
      }
    } else if (deck === "words") {
      const wod = wodActive();
      const pool = shuffle(srsOrder(words, (w) => w.pinyin).slice(0, Math.max(len * 3, 24)));
      if (wod) pool.unshift(wod);
      const seen = {};
      for (const w of pool) {
        if (out.length >= len) break;
        if (seen[w.pinyin]) continue;
        seen[w.pinyin] = 1;
        out.push({
          key: w.pinyin,
          show: w.en,
          say: w.en,
          answer: w.pinyin,
          sayAnswer: w.hanzi || w.pinyin,
          lang: "en-US", answerLang: "zh-CN",
        });
      }
    } else {
      const src = (Array.isArray(carSentences) && carSentences.length) ? carSentences : (SENTENCES || []);
      const pool = shuffle(src).slice(0, len);
      for (const sn of pool) {
        out.push({
          key: "sen:" + (sn.pinyin || ""),
          show: sn.pinyin,
          say: sn.hanzi || sn.pinyin,
          sayLang: "zh-CN",
          answer: sn.en,
          sayAnswer: sn.en,
          lang: "zh-CN", answerLang: "en-US",
          listen: true,
        });
      }
    }
    return out;
  };

  const holdPause = async () => { while (pauseRef.current && !cancelRef.current) await carWait(180); };

  const runLoop = async (q) => {
    for (let i = 0; i < q.length; i++) {
      if (cancelRef.current) return;
      setIdx(i); setReveal(false);
      await holdPause(); if (cancelRef.current) return;
      const it = q[i];
      await carSpeak(it.say, it.sayLang || it.lang);
      if (it.listen) { await carWait(600); await carSpeak(it.say, it.sayLang || it.lang); }
      await holdPause(); if (cancelRef.current) return;
      await carWait(gap * 1000);
      await holdPause(); if (cancelRef.current) return;
      setReveal(true);
      await carSpeak(it.sayAnswer, it.answerLang || it.lang);
      // a 2s window to tap "tricky" while the answer is still fresh —
      // far easier than trying to remember which ones were hard at the end
      setMarkKey(it.key);
      await carWait(2000);
      setMarkKey(null);
    }
    if (!cancelRef.current) { release(); setPhase("review"); }
  };

  const release = () => {
    cancelRef.current = true;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    try { if (wakeRef.current) wakeRef.current.release(); } catch (e) {}
    wakeRef.current = null;
  };

  const start = async () => {
    const q = buildQueue();
    if (!q.length) return;
    setQueue(q); setIdx(0); setReveal(false); setFlagged({}); setSecs(0);
    setPaused(false); pauseRef.current = false; cancelRef.current = false;
    setPhase("run");
    primeSpeech();
    try { if (navigator.wakeLock) wakeRef.current = await navigator.wakeLock.request("screen"); } catch (e) {}
    await carSpeak("Ready.", "en-US");
    runLoop(q);
  };

  const stopNow = () => { release(); setPhase(idx > 0 ? "review" : "setup"); };

  const saveReview = () => {
    const asked = queue.slice(0, Math.min(queue.length, idx + 1));
    asked.forEach((it) => {
      if (it.closer) return;                       // the confidence closers never score
      if (String(it.key).indexOf("sen:") === 0) return;
      srsRecord(it.key, !flagged[it.key]);
    });
    recordEffort();
    markPracticedToday();
    setPhase("setup");
  };

  const decks = [
    { id: "math",  emoji: "🔢", name: "Math facts", desc: "From the sets you picked" },
    { id: "words", emoji: "🦊", name: "Chinese words", desc: "English out → he says the Chinese" },
    { id: "sent",  emoji: "💬", name: "Chinese sentences", desc: "He hears it → says what it meant" },
  ].filter((d) => d.id !== "math" || hasMath);

  // ---------------- setup ----------------
  if (phase === "setup") {
    const empty = deck === "math" && !facts.length;
    return (
      <div>
        <div style={{ background: "#fff", borderRadius: 22, border: "3px solid #cfe3f5", padding: "16px 16px 18px", marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
            <span style={{ fontSize: 30 }}>🚗</span>
            <div style={{ fontWeight: 800, fontSize: 20 }}>Car Mode</div>
          </div>
          <div style={{ fontSize: 13.5, color: "#7a7391", lineHeight: 1.5 }}>
            It talks, he answers out loud, nobody looks at the screen. Phone in the cradle. You'll mark the slow ones at the end, parked.
          </div>
        </div>

        <div style={{ fontSize: 11, fontWeight: 800, color: "#8b83a8", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 7 }}>What to drill</div>
        <div style={{ display: "grid", gap: 9, marginBottom: 16 }}>
          {decks.map((d) => {
            const on = deck === d.id;
            return (
              <button key={d.id} onClick={() => setDeck(d.id)}
                style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left", background: "#fff",
                  border: on ? "4px solid #3BA0C8" : "3px solid #e7e0d0", borderRadius: 18, padding: "12px 14px",
                  fontFamily: "inherit", color: C.ink, cursor: "pointer" }}>
                <span style={{ fontSize: 28 }}>{d.emoji}</span>
                <span>
                  <span style={{ display: "block", fontWeight: 800, fontSize: 16 }}>{d.name}</span>
                  <span style={{ display: "block", fontSize: 12.5, color: "#7a7391", marginTop: 1 }}>{d.desc}</span>
                </span>
              </button>
            );
          })}
        </div>

        <div style={{ fontSize: 11, fontWeight: 800, color: "#8b83a8", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 7 }}>
          Thinking time before the answer
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
          {[3, 6, 10].map((g) => (
            <button key={g} onClick={() => setGap(g)}
              style={{ ...chip, flex: 1, padding: "18px 6px", fontSize: 20, fontWeight: 800, borderRadius: 16,
                background: gap === g ? "#3BA0C8" : "#fff", color: gap === g ? "#fff" : C.ink,
                borderColor: gap === g ? "#3BA0C8" : "#e3ddcf" }}>{g}s</button>
          ))}
        </div>
        <div style={{ fontSize: 12, color: "#7a7391", marginBottom: 16 }}>
          Longer gaps give him room to think and say it out loud; shorter ones build instant recall. Start at 6s and tighten as he gets quicker.
        </div>

        <div style={{ fontSize: 11, fontWeight: 800, color: "#8b83a8", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 7 }}>How long</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
          {[[8, "~3 min"], [12, "~5 min"], [18, "~7 min"]].map(([n, t]) => (
            <button key={n} onClick={() => setLen(n)}
              style={{ ...chip, flex: 1, padding: "11px 6px", fontSize: 14,
                background: len === n ? "#3BA0C8" : "#fff", color: len === n ? "#fff" : C.ink,
                borderColor: len === n ? "#3BA0C8" : "#e3ddcf" }}>{n} · {t}</button>
          ))}
        </div>

        <button onClick={start} disabled={empty}
          style={{ ...bigBtn, background: empty ? "#c9c3d8" : "#3BA0C8", color: "#fff", width: "100%",
            cursor: empty ? "not-allowed" : "pointer" }}>
          ▶︎ Start
        </button>
        {empty && (
          <div style={{ textAlign: "center", marginTop: 10, color: C.berry, fontWeight: 700, fontSize: 14 }}>
            Pick at least one math set on the menu first.
          </div>
        )}

        <button onClick={() => setTips((t) => !t)}
          style={{ ...ghostBtn, width: "100%", marginTop: 14 }}>
          {tips ? "▴ Hide the coaching notes" : "💡 Coaching notes for the driver"}
        </button>
        {tips && (
          <div style={{ marginTop: 12 }}>
            <div style={{ background: C.ink, color: "#fff", borderRadius: 18, padding: "14px 16px", marginBottom: 10 }}>
              <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 5 }}>The one thing</div>
              <div style={{ fontSize: 14, lineHeight: 1.55 }}>
                If he works the answer out, the rep doesn't count. Automaticity means pulling it straight from memory — and speed is the only way you can tell the difference while driving.
              </div>
            </div>
            {CAR_TIPS.map((t, i) => (
              <div key={i} style={{ background: "#fff", borderRadius: 16, border: "2px solid #e7e0d0",
                borderLeft: "6px solid " + (i % 2 ? C.leaf : C.fox), padding: "11px 14px", marginBottom: 8 }}>
                <div style={{ fontWeight: 800, fontSize: 15 }}>{t[0]}</div>
                <div style={{ fontSize: 13.5, color: "#7a7391", marginTop: 3, lineHeight: 1.5 }}>{t[1]}</div>
              </div>
            ))}
            <div style={{ background: "#FFF1EC", borderRadius: 16, border: "2px solid " + C.fox, padding: "12px 14px" }}>
              <div style={{ fontWeight: 800, fontSize: 15 }}>Worth remembering</div>
              <div style={{ fontSize: 13.5, color: "#7a7391", marginTop: 3, lineHeight: 1.5 }}>
                The car is a relationship before it's a classroom. If every drive turns into a test he'll start dreading it. Skip the days he isn't up for it — the drilling is worth almost nothing next to him wanting to be in there with you.
              </div>
            </div>
          </div>
        )}

        <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>
          ⬅ Back to menu
        </button>
      </div>
    );
  }

  // ---------------- running ----------------
  if (phase === "run") {
    const it = queue[idx] || queue[0];
    const mm = Math.floor(secs / 60), ss = String(secs % 60).length < 2 ? "0" + (secs % 60) : String(secs % 60);
    return (
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 800, fontSize: 14, color: "#8b83a8", marginBottom: 8 }}>
          <span>{idx + 1} / {queue.length}</span><span>⏱ {mm}:{ss}</span>
        </div>
        <div style={{ height: 8, background: "#e7e0d0", borderRadius: 6, overflow: "hidden", marginBottom: 16 }}>
          <div style={{ width: ((idx + 1) / queue.length) * 100 + "%", height: "100%", background: "#3BA0C8", transition: "width .3s" }} />
        </div>

        <div style={{ background: C.ink, borderRadius: 28, padding: "40px 18px", minHeight: 260,
          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
          {it.closer && (
            <div style={{ background: C.leaf, color: "#fff", borderRadius: 20, padding: "4px 14px", fontSize: 12, fontWeight: 800, marginBottom: 12 }}>
              finish strong
            </div>
          )}
          {it.listen && !reveal ? (
            <div style={{ fontSize: 60 }}>🔊</div>
          ) : (
            <div style={{ fontSize: it.show && it.show.length > 18 ? 30 : 48, fontWeight: 800, color: "#fff", lineHeight: 1.2 }}>
              {it.show}
            </div>
          )}
          {reveal ? (
            <div style={{ marginTop: 16, fontSize: 34, fontWeight: 800, color: C.sun, lineHeight: 1.25 }}>{it.answer}</div>
          ) : (
            <div style={{ marginTop: 14, fontSize: 15, fontWeight: 700, color: "#b9b2cf" }}>
              {paused ? "paused" : "say it out loud…"}
            </div>
          )}
        </div>

        {/* big "that was tricky" button — live for ~2s after each answer,
            so you can flag it while it's fresh instead of recalling later */}
        <button
          onClick={() => { if (markKey) setFlagged((f) => { const n = Object.assign({}, f); n[markKey] = true; return n; }); }}
          disabled={!markKey}
          style={{
            width: "100%",
            marginTop: 16,
            padding: "26px 12px",
            fontSize: 22,
            fontWeight: 800,
            borderRadius: 22,
            fontFamily: "inherit",
            cursor: markKey ? "pointer" : "default",
            border: "4px solid " + (markKey ? (flagged[markKey] ? C.berry : C.sun) : "#e7e0d0"),
            background: markKey ? (flagged[markKey] ? "#FFECE4" : "#FFF7E6") : "#F4F1EA",
            color: markKey ? C.ink : "#bdb6a6",
            transition: "background .15s",
          }}
        >
          {markKey
            ? (flagged[markKey] ? "⭐ marked tricky" : "⭐ That was tricky")
            : "⭐ …"}
        </button>

        <div style={{ display: "flex", gap: 12, marginTop: 12 }}>
          <button onClick={() => setPaused((p) => !p)}
            style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, flex: 1, padding: "24px 10px", fontSize: 21, borderRadius: 20 }}>
            {paused ? "▶︎ Resume" : "⏸ Pause"}
          </button>
          <button onClick={stopNow}
            style={{ ...bigBtn, background: C.berry, color: "#fff", flex: 1, padding: "24px 10px", fontSize: 21, borderRadius: 20 }}>
            ■ End
          </button>
        </div>
        <div style={{ textAlign: "center", fontSize: 13, color: "#8b83a8", marginTop: 14, fontWeight: 700 }}>
          Tap ⭐ right after a slow one — or leave it and mark them all at the end.
        </div>
      </div>
    );
  }

  // ---------------- review ----------------
  const asked = queue.slice(0, Math.min(queue.length, idx + 1));
  const nFlag = Object.keys(flagged).filter((k) => flagged[k]).length;
  return (
    <div>
      <div style={{ background: "#fff", borderRadius: 22, border: "3px solid #cfe3f5", padding: "16px", marginBottom: 14 }}>
        <div style={{ fontWeight: 800, fontSize: 19, marginBottom: 4 }}>Which ones were slow?</div>
        <div style={{ fontSize: 13.5, color: "#7a7391", lineHeight: 1.5 }}>
          Anything much past three seconds. Tap it and it comes back more often on its own. Do this parked.
        </div>
      </div>

      <div style={{ display: "grid", gap: 8, marginBottom: 16 }}>
        {asked.map((it, i) => {
          const on = !!flagged[it.key];
          return (
            <button key={it.key + "-" + i}
              onClick={() => setFlagged((f) => { const n = Object.assign({}, f); n[it.key] = !n[it.key]; return n; })}
              style={{ display: "flex", alignItems: "center", gap: 11, textAlign: "left",
                background: on ? "#FFECE4" : "#fff", border: on ? "3px solid " + C.berry : "3px solid #e7e0d0",
                borderRadius: 16, padding: "11px 13px", fontFamily: "inherit", color: C.ink, cursor: "pointer" }}>
              <span style={{ fontSize: 20 }}>{on ? "🐌" : "⚡"}</span>
              <span style={{ fontWeight: 800, fontSize: 16, flex: 1 }}>{it.show}</span>
              <span style={{ fontSize: 14, color: "#7a7391", fontWeight: 700, maxWidth: 150, textAlign: "right" }}>{it.answer}</span>
            </button>
          );
        })}
      </div>

      <button onClick={saveReview} style={{ ...bigBtn, background: C.leaf, color: "#fff", width: "100%" }}>
        {nFlag ? "Save — " + nFlag + " to practise more" : "All quick! Save and finish"}
      </button>

      <div style={{ background: "#fff", borderRadius: 18, border: "3px solid " + C.sun, padding: "13px 15px", marginTop: 14 }}>
        <div style={{ fontWeight: 800, fontSize: 16 }}>🔁 Now let him quiz you</div>
        <div style={{ fontSize: 13.5, color: "#7a7391", marginTop: 3, lineHeight: 1.5 }}>
          Hand it back to Sam for two minutes and get some wrong. Catching you is worth more than anything the app just did.
        </div>
      </div>
    </div>
  );
}


// Browser Back should return to the app's menu, not navigate away from the
// page (which used to lose the whole session). Each screen change away from
// "home" pushes one history entry; Back pops it and we go home.
function useBackToMenu(screen, setScreen) {
  useEffect(() => {
    if (screen === "home") return;
    window.history.pushState({ samScreen: screen }, "");
    const onPop = () => setScreen("home");
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, [screen, setScreen]);
}


// The app used to pull only once on mount. Devices left open (a phone in a
// pocket, a Chromebook tab) therefore never saw changes made elsewhere, which
// looked exactly like "starring didn't sync". Re-pull whenever the tab becomes
// visible again, and flush any pending push before the page is hidden/closed.
function useLiveSync(applyRemote, setStatus) {
  useEffect(() => {
    const pull = () => {
      pullRemoteProgress().then((remote) => {
        mergeRemoteProgress(remote);
        markPulled();
        if (remote) { applyRemote(); setStatus && setStatus("synced"); }
      });
    };
    const onVisible = () => {
      if (document.visibilityState === "visible") pull();
      else flushSync();          // leaving: push now, don't wait out the debounce
    };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", pull);
    window.addEventListener("pagehide", flushSync);
    const poll = setInterval(() => {
      if (document.visibilityState === "visible") pull();
    }, 60000);                   // and a quiet re-check once a minute
    return () => {
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", pull);
      window.removeEventListener("pagehide", flushSync);
      clearInterval(poll);
    };
  }, [applyRemote, setStatus]);
}

function LanguageShell() {
  const [lang, setLang] = useState(() => loadLS("lang", "zh"));
  useEffect(() => { saveLS("lang", lang); }, [lang]);
  // cycle: Chinese -> English -> Math -> Chinese
  if (lang === "en") return <EnglishApp onSwitchLang={() => setLang("math")} />;
  if (lang === "math") return <MathApp onSwitchLang={() => setLang("zh")} />;
  return <ChineseApp onSwitchLang={() => setLang("en")} />;
}

function AppLoader() {
  const [state, setState] = useState("loading"); // loading | ready | error
  const [detail, setDetail] = useState("");
  useEffect(() => {
    let alive = true;
    // Fetch vocab here directly so there's no dependency on other scripts.
    // Fallback must load BOTH files, or the English side ends up with no words.
    const p = window.__VOCAB_PROMISE__ ||
      Promise.all([
        fetch("vocab.json?t=" + Date.now()).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status + " loading vocab.json");
          return r.json();
        }),
        fetch("words-en.json?t=" + Date.now())
          .then(function (r) { return r.ok ? r.json() : { lists: [] }; })
          .catch(function () { return { lists: [] }; })
      ]).then(function (both) { var v = both[0]; v.english = both[1]; return v; });
    p.then(function (v) {
        if (!alive) return;
        if (!v || !v.lessons) throw new Error("vocab.json loaded but has no lessons");
        window.__VOCAB__ = v;
        setState("ready");
      })
      .catch(function (e) {
        if (!alive) return;
        setDetail(String(e && e.message ? e.message : e));
        setState("error");
      });
    return function () { alive = false; };
  }, []);

  if (state === "loading") {
    return (
      <div className="loading">
        <div style={{ fontSize: 54 }}>🦊</div>
        <div style={{ fontWeight: 700, marginTop: 10 }}>Loading Sam's Chinese Quest…</div>
      </div>
    );
  }
  if (state === "error") {
    return (
      <div className="loading">
        <div style={{ fontSize: 54 }}>😵</div>
        <div style={{ fontWeight: 700, marginTop: 10 }}>Couldn't load the vocabulary.</div>
        <div style={{ marginTop: 6, color: "#7a7391", fontSize: 13, maxWidth: 320, textAlign: "center" }}>{detail || "Check your connection and refresh."}</div>
      </div>
    );
  }
  return <LanguageShell />;
}

// Resilient mount: in-browser Babel executes this script asynchronously,
// and the initial createRoot/render could silently fail to attach on load
// (leaving the app stuck on the "Loading" placeholder). Guard the mount so it
// only runs once the #root element exists, retry until it does, and defer to
// the next frame so it never races Babel's auto-run / DOM readiness.
(function mountApp() {
  var el = document.getElementById("root");
  if (!el || typeof ReactDOM === "undefined" || !ReactDOM.createRoot) {
    return requestAnimationFrame(mountApp);
  }
  try {
    var root = ReactDOM.createRoot(el);
    root.render(<AppLoader />);
  } catch (err) {
    el.innerHTML =
      '<div style="padding:24px;font-family:sans-serif;color:#b00">' +
      'Failed to start the app: ' + (err && err.message ? err.message : err) +
      '</div>';
    console.error("Mount failed:", err);
  }
})();
</script>
</body>
</html>

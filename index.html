          <button onClick={buildPreview} disabled={!bulk.trim() || looking}
            style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 10, fontSize: 15, padding: "12px", opacity: bulk.trim() && !looking ? 1 : 0.5 }}>
            {looking ? "Looking them up…" : "🔎 Look them up"}
          </button>

          {preview && (
            <div style={{ marginTop: 14 }}>
              <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 8 }}>
                Check these, then add {preview.length === 1 ? "it" : "them"}
              </div>
              {preview.map((row, i) => (
                <div key={i} style={{ background: "#F7FBF8", border: "2px solid #dfeee6", borderRadius: 14, padding: "10px 12px", marginBottom: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                    <div style={{ fontSize: 22, fontWeight: 800, minWidth: 60 }}>{row.hanzi || "—"}</div>
                    <button onClick={() => speak({ hanzi: row.hanzi, pinyin: row.pinyin })}
                      style={{ ...ghostBtn, padding: "5px 10px", fontSize: 13 }}>🔊</button>
                    <button onClick={() => setPreview(preview.filter((_, k) => k !== i))}
                      style={{ ...ghostBtn, padding: "5px 10px", fontSize: 13, marginLeft: "auto", color: C.berry, borderColor: "#f0cfd8" }}>remove</button>
                  </div>
                  <input value={row.pinyin} placeholder="pinyin"
                    onChange={(e) => setPreview(preview.map((r, k) => (k === i ? Object.assign({}, r, { pinyin: e.target.value }) : r)))}
                    style={{ ...inp, fontSize: 14, padding: "8px 10px", marginBottom: 6 }} />
                  <input value={row.en} placeholder="what it means in English"
                    onChange={(e) => setPreview(preview.map((r, k) => (k === i ? Object.assign({}, r, { en: e.target.value }) : r)))}
                    style={{ ...inp, fontSize: 14, padding: "8px 10px" }} />
                  {row.note && (
                    <div style={{ fontSize: 11.5, color: "#a8752f", marginTop: 6, fontWeight: 700 }}>⚠ {row.note}</div>
                  )}
                </div>
              ))}
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={confirmPreview}
                  style={{ ...bigBtn, background: C.leaf, flex: 2, fontSize: 15, padding: "12px" }}>
                  ✓ Add {preview.length} to the word list
                </button>
                <button onClick={() => setPreview(null)}
                  style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, flex: 1, fontSize: 15, padding: "12px" }}>
                  Back
                </button>
              </div>
            </div>
          )}
          {added > 0 && (
            <div style={{ marginTop: 10, fontWeight: 700, color: C.leaf, fontSize: 14 }}>
              Added {added} word{added === 1 ? "" : "s"} to “Words We Added”.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ---- Word of the Day drill: 4 short steps, ~1 minute ----
function WordOfDay({ word, allWords, sentences, onHome }) {
  const [step, setStep] = useState(0);
  const [picked, setPicked] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [earned, setEarned] = useState(false);

  // step 2 needs distractors
  const options = useMemo(() => {
    const wrong = shuffle(allWords.filter((w) => w.pinyin !== word.pinyin)).slice(0, 3);
    return shuffle([word, ...wrong]);
  }, [word, allWords.length]);

  // step 4+: every sentence we have that actually uses this word (max 3),
  // shortest first so he starts easy and builds up.
  const examples = useMemo(() => {
    const hz = word.hanzi || "";
    if (!hz) return [];
    return sentences
      .filter((s) => (s.hanzi || "").includes(hz))
      .sort((a, b) => (a.hanzi || "").length - (b.hanzi || "").length)
      .slice(0, 3);
  }, [word, sentences.length]);

  // Order matters: make him RETRIEVE the word from memory before we ever
  // show or speak it. Testing yourself first is far more effective than
  // being handed the answer and then repeating it.
  // Sentence work runs input-first: he hears real sentences, shows he
  // understood them, repeats one back, and only then invents his own.
  // Understanding has to come before producing — asking a 7-year-old to
  // build a sentence with a word he has only ever met in isolation is
  // asking him to do the hardest step first.
  // With examples: hear them, show he understood, echo one, then invent.
  // Without: at minimum still ask him to build a sentence, and say plainly
  // that the listening examples are missing rather than quietly dropping
  // four steps and leaving a one-minute drill that feels finished.
  // Individual sentences first, THEN the all-together recap — hearing them
  // one at a time builds up to the run-through rather than front-loading it.
  // Short phrases sit between the single word and full sentences — a much
  // gentler rung than jumping straight from "几" to a whole sentence.
  const phrases = (word.phrases || []).slice(0, 3);

  const steps = ["Say it", "Check it", "Hear it"]
    .concat(examples.length ? examples.map((_, k) => "Meaning " + (k + 1)).concat(["Listen"]) : [])
    .concat(phrases.map((_, k) => "Phrase " + (k + 1)))
    .concat(examples.length ? ["Say it back"] : [])
    .concat(["Make your own"]);
  const last = steps.length - 1;

  // The listening step should play by itself — he shouldn't have to hunt for
  // a button before he can hear the word.
  useEffect(() => {
    const label = steps[step];
    if (label === "Hear it") {
      const t = setTimeout(() => speak(word), 250);
      return () => clearTimeout(t);
    }
    // every sentence step opens by playing the Chinese, unprompted —
    // he should never have to hunt for a button before he can hear it
    if (label === "Listen") {
      const timers = examples.map((ex, k) =>
        setTimeout(() => speak({ hanzi: ex.hanzi, pinyin: ex.pinyin }), 300 + k * 2600)
      );
      return () => timers.forEach(clearTimeout);
    }
    // NB: "Phrase" steps deliberately do NOT auto-play — he has to produce it first.
    if (label && (label.indexOf("Meaning") === 0 || label === "Say it back")) {
      const ex = label === "Say it back" ? examples[0] : examples[Number(label.split(" ")[1]) - 1];
      if (!ex) return;
      const t = setTimeout(() => speak({ hanzi: ex.hanzi, pinyin: ex.pinyin }), 300);
      return () => clearTimeout(t);
    }
  }, [step, word]);

  const finish = () => {
    srsRecord(word.pinyin, true);
    recordEffort();
    if (markWodDone()) setEarned(true);
    setStep(steps.length);   // done screen
  };

  const advance = () => {
    setPicked(null);
    setRevealed(false);
    if (step >= last) finish();
    else setStep(step + 1);
  };

  const goBack = () => {
    if (step <= 0) return;
    setPicked(null);
    setRevealed(false);
    setStep(step - 1);
  };

  // ---- done ----
  if (step >= steps.length)
    return (
      <Center>
        <div style={{ fontSize: 64 }}>🌟</div>
        <h2 style={{ margin: "8px 0" }}>Nailed it!</h2>
        <div style={{ fontSize: 34, fontWeight: 800, color: C.fox }}>{word.pinyin}</div>
        <div style={{ fontSize: 17, color: "#7a7391", marginTop: 2 }}>{word.en}</div>
        {earned && (
          <div style={{ marginTop: 14, fontWeight: 800, color: C.sun, fontSize: 17 }}>
            🪙 +1 chip for word of the day!
          </div>
        )}
        <div style={{ marginTop: 12, fontSize: 12, color: "#9a94ad", maxWidth: 300, textAlign: "center" }}>
          This word will keep popping up in the other games today.
        </div>
        <button onClick={onHome} style={{ ...bigBtn, background: C.fox, marginTop: 18 }}>⬅ Back to menu</button>
      </Center>
    );

  const label = steps[step];

  return (
    <div>
      <GameTitle>Word of the Day · {label}</GameTitle>

      {/* progress pips — tappable, so he can jump back to any earlier step */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 14 }}>
        <button
          onClick={goBack}
          disabled={step === 0}
          title="Previous step"
          style={{ ...ghostBtn, padding: "4px 9px", fontSize: 14, lineHeight: 1,
            opacity: step === 0 ? 0.3 : 1, cursor: step === 0 ? "default" : "pointer" }}
        >
          ‹
        </button>
        <div style={{ display: "flex", gap: 6 }}>
          {steps.map((_, k) => (
            <button
              key={k}
              onClick={() => { if (k <= step) { setPicked(null); setRevealed(false); setStep(k); } }}
              title={steps[k]}
              style={{ width: 26, height: 12, padding: 0, border: "none", background: "transparent",
                cursor: k <= step ? "pointer" : "default" }}
            >
              <div style={{ width: 26, height: 6, borderRadius: 4,
                background: k <= step ? C.fox : "#e7e0d0" }} />
            </button>
          ))}
        </div>
      </div>

      {/* ---- step 1: meet it ---- */}
      {label === "Check it" && (
        <div>
          <div style={{ background: "#fff", borderRadius: 28, padding: "34px 20px", textAlign: "center",
            border: `4px solid ${C.fox}`, boxShadow: "0 10px 0 rgba(232,112,58,0.3)" }}>
            <div style={{ fontSize: 64 }}>{word.emoji || "⭐"}</div>
            <div style={{ fontSize: 40, fontWeight: 800, color: C.fox, marginTop: 8 }}>{word.pinyin}</div>
            <div style={{ fontSize: 20, color: "#7a7391", marginTop: 4 }}>{word.en}</div>
            <button onClick={() => speak(word)} style={{ ...bigBtn, background: C.sky, marginTop: 16, padding: "12px 26px" }}>
              🔊 Hear it
            </button>
          </div>
          <button onClick={advance} style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14 }}>
            🗣️ Said it again — next
          </button>
        </div>
      )}

      {/* ---- step 2: hear it and pick (plays by itself on arrival) ---- */}
      {label === "Hear it" && (
        <div>
          <div style={{ background: "#fff", borderRadius: 24, padding: "28px 20px", textAlign: "center",
            border: `4px solid ${C.leaf}`, boxShadow: "0 8px 0 rgba(95,184,148,0.3)" }}>
            <button onClick={() => speak(word)} style={{ ...bigBtn, background: C.sky, fontSize: 20, padding: "16px 30px" }}>
              🔊 Play again
            </button>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
            {options.map((opt, idx) => {
              let bg = "#fff", bd = "#e3ddcf", cl = C.ink;
              if (picked) {
                if (opt.pinyin === word.pinyin) { bg = C.leaf; bd = C.leaf; cl = "#fff"; }
                else if (opt.pinyin === picked.pinyin) { bg = "#F4A7A7"; bd = "#F4A7A7"; cl = "#fff"; }
              }
              return (
                <button key={idx}
                  onClick={() => {
                    if (picked) return;
                    setPicked(opt);
                    const ok = opt.pinyin === word.pinyin;
                    ok ? playCorrect(0) : playSoftMiss();
                    setTimeout(advance, 1100);
                  }}
                  style={{ ...bigBtn, background: bg, color: cl, border: `3px solid ${bd}`, fontSize: 17, padding: "14px 8px" }}>
                  {opt.emoji} {opt.en}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* ---- step 3: recall and say ---- */}
      {label === "Say it" && (
        <div>
          <div style={{ background: "#fff", borderRadius: 28, padding: "34px 20px", textAlign: "center",
            border: `4px solid ${C.berry}`, boxShadow: "0 10px 0 rgba(214,90,110,0.25)" }}>
            <div style={{ fontSize: 44 }}>{word.emoji || "⭐"}</div>
            <div style={{ fontSize: 30, fontWeight: 800, marginTop: 8 }}>{word.en}</div>
            {revealed && (
              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 34, fontWeight: 800, color: C.fox }}>{word.pinyin}</div>
              </div>
            )}
          </div>
          {!revealed ? (
            <button onClick={() => { setRevealed(true); speak(word); recordSpoken(); }}
              style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14 }}>
              🗣️ I said it — check
            </button>
          ) : (
            <button onClick={advance} style={{ ...bigBtn, background: C.sky, width: "100%", marginTop: 14 }}>
              Next →
            </button>
          )}
        </div>
      )}

      {/* ---- short phrases: bridge between one word and a whole sentence ---- */}
      {label.indexOf("Phrase") === 0 && (() => {
        const ph = phrases[Number(label.split(" ")[1]) - 1];
        if (!ph) return null;
        return (
          <div>
            <div style={{ background: "#fff", borderRadius: 24, padding: "28px 20px", textAlign: "center",
              border: `4px solid ${C.sun}`, boxShadow: "0 8px 0 rgba(246,196,69,0.28)" }}>
              <div style={{ fontSize: 12, color: "#9a94ad", fontWeight: 800, marginBottom: 10 }}>
                Say this in Chinese
              </div>
              <div style={{ fontSize: 26, fontWeight: 800, lineHeight: 1.3 }}>{ph.en}</div>
              {revealed && (
                <div style={{ marginTop: 16 }}>
                  <div style={{ fontSize: 26, fontWeight: 800, color: C.fox }}>{ph.pinyin}</div>
                  <button onClick={() => speak({ hanzi: ph.hanzi, pinyin: ph.pinyin })}
                    style={{ ...ghostBtn, marginTop: 10 }}>🔊 Hear it again</button>
                </div>
              )}
            </div>
            {!revealed ? (
              <button
                onClick={() => { setRevealed(true); speak({ hanzi: ph.hanzi, pinyin: ph.pinyin }); recordSpoken(); }}
                style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14 }}>
                🗣️ I said it — check
              </button>
            ) : (
              <button onClick={advance} style={{ ...bigBtn, background: C.sky, width: "100%", marginTop: 14 }}>
                Next →
              </button>
            )}
          </div>
        );
      })()}

      {/* ---- "Use it" steps: say each real sentence, then check ---- */}
      {label === "Listen" && (
        <div>
          <div style={{ background: "#fff", borderRadius: 24, padding: "26px 20px", textAlign: "center",
            border: `4px solid ${C.sky}`, boxShadow: "0 8px 0 rgba(107,169,214,0.3)" }}>
            <div style={{ fontSize: 12, color: "#9a94ad", fontWeight: 800, marginBottom: 10 }}>
              Just listen — {examples.length === 1 ? "one sentence" : examples.length + " sentences"} using {word.pinyin}
            </div>
            <div style={{ fontSize: 58 }}>👂</div>
            <div style={{ fontSize: 15, color: "#7a7391", marginTop: 10, lineHeight: 1.5 }}>
              Nothing to answer yet. Hear the word doing its job in a real sentence.
            </div>
            <button
              onClick={() => examples.forEach((ex, k) =>
                setTimeout(() => speak({ hanzi: ex.hanzi, pinyin: ex.pinyin }), k * 2600))}
              style={{ ...ghostBtn, marginTop: 14 }}>🔊 Play them again</button>
          </div>
          <button onClick={advance} style={{ ...bigBtn, background: C.sky, width: "100%", marginTop: 14 }}>
            Got it →
          </button>
        </div>
      )}

      {/* ---- what did that mean? comprehension before production ---- */}
      {label.indexOf("Meaning") === 0 && (() => {
        const ex = examples[Number(label.split(" ")[1]) - 1];
        if (!ex) return null;
        return (
          <div>
            <div style={{ background: "#fff", borderRadius: 24, padding: "26px 20px", textAlign: "center",
              border: `4px solid ${C.leaf}`, boxShadow: "0 8px 0 rgba(95,184,148,0.3)" }}>
              <div style={{ fontSize: 12, color: "#9a94ad", fontWeight: 800, marginBottom: 10 }}>
                What did that mean?
              </div>
              <button onClick={() => speak({ hanzi: ex.hanzi, pinyin: ex.pinyin })}
                style={{ ...bigBtn, background: C.sky, padding: "14px 26px" }}>🔊 Hear it again</button>
              {revealed && (
                <div style={{ marginTop: 16 }}>
                  <div style={{ fontSize: 19, fontWeight: 800, lineHeight: 1.4 }}>{ex.en}</div>
                  <div style={{ fontSize: 16, color: C.fox, fontWeight: 800, marginTop: 6 }}>{ex.pinyin}</div>
                </div>
              )}
            </div>
            {!revealed ? (
              <div>
                <button onClick={() => { setRevealed(true); recordSpoken(); }}
                  style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14 }}>
                  🗣️ He said what it meant — check
                </button>
                <div style={{ textAlign: "center", fontSize: 12, color: "#9a94ad", marginTop: 8 }}>
                  Roughly right counts. This is understanding, not translating.
                </div>
              </div>
            ) : (
              <button onClick={advance} style={{ ...bigBtn, background: C.sky, width: "100%", marginTop: 14 }}>
                Next →
              </button>
            )}
          </div>
        );
      })()}

      {/* ---- echo: put the sentence in his mouth before he has to build one ---- */}
      {label === "Say it back" && (() => {
        const ex = examples[0];
        if (!ex) return null;
        return (
          <div>
            <div style={{ background: "#fff", borderRadius: 24, padding: "26px 20px", textAlign: "center",
              border: `4px solid ${C.sun}`, boxShadow: "0 8px 0 rgba(246,196,69,0.35)" }}>
              <div style={{ fontSize: 12, color: "#9a94ad", fontWeight: 800, marginBottom: 10 }}>
                Say it back, exactly
              </div>
              <div style={{ fontSize: 46 }}>🦜</div>
              <button onClick={() => speak({ hanzi: ex.hanzi, pinyin: ex.pinyin })}
                style={{ ...bigBtn, background: C.sky, padding: "14px 26px", marginTop: 12 }}>🔊 Play it</button>
              {revealed && (
                <div style={{ fontSize: 19, fontWeight: 800, color: C.fox, marginTop: 14, lineHeight: 1.35 }}>
                  {ex.pinyin}
                </div>
              )}
            </div>
            {!revealed ? (
              <button onClick={() => { setRevealed(true); recordSpoken(); }}
                style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14 }}>
                🗣️ He said it — check
              </button>
            ) : (
              <button onClick={advance} style={{ ...bigBtn, background: C.sky, width: "100%", marginTop: 14 }}>
                Next →
              </button>
            )}
          </div>
        );
      })()}

      {/* ---- now his own ---- */}
      {label === "Make your own" && (
        <div>
          <div style={{ background: "#fff", borderRadius: 24, padding: "26px 20px", textAlign: "center",
            border: `4px solid ${C.fox}`, boxShadow: "0 8px 0 rgba(232,112,58,0.3)" }}>
            <div style={{ fontSize: 12, color: "#9a94ad", fontWeight: 800, marginBottom: 8 }}>
              Your turn — make a new one
            </div>
            <div style={{ fontSize: 52 }}>{word.emoji || "⭐"}</div>
            <div style={{ fontSize: 34, fontWeight: 800, color: C.fox, marginTop: 6 }}>{word.pinyin}</div>
            <div style={{ fontSize: 16, color: "#7a7391", marginTop: 2 }}>{word.en}</div>
            {!examples.length && (
              <div style={{ background: "#FFF6E9", border: "2px solid #f0dcae", borderRadius: 12,
                padding: "10px 12px", marginTop: 14, fontSize: 12.5, color: "#8a6d2f", lineHeight: 1.5, textAlign: "left" }}>
                No example sentences for this word yet, so the listening steps were skipped.
                Ask Claude to write a couple and they'll show up here next time.
              </div>
            )}
            <div style={{ textAlign: "left", marginTop: 16, fontSize: 15, color: "#7a7391", lineHeight: 1.9 }}>
              {examples.length ? "Take one you just heard and swap a piece:" : "Try one of these:"}
              <div style={{ marginTop: 6, fontWeight: 700, color: C.ink }}>
                · one about you<br />
                · one about someone in your family<br />
                · one that's a question — ask me it<br />
                · one that isn't true, on purpose 😄
              </div>
            </div>
          </div>
          <button onClick={advance} style={{ ...bigBtn, background: C.leaf, width: "100%", marginTop: 14 }}>
            🗣️ He made one — finish
          </button>
          <div style={{ textAlign: "center", fontSize: 12, color: "#9a94ad", marginTop: 8 }}>
            Don't correct him mid-sentence. Say the fixed version back afterwards, like it's your turn.
          </div>
        </div>
      )}

      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 12, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

// ---- picker: choose today's word from the whole vocabulary ----
function WodPicker({ allWords, onPick, onCancel }) {
  const [q, setQ] = useState("");
  const term = q.trim().toLowerCase();
  // de-duplicate (a word can appear in more than one lesson) and sort A–Z
  const seen = new Set();
  const unique = allWords.filter((w) => {
    const k = (w.pinyin || "") + "|" + (w.en || "");
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  }).sort((a, b) => (a.en || "").toLowerCase().localeCompare((b.en || "").toLowerCase()));

  const matches = term
    ? unique.filter((w) =>
        (w.en || "").toLowerCase().includes(term) ||
        (w.pinyin || "").toLowerCase().includes(term) ||
        (w.hanzi || "").includes(q.trim()))
    : unique;

  return (
    <div style={{ background: "#fff", borderRadius: 18, border: `3px solid ${C.fox}`, padding: 14, marginTop: 10 }}>
      <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 8 }}>
        Pick today's word <span style={{ color: "#9a94ad", fontWeight: 700 }}>({matches.length} of {unique.length})</span>
      </div>
      <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search English, pinyin or 中文…"
        style={{ ...inp, fontSize: 15 }} />
      <div style={{ maxHeight: 340, overflowY: "auto", marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
        {matches.map((w, i) => (
          <button key={w.pinyin + i} onClick={() => onPick(w)}
            style={{ display: "flex", alignItems: "center", gap: 10, background: "#FFFDF7",
              border: "2px solid #eee6d6", borderRadius: 12, padding: "9px 11px", cursor: "pointer",
              fontFamily: "inherit", textAlign: "left" }}>
            <span style={{ fontSize: 20 }}>{w.emoji || "📘"}</span>
            <span style={{ flex: 1, minWidth: 0 }}>
              <span style={{ display: "block", fontWeight: 800, fontSize: 15, color: C.fox }}>{w.pinyin}</span>
              <span style={{ display: "block", fontSize: 12, color: "#7a7391" }}>
                {w.en}{w.lesson ? <span style={{ color: "#bdb6a6" }}> · {w.lesson}</span> : null}
              </span>
            </span>
          </button>
        ))}
        {matches.length === 0 && <div style={{ fontSize: 13, color: "#9a94ad" }}>No matches.</div>}
      </div>
      <button onClick={onCancel} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, width: "100%", marginTop: 10, fontSize: 14, padding: "10px" }}>
        Cancel
      </button>
    </div>
  );
}

function Flashcards({ words, trouble, toggleTrouble, onlyTrouble, onHome }) {
  const [deck, setDeck] = useState(() => srsOrder(shuffle(words), (w) => w.pinyin));
  const [i, setI] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [holding, setHolding] = useState(false);
  const holdRef = useRef(null);
  useEffect(() => () => { if (holdRef.current) clearTimeout(holdRef.current); }, []);
  const [known, setKnown] = useState(0);

  // 10-second recall timer. It runs only while the card is face-down —
  // once Sam flips to check, the clock stops so he can read and hear the
  // answer without being rushed off the card.
  const RECALL_SECONDS = 10;
  const [timeLeft, setTimeLeft] = useState(RECALL_SECONDS);
  const tickRef = useRef(null);
  const nextRef = useRef(null);

  // if the word list changes (e.g. trouble list empties), keep index in range
  const card = deck[i] || deck[0];

  if (!card) {
    return (
      <Center>
        <div style={{ fontSize: 54 }}>🌟</div>
        <h2 style={{ margin: "10px 0" }}>No tricky words yet!</h2>
        <p style={{ color: "#7a7391", maxWidth: 320, textAlign: "center" }}>
          Tap the ⭐ on a card while you play to save the ones you want to practice more. They'll show up here.
        </p>
      </Center>
    );
  }

  const flagged = trouble.has(card.pinyin);

  // On "Got it", say the word aloud and hold the card for a beat so Sam can
  // hear the pronunciation while still looking at it, then advance.
  const advance = () => {
    setFlipped(false);
    setHolding(false);
    setTimeLeft(RECALL_SECONDS);
    if (i + 1 < deck.length) setI(i + 1);
    else {
      setI(0);
      setDeck(srsOrder(shuffle(words), (w) => w.pinyin));
      setKnown(0);
    }
  };

  const next = (gotIt) => {
    if (holding) return;                 // ignore taps during the pause
    if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; }
    if (gotIt) { setKnown((k) => k + 1); playCorrect(known); }
    if (card) srsRecord(card.pinyin, !!gotIt);
    recordEffort();

    if (gotIt && card) {
      setFlipped(true);                  // keep the answer visible
      setHolding(true);
      speak(card);                       // hear it in good Mandarin
      // Always wait for a tap — he decides when he's done looking at it.
    } else {
      advance();
    }
  };

  nextRef.current = next;

  useEffect(() => {
    if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; }
    // only count down on a face-down card that isn't mid-celebration
    if (flipped || holding) return;
    setTimeLeft(RECALL_SECONDS);
    tickRef.current = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) {
          clearInterval(tickRef.current);
          tickRef.current = null;
          // ran out of time — counts as "not yet" and moves on
          setTimeout(() => nextRef.current && nextRef.current(false), 0);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => { if (tickRef.current) clearInterval(tickRef.current); };
  }, [i, flipped, holding, deck]);

  return (
    <div style={{ textAlign: "center" }}>
      <Progress value={i} total={deck.length} label={onlyTrouble ? "⭐ practice pile" : `⭐ ${known} known`} />

      {/* recall countdown — pauses once the card is flipped */}
      <div style={{ marginTop: 10 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 5 }}>
          <span style={{ fontSize: 18 }}>{flipped || holding ? "⏸️" : "⏳"}</span>
          <span style={{
            fontWeight: 800, fontSize: 17,
            color: flipped || holding ? "#9a94ad" : timeLeft <= 3 ? C.berry : C.ink,
          }}>
            {flipped || holding ? "take your time" : `${timeLeft}s`}
          </span>
        </div>
        <div style={{ height: 8, borderRadius: 6, background: "#F0EADC", overflow: "hidden" }}>
          <div style={{
            width: `${(flipped || holding ? 1 : timeLeft / RECALL_SECONDS) * 100}%`,
            height: "100%", borderRadius: 6,
            background: flipped || holding ? "#ded7c8" : timeLeft <= 3 ? C.berry : C.leaf,
            transition: "width 0.9s linear",
          }} />
        </div>
      </div>
      <div
        onClick={() =>
          setFlipped((f) => {
            const next = !f;
            if (next) speak(card); // say it as soon as the answer is shown
            return next;
          })
        }
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 28,
          padding: "44px 20px",
          margin: "16px 0",
          minHeight: 220,
          display: "flex",
          flexDirection: "column",
          justifyContent: "center",
          alignItems: "center",
          border: `4px solid ${flagged ? C.sun : C.sky}`,
          boxShadow: `0 10px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(127,178,232,0.35)"}`,
          cursor: "pointer",
        }}
      >
        <StarButton
          flagged={flagged}
          onClick={() => toggleTrouble(card.pinyin)}
          style={{ top: 12, right: 12, fontSize: 26 }}
        />
        {!flipped ? (
          <>
            <div style={{ fontSize: 22, marginBottom: 6 }}>{card.emoji}</div>
            <div style={{ fontSize: 38, fontWeight: 800 }}>
              {card.en}
            </div>
          </>
        ) : (
          <>
            <div style={{ fontSize: 40, color: C.fox, fontWeight: 800 }}>{card.pinyin}</div>
            <button
              onClick={(e) => { e.stopPropagation(); speak(card); }}
              style={{ ...ghostBtn, marginTop: 14 }}
            >
              🔊 Hear it
            </button>
          </>
        )}
      </div>
      {holding ? (
        // review mode: sit with the word as long as you like
        <button onClick={advance} style={{ ...bigBtn, background: C.sky, width: "100%" }}>
          Next word →
        </button>
      ) : (
        <div style={{ display: "flex", gap: 12 }}>
          <button onClick={() => next(false)} disabled={holding}
            style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, flex: 1, opacity: holding ? 0.5 : 1 }}>
            🔁 Not yet
          </button>
          <button onClick={() => next(true)} disabled={holding}
            style={{ ...bigBtn, background: C.leaf, flex: 1, opacity: holding ? 0.6 : 1 }}>
            {holding ? "🔊 listen…" : "✓ Got it!"}
          </button>
        </div>
      )}
      <div style={{ marginTop: 10, fontSize: 12, color: "#9a94ad" }}>
        Tap the ⭐ to save a word you want to practice more.
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

// -------------------- BUILD A SENTENCE --------------------
// Tap the pinyin word-tiles in the right order to build the sentence.
// Teaches word order / grammar rather than isolated vocabulary.
// Common words/particles that appear in sentences but aren't vocab cards.
// Without these the tile would be read as raw pinyin, which sounds wrong.
const COMMON_HANZI = {
  "wǒ":"我","wǒmen":"我们","nǐ":"你","nǐmen":"你们","tā":"他","tāmen":"他们",
  "de":"的","bù":"不","bú":"不","le":"了","ba":"吧","ma":"吗","ne":"呢","a":"啊","la":"啦","na":"哪",
  "shì":"是","yǒu":"有","méi":"没","hěn":"很","tài":"太","dōu":"都","yào":"要","xiǎng":"想",
  "zuò":"做","lái":"来","qù":"去","kàn":"看","chī":"吃","hē":"喝","xǐ":"洗","ài":"爱",
  "zhè":"这","nà":"那","ge":"个","dà":"大","xiǎo":"小","hǎo":"好","huài":"坏",
  "tiān":"天","fàn":"饭","mén":"门","lǐ":"里","hé":"和","zài":"在","yī":"一","qī":"七",
  "diǎn":"点","diào":"掉","suān":"酸","qiāo":"敲","jiàn":"见","yīfu":"衣服","shūfu":"舒服",
  "yóuxì":"游戏","guānxi":"关系","hǎojiǔ":"好久","chuángshàng":"床上","zěnme":"怎么"
};

// Map a pinyin syllable back to its characters so tapped tiles are
// pronounced properly (browser voices read hanzi far better than pinyin).
let _pyMap = null;
const pinyinKey = (s) =>
  (s || "").toLowerCase().replace(/[.,!?;:。，！？、\s]/g, "");
const getPinyinMap = () => {
  if (_pyMap) return _pyMap;
  _pyMap = {};
  Object.keys(COMMON_HANZI).forEach((k) => { _pyMap[pinyinKey(k)] = COMMON_HANZI[k]; });
  try {
    (getVocab().lessons || []).forEach((L) =>
      (L.words || []).forEach((w) => {
        if (w.pinyin && w.hanzi) {
          const k = pinyinKey(w.pinyin);
          if (k && !_pyMap[k]) _pyMap[k] = w.hanzi;
        }
      })
    );
  } catch (e) {}
  return _pyMap;
};
const speakToken = (token) => {
  const hz = getPinyinMap()[pinyinKey(token)];
  speak(hz ? { hanzi: hz, pinyin: token } : { pinyin: token });
};

function BuildSentence({ sentences, starred, toggleSentence, onHome }) {
  const pickOne = () => {
    const usable = sentences.filter((s) => (s.pinyin || "").split(/\s+/).length >= 2);
    if (!usable.length) return null;
    return srsPick(usable, (s) => s.en) || usable[0];
  };
  const [s, setS] = useState(pickOne);
  const [placed, setPlaced] = useState([]);
  const [tiles, setTiles] = useState([]);
  const [status, setStatus] = useState(null); // null | 'right' | 'wrong'
  const [score, setScore] = useState(0);
  const [attempts, setAttempts] = useState(0);
  const [revealed, setRevealed] = useState(false);

  // split the pinyin into tappable tiles (strip trailing punctuation for matching)
  const cleanWord = (t) => t.replace(/[.,!?。，！？]/g, "");

  useEffect(() => {
    if (!s) return;
    const parts = (s.pinyin || "").split(/\s+/).filter(Boolean);
    setTiles(shuffle(parts.map((t, idx) => ({ id: idx, text: t }))));
    setPlaced([]);
    setStatus(null);
    setAttempts(0);
    setRevealed(false);
  }, [s]);

  if (!s)
    return (
      <Center>
        <div style={{ fontSize: 54 }}>🧩</div>
        <h2 style={{ margin: "10px 0" }}>No sentences for these lessons</h2>
        <p style={{ color: "#7a7391", maxWidth: 320, textAlign: "center" }}>
          Pick more lessons in the word bank to play this one.
        </p>
        <button onClick={onHome} style={{ ...bigBtn, background: C.fox, marginTop: 16 }}>⬅ Back to menu</button>
      </Center>
    );

  const target = (s.pinyin || "").split(/\s+/).filter(Boolean);
  const flagged = starred.has(s.en);

  // After a wrong answer the tiles stay editable so Sam can fix his own
  // sentence. Only "right" locks the board.
  const place = (tile) => {
    if (status === "right") return;
    if (status === "wrong") setStatus(null);   // start editing again
    speakToken(tile.text);            // say each word as it's tapped
    setPlaced((p) => [...p, tile]);
    setTiles((t) => t.filter((x) => x.id !== tile.id));
  };
  const unplace = (tile) => {
    if (status === "right") return;
    if (status === "wrong") setStatus(null);
    speakToken(tile.text);
    setPlaced((p) => p.filter((x) => x.id !== tile.id));
    setTiles((t) => [...t, tile]);
  };
  const clearAll = () => {
    if (status === "right") return;
    setStatus(null);
    setTiles((t) => [...t, ...placed]);
    setPlaced([]);
  };

  const check = () => {
    const attempt = placed.map((p) => cleanWord(p.text).toLowerCase()).join(" ");
    const want = target.map((t) => cleanWord(t).toLowerCase()).join(" ");
    const ok = attempt === want;
    setStatus(ok ? "right" : "wrong");
    // Only the FIRST try counts for spaced repetition and the daily goal,
    // so retrying to fix a sentence is free but can't farm chips.
    if (attempts === 0) {
      srsRecord(s.en, ok);
      recordEffort();   // one sentence = one point, same as any other answer
    }
    if (ok) { setScore((v) => v + 1); playApplause(); speak({ hanzi: s.hanzi, pinyin: s.pinyin }); }
    else {
      setAttempts((a) => a + 1);
      playSoftMiss();
      if (toggleSentence && !starred.has(s.en)) toggleSentence(s.en);
    }
  };

  const nextOne = () => setS(pickOne());

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
        <Badge color={C.leaf}>⭐ {score}</Badge>
        <Badge color={C.sky}>🧩 build it</Badge>
      </div>

      <div
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 22,
          padding: "20px 16px",
          border: `4px solid ${flagged ? C.sun : C.sky}`,
          boxShadow: `0 8px 0 ${flagged ? "rgba(246,196,69,0.35)" : "rgba(107,169,214,0.3)"}`,
        }}
      >
        <StarButton flagged={flagged} onClick={() => toggleSentence(s.en)} />
        <div style={{ fontSize: 13, color: "#9a94ad", marginBottom: 6, fontWeight: 700 }}>
          Put the words in order to say:
        </div>
        <div style={{ fontSize: 19, fontWeight: 800, lineHeight: 1.35 }}>{s.en}</div>
      </div>

      {/* answer slots */}
      <div
        style={{
          minHeight: 66,
          marginTop: 14,
          padding: "12px 10px",
          borderRadius: 16,
          border: `3px dashed ${status === "right" ? C.leaf : status === "wrong" ? "#F0A5A5" : "#d8d0be"}`,
          background: status === "right" ? "#EAF7F0" : status === "wrong" ? "#FDECEC" : "#FFFDF7",
          display: "flex",
          flexWrap: "wrap",
          gap: 8,
          alignItems: "flex-start",
        }}
      >
        {placed.length === 0 && (
          <span style={{ fontSize: 13, color: "#b3ab98" }}>Tap the words below…</span>
        )}
        {placed.map((t) => (
          <button key={t.id} onClick={() => unplace(t)} style={{ ...tile_, background: C.sky, color: "#fff", borderColor: C.sky }}>
            {t.text}
          </button>
        ))}
      </div>

      {/* available tiles */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 14, justifyContent: "center" }}>
        {tiles.map((t) => (
          <button key={t.id} onClick={() => place(t)} style={tile_}>
            {t.text}
          </button>
        ))}
      </div>

      {status === "wrong" && !revealed && (
        <div style={{ marginTop: 14, textAlign: "center" }}>
          <div style={{ color: C.berry, fontWeight: 800 }}>Not quite — tap the words to move them around!</div>
          <div style={{ fontSize: 12, color: "#7a7391", marginTop: 4 }}>
            Tap a word in the box to take it back out.
          </div>
          <button onClick={() => { setRevealed(true); speak({ hanzi: s.hanzi, pinyin: s.pinyin }); }}
            style={{ ...ghostBtn, marginTop: 10 }}>
            🙈 Show me the answer
          </button>
        </div>
      )}
      {revealed && status !== "right" && (
        <div style={{ marginTop: 14, textAlign: "center" }}>
          <div style={{ color: C.berry, fontWeight: 800 }}>It should be:</div>
          <div style={{ fontSize: 18, fontWeight: 800, marginTop: 4, color: C.fox }}>{s.pinyin}</div>
          <button onClick={() => speak({ hanzi: s.hanzi, pinyin: s.pinyin })} style={{ ...ghostBtn, marginTop: 8 }}>🔊 Hear it</button>
        </div>
      )}
      {status === "right" && (
        <div style={{ marginTop: 14, textAlign: "center", color: C.leaf, fontWeight: 800, fontSize: 18 }}>
          ✓ Perfect!{attempts > 0 ? " You fixed it! 🎉" : ""}
        </div>
      )}

      <div style={{ marginTop: 16 }}>
        {status === "right" || revealed ? (
          <button onClick={nextOne} style={{ ...bigBtn, background: C.sky, width: "100%" }}>
            Next sentence →
          </button>
        ) : (
          <div style={{ display: "flex", gap: 10 }}>
            {placed.length > 0 && (
              <button onClick={clearAll}
                style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, flex: "0 0 38%" }}>
                ↺ Clear
              </button>
            )}
            <button
              onClick={check}
              disabled={placed.length === 0}
              style={{ ...bigBtn, background: C.leaf, flex: 1, opacity: placed.length ? 1 : 0.5 }}
            >
              {attempts > 0 ? "✓ Try again" : "✓ Check"}
            </button>
          </div>
        )}
      </div>

      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 12, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

const tile_ = {
  border: "3px solid #e3ddcf",
  background: "#fff",
  color: "#2A2440",
  borderRadius: 12,
  padding: "10px 14px",
  fontSize: 17,
  fontWeight: 800,
  cursor: "pointer",
  fontFamily: "inherit",
  boxShadow: "0 3px 0 rgba(0,0,0,0.05)",
};

// -------------------- BEAT THE CLOCK --------------------
function BeatTheClock({ words, addTrouble, trouble, toggleTrouble, onHome }) {
  const [phase, setPhase] = useState("ready"); // ready | play | done
  const [time, setTime] = useState(60);
  const [score, setScore] = useState(0);
  const [round, setRound] = useState(null);
  const [flash, setFlash] = useState(null);
  const timer = useRef(null);

  const build = (avoid) => {
    const q = srsPick(words, (w) => w.pinyin, avoid) || shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.pinyin !== q.pinyin)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };

  const start = () => {
    setScore(0);
    setTime(60);
    setPhase("play");
    setRound(build());
    timer.current = setInterval(() => {
      setTime((t) => {
        if (t <= 1) {
          clearInterval(timer.current);
          recordEffort();   // whole round counts as ONE practice (per Vin)
          setPhase("done");
          return 0;
        }
        return t - 1;
      });
    }, 1000);
  };

  useEffect(() => () => clearInterval(timer.current), []);

  const choose = (opt) => {
    const right = opt.pinyin === round.q.pinyin;
    setFlash(right ? "right" : "wrong");
    if (right) { setScore((s) => s + 1); playCorrect(score); speak(round.q); }
    else { playSoftMiss(); addTrouble && addTrouble(round.q.pinyin); }
    srsRecord(round.q.pinyin, right);   // still tracked for spaced repetition
    // NOTE: effort is credited once per completed round, not per answer,
    // so a fast 60s round can't inflate the daily goal.
    const prev = round.q.pinyin;
    setTimeout(() => { setFlash(null); setRound(build(prev)); }, 200);
  };

  if (phase === "ready")
    return (
      <Center>
        <div style={{ fontSize: 60 }}>⏱️</div>
        <h2 style={{ margin: "10px 0" }}>Beat the Clock!</h2>
        <p style={{ color: "#7a7391", maxWidth: 300, textAlign: "center" }}>
          Get as many right as you can in 60 seconds. Ready, Sam?
        </p>
        <button onClick={start} style={{ ...bigBtn, background: C.berry, marginTop: 16, padding: "16px 40px" }}>
          🚀 Start!
        </button>
      </Center>
    );

  if (phase === "done")
    return (
      <Center>
        <div style={{ fontSize: 64 }}>{score >= 15 ? "🏆" : score >= 8 ? "🌟" : "💪"}</div>
        <h2 style={{ margin: "8px 0" }}>Time's up!</h2>
        <div style={{ fontSize: 52, fontWeight: 800, color: C.fox }}>{score}</div>
        <div style={{ color: "#7a7391" }}>correct answers</div>
        <div style={{ marginTop: 8, fontWeight: 700, color: C.leaf }}>
          {score >= 15 ? "Amazing! You're a Chinese champion!" : score >= 8 ? "Great job! Try to beat it!" : "Nice try — go again!"}
        </div>
        <button onClick={start} style={{ ...bigBtn, background: C.berry, marginTop: 18 }}>
          🔁 Play again
        </button>
        <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 10 }}>
          ⬅ Back to menu
        </button>
      </Center>
    );

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <Badge color={C.fox}>⭐ {score}</Badge>
        <div
          style={{
            fontSize: 30,
            fontWeight: 800,
            color: time <= 10 ? C.berry : C.ink,
          }}
        >
          ⏱️ {time}s
        </div>
      </div>
      <div
        style={{
          position: "relative",
          background: flash === "right" ? "#DFF5EA" : flash === "wrong" ? "#FBE0E0" : "#fff",
          borderRadius: 24,
          padding: "28px 20px",
          textAlign: "center",
          border: `4px solid ${trouble && trouble.has(round.q.pinyin) ? C.sun : C.berry}`,
          transition: "background 0.15s",
        }}
      >
        <StarButton
          flagged={trouble ? trouble.has(round.q.pinyin) : false}
          onClick={() => toggleTrouble(round.q.pinyin)}
        />
        <div style={{ fontSize: 20, marginBottom: 4 }}>{round.q.emoji}</div>
        <div style={{ fontSize: 36, fontWeight: 800 }}>
          {round.q.en}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
        {round.options.map((opt, idx) => (
          <button key={idx} onClick={() => choose(opt)} style={{ ...bigBtn, background: "#fff", color: C.ink, border: "3px solid #e3ddcf", fontSize: 18, padding: "16px 8px" }}>
            {opt.pinyin}
          </button>
        ))}
      </div>
    </div>
  );
}

// -------------------- SAY THE SENTENCE --------------------
// Oral practice: Sam reads the English sentence, says it aloud in Chinese,
// then taps to reveal the pinyin + hear the correct answer, and self-scores.
// ---- chooser shown when both tricky words AND starred sentences exist ----
function TrickyPicker({ wordCount, sentenceCount, go, onHome }) {
  return (
    <div>
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 46 }}>⭐</div>
        <div style={{ fontWeight: 800, fontSize: 20, marginTop: 4 }}>Practice tricky ones</div>
        <div style={{ fontSize: 13, color: "#7a7391", marginTop: 2 }}>What would you like to work on?</div>
      </div>

function SayTheSentence({ sentences, starred, toggleSentence, onHome, forceStarredOnly }) {
  const [onlyStarred, setOnlyStarred] = useState(false);

  const pool = onlyStarred
    ? sentences.filter((x) => starred.has(x.en))
    : sentences;

  const [deck, setDeck] = useState(() => shuffle(pool));
  const [i, setI] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [spoke, setSpoke] = useState(false);
  const [got, setGot] = useState(0);
  const [done, setDone] = useState(0);

  // rebuild the deck when the filter changes or the starred pile shifts under it
  useEffect(() => {
    setDeck(shuffle(pool));
    setI(0);
    setRevealed(false);
    setSpoke(false);
  }, [onlyStarred, pool.length]);

  const starredCount = sentences.filter((x) => starred.has(x.en)).length;
  const s = deck[i] || deck[0];

  if (!s) {
    // Two reasons the deck can be empty: filtering to starred-only with none
    // starred, or no selected lesson has any sentences.
    if (onlyStarred) {
      return (
        <Center>
          <div style={{ fontSize: 54 }}>⭐</div>
          <h2 style={{ margin: "10px 0" }}>No starred sentences yet</h2>
          <p style={{ color: "#7a7391", maxWidth: 320, textAlign: "center" }}>
            Tap the ⭐ on a sentence to save it here for extra practice.
          </p>
          <button onClick={() => setOnlyStarred(false)} style={{ ...bigBtn, background: C.leaf, marginTop: 16 }}>
            ← Back to all sentences
          </button>
        </Center>
      );
    }
    return (
      <Center>
        <div style={{ fontSize: 54 }}>💬</div>
        <h2 style={{ margin: "10px 0" }}>No sentences for these lessons</h2>
        <p style={{ color: "#7a7391", maxWidth: 340, textAlign: "center" }}>
          The lessons you've picked don't have sentences yet. Head back and select
          more lessons in the word bank to practice sentences.
        </p>
      </Center>
    );
  }

  const flagged = starred.has(s.en);

  const reveal = () => {
    if (!revealed) {
      setRevealed(true);
      speak({ hanzi: s.hanzi, pinyin: s.pinyin }); // say it in good Mandarin
    }
  };

  const next = (knewIt) => {
    if (knewIt) { setGot((g) => g + 1); playCorrect(got); }
    setSpoke(false);
    setDone((d) => d + 1);
    if (s) srsRecord(s.en, !!knewIt);
    recordEffort();               // one point per sentence
    setRevealed(false);
    if (i + 1 < deck.length) setI(i + 1);
    else {
      setI(0);
      setDeck(shuffle(pool));
    }
  };

  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <Progress value={i} total={deck.length} label={`✅ ${got} / ${done}`} />
      </div>

      {!forceStarredOnly && (
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 4 }}>
          <button
            onClick={() => starredCount > 0 && setOnlyStarred((v) => !v)}
            disabled={!onlyStarred && starredCount === 0}
            style={{
              ...ghostBtn,
              fontSize: 12,
              borderColor: onlyStarred ? C.sun : "#e3ddcf",
              background: onlyStarred ? "#FFF9EC" : "#fff",
              opacity: !onlyStarred && starredCount === 0 ? 0.5 : 1,
            }}
          >
            {onlyStarred ? "⭐ Practicing starred — show all" : `⭐ Practice starred only (${starredCount})`}
          </button>
        </div>
      )}
      {forceStarredOnly && (
        <div style={{ textAlign: "center", marginBottom: 4, fontSize: 12, fontWeight: 800, color: C.sun }}>
          ⭐ Practicing your tricky sentences
        </div>
      )}

      <div
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 28,
          padding: "34px 20px",
          margin: "12px 0 16px",
          minHeight: 230,
          display: "flex",
          flexDirection: "column",
          justifyContent: "center",
          alignItems: "center",
          border: `4px solid ${flagged ? C.sun : C.fox}`,
          boxShadow: `0 10px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(232,112,58,0.3)"}`,
        }}
      >
        <StarButton flagged={flagged} onClick={() => toggleSentence(s.en)} />
        <div style={{ fontSize: 13, color: "#9a94ad", marginBottom: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5 }}>
          Say this in Chinese
        </div>
        <div style={{ fontSize: 26, fontWeight: 800, lineHeight: 1.3 }}>
          {s.en}
        </div>

        {!revealed ? (
          <div style={{ marginTop: 18 }}>
            <button
              onClick={() => { setSpoke(true); recordSpoken(); reveal(); }}
              style={{ ...bigBtn, background: C.leaf, padding: "14px 26px" }}
            >
              🗣️ I said it — show answer
            </button>
          </div>
        ) : (
          <div style={{ marginTop: 20 }}>
            <div style={{ fontSize: 26, color: C.fox, fontWeight: 800 }}>{s.pinyin}</div>
            <button
              onClick={() => speak({ hanzi: s.hanzi, pinyin: s.pinyin })}
              style={{ ...ghostBtn, marginTop: 12 }}
            >
              🔊 Hear it again
            </button>
          </div>
        )}
      </div>

      {revealed && (
        <>
          <div style={{ fontSize: 13, color: "#7a7391", marginBottom: 10, fontWeight: 700 }}>
            How did Sam do?{spoke && <span style={{ color: C.leaf }}> · 🗣️ said it out loud!</span>}
          </div>
          <div style={{ display: "flex", gap: 12 }}>
            <button onClick={() => next(false)} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, flex: 1 }}>
              🔁 Practice again
            </button>
            <button onClick={() => next(true)} style={{ ...bigBtn, background: C.leaf, flex: 1 }}>
              ✓ Nailed it!
            </button>
          </div>
        </>
      )}

      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

// -------------------- WHAT'S THAT SENTENCE MEAN? --------------------
// Sam hears a full sentence in Mandarin and picks the correct English meaning.
function SentenceMeaning({ sentences, starred, toggleSentence, onHome }) {
  const build = () => {
    const q = shuffle(sentences)[0];
    const wrong = shuffle(sentences.filter((s) => s.en !== q.en)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const [round, setRound] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);

  useEffect(() => { if (round && round.q) speak(round.q); }, [round]);

  if (!round || !round.q) {
    return (
      <Center>
        <div style={{ fontSize: 54 }}>📣</div>
        <h2 style={{ margin: "10px 0" }}>No sentences for these lessons</h2>
        <p style={{ color: "#7a7391", maxWidth: 340, textAlign: "center" }}>
          Pick more lessons in the word bank to practice sentences.
        </p>
        <button onClick={onHome} style={{ ...bigBtn, background: C.leaf, marginTop: 16 }}>
          ⬅ Back to menu
        </button>
      </Center>
    );
  }

  const flagged = starred ? starred.has(round.q.en) : false;

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    if (opt.en === round.q.en) {
      setScore((s) => s + 1);
      setStreak((s) => s + 1);
      playCorrect(streak);
      if (streak + 1 === 5) playApplause();   // reward a hot run
    } else {
      setStreak(0);
      playSoftMiss();
      toggleSentence && !starred.has(round.q.en) && toggleSentence(round.q.en);
    }
    srsRecord(round.q.en, opt.en === round.q.en);
    recordEffort();               // one point per sentence answered
    setTimeout(() => { setPicked(null); setRound(build()); }, 1400);
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
        <Badge color={C.sun}>⭐ {score}</Badge>
        <Badge color={streak >= 3 ? C.berry : C.leaf}>
          🔥 {streak} {streak >= 3 ? "on fire!" : ""}
        </Badge>
      </div>
      <div
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 24,
          padding: "30px 20px",
          textAlign: "center",
          border: `4px solid ${flagged ? C.sun : C.fox}`,
          boxShadow: `0 8px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(232,112,58,0.3)"}`,
        }}
      >
        <StarButton flagged={flagged} onClick={() => toggleSentence(round.q.en)} />
        <button onClick={() => speak(round.q)} style={{ ...bigBtn, background: C.sky, fontSize: 20, padding: "16px 30px" }}>
          🔊 Play sentence
        </button>
        <div style={{ marginTop: 12, fontSize: 15, color: "#cfc9bb", fontWeight: 700, minHeight: 20 }}>
          {picked ? round.q.pinyin : ""}
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
        {round.options.map((opt, idx) => {
          let bg = "#fff", bd = "#e3ddcf", cl = C.ink;
          if (picked) {
            if (opt.en === round.q.en) { bg = C.leaf; bd = C.leaf; cl = "#fff"; }
            else if (opt.en === picked.en) { bg = "#F4A7A7"; bd = "#F4A7A7"; cl = "#fff"; }
          }
          return (
            <button
              key={idx}
              onClick={() => choose(opt)}
              style={{ ...bigBtn, background: bg, color: cl, border: `3px solid ${bd}`, fontSize: 16, padding: "14px 10px", textAlign: "left" }}
            >
              {opt.en}
            </button>
          );
        })}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

// -------------------- WHAT DOES THIS MEAN? --------------------
// Sam hears the word spoken in Chinese and picks the correct English meaning
function ToneMatch({ words, addTrouble, trouble, toggleTrouble, onHome }) {
  const build = (avoid) => {
    const q = srsPick(words, (w) => w.pinyin, avoid) || shuffle(words)[0];
    const wrong = shuffle(words.filter((w) => w.en !== q.en)).slice(0, 3);
    return { q, options: shuffle([q, ...wrong]) };
  };
  const [round, setRound] = useState(build);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);

  const flagged = trouble ? trouble.has(round.q.pinyin) : false;

  useEffect(() => { speak(round.q); }, [round]);

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    if (opt.en === round.q.en) {
      setScore((s) => s + 1);
      setStreak((s) => s + 1);
      playCorrect(streak);
      if (streak + 1 === 5) playApplause();
    } else {
      setStreak(0);
      playSoftMiss();
      addTrouble && addTrouble(round.q.pinyin);
    }
    srsRecord(round.q.pinyin, opt.en === round.q.en);
    recordEffort();
    const prevKey = round.q.pinyin;
    setTimeout(() => { setPicked(null); setRound(build(prevKey)); }, 1200);
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
        <Badge color={C.leaf}>⭐ {score}</Badge>
        <Badge color={streak >= 3 ? C.berry : C.sun}>
          🔥 {streak} {streak >= 3 ? "on fire!" : ""}
        </Badge>
      </div>
      <div
        style={{
          position: "relative",
          background: "#fff",
          borderRadius: 24,
          padding: "30px 20px",
          textAlign: "center",
          border: `4px solid ${flagged ? C.sun : C.leaf}`,
          boxShadow: `0 8px 0 ${flagged ? "rgba(246,196,69,0.4)" : "rgba(95,184,148,0.3)"}`,
        }}
      >
        <StarButton flagged={flagged} onClick={() => toggleTrouble(round.q.pinyin)} />
        <button onClick={() => speak(round.q)} style={{ ...bigBtn, background: C.sky, fontSize: 22, padding: "18px 34px" }}>
          🔊 Play sound
        </button>
        <div style={{ marginTop: 12, fontSize: 18, color: "#cfc9bb", fontWeight: 700 }}>
          {picked ? round.q.pinyin : ""}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
        {round.options.map((opt, idx) => {
          let bg = "#fff", bd = "#e3ddcf";
          if (picked) {
            if (opt.en === round.q.en) { bg = C.leaf; bd = C.leaf; }
            else if (opt.en === picked.en) { bg = "#F4A7A7"; bd = "#F4A7A7"; }
          }
          return (
            <button
              key={idx}
              onClick={() => choose(opt)}
              style={{
                ...bigBtn,
                background: bg,
                color: picked && (opt.en === round.q.en || opt.en === picked.en) ? "#fff" : C.ink,
                border: `3px solid ${bd}`,
                fontSize: 17,
                padding: "18px 8px",
              }}
            >
              {opt.emoji} {opt.en}
            </button>
          );
        })}
      </div>
      <button onClick={onHome} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, marginTop: 14, width: "100%" }}>
        ⬅ Back to menu
      </button>
    </div>
  );
}

// -------------------- WORD LIST --------------------
// Comprehensive A–Z list (by English). Archive words Sam has mastered so they
// drop out of the games but stay here for reference.
function WordList({ allWords, archived, trouble, toggleTrouble, toggleArchived, customWords, addCustomWord, removeCustomWord, openAdd, hideWord, hiddenCount, unhideAll }) {
  const [showArchived, setShowArchived] = useState(true);
  const [showAdd, setShowAdd] = useState(!!openAdd);
  const [bulk, setBulk] = useState("");
  const [added, setAdded] = useState(0);

  // key on whatever the word actually has — a word added as characters only
  // has no pinyin, and would otherwise never show a delete button
  const cwKey = (w) => [w.pinyin || "", w.hanzi || "", w.en || ""].join("|");
  const customSet = new Set((customWords || []).map(cwKey));

  // Work out what the user typed: Chinese characters, pinyin, or English.
  const classify = (text) => {
    const t = text.trim();
    if (!t) return null;
    const hasHan = /[一-鿿]/.test(t);
    // pinyin often carries tone marks; also treat "ni hao"-style ASCII as
    // ambiguous and let Claude sort it out later.
    const hasToneMark = /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/i.test(t);
    if (hasHan) return { en: "", pinyin: "", hanzi: t };
    if (hasToneMark) return { en: "", pinyin: t, hanzi: "" };
    return { en: t, pinyin: "", hanzi: "" };
  };

  // One box, one or more lines. Also accepts "english = 中文" or "english - 中文".
  const submit = () => {
    const lines = bulk.split("\n").map((s) => s.trim()).filter(Boolean);
    let n = 0;
    lines.forEach((line) => {
      // allow an explicit pairing on one line
      const pair = line.split(/\s*[=|]\s*/);
      let parts;
      if (pair.length >= 2) {
        const merged = { en: "", pinyin: "", hanzi: "" };
        pair.forEach((p) => {
          const c = classify(p);
          if (!c) return;
          if (c.hanzi) merged.hanzi = c.hanzi;
          else if (c.pinyin) merged.pinyin = c.pinyin;
          else if (!merged.en) merged.en = c.en;
        });
        parts = merged;
      } else {
        parts = classify(line);
      }
      if (!parts || (!parts.en && !parts.pinyin && !parts.hanzi)) return;
      addCustomWord({
        en: parts.en || parts.pinyin || parts.hanzi,
        pinyin: parts.pinyin || "",
        hanzi: parts.hanzi || "",   // hanzi drives good audio when present
        emoji: "📝",
        needsDef: !(parts.en && parts.pinyin && parts.hanzi),
      });
      n++;
    });
    setAdded(n);
    setBulk("");
    setTimeout(() => setAdded(0), 4000);
  };

  const sorted = [...allWords].sort((a, b) =>
    a.en.toLowerCase().localeCompare(b.en.toLowerCase())
  );
  const rows = sorted;
  const activeCount = allWords.length;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontWeight: 800, fontSize: 16 }}>
          📖 Word list <span style={{ color: C.fox }}>({activeCount} active)</span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setShowAdd((s) => !s)} style={{ ...ghostBtn, fontSize: 13, borderColor: C.leaf, color: C.leaf }}>
            ➕ Add word
          </button>

        </div>
      </div>

      {showAdd && (
        <div style={{ background: "#F4FBF7", border: `2px solid ${C.leaf}`, borderRadius: 16, padding: 14, marginBottom: 14 }}>
          <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 6 }}>Add words</div>
          <div style={{ fontSize: 12, color: "#5c7a6c", marginBottom: 10, lineHeight: 1.5 }}>
            Type or paste one word per line — English, pinyin, or Chinese, whichever
            you have. Claude fills in the rest next time you chat.
          </div>
          <textarea
            value={bulk}
            onChange={(e) => setBulk(e.target.value)}
            rows={5}
            placeholder={"also\n猫\nmāo\nrabbit = 兔子"}
            style={{ ...inp, fontFamily: "inherit", fontSize: 15, lineHeight: 1.6, resize: "vertical" }}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button onClick={submit} disabled={!bulk.trim()}
              style={{ ...bigBtn, background: C.leaf, flex: 1, fontSize: 15, padding: "10px", opacity: bulk.trim() ? 1 : 0.5 }}>
              ✓ Add words
            </button>
            <button onClick={() => setShowAdd(false)} style={{ ...bigBtn, background: "#EBE5D8", color: C.ink, fontSize: 15, padding: "10px 16px" }}>
              Done
            </button>
          </div>
          {added > 0 && (
            <div style={{ marginTop: 10, fontWeight: 700, color: C.leaf, fontSize: 14 }}>
              Added {added} word{added === 1 ? "" : "s"} to “Words We Added”.
            </div>
          )}
        </div>
      )}
      {(() => {
        const total = allWords.length;
        const done = allWords.filter((w) => archived.has(w.pinyin)).length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        return (
          <div style={{ background: "#fff", border: `3px solid ${done ? C.leaf : "#efe8d8"}`,
            borderRadius: 16, padding: "12px 14px", marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontWeight: 800, fontSize: 15 }}>
                ✅ {done} of {total} mastered
              </span>
              <span style={{ fontWeight: 800, fontSize: 15, color: done ? C.leaf : "#b3ab98" }}>{pct}%</span>
            </div>
            <div style={{ height: 12, borderRadius: 8, background: "#F0EADC", overflow: "hidden" }}>
              <div style={{ width: `${pct}%`, height: "100%", borderRadius: 8, background: C.leaf, transition: "width .3s" }} />
            </div>
          </div>
        );
      })()}

      <div style={{ fontSize: 12, color: "#7a7391", marginBottom: 12 }}>
        Tap ✅ when Sam has a word down, ⭐ for the practice pile, or 🔊 to hear it.
      </div>
      {hiddenCount > 0 && (
        <div style={{ marginTop: 8, fontSize: 12, color: "#9a94ad", display: "flex", alignItems: "center", gap: 8 }}>
          <span>{hiddenCount} word{hiddenCount === 1 ? "" : "s"} removed</span>
          <button onClick={() => { if (window.confirm("Bring back all removed words?")) unhideAll(); }}
            style={{ ...ghostBtn, padding: "3px 8px", fontSize: 11 }}>
            ↺ restore
          </button>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {rows.map((w, idx) => {

          const isTricky = trouble.has(w.pinyin);
          const isMastered = archived.has(w.pinyin);
          return (
            <div
              key={w.pinyin + idx}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                background: isMastered ? "#EFF9F3" : "#fff",
                border: `2px solid ${isMastered ? C.leaf : isTricky ? C.sun : "#efe8d8"}`,
                borderRadius: 14,
                padding: "10px 12px",
              }}
            >
              <span style={{ fontSize: 26, width: 32, textAlign: "center" }}>{w.emoji}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 800, fontSize: 20, color: C.ink, lineHeight: 1.25 }}>
                  {w.en}
                </div>
                <div style={{ fontSize: 18, color: C.fox, fontWeight: 700, lineHeight: 1.3 }}>
                  {w.pinyin}
                </div>
              </div>
              <button
                onClick={() => { if (!isMastered) playCelebrate(); toggleArchived(w.pinyin); }}
                aria-pressed={isMastered}
                title={isMastered ? "Mastered! Tap to undo" : "Mark as mastered"}
                style={{
                  padding: 0,
                  cursor: "pointer",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  width: 36,
                  height: 36,
                  flexShrink: 0,
                  borderRadius: 10,
                  border: `3px solid ${isMastered ? C.leaf : "#cfd8cc"}`,
                  background: isMastered ? C.leaf : "#fff",
                  boxShadow: isMastered ? "none" : "inset 0 2px 4px rgba(0,0,0,0.06)",
                  fontFamily: "inherit",
                }}
              >
                <span style={{ fontSize: 21, lineHeight: 1, fontWeight: 900, color: isMastered ? "#fff" : "#cbd6cd" }}>✓</span>
              </button>
              <button
                onClick={() => toggleTrouble(w.pinyin)}

  );

// Waits for vocab.json inside React so there are no script-timing assumptions.

// ============================================================
//  ENGLISH SIDE — "Sam's English Skills"
//  Activities: Flashcards, Quiz, Speed Round, Spelling
//  Data comes from words-en.json (window.__VOCAB__.english)
// ============================================================
const getEnglish = () => (window.__VOCAB__ && window.__VOCAB__.english) || { lists: [] };

// Deliberately pick the BEST English voice the device has, instead of letting
// the browser fall back to its low-quality default (which sounds robotic).
// Same approach that fixed the Mandarin audio.
let bestEnVoice = null;

const PREFERRED_EN_VOICES = [
  // Google's natural voices (Chrome / Android / ChromeOS) — best quality
  "Google US English", "Google UK English Female", "Google UK English Male",
  // Microsoft neural voices (Windows / Edge)
  "Microsoft Aria", "Microsoft Jenny", "Microsoft Guy", "Microsoft Michelle",
  "Microsoft Ana", "Microsoft Zira", "Microsoft David",
  // Apple (macOS / iOS) — prefer the enhanced/premium ones
  "Samantha", "Ava", "Allison", "Susan", "Alex", "Karen", "Daniel", "Moira",
];

const selectBestEnVoice = () => {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  const isEn = (v) => v.lang && v.lang.toLowerCase().startsWith("en");

  // 1) Google voices first — best quality on Chrome/Windows/ChromeOS
  const google = voices.find((v) => isEn(v) && /google/i.test(v.name));
  if (google) { bestEnVoice = google; return; }
  // 2) anything flagged natural/neural/enhanced/premium/online
  const fancy = voices.find(
    (v) => isEn(v) && /natural|neural|enhanced|premium|online/i.test(v.name)
  );
  if (fancy) { bestEnVoice = fancy; return; }
  // 3) any server-side (non-local) voice — usually the good ones
  const remote = voices.find((v) => isEn(v) && v.localService === false);
  if (remote) { bestEnVoice = remote; return; }
  // 4) named preferred list (Microsoft Aria etc.)
  for (const name of PREFERRED_EN_VOICES) {
    const hit = voices.find(
      (v) => isEn(v) && v.name.toLowerCase().includes(name.toLowerCase())
    );
    if (hit) { bestEnVoice = hit; return; }
  }
  // 5) fall back to any English voice at all
  const any = voices.find(isEn);
  if (any) bestEnVoice = any;
};

if (typeof window !== "undefined" && "speechSynthesis" in window) {
  if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", selectBestEnVoice);
  else { const _prev = window.speechSynthesis.onvoiceschanged; window.speechSynthesis.onvoiceschanged = function(){ if(typeof _prev==="function") try{_prev();}catch(e){} selectBestEnVoice(); }; }
  [200, 600, 1200, 2500].forEach((ms) => setTimeout(selectBestEnVoice, ms));
}

const speakEn = (text) => {
  if (!("speechSynthesis" in window) || !text) return;
  const say = (attempt) => {
    try {
      if (!bestEnVoice) selectBestEnVoice();
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      u.pitch = 1.0;
      // manual override from settings wins, if the user picked one
      const pref = loadLS("en_voice_pref", "");
      const chosen = pref
        ? window.speechSynthesis.getVoices().find((v) => v.name === pref)
        : bestEnVoice;
      if (chosen) u.voice = chosen;
      window.speechSynthesis.speak(u);
      try { window.speechSynthesis.resume(); } catch (e) {}
    } catch (e) {}
  };
  // voices can take a moment to load — try immediately, then retry with delays
  // Same Android rule as above: fire synchronously within the gesture first.
  const hadVoicesEn = window.speechSynthesis.getVoices().length > 0;
  selectBestEnVoice();
  say(1);
  if (!hadVoicesEn) {
    let tries = 0;
    const retry = () => {
      tries++;
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
      selectBestEnVoice();
      if (window.speechSynthesis.getVoices().length) { say(2); return; }
      if (tries < 6) setTimeout(retry, 300);
    };
    setTimeout(retry, 300);
  }
};

function EnglishApp({ onSwitchLang }) {
  const { lists: LISTS } = getEnglish();
  const [screen, setScreen] = useState("home");
  useBackToMenu(screen, setScreen);
  const [pool, setPool] = useState(() => {
    const ids = LISTS.map((l) => l.id);
    if ((loadLS("en_myWords", []) || []).length) ids.push("en-my-words");
    return ids;
  });
  const [starred, setStarred] = useState(() => new Set(loadLS("en_starred", [])));
  const [mastered, setMastered] = useState(() => new Set(loadLS("en_mastered", [])));
  const [myWords, setMyWords] = useState(() => loadLS("en_myWords", []));
  const [syncStatus, setSyncStatus] = useState("");

  useEffect(() => {
    saveTimed("en_starred", [...starred]);
    saveLS("en_mastered", [...mastered]);
    saveLS("en_myWords", myWords);
    syncAll(setSyncStatus);
  }, [starred, mastered, myWords]);

  useEffect(() => onProgressChange(() => syncAll(setSyncStatus)), []);

  const applyRemoteEn = React.useCallback(() => {
    setStarred(new Set(loadLS("en_starred", [])));
    setMastered(new Set(loadLS("en_mastered", [])));
    setMyWords(loadLS("en_myWords", []));
  }, []);
  useLiveSync(applyRemoteEn, setSyncStatus);

  useEffect(() => {
    pullRemoteProgress().then((remote) => {
      mergeRemoteProgress(remote);
      markPulled();
      if (!remote) return;
      if (remote.en_starred) setStarred((p) => new Set([...p, ...remote.en_starred]));
      if (remote.en_mastered) setMastered((p) => new Set([...p, ...remote.en_mastered]));
      if (remote.en_myWords && remote.en_myWords.length) {
        setMyWords((prev) => {
          const seen = new Set(prev.map((w) => w.word.toLowerCase()));
          return [...prev, ...remote.en_myWords.filter((w) => !seen.has(w.word.toLowerCase()))];
        });
        setPool((p) => (p.includes("en-my-words") ? p : [...p, "en-my-words"]));
      }
      setSyncStatus("synced");
    });
  }, []);

  const toggleList = (id) =>
    setPool((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));
  const toggleStar = (w) =>
    setStarred((prev) => { const n = new Set(prev); n.has(w) ? n.delete(w) : n.add(w); return n; });
  const addStar = (w) =>
    setStarred((prev) => (prev.has(w) ? prev : new Set([...prev, w])));
  const toggleMastered = (w) =>
    setMastered((prev) => { const n = new Set(prev); n.has(w) ? n.delete(w) : n.add(w); return n; });

  // Normalise so spacing/case variants resolve: "Free loader" === "Freeloader"
  const _norm = (s) => (s || "").toLowerCase().replace(/[\s\-_]/g, "");
  const _realWords = new Set(LISTS.flatMap((l) => l.words.map((w) => _norm(w.word))));
  const _myFiltered = myWords.filter((w) => !_realWords.has(_norm(w.word)));

  // Once Claude has promoted a word into words-en.json, drop the local
  // placeholder for good — otherwise the "needs a definition" badge keeps
  // showing words that were finished days ago.
  useEffect(() => {
    if (myWords.length !== _myFiltered.length) setMyWords(_myFiltered);
  }, [myWords.length, _myFiltered.length]);
  const allLists = _myFiltered.length
    ? [...LISTS, { id: "en-my-words", title: "My Words", subtitle: "words you added", words: _myFiltered }]
    : LISTS;

  const addMyWord = (w) => {
    setMyWords((prev) => [...prev, w]);
    setPool((p) => (p.includes("en-my-words") ? p : [...p, "en-my-words"]));
  };
  const removeMyWord = (word) => setMyWords((prev) => prev.filter((x) => x.word !== word));

  const activeWords = allLists
    .flatMap((l) => l.words)

  const listWords = allLists
    .flatMap((l) => l.words.map((w) => ({ ...w, list: l.title })));
  const starredWords = activeWords.filter((w) => starred.has(w.word));

  const home = () => setScreen("home");

  return (
    <div style={{ minHeight:"100vh", background:`radial-gradient(circle at 20% 10%, #DCE9FB 0%, #F3F7FE 45%)`,
      color:C.ink, fontFamily:"'Baloo 2','Comic Sans MS',system-ui,sans-serif", padding:"20px 16px 60px" }}>
      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        <EnHeader onHome={home} showHome={screen !== "home"} onSwitchLang={onSwitchLang} />
        {screen === "home" && (
          <EnHome addMyWord={addMyWord} myWords={_myFiltered}
            wordCount={activeWords.length} starredCount={starredWords.length}
            totalCount={listWords.length} masteredCount={mastered.size} go={setScreen} />
        )}
        {screen === "flashcards" && (
          <React.Fragment><GameTitle>Flashcards</GameTitle>
          <EnFlashcards words={activeWords} starred={starred} toggleStar={toggleStar} onHome={home} />
          </React.Fragment>
        )}
        {screen === "starflip" && <EnFlashcards words={starredWords} starred={starred} toggleStar={toggleStar} onlyStarred onHome={home} />}
        {screen === "quiz" && (
          <React.Fragment><GameTitle>Quiz</GameTitle>
          <EnQuiz words={activeWords} starred={starred} toggleStar={toggleStar} addStar={addStar} onHome={home} />
          </React.Fragment>
        )}
        {screen === "speed" && (
          <React.Fragment><GameTitle>Speed Round</GameTitle>
          <EnSpeed words={activeWords} starred={starred} toggleStar={toggleStar} addStar={addStar} onHome={home} />
          </React.Fragment>
        )}
        {screen === "spelling" && (
          <React.Fragment><GameTitle>Spelling</GameTitle>
          <EnSpelling words={activeWords} starred={starred} toggleStar={toggleStar} addStar={addStar} onHome={home} />
          </React.Fragment>
        )}
        {screen === "wordlist" && <EnWordList allWords={listWords} starred={starred} mastered={mastered} toggleStar={toggleStar} toggleMastered={toggleMastered} myWords={myWords} removeMyWord={removeMyWord} />}
      </div>
    </div>
  );
}

    const lines = bulk.split("\n").map((s) => s.trim()).filter(Boolean);

    lines.forEach((line) => {
      const m = line.match(/^(.+?)\s*[:–—-]\s*(.+)$/);
      const word = (m ? m[1] : line).trim();
      const definition = m ? m[2].trim() : "";
      if (!word) return;
      addMyWord({
        word,
        definition: definition || "(definition coming — ask Claude to fill this in)",
        example: "",
        emoji: "📝",
        needsDef: !definition,
      });
      n++;

    setAdded(n); setBulk("");

function EnFlashcards({ words, starred, toggleStar, onlyStarred, onHome }) {
  const [deck, setDeck] = useState(() => shuffle(words));
  const [i, setI] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(0);
  const card = deck[i] || deck[0];

  if (!card) return (
    <Center>
      <div style={{ fontSize:54 }}>⭐</div>
      <h2 style={{ margin:"10px 0" }}>No tricky words yet</h2>
      <p style={{ color:"#7a7391", maxWidth:320, textAlign:"center" }}>Tap the ⭐ on a card to save it for extra practice.</p>
      <button onClick={onHome} style={{ ...bigBtn, background:"#5B8DEF", marginTop:16 }}>⬅ Back to menu</button>
    </Center>
  );

  const flagged = starred.has(card.word);
  const next = (got) => {
    if (got) { setKnown((k) => k + 1); playCorrect(known); }
    if (card) srsRecord("en:" + card.word, !!got);
    recordEffort();
    setFlipped(false);
    if (i + 1 < deck.length) setI(i + 1);
    else { setI(0); setDeck(srsOrder(shuffle(words), (w) => "en:" + w.word)); setKnown(0); }
  };

  return (
    <div style={{ textAlign:"center" }}>
      <Progress value={i} total={deck.length} label={onlyStarred ? "⭐ practice pile" : `✅ ${known} known`} />
      <div onClick={() => setFlipped((f) => { const n=!f; if(n) speakEn(card.word); return n; })}

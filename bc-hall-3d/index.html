<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blue Coast Function Hall – Expansion 3D (parking + pool side)</title>
<style>body{margin:0;overflow:hidden;font-family:system-ui,sans-serif}#hud{position:fixed;top:8px;left:8px;background:rgba(0,40,60,.8);color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;max-width:300px;z-index:5}

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<div id="hud"><b>Blue Coast Function Hall – expansion concept</b><br>
<span id="info"></span><br>
<button id="tLayout">Next view</button><button id="tView">Top view</button></div>
<div id="start">Click to walk<br><small>WASD / arrows to move · mouse to look · Esc to release</small></div>
<div id="joy"><div id="knob"></div></div><div id="look"></div>
<script type="module">
import * as THREE from 'three';
import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
// Units: meters. x along parking-side wall (grid 7→10), z depth. Sea-side wall z=0, old parking wall z=D0, new wall z=D1.
const W=18.58,D0=12.5,D1=18.4,H=3.4,P=2.05; // P = pool-side walkway depth (as-built plan: 2.047 m), extension goes to z=-P

// floor: cream polished tile

const tt=new THREE.CanvasTexture(tc);tt.wrapS=tt.wrapT=THREE.RepeatWrapping;tt.repeat.set(W/.6,D1/.6);tt.colorSpace=THREE.SRGBColorSpace;

const tt2=tt.clone();tt2.repeat.set(W/.6,P/.6);tt2.needsUpdate=true;const extFloorM=new THREE.MeshStandardMaterial({map:tt2,roughness:.15,metalness:.1}),deckM=M(0xb9b2a4);

for(let x=1.55;x<W;x+=3.1)for(let z=1.5-P;z<D1;z+=3){const c=new THREE.Mesh(new THREE.CircleGeometry(.09,12),dlm);c.rotation.x=Math.PI/2;c.position.set(x,H-.001,z);scene.add(c)}
for(const [x,z] of [[4.6,4],[14,4],[4.6,11],[14,11],[9.3,16],[4.6,-1],[14,-1]]){const l=new THREE.PointLight(0xfff0d0,14,14);l.position.set(x,H-.3,z);scene.add(l)}
// walls with openings
const wallM=M(0xfbf8f2),glass=new THREE.MeshStandardMaterial({color:0x9fd3e6,transparent:true,opacity:.35,roughness:.05}),frame=M(0x2d2a26),shade=M(0x3a3f45),doorM=M(0x7a5434);
const walls=[];
function wallX(z,openings,p=scene){ // wall along x at depth z, openings [{x0,x1,y0,y1,type}]
 box(W,.25,.25,wallM,W/2,H-.125,z,p);
 const xs=[0,...openings.flatMap(o=>[o.x0,o.x1]),W];
 for(let i=0;i<xs.length;i+=2)if(xs[i+1]>xs[i])box(xs[i+1]-xs[i],H,.25,wallM,(xs[i]+xs[i+1])/2,H/2,z,p);
 for(const o of openings){const w=o.x1-o.x0,cx=(o.x0+o.x1)/2;
  if(o.y0>0)box(w,o.y0,.25,wallM,cx,o.y0/2,z,p);box(w,H-o.y1,.25,wallM,cx,(H+o.y1)/2,z,p);
  const gm=o.type=='door'?glass:glass;box(w,o.y1-o.y0,.04,gm,cx,(o.y0+o.y1)/2,z,p);
  box(w,.06,.08,frame,cx,o.y1,z,p);box(.06,o.y1-o.y0,.08,frame,cx,(o.y0+o.y1)/2,z,p);
  if(o.type!='door')box(w,.35,.06,shade,cx,o.y1-.2,z+(z<1?.15:-.15),p);}
 walls.push({axis:'z',v:z});}
function wallZ(x,z0,z1,doors=[]){ const pts=[z0,...doors.flatMap(d=>[d[0],d[1]]),z1];
 for(let i=0;i<pts.length;i+=2)box(.25,H,pts[i+1]-pts[i],wallM,x,H/2,(pts[i]+pts[i+1])/2);
 for(const d of doors){box(.25,H-2.2,d[1]-d[0],wallM,x,(H+2.2)/2,(d[0]+d[1])/2);box(.06,2.2,d[1]-d[0]-.1,doorM,x+(x<1?.1:-.1),1.1,(d[0]+d[1])/2)}}
// sea-side wall: glass bays between columns (per photos)
const sea=[];for(const [a,b] of [[0,6.2],[6.2,12.4],[12.4,W]]){const m=(a+b)/2;sea.push({x0:a+.5,x1:m-.45,y0:.35,y1:2.4},{x0:m-.35,x1:m+.95,y0:0,y1:2.5,type:'door'},{x0:m+1.05,x1:b-.5,y0:.35,y1:2.4})}
const seaOld=new THREE.Group(),seaNew=new THREE.Group();scene.add(seaOld,seaNew);
wallX(0,sea,seaOld);wallX(-P,sea,seaNew); // 'Both sides': same glass bays rebuilt 2.05 m out at the pool edge
for(const x of [0,W])box(.25,H,P,wallM,x,H/2,-P/2,seaNew); // side walls closing the walkway ends
// new parking-side wall: windows + main double door + service door
wallX(D1,[{x0:1.2,x1:3.6,y0:.9,y1:2.3},{x0:8.1,x1:10.5,y0:.9,y1:2.3},{x0:14.8,x1:17.2,y0:.9,y1:2.3}]);
wallZ(0,0,D1,[[9.6,11.1]]);wallZ(W,0,D1,[[3,4.5]]);
const DOORS=[[3.4,1,1.6],[9.6,1,1.6],[15.8,1,1.6],[W-1,3.75,1.9],[1,10.35,1.9]],DOORS_B=DOORS.map((d,i)=>i<3?[d[0],d[1]-P,d[2]]:d);
const ddL=['Double door 1','Double door 2','Double door 3'].map((t,i)=>label(t,DOORS[i][0],2.2,.3));label('Kitchen door',W-.4,2.4,3.75);label('New stage-wall door',.4,2.4,10.35);
// old wall (current-size view only)
const oldWall=new THREE.Group();box(W,H,.25,M(0xeee6da),W/2,H/2,D0,oldWall);box(1.6,2.2,.27,doorM,W/2,1.1,D0,oldWall);scene.add(oldWall);oldWall.visible=false;
// columns: grid 7..10 at x=0,6.2,12.4,18.58 along old wall; 8 & 9 freestanding
const colM=M(0xf1ece2);const cols=[[6.2,D0],[12.4,D0]];
for(const [x,z] of cols){box(.5,H,.5,colM,x,H/2,z);label('Column (grid '+(x<7?8:9)+')',x,2.6,z)}
for(const x of [0,6.2,12.4,W])box(.45,H,.45,colM,Math.min(Math.max(x,.2),W-.2),H/2,.2);
// walkway columns at grid 8 & 9 on the pool edge (carry the 2nd-floor hallway); end up inside the new glass line
for(const x of [6.2,12.4])box(.35,H,.35,colM,x,H/2,-P);
const colsB=cols.concat([[6.2,.2],[12.4,.2]]);
for(const x of [0,W])box(.45,H,.45,colM,x?W-.2:.2,H/2,D0);
// stage + backdrop at sea-wall? put stage on west side wall
box(1.8,.45,6,M(0x6b4b35),1.0,.225,D0/2);label('Stage',1.0,1,D0/2);
// AC units
for(const z of [3,9,15]){box(.25,.3,1,M(0xffffff),W-.25,2.8,z);box(.25,.3,1,M(0xffffff),.25,2.8,z+1.5)}
// string lights (from photo)
const bulbM=new THREE.MeshBasicMaterial({color:0xffd27a});
for(let z=2;z<D1-1;z+=2.2)for(let x=3;x<W-.5;x+=.6){const b=new THREE.Mesh(new THREE.SphereGeometry(.04,6,6),bulbM);b.position.set(x,H-.35-Math.sin((x-3)/(W-3.5)*Math.PI)*.4,z);scene.add(b)}
// tables
const tableGeo=new THREE.CylinderGeometry(.9,.95,.76,24),topGeo=new THREE.CylinderGeometry(.92,.92,.03,24);
const clothT=M(0x2aa6b8),clothW=M(0xffffff),clothR=M(0xd9443a),chairM=M(0xbfbab0),seatM=M(0xf2e8d0);
function table(x,z,i,g){const t=new THREE.Group();t.position.set(x,0,z);const s=new THREE.Mesh(tableGeo,clothW);s.position.y=.38;t.add(s);const tp=new THREE.Mesh(topGeo,i%7==3?clothR:clothT);tp.position.y=.77;t.add(tp);
 for(let k=0;k<10;k++){const a=k/10*Math.PI*2,c=new THREE.Group();c.position.set(Math.cos(a)*1.25,0,Math.sin(a)*1.25);c.rotation.y=-a+Math.PI/2;
  box(.42,.06,.42,seatM,0,.46,0,c);box(.42,.5,.04,chairM,0,.75,.2,c);for(const[a2,b2]of[[-.18,-.18],[.18,-.18],[-.18,.18],[.18,.18]])box(.03,.45,.03,chairM,a2,.22,b2,c);t.add(c)}
 g.add(t)}
function layout(z0,depth,cap,cl=cols,dr=DOORS){const g=new THREE.Group();let pos=[];const sx=2.75,sz=2.75;
 for(let z=z0+2.4;z<depth-1.4;z+=sz)for(let x=2.9;x<W-1.2;x+=sx){if(cl.some(([cx,cz])=>Math.hypot(cx-x,cz-z)<1.85))continue;if(dr.some(([dx,dz,r])=>Math.hypot(dx-x,dz-z)<r))continue;pos.push([x,z])}
 pos=pos.slice(0,cap);pos.forEach((p,i)=>table(p[0],p[1],i,g));scene.add(g);return{g,n:pos.length,pos}}
const big=layout(0,D1,99),small=layout(0,D0,20),both=layout(-P,D1,99,colsB,DOORS_B);window._layouts={current:small.pos,parking:big.pos,both:both.pos};
// labels
const lW=label('18.58 m (grid 7 → 10)',W/2,.3,D1-.6),lN=label('Parking-side extension +5.9 m × 18.58 m ≈ 110 m²',W/2,.3,(D0+D1)/2+1.2),lO=label('Original hall 18.58 × 12.5 m = 232 m²',W/2,.3,3.6),lT=label('',W/2,.3,D0+.35),lDO=label('12.5 m',W-.6,.3,D0/2),lDN=label('',W-.6,.6,D1/2+2),
 lP=label('',W/2,.3,-P/2),lPT=label('- - - old glass wall line - - -',W/2,.3,.45);
const A0=W*D0,f1=v=>String(+v.toFixed(2)),fa=v=>Math.round(v),pct=a=>'+'+Math.round((a/A0-1)*100)+'%';
const MODES=['Current size','Parking side only','Both sides'];
function setMode(){const m=mode;big.g.visible=m==1;small.g.visible=m==0;both.g.visible=m==2;oldWall.visible=m==0;
 newTint.visible=lN.visible=lDN.visible=m>0;seaOld.visible=m<2;seaNew.visible=poolTint.visible=poolLine.visible=lPT.visible=m==2;poolBeam.visible=m==2&&!top;
 floorP.material=m==2?extFloorM:deckM;ddL.forEach(l=>l.position.z=m==2?.3-P:.3);
 lP.element.innerHTML=m==2?`Pool-side extension +${P} m × 18.58 m ≈ ${fa(W*P)} m²`:`Pool walkway ~${P} m (outside)`;
 lT.element.innerHTML=m>0?'- - - old parking wall line - - -':'current wall';
 const dep=m==2?D1+P:D1;lDN.element.innerHTML=f1(dep)+' m total depth';lDN.position.z=m==2?(D1-P)/2+2:D1/2+2;
 const a=m==0?A0:W*dep,L=[small,big,both][m];
 document.getElementById('info').innerHTML=`<b>${MODES[m]}:</b> 18.58 × ${f1(m==0?D0:dep)} m ≈ ${fa(a)} m²${m?' ('+pct(a)+')':''}<br>${L.n} tables × 10 = ${L.n*10} seats`+(m==0?" (today's tight max ~200)":' (tight banquet; clear paths kept at 3 double doors, kitchen door, stage-wall door and columns)')+'<br><small>Blue = original footprint · orange = parking-side extension'+(m==2?' · green = pool-side extension':'')+'</small>';
 document.getElementById('tLayout').textContent='Show: '+MODES[(m+1)%3];}
setMode();document.getElementById('tLayout').onclick=e=>{e.stopPropagation();mode=(mode+1)%3;if(!top){const p=cam.position;p.z=Math.min(Math.max(p.z,(mode==2?-P:0)+.4),(mode==0?D0:D1)-.4)}setMode()};
window._setMode=m=>{mode=m;setMode()};
document.getElementById('tView').onclick=e=>{e.stopPropagation();top=!top;e.target.textContent=top?'Walk view':'Top view';scene.children.forEach(o=>{if(o.position.y>H-.7&&!o.isLight)o.visible=!top});setMode();if(top){cam.position.set(W/2,28,(D1-P)/2+.01);cam.lookAt(W/2,0,(D1-P)/2)}else{cam.position.set(W/2,1.6,D1-1.5);cam.rotation.set(0,0,0)}};
// controls
const ctl=new PointerLockControls(cam,document.body);const st=document.getElementById('start');

else{st.onclick=()=>ctl.lock();ctl.addEventListener('lock',()=>st.style.display='none');ctl.addEventListener('unlock',()=>st.style.display='flex')}
const keys={};addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);
let jx=0,jy=0;const joy=document.getElementById('joy'),knob=document.getElementById('knob');
const jm=e=>{const r=joy.getBoundingClientRect(),t=e.targetTouches[0];let dx=t.clientX-r.left-60,dy=t.clientY-r.top-60;const d=Math.min(1,Math.hypot(dx,dy)/50),a=Math.atan2(dy,dx);jx=Math.cos(a)*d;jy=Math.sin(a)*d;knob.style.left=40+jx*40+'px';knob.style.top=40+jy*40+'px';e.preventDefault()};
joy.addEventListener('touchstart',jm);joy.addEventListener('touchmove',jm);joy.addEventListener('touchend',()=>{jx=jy=0;knob.style.left=knob.style.top='40px'});

 let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-jy,s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx;

 const ok=(x,z)=>x>r&&x<W-r&&z>minZ+r&&z<maxZ-r&&!cl.some(([cx,cz])=>Math.abs(cx-x)<.25+r&&Math.abs(cz-z)<.25+r);

step();

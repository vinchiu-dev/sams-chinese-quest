<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1E71A7" />
  <title>Blue Coast Events</title>
  <style>
    :root {
      --accent: #1E71A7;
      --accent-soft: #e8f3f9;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a2332;
      --muted: #5c6b7a;
      --border: #dde3ea;
      --won: #1a7f4b;
      --lost: #9b3b3b;
      --shadow: 0 1px 3px rgba(16, 40, 60, 0.08);
      --radius: 10px;
      --drawer-w: min(420px, 100vw);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    body.drawer-open { overflow: hidden; }

    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px 6px;
      position: relative;
      z-index: 20;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .topbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 12px;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
      min-width: 0;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .north-star {
      margin: 0;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .north-star strong { color: var(--accent); font-weight: 600; }
    .lead-count {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .banner {
      margin-top: 5px;
      background: var(--accent-soft);
      border: 1px solid #c5dceb;
      color: #154a6e;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      line-height: 1.3;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }
    .banner a { color: #0d4f7a; font-weight: 600; }
    .banner-btn {
      margin-left: auto;
      border: 1px solid #9bc0d8;
      background: #fff;
      color: #154a6e;
      font: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .banner-btn:hover { background: #eef6fb; }

    .revenue-panel {
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fafcfd;
    }
    .rev-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 4px 10px;
      background: #f0f4f7;
      border: 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font: inherit;
      text-align: left;
      color: inherit;
    }
    .rev-head:hover { background: #e8eef3; }
    .rev-head-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .rev-chevron {
      display: inline-block;
      width: 0.7rem;
      color: var(--muted);
      font-size: 0.62rem;
      transition: transform 0.12s ease;
      flex-shrink: 0;
    }
    .revenue-panel.is-collapsed .rev-chevron { transform: rotate(-90deg); }
    .revenue-panel.is-collapsed .rev-head { border-bottom: 0; }
    .revenue-panel.is-collapsed .rev-body { display: none; }
    .rev-head h2 {
      margin: 0;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .rev-total {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--won);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .rev-body { border-top: 0; }
    .rev-chart-wrap {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 6px 10px;
      padding: 6px 10px 4px;
      max-height: 78px;
      align-items: center;
    }
    .rev-donut-box {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 64px;
      width: 64px;
    }
    .rev-donut-box svg { width: 64px; height: 64px; display: block; }
    .rev-donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
      line-height: 1.15;
    }
    .rev-donut-center .big {
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .rev-donut-center .sub {
      font-size: 0.52rem;
      color: var(--muted);
      margin-top: 0;
    }
    .rev-legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px 8px;
      max-height: 68px;
      overflow: hidden;
      font-size: 0.62rem;
      align-content: start;
    }
    .rev-leg-item {
      display: grid;
      grid-template-columns: 8px 1fr auto;
      gap: 5px;
      align-items: center;
      min-width: 0;
    }
    .rev-swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .rev-leg-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 600;
    }
    .rev-leg-meta {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-size: 0.64rem;
    }
    .rev-bars {
      display: none;
      flex-direction: column;
      gap: 3px;
      padding: 8px 10px 4px;
      max-height: 108px;
      overflow: hidden;
    }
    .rev-bar-row {
      display: grid;
      grid-template-columns: 72px 1fr 78px;
      gap: 6px;
      align-items: center;
      font-size: 0.68rem;
    }
    .rev-bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: var(--text);
    }
    .rev-bar-track {
      height: 10px;
      background: #e6edf2;
      border-radius: 5px;
      overflow: hidden;
    }
    .rev-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 5px;
      min-width: 0;
    }
    .rev-bar-meta {
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-size: 0.64rem;
    }
    .rev-bar-meta strong { color: var(--won); font-weight: 700; }
    .rev-hint {
      margin: 0;
      padding: 0 10px 7px;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.25;
    }
    .rev-hint[hidden] { display: none !important; }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      margin-top: 7px;
      align-items: center;
    }
    .filters-row label.pipe-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
      flex-shrink: 0;
    }
    select {
      font: inherit;
      font-size: 0.82rem;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      min-width: 96px;
      text-transform: none;
      letter-spacing: normal;
      font-weight: 400;
    }
    #channel-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1.2;
    }
    .chip span {
      color: var(--muted);
      font-weight: 500;
      margin-left: 2px;
    }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .chip.active span { color: rgba(255,255,255,0.85); }

    .board-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      /* Keep touch-action auto so column-body can still pan-y (ancestor pan-x ∩ pan-y = none). */
      padding: 8px 12px 12px;
    }
    #board {
      display: flex;
      gap: 12px;
      align-items: stretch;
      min-width: min-content;
      height: 100%;
    }
    .column {
      flex: 0 0 min(270px, 33vw);
      width: min(270px, 33vw);
      background: #eef1f4;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      max-height: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .column.drag-over {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      background: #e4eef5;
    }
    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: #f8fafb;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .column-header h2 {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .col-count {
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      min-width: 22px;
      height: 22px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }
    .column-body {
      padding: 8px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overscroll-behavior: contain;
    }
    .empty {
      margin: 12px 4px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
    .error { color: var(--lost); padding: 24px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 11px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
      position: relative;
      user-select: none;
    }
    .card:hover, .card:focus {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(30, 113, 167, 0.18);
    }
    .card.dragging {
      opacity: 0.45;
    }
    .card-top {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
      align-items: center;
      padding-right: 28px;
    }
    .card-drag-handle {
      position: absolute;
      top: 6px;
      right: 4px;
      width: 28px;
      height: 28px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.95rem;
      line-height: 1;
      letter-spacing: -0.12em;
      cursor: grab;
      touch-action: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 2;
    }
    .card-drag-handle:hover,
    .card-drag-handle:focus-visible {
      background: var(--accent-soft);
      border-color: #c5dceb;
      color: var(--accent);
      outline: none;
    }
    .card-drag-handle:active { cursor: grabbing; }
    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .channel-badge {
      background: var(--accent);
      color: #fff;
    }
    .source-badge {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .card-title {
      margin: 0 0 2px;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .card-org, .card-meta, .card-contact, .card-updated, .card-fo-preview, .card-lost {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .card-org { color: var(--text); font-weight: 500; }
    .card-rev {
      margin: 4px 0 0;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--won);
    }
    .card-fo-preview {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
      color: #3d5a6e;
      font-style: italic;
    }
    .card-lost { color: var(--lost); font-weight: 500; }

    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 35, 50, 0.45);
      z-index: 40;
    }
    #backdrop.open { display: block; }

    #drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--drawer-w);
      height: 100%;
      background: var(--card);
      z-index: 50;
      transform: translateX(105%);
      transition: transform 0.22s ease;
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
    }
    #drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .drawer-header h2 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--accent);
    }
    #drawer-sub {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .icon-btn {
      border: none;
      background: #eef1f4;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text);
      flex-shrink: 0;
    }
    .drawer-body {
      padding: 14px 16px 24px;
      overflow-y: auto;
      flex: 1;
    }
    .field { margin-bottom: 14px; }
    .field > span, .field > label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .field p { margin: 0; font-size: 0.9rem; }
    .seed-box {
      background: #f7f9fb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-height: 140px;
      overflow-y: auto;
    }
    textarea, input[type="number"] {
      width: 100%;
      font: inherit;
      font-size: 0.95rem;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    textarea { min-height: 120px; resize: vertical; }
    textarea:focus, select:focus, input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .field-hint {
      margin: 4px 0 0;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.25;
    }
    .drawer-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      font: inherit;
      font-weight: 600;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    #save-msg {
      font-size: 0.8rem;
      color: var(--won);
      font-weight: 600;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(120%);
      background: #1a2332;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.22);
      z-index: 80;
      max-width: min(420px, calc(100vw - 24px));
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }


    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .btn-add {
      appearance: none;
      border: none;
      background: #0d9488;
      color: #fff;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }
    .btn-add:hover { background: #0f766e; }
    #add-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
      background: rgba(15, 23, 42, 0.45);
    }
    #add-modal.open { display: flex; }
    .add-card {
      width: min(440px, 100%);
      max-height: min(92vh, 720px);
      overflow: auto;
      background: #fff;
      border-radius: 14px 14px 10px 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.28);
      padding: 14px 14px 16px;
    }
    .add-card h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
    }
    .add-card .add-sub {
      margin: 0 0 12px;
      font-size: 0.75rem;
      color: var(--muted, #64748b);
      line-height: 1.35;
    }
    .add-card .field { margin-bottom: 10px; }
    .add-card label, .add-card .field > span {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    .add-card input, .add-card select, .add-card textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-size: 0.9rem;
    }
    .add-card textarea { min-height: 72px; resize: vertical; }
    .add-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .add-actions .btn-primary {
      flex: 1;
      appearance: none;
      border: none;
      background: #0d9488;
      color: #fff;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .add-actions .btn-ghost {
      appearance: none;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    @media (min-width: 721px) {
      #add-modal { align-items: center; }
      .add-card { border-radius: 14px; }
    }

    @media (max-width: 720px) {
      .rev-chart-wrap { grid-template-columns: 64px 1fr; max-height: 72px; }
      .rev-bar-row { grid-template-columns: 64px 1fr 70px; }
      .column { flex: 0 0 33vw; width: 33vw; min-width: 140px; max-height: 100%; height: 100%; }
      .board-wrap { padding: 6px 8px 10px; }
      #board { gap: 8px; }
      .topbar { padding: 4px 8px; }
      .brand h1 { font-size: 0.95rem; }
      .north-star { display: none; }
      #drawer { width: 100%; }
      .north-star { white-space: normal; }
      .filters-row { margin-top: 5px; }
      .revenue-panel { margin-top: 5px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <h1>Blue Coast Events</h1>
        <p class="north-star">North star: <strong id="north-star">YoY event sales growth</strong></p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn-add" id="btn-add-event">+ Add event</button>
      </div>
    </div>

    <section class="revenue-panel" id="revenue-panel" aria-label="Running event revenue by source">
      <button type="button" class="rev-head" id="rev-toggle" aria-expanded="true" aria-controls="rev-body" title="Collapse or expand revenue chart">
        <span class="rev-head-left">
          <span class="rev-chevron" aria-hidden="true">▾</span>
          <h2>Revenue by source</h2>
        </span>
        <span class="rev-total" id="rev-total">₱0 · 0 won</span>
      </button>
      <div class="rev-body" id="rev-body">
        <div class="rev-chart-wrap" id="rev-chart-wrap">
          <div class="rev-donut-box">
            <svg id="rev-donut" viewBox="0 0 120 120" aria-hidden="true"></svg>
            <div class="rev-donut-center">
              <span class="big" id="rev-donut-big">₱0</span>
              <span class="sub" id="rev-donut-sub">0 won</span>
            </div>
          </div>
          <div class="rev-legend" id="rev-legend"></div>
        </div>
      </div>
    </section>
  </header>

  <div class="board-wrap">
    <div id="board" aria-label="Events pipeline board"></div>
  </div>

  <div id="backdrop" aria-hidden="true"></div>
  <aside id="drawer" aria-label="Lead detail" role="dialog" aria-modal="true">
    <div class="drawer-header">
      <div>
        <h2 id="drawer-title">Lead</h2>
        <p id="drawer-sub"></p>
      </div>
      <button type="button" class="icon-btn" id="btn-close" aria-label="Close">×</button>
    </div>
    <div class="drawer-body">
      <div class="field" id="revenue-wrap">
        <label for="revenue-php">Event amount (₱)</label>
        <input type="number" id="revenue-php" min="0" step="1" placeholder="e.g. 85000" inputmode="numeric" />
        <p class="field-hint" id="revenue-hint">Feeds the pie chart when stage is Won.</p>
      </div>
      <div class="field">
        <span>Contact</span>
        <p id="drawer-contact"></p>
      </div>
      <div class="field">
        <span>Dates / Pax / Inquiry</span>
        <p id="drawer-dates"></p>
      </div>
      <div class="field">
        <span>Marketing channel</span>
        <select id="channel-select" aria-label="Marketing channel"></select>
      </div>
      <div class="field">
        <span>Stage</span>
        <select id="stage-select" aria-label="Change stage"></select>
      </div>
      <div class="field">
        <span>Seed / inbox notes</span>
        <div class="seed-box" id="drawer-seed"></div>
      </div>
      <div class="field">
        <label for="fo-notes">FO notes</label>
        <textarea id="fo-notes" placeholder="Call notes, next steps, quote amounts…"></textarea>
      </div>
      <div class="field" id="lost-reason-wrap" hidden>
        <label for="lost-reason">Lost reason</label>
        <textarea id="lost-reason" placeholder="Why lost / past…"></textarea>
      </div>
      <div class="drawer-actions">
        <button type="button" class="btn-primary" id="btn-save">Save</button>
        <span id="save-msg" hidden>Saved</span>
      </div>
    </div>
  </aside>


  <div id="add-modal" aria-hidden="true">
    <div class="add-card" role="dialog" aria-modal="true" aria-labelledby="add-title">
      <h2 id="add-title">Add event</h2>
      <p class="add-sub">Creates a card on the board. Also copies a Sheet row so every device stays in sync.</p>
      <div class="field">
        <label for="add-name">Guest / contact name *</label>
        <input id="add-name" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="add-org">Org / agency</label>
        <input id="add-org" />
      </div>
      <div class="field">
        <label for="add-phone">Phone</label>
        <input id="add-phone" inputmode="tel" />
      </div>
      <div class="field">
        <label for="add-email">Email</label>
        <input id="add-email" type="email" inputmode="email" />
      </div>
      <div class="field">
        <label for="add-dates">Event dates</label>
        <input id="add-dates" placeholder="e.g. 2026-10-12 to 2026-10-14" />
      </div>
      <div class="field">
        <label for="add-pax">Pax / rooms</label>
        <input id="add-pax" placeholder="e.g. 80" />
      </div>
      <div class="field">
        <label for="add-channel">Marketing channel</label>
        <select id="add-channel"></select>
      </div>
      <div class="field">
        <label for="add-stage">Stage</label>
        <select id="add-stage"></select>
      </div>
      <div class="field">
        <label for="add-notes">Notes</label>
        <textarea id="add-notes" placeholder="What they want, next step…"></textarea>
      </div>
      <div class="add-actions">
        <button type="button" class="btn-ghost" id="btn-add-cancel">Cancel</button>
        <button type="button" class="btn-primary" id="btn-add-save">Add to board</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#1E71A7"/>
<title>Command Center</title>
<link rel="icon" href="blue-coast-logo.png"/>
<style>
:root{--accent:#1E71A7;--accent-deep:#0f3d5c;--accent-soft:#e8f3f9;--bg:#f4f6f8;--card:#fff;--ink:#1a2332;--muted:#5c6b7a;--border:#dde3ea;
--green:#1a7f4b;--green-soft:#d8f5e5;--red:#b42318;--red-soft:#ffe4e8;--amber:#8a5a00;--amber-soft:#fff4d6;--shadow:0 1px 3px rgba(16,40,60,.08);--radius:14px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.35}
.wrap{max-width:980px;margin:0 auto;padding:12px 12px 56px}
.hero{background:linear-gradient(135deg,var(--accent-deep) 0%,var(--accent) 55%,#2a8fc4 100%);color:#fff;border-radius:16px;padding:12px 14px 10px;box-shadow:0 10px 28px rgba(30,113,167,.28);position:sticky;top:6px;z-index:5}
.hero h1{margin:0;font-size:1.15rem;letter-spacing:-.02em}
.hero .sub{margin:2px 0 8px;font-size:.78rem;opacity:.92}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs a{white-space:nowrap;text-decoration:none;color:#fff;font-weight:700;font-size:13px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
.tabs a.on{background:#fff;color:var(--accent-deep)}
.label{margin:16px 2px 8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.wide{grid-column:1/-1}
.k{font-size:12px;font-weight:700;color:var(--muted)}
.v{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.1}
.v.mid{font-size:1.45rem}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
.cmp{font-size:13px}
.foot{margin-top:auto;padding-top:8px;font-size:11px;color:var(--muted)}
.foot a,.cmp a{color:var(--accent)}
.pill{display:inline-block;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px}
.p-ok{background:var(--green-soft);color:var(--green)} .p-bad{background:var(--red-soft);color:var(--red)} .p-wait{background:var(--amber-soft);color:var(--amber)}
.bar{height:12px;background:#e2e8f0;border-radius:8px;position:relative;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--green)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:5px 4px;border-top:1px solid var(--border)} table.t td:not(:first-child){text-align:right;white-space:nowrap}
.links{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.links a{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--accent-deep);font-weight:700;box-shadow:var(--shadow)}
.links a span{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.note{font-size:12px;color:var(--muted);margin:12px 2px}
.dash{color:var(--muted)}
ol.rec{margin:6px 0 0;padding-left:20px;font-size:14px} ol.rec li{margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1 id="title">Command Center</h1><p class="sub" id="asof">Loading…</p><nav class="tabs" id="tabs"></nav></div>
  <main id="main"></main>
  <p class="note">Every number shows its date and source. "—" means not available yet; nothing is estimated unless labeled. Not search-indexed, but anyone with the link can open this page.</p>
</div>
<script>
(function(){
var NOW=new Date(), TABS=[], CACHE={};
var SYM={PHP:'₱',USD:'$'};
function money(n,cur,dec){ if(n==null||isNaN(n)) return '—'; var s=SYM[cur]||'', a=Math.abs(n), neg=n<0?'−':'';
  if(a>=1e6) return neg+s+(a/1e6).toFixed(dec==null?2:dec)+'M'; if(a>=1e5) return neg+s+Math.round(a/1e3).toLocaleString()+'K'; if(a>=1e4) return neg+s+(a/1e3).toFixed(1)+'K'; return neg+s+Math.round(a).toLocaleString(); }
function num(n){ return n==null?'—':Number(n).toLocaleString(); }
function pctv(x,d){ return x==null||isNaN(x)?'—':(x*100).toFixed(d==null?1:d)+'%'; }
function growth(a,b){ return (a==null||b==null||!b)?null:(a/b-1)*100; }
function arrow(p,suffix,inv){ if(p==null||isNaN(p)) return '<span class="dash">—</span>'; var c=p>0.05?(inv?'down':'up'):p<-0.05?(inv?'up':'down'):'flat', ar=p>0.05?'▲':p<-0.05?'▼':'▶';
  return '<span class="'+c+'">'+ar+' '+(p>0?'+':'')+p.toFixed(1)+(suffix||'%')+'</span>'; }
function pts(a,b){ return (a==null||b==null)?null:(a-b)*100; }
function fmtDate(s){ if(!s) return '—'; var d=new Date(String(s).length===10? s+'T12:00:00':s); return isNaN(d)?esc(s):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function a(url,txt){ return url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(txt)+'</a>':esc(txt); }
function card(k,v,cmp,foot,cls,vcls){ return '<div class="card '+(cls||'')+'"><div class="k">'+k+'</div><div class="v '+(vcls||'')+'">'+v+'</div><div class="cmp">'+(cmp||'')+'</div><div class="foot">'+(foot||'')+'</div></div>'; }
function getJSON(u){ return fetch(u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }); }
function sec(title,inner,grid){ return '<div class="label">'+esc(title)+'</div>'+(grid===false?inner:'<div class="grid">'+inner+'</div>'); }

var R={};
R.financials=function(b){
  var c=b.currency, m=b.month||{}, y=b.ytd||{}, src='As of '+fmtDate(b.as_of)+' · '+a(b.source_url,b.period_label+' statement');
  var h='';
  h+=card(esc(b.ni_label)+' · '+esc(b.period_label), money(m.ni,c), 'Last year '+money(m.ni_ly,c)+' · '+arrow(growth(m.ni,m.ni_ly)), src);
  h+=card(esc(b.ni_label)+' YTD · '+esc(b.ytd_label), money(y.ni,c), 'Last year '+money(y.ni_ly,c)+' · '+arrow(growth(y.ni,y.ni_ly)), src);
  h+=card('Sales · '+esc(b.period_label), money(m.sales,c), 'Last year '+money(m.sales_ly,c)+' · '+arrow(growth(m.sales,m.sales_ly)), src);
  h+=card('Sales YTD · '+esc(b.ytd_label), money(y.sales,c), 'Last year '+money(y.sales_ly,c)+' · '+arrow(growth(y.sales,y.sales_ly)), src);
  function mg(x,s){ return (x==null||!s)?null:x/s; }
  function mrow(lbl,cur,ly){ return '<tr><td>'+lbl+'</td><td><b>'+pctv(cur)+'</b></td><td>'+pctv(ly)+'</td><td>'+arrow(pts(cur,ly),' pts')+'</td></tr>'; }
  var t='<table class="t"><tr><td class="k">Margins</td><td class="k">Now</td><td class="k">Last yr</td><td class="k">Change</td></tr>';
  t+=mrow('Net margin · month',mg(m.ni,m.sales),mg(m.ni_ly,m.sales_ly));
  t+=mrow('Net margin · YTD',mg(y.ni,y.sales),mg(y.ni_ly,y.sales_ly));
  if(m.gp!=null||y.gp!=null){ t+=mrow('Gross margin · month',mg(m.gp,m.sales),mg(m.gp_ly,m.sales_ly)); t+=mrow('Gross margin · YTD',mg(y.gp,y.sales),mg(y.gp_ly,y.sales_ly)); }
  else t+='<tr><td>Gross margin</td><td colspan="3" class="dash">— not in statement</td></tr>';
  (b.rows||[]).forEach(function(r){
    if(r.fmt==='pct_points') t+='<tr><td>'+esc(r.label)+(r.note?' <span class="dash">('+esc(r.note)+')</span>':'')+'</td><td><b>'+pctv(r.value)+'</b></td><td>'+pctv(r.value_ly)+'</td><td>'+arrow(pts(r.value,r.value_ly),' pts',r.lower_is_better)+'</td></tr>';
    else t+='<tr><td>'+esc(r.label)+(r.note?' <span class="dash">('+esc(r.note)+')</span>':'')+'</td><td><b>'+money(r.value,c)+'</b></td><td>'+money(r.value_ly,c)+'</td><td>'+arrow(growth(r.value,r.value_ly))+'</td></tr>';
  });
  t+='</table>';
  h+='<div class="card wide">'+t+'<div class="foot">'+src+' · '+esc(b.note||'')+'</div></div>';
  return sec('Financials · latest monthly statement',h);
};
R.youtube=function(b){
  var hist=(b.history||[]).slice().sort(function(x,y){return x.date<y.date?-1:1;}), first=hist[0], last=hist[hist.length-1];
  var h='';
  if(b.subscribers==null && !b.url){ return sec('YouTube',card('YouTube','<span class="dash">—</span>','No channel found','As of '+fmtDate(b.as_of),'','mid')); }
  var dsub='', dview='';
  if(hist.length>1){ var days=Math.round((new Date(last.date)-new Date(first.date))/864e5);
    dsub=' · '+arrow(growth(last.subscribers,first.subscribers))+' in '+days+'d'; dview=' · +'+num(last.total_views-first.total_views)+' in '+days+'d'; }
  h+=card('Subscribers · '+a(b.url,b.handle), esc(b.subscribers_display||num(b.subscribers)), (b.videos?num(b.videos)+' videos':'')+dsub+(hist.length<2?' <span class="dash">Growth: — (first snapshot '+fmtDate(first&&first.date)+')</span>':''), 'As of '+fmtDate(b.as_of)+' · '+esc(b.source),'','mid');
  h+=card('Total channel views', num(b.total_views), dview||'<span class="dash">Growth shows after the next snapshot</span>', 'As of '+fmtDate(b.as_of)+' · public channel page','','mid');
  h+=card('Views, 28 days'+(b.views_28d_label?' · '+esc(b.views_28d_label):''), b.views_28d==null?'<span class="dash">—</span>':num(b.views_28d),
    (b.views_prior_28d!=null?'Prior 28 days '+num(b.views_prior_28d)+' · '+arrow(growth(b.views_28d,b.views_prior_28d)):'Prior 28 days: <span class="dash">—</span>')+(b.subs_change_28d!=null?' · subs '+(b.subs_change_28d>0?'+':'')+b.subs_change_28d:''),
    esc(b.views_28d_source||'Needs YouTube Studio access (not public)'),'','mid');
  return sec('YouTube',h)+(b.note?'<p class="note">'+esc(b.note)+'</p>':'');
};
R.renovation=function(b){
  function daysTo(ymd){ return Math.ceil((new Date(ymd+'T00:00:00+08:00')-NOW)/864e5); }
  function dnum(y){ var p=y.split('-'); return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5; }
  var tdy=dnum(NOW.getFullYear()+'-'+(NOW.getMonth()+1)+'-'+NOW.getDate());
  var done=b.items_total?b.items_done/b.items_total:null, planNow=Math.max(0,Math.min(1,(tdy-dnum(b.start))/(dnum(b.finish_target)-dnum(b.start))));
  var age=(NOW-new Date(b.as_of))/864e5;
  var pill=b.status==='on_track'?'<span class="pill p-ok">On track</span>':b.status==='behind'?'<span class="pill p-bad">Behind plan</span>':'<span class="pill p-wait">Pending first check</span>';
  var x='<div class="row"><div><div class="k">Status (tracker\'s own rule)</div><div style="margin-top:6px">'+pill+'</div></div>';
  x+='<div><div class="k">Days to Christmas</div><div class="v">'+Math.max(daysTo(b.owner_deadline||'2026-12-25'),0)+'</div></div>';
  x+='<div><div class="k">Days to finish target ('+fmtDate(b.finish_target)+')</div><div class="v">'+Math.max(daysTo(b.finish_target),0)+'</div></div>';
  x+='<div><div class="k">Items done</div><div class="v mid">'+(done==null?'—':Math.round(done*100)+'%')+'</div><div class="cmp">'+b.items_done+' of '+b.items_total+' · plan at check '+Math.round((b.plan_pct_at_check||0)*100)+'%</div></div></div>';
  if(done!=null) x+='<div class="bar"><i style="width:'+(done*100).toFixed(1)+'%"></i><b style="left:'+(planNow*100).toFixed(1)+'%"></b></div><div class="cmp">Black line = where the plan expects us today ('+Math.round(planNow*100)+'%). Rooms: '+b.areas_ready+' ready · '+b.areas_in_work+' in work · '+b.areas_need_fix+' need fixes · '+b.areas_not_started+' not started (of '+b.areas_total+').</div>';
  x+='<div class="cmp" style="margin-top:6px">'+esc(b.note)+(age>4?' <b class="down">Snapshot is '+Math.floor(age)+' days old.</b>':'')+'</div>';
  x+='<div class="foot">As of '+esc(b.as_of_et_label||fmtDate(b.as_of))+' · '+a(b.tracker_url,'Renovation tracker')+' · Christmas = Dec 25; tracker finish target '+fmtDate(b.finish_target)+'</div>';
  return sec('Renovations: done before Christmas?','<div class="card wide">'+x+'</div>');
};
R.kpis=function(b,tab){
  var h='', pend=[];
  (b.items||[]).forEach(function(it,i){
    if(it.type){ var id='live-'+tab+'-'+i; h+='<div class="card" id="'+id+'"><div class="k">'+esc(it.label)+'</div><div class="v mid dash">…</div></div>'; pend.push([id,it]); return; }
    var c=it.currency, v=it.fmt==='money'?money(it.value,c):it.fmt==='score10'?(it.value==null?'—':it.value.toFixed(1)+'<span style="font-size:1rem;color:var(--muted)">/10</span>'):num(it.value);
    var cmp='';
    if(it.value_ly!=null) cmp='Last year '+money(it.value_ly,c)+' · '+arrow(growth(it.value,it.value_ly));
    else if(it.compare_value!=null) cmp=esc(it.compare_label||'vs')+' '+money(it.compare_value,c)+' · '+arrow(growth(it.value,it.compare_value));
    if(it.sub) cmp+=(cmp?'<br>':'')+'<span class="dash">'+esc(it.sub)+'</span>';
    if(it.note) cmp+='<br><span class="dash">'+esc(it.note)+'</span>';
    h+=card(esc(it.label),v,cmp,'As of '+fmtDate(it.as_of)+' · '+esc(it.source)+(it.link?' · '+a(it.link,'open'):''),'','mid');
  });
  setTimeout(function(){ pend.forEach(function(p){ LIVE[p[1].type](p[0],p[1]); }); },0);
  return sec(b.title||'More',h);
};
R.ads_weekly=function(b){
  var t=b.target||{}, ap=b.ads_pct_of_sales||{}, pct=ap.pct;
  var cls=pct==null?'dash':pct>t.ceiling?'down':pct>t.high?'flat':'up';
  var pctTxt=pct==null?'<span class="dash">—</span>':'<span class="'+cls+'">'+pctv(pct,2)+'</span>';
  var band=pct==null?'':pct>t.ceiling?'Above the '+pctv(t.ceiling,0)+' ceiling':pct>t.high?'Above target, under the ceiling':pct>=t.low?'In the target band':'Below target (room to scale)';
  var h='<div class="row"><div><div class="k">Ads % of sales · '+esc(ap.window_label||'—')+'</div><div class="v">'+pctTxt+'</div><div class="cmp">'+(ap.ads_cost!=null?money(ap.ads_cost,'USD')+' ads ÷ '+money(ap.sales,'USD')+' sales · ':'')+'target '+pctv(t.low,0)+'–'+pctv(t.high,0)+', ceiling '+pctv(t.ceiling,0)+(band?' · <b>'+band+'</b>':'')+'</div></div>';
  var o=b.osaki||{};
  var vpill=!o.verdict?'<span class="pill p-wait">'+(b.status==='pending'?'First review '+fmtDate(b.first_review).replace(/, \d{4}$/,''):'—')+'</span>':'<span class="pill '+(/^(keep|scale)/i.test(o.verdict)?'p-ok':/^(pause|cut)/i.test(o.verdict)?'p-bad':'p-wait')+'">'+esc(o.verdict_label||o.verdict)+'</span>';
  h+='<div><div class="k">Osaki verdict · '+esc(o.campaign||'Brands → Osaki')+'</div><div style="margin-top:8px">'+vpill+'</div>'+(o.reason?'<div class="cmp" style="margin-top:4px">'+esc(o.reason)+'</div>':'')+'</div></div>';
  var recs=b.recommendations||[];
  h+='<div class="k" style="margin-top:10px">Top recommended changes'+(b.week_of?' · week of '+fmtDate(b.week_of):'')+'</div>';
  h+=recs.length?'<ol class="rec">'+recs.slice(0,3).map(function(r){return '<li><b>'+esc(r.title)+'</b>'+(r.detail?' · '+esc(r.detail):'')+(r.impact?' <span class="dash">('+esc(r.impact)+')</span>':'')+(r.status?' <span class="pill p-wait" style="font-size:11px;padding:2px 7px">'+esc(r.status)+'</span>':'')+'</li>';}).join('')+'</ol>'
     :'<div class="cmp dash" style="margin-top:4px">First review Tue '+fmtDate(b.first_review).replace(/, \d{4}$/,'')+'</div>';
  h+='<div class="foot">'+esc(b.account||'')+(b.updated_at_et?' · reviewed '+fmtDate(b.updated_at_et):'')+' · Ads %: as of '+fmtDate(ap.as_of)+' · '+esc(ap.source||'')+(b.source?' · '+esc(b.source):'')+'</div>';
  return sec('Google Ads: weekly recommendations','<div class="card wide">'+h+'</div>');
};
R.links=function(b){ return sec('Open','<div class="links">'+(b.items||[]).map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'<span>'+esc(l.sub||'')+'</span></a>';}).join('')+'</div>',false); };

var LIVE={};
LIVE.live_crm_pipeline=function(id,it){ getJSON(it.url).then(function(C){
    var open={new_inquiry:1,preparing_quote:1,quoted:1}, today=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
    var MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    function evDate(t){ if(!t) return null; var m=String(t).match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
      m=String(t).match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:\s+(\d{1,2})\b)?/i); var y=String(t).match(/\b(20\d\d)\b/);
      return (m&&y)?new Date(+y[1],MON[m[1].toLowerCase()],m[2]?+m[2]:28):null; }
    var n=0,nOpen=0,val=0,priced=0;
    (C.leads||[]).forEach(function(l){ if(!open[l.stage]) return; nOpen++; var d=evDate(l.event_dates); if(d&&d>=today){ n++; if(typeof l.revenue_php==='number'){ val+=l.revenue_php; priced++; } } });
    var last=(C.leads||[]).reduce(function(x,l){return l.last_updated>x?l.last_updated:x;},'');
    document.getElementById(id).innerHTML='<div class="k">'+esc(it.label)+'</div><div class="v mid">'+n+' leads · '+money(val,'PHP')+'</div><div class="cmp">'+priced+' of '+n+' priced (quotes or agency budgets; some OCD items may overlap). '+nOpen+' open leads total.</div><div class="foot">Live from CRM · last edit '+fmtDate(last)+' · '+a(it.link,'Events CRM')+'</div>';
  }).catch(function(){ document.getElementById(id).innerHTML='<div class="k">'+esc(it.label)+'</div><div class="v mid dash">—</div><div class="foot">Could not load CRM data.</div>'; }); };
LIVE.live_ota_week=function(id,it){ getJSON(it.url).then(function(O){
    var w=O.windows||{}, x=w.last_7d||{}, y=w.yoy_7d||{};
    document.getElementById(id).innerHTML='<div class="k">Confirmed room bookings · '+fmtDate(x.window&&x.window[0])+'–'+fmtDate(x.window&&x.window[1])+'</div><div class="v mid">'+num(x.reservations_confirmed)+'</div><div class="cmp">Same week last year '+num(y.reservations_confirmed)+' · '+arrow(growth(x.reservations_confirmed,y.reservations_confirmed))+'<br>Value '+money(x.amount_php_sum,'PHP')+' vs '+money(y.amount_php_sum,'PHP')+'</div><div class="foot">As of '+fmtDate(O.run_date_et)+' · Cloudbeds confirmation emails · '+a(it.link,'OTA board')+'</div>';
  }).catch(function(){ document.getElementById(id).innerHTML='<div class="k">'+esc(it.label)+'</div><div class="v mid dash">—</div><div class="foot">Could not load OTA data.</div>'; }); };

function render(){
  var id=(location.hash||'').replace('#','')||(TABS[0]&&TABS[0].id), tab=TABS.filter(function(t){return t.id===id;})[0]||TABS[0];
  if(tab.id!==id) history.replaceState(null,'','#'+tab.id);
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<a href="#'+t.id+'" class="'+(t.id===tab.id?'on':'')+'">'+esc(t.label)+'</a>';}).join('');
  var main=document.getElementById('main'); main.innerHTML='<p class="note">Loading '+esc(tab.label)+'…</p>';
  (CACHE[tab.id]?Promise.resolve(CACHE[tab.id]):getJSON(tab.file)).then(function(D){
    CACHE[tab.id]=D;
    document.title=(D.name||tab.label)+' · Command Center';
    document.getElementById('title').textContent=(D.name||tab.label)+' · Command Center';
    document.getElementById('asof').textContent='Data as of '+fmtDate(D.updated_at_et)+' · tab #'+tab.id+' · bookmark this tab';
    main.innerHTML=(D.layout||[]).map(function(k){ var b=D[k]; if(!b||!R[b.type]) return ''; try{ return R[b.type](b,tab.id); }catch(e){ console.warn(k,e); return '<p class="note">Block '+esc(k)+' failed to render.</p>'; } }).join('');
  }).catch(function(e){ main.innerHTML='<p class="note">Could not load '+esc(tab.file)+' ('+esc(e.message)+')</p>'; });
}
getJSON('tabs.json').then(function(T){ TABS=T.tabs||[]; window.addEventListener('hashchange',render); render(); })
  .catch(function(e){ document.getElementById('asof').textContent='Could not load tabs.json'; });
})();
</script>

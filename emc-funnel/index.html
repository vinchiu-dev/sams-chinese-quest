<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="emc-funnel-version" content="2026-09-15-weekly-v1"/>
<title>EMC · Weekly funnel check</title>
<style>
  :root {
    --blue-deep: #001a9e; --blue-rich: #0126de; --pink: #e018cf;
    --green: #1fc41a; --green-soft: #d8ffd6; --green-ink: #0f8a0c; --green-border: #4ae045;
    --yellow: #e6c200; --yellow-soft: #fff4a8; --yellow-ink: #7a6200;
    --red: #e11d48; --red-soft: #ffe4e8; --red-ink: #9f1239;
    --unknown: #94a3b8; --unknown-soft: #e2e8f0; --unknown-ink: #475569;
    --ink: #0b1220; --muted: #334155; --card: rgba(255,255,255,.95);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(900px 520px at 0% 0%, rgba(1,38,222,.55) 0%, transparent 55%),
      radial-gradient(860px 480px at 100% 15%, rgba(224,24,207,.45) 0%, transparent 52%),
      linear-gradient(165deg, #001a9e 0%, #0a2ad8 38%, #9b18d4 72%, #e018cf 100%);
    color: var(--ink); min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 22px 16px 72px; }
  .hero {
    border-radius: 22px; padding: 18px 18px 14px;
    background: linear-gradient(135deg, #001a9e 0%, #0126de 42%, #c218d8 78%, #e018cf 100%);
    color: #fff; box-shadow: 0 16px 40px rgba(0,26,158,.35);
    border: 1px solid rgba(230,194,0,.35); margin-bottom: 14px;
  }
  .hero h1 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
  .hero .sub { margin: 8px 0 0; color: rgba(255,255,255,.92); font-size: 13px; line-height: 1.45; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); color: #fff;
  }
  .chip strong { color: var(--yellow-soft); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .section-label {
    margin: 20px 0 8px; font-size: 11px; font-weight: 800;
    letter-spacing: .14em; text-transform: uppercase; color: var(--yellow);
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .stage {
    background: var(--card); border-radius: 18px; padding: 14px 16px 14px;
    margin-bottom: 12px; border: 1px solid rgba(255,255,255,.5);
    box-shadow: 0 8px 24px rgba(0,26,158,.16);
  }
  .stage.highlight-yt { border: 1.5px solid rgba(31,196,26,.45); }
  .stage .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .stage h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
  .q { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
  .ans { margin: 10px 0 0; font-size: 14px; line-height: 1.45; font-weight: 650; }
  .metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    gap: 8px; margin-top: 12px;
  }
  .metric {
    background: #f8fafc; border-radius: 12px; padding: 9px 10px;
    border: 1px solid #e2e8f0; min-height: 78px;
  }
  .metric.key { border-color: #fde047; background: linear-gradient(180deg, #fff 0%, var(--yellow-soft) 140%); }
  .metric.yt { border-color: #86efac; background: linear-gradient(180deg, #fff 0%, var(--green-soft) 160%); }
  .metric.steady { border-color: var(--green-border); }
  .metric .lab { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #64748b; }
  .metric .val { font-size: 18px; font-weight: 800; margin-top: 3px; letter-spacing: -.03em; }
  .metric .val.unk { color: var(--unknown-ink); font-size: 16px; font-weight: 700; }
  .metric .delta { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .metric .stamp { margin-top: 6px; }
  .pill {
    font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 999px;
    white-space: nowrap; border: 1px solid transparent; display: inline-block;
  }
  .pill.green, .pill.steady { background: var(--green-soft); color: var(--green-ink); border-color: #86efac; }
  .pill.yellow { background: var(--yellow-soft); color: var(--yellow-ink); border-color: #fde047; }
  .pill.red { background: var(--red-soft); color: var(--red-ink); border-color: #fda4af; }
  .pill.unknown { background: var(--unknown-soft); color: var(--unknown-ink); border-color: #cbd5e1; }
  .charts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px; margin-top: 12px;
  }
  .chart {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 10px 6px;
  }
  .chart-title { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #64748b; }
  .chart-cap { font-size: 11px; color: var(--muted); margin: 2px 0 6px; }
  svg.spark { width: 100%; height: 92px; display: block; }
  .sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-top: 12px; }
  .src {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px;
  }
  .src.yt { border-color: #86efac; background: linear-gradient(180deg,#fff,#d8ffd6); }
  .src h3 { margin: 0; font-size: 13px; }
  .src .sv { font-size: 16px; font-weight: 800; margin-top: 4px; }
  .src .sd { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .log { list-style: none; margin: 10px 0 0; padding: 0; }
  .log li {
    display: grid; grid-template-columns: 92px 1fr; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid #e2e8f0; font-size: 13px; line-height: 1.4;
  }
  .log li:last-child { border-bottom: 0; }
  .log .when { font-weight: 800; color: var(--blue-rich); font-size: 12px; }
  .notice-grid { display: grid; gap: 8px; margin-top: 10px; }
  .ncard {
    border-radius: 14px; padding: 12px 14px; border: 1.5px solid #e2e8f0; background: #fff;
  }
  .ncard.moved { background: linear-gradient(160deg, #fff 0%, var(--yellow-soft) 100%); border-color: rgba(230,194,0,.7); }
  .ncard.red { background: linear-gradient(160deg, #fff 0%, var(--red-soft) 100%); border-color: #fda4af; }
  .ncard.steady { background: linear-gradient(160deg, #fff 0%, var(--green-soft) 100%); border-color: var(--green-border); }
  .ncard.unk { background: #f8fafc; }
  .ncard .nl { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  .ncard p { margin: 0; font-size: 14px; font-weight: 650; line-height: 1.4; }
  .banner {
    background: rgba(255,255,255,.92); border: 1.5px dashed rgba(230,194,0,.75);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 12px;
    font-size: 13px; line-height: 1.45; font-weight: 650;
  }
  .legend {
    background: rgba(255,255,255,.9); border-radius: 16px; padding: 12px 14px;
    font-size: 12.5px; line-height: 1.45; color: var(--muted); margin-top: 8px;
  }
  .legend strong { color: var(--ink); }
  .footer { margin-top: 14px; font-size: 11px; color: rgba(255,255,255,.85); }
  a { color: #1d4ed8; }
  .hero a { color: var(--yellow-soft); }
  .ctx-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  @media (max-width: 720px) { .ctx-row { grid-template-columns: 1fr; } .log li { grid-template-columns: 1fr; gap: 2px; } }
  .boot { color: #fff; font-weight: 700; padding: 24px; }
  ul.blockers { margin: 8px 0 0; padding-left: 1.15rem; font-size: 13px; color: var(--muted); }
  .ux { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); background: #f8fafc; border-radius: 10px; padding: 8px 10px; }
</style>
</head>
<body>
  <div class="wrap" id="app"><p class="boot">Loading LAST-RUN.json…</p></div>
<script>
(function () {
  const FALLBACK_URL = "LAST-RUN.json";

  const $app = document.getElementById("app");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function isNil(v) { return v === null || v === undefined || v === ""; }

  function fmtNum(v, kind) {
    if (isNil(v) || Number.isNaN(Number(v))) return null;
    const n = Number(v);
    if (kind === "usd") {
      if (Math.abs(n) >= 10000) return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 });
      return "$" + n.toLocaleString("en-US", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
    }
    if (kind === "usd_exact") {
      return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    if (kind === "pct") {
      const p = Math.abs(n) <= 1.5 && kind === "pct" ? n * 100 : n;
      /* bounce_rate may be 0–1 or 0–100; caller should pass already-scaled or use fmtPct */
      return null;
    }
    if (kind === "ratio") {
      if (n === 0) return "0";
      if (Math.abs(n) < 0.0001) return n.toExponential(1);
      if (Math.abs(n) < 0.01) return n.toFixed(4);
      if (Math.abs(n) < 1) return n.toFixed(3);
      return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
    }
    if (kind === "hours") return n.toLocaleString("en-US", { maximumFractionDigits: 1 }) + " h";
    if (kind === "sec") {
      if (n >= 120) return Math.round(n / 60) + " min";
      return Math.round(n) + " s";
    }
    if (Math.abs(n) >= 10000) return n.toLocaleString("en-US", { maximumFractionDigits: 0 });
    if (Number.isInteger(n)) return n.toLocaleString("en-US");
    return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
  }

  function fmtPctPoints(v, alreadyRatio) {
    if (isNil(v) || Number.isNaN(Number(v))) return null;
    const n = Number(v);
    const pct = (alreadyRatio || Math.abs(n) <= 1.5) ? n * 100 : n;
    const sign = pct > 0 ? "+" : "";
    return sign + pct.toFixed(Math.abs(pct) >= 10 ? 0 : 1) + "%";
  }

  function fmtBounce(v) {
    if (isNil(v)) return null;
    const n = Number(v);
    const pct = Math.abs(n) <= 1.5 ? n * 100 : n;
    return pct.toFixed(1) + "%";
  }

  function fmtVal(v, kind) {
    if (kind === "pct_bh") return fmtBounce(v);
    if (kind === "bounce") return fmtBounce(v);
    if (kind === "delta_pct") return fmtPctPoints(v, false);
    const s = fmtNum(v, kind);
    return s;
  }

  function displayVal(v, kind) {
    const s = fmtVal(v, kind);
    if (s == null) return '<span class="val unk">Unknown</span>';
    return '<span class="val">' + esc(s) + "</span>";
  }

  function normStatus(s) {
    if (!s) return "unknown";
    const x = String(s).toLowerCase();
    if (x === "green" || x === "steady") return "steady";
    if (x === "yellow") return "yellow";
    if (x === "red") return "red";
    return "unknown";
  }

  function pill(status, label) {
    const n = normStatus(status);
    const text = label || (
      n === "steady" ? "✓ Steady" :
      n === "yellow" ? "Yellow" :
      n === "red" ? "Red" : "Unknown"
    );
    return '<span class="pill ' + n + '">' + esc(text) + "</span>";
  }

  function metricStamp(m) {
    if (!m) return pill("unknown");
    const n = normStatus(m.status);
    if (n === "steady") return pill("steady", "✓ Steady");
    if (n === "yellow" || n === "red") return pill(n);
    if (!isNil(m.last_7d) && isNil(m.wow_pct) && isNil(m.yoy_pct)) return pill("unknown", "No delta");
    return pill("unknown");
  }

  function deltaLine(m) {
    if (!m) return "—";
    const bits = [];
    if (!isNil(m.wow_pct)) bits.push("WoW " + (fmtPctPoints(m.wow_pct, Math.abs(Number(m.wow_pct)) <= 1.5) || "—"));
    else bits.push("WoW —");
    if (!isNil(m.yoy_pct)) bits.push("YoY " + (fmtPctPoints(m.yoy_pct, Math.abs(Number(m.yoy_pct)) <= 1.5) || "—"));
    else bits.push("YoY —");
    if (m.note && isNil(m.last_7d)) bits.push(m.note);
    return bits.join(" · ");
  }

  function metricCard(label, m, kind, extraClass) {
    const cls = ["metric", extraClass || ""];
    if (m && normStatus(m.status) === "steady") cls.push("steady");
    return (
      '<div class="' + cls.join(" ").trim() + '">' +
        '<div class="lab">' + esc(label) + "</div>" +
        displayVal(m && m.last_7d, kind) +
        '<div class="delta">' + esc(deltaLine(m)) + "</div>" +
        '<div class="stamp">' + metricStamp(m) + "</div>" +
      "</div>"
    );
  }

  function winLabel(w) {
    if (!w || !w.start_et || !w.end_et) return "not set";
    return w.start_et.replace(/^\d{4}-/, "") + " → " + w.end_et.replace(/^\d{4}-/, "");
  }

  function lineChart(days, key, title, color) {
    const w = 480, h = 92, pL = 6, pR = 6, pT = 10, pB = 16;
    const innerW = w - pL - pR, innerH = h - pT - pB;
    const pts = (days || []).map(function (d) {
      const v = d ? d[key] : null;
      return { date: d && d.date, v: isNil(v) ? null : Number(v) };
    });
    const nums = pts.map(function (p) { return p.v; }).filter(function (v) { return v != null && !Number.isNaN(v); });
    if (!pts.length || !nums.length) {
      return (
        '<div class="chart">' +
          '<div class="chart-title">' + esc(title) + "</div>" +
          '<p class="chart-cap">Unknown — fill 30–50 daily points in traffic.series.days</p>' +
          '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
            '<line x1="' + pL + '" y1="' + (pT + innerH / 2) + '" x2="' + (w - pR) + '" y2="' + (pT + innerH / 2) + '" stroke="#cbd5e1" stroke-dasharray="5 5" stroke-width="1.5"/>' +
          "</svg>" +
        "</div>"
      );
    }
    const min = Math.min.apply(null, nums);
    const max = Math.max.apply(null, nums);
    const span = (max - min) || Math.abs(max) || 1;
    const pad = span * 0.12;
    const lo = min - pad, hi = max + pad;
    const n = Math.max(pts.length - 1, 1);
    const xy = pts.map(function (p, i) {
      const x = pL + (i / n) * innerW;
      if (p.v == null) return { x: x, y: null };
      const y = pT + innerH - ((p.v - lo) / (hi - lo)) * innerH;
      return { x: x, y: y, v: p.v };
    });
    /* baseline = median of first half (visual steady) */
    const firstHalf = nums.slice(0, Math.max(1, Math.floor(nums.length / 2))).slice().sort(function (a, b) { return a - b; });
    const med = firstHalf[Math.floor(firstHalf.length / 2)];
    const baseY = pT + innerH - ((med - lo) / (hi - lo)) * innerH;
    let d = "";
    let drawing = false;
    xy.forEach(function (p) {
      if (p.y == null) { drawing = false; return; }
      d += (drawing ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1) + " ";
      drawing = true;
    });
    const last = xy.filter(function (p) { return p.y != null; }).pop();
    const firstDate = pts[0] && pts[0].date ? pts[0].date : "";
    const lastDate = pts[pts.length - 1] && pts[pts.length - 1].date ? pts[pts.length - 1].date : "";
    return (
      '<div class="chart">' +
        '<div class="chart-title">' + esc(title) + "</div>" +
        '<p class="chart-cap">' + esc((firstDate || "start") + " → " + (lastDate || "end") + " · dashed = first-half median") + "</p>" +
        '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
          '<line x1="' + pL + '" y1="' + baseY.toFixed(1) + '" x2="' + (w - pR) + '" y2="' + baseY.toFixed(1) + '" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1"/>' +
          '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
          (last ? '<circle cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="3.2" fill="' + color + '"/>' : "") +
        "</svg>" +
      "</div>"
    );
  }

  function sourceCard(src) {
    const yt = src.highlight || src.id === "youtube";
    const primary = src.views || src.sessions || src.users || {};
    const watch = src.watch_hours;
    const spend = src.spend;
    let extra = "";
    if (watch && !isNil(watch.last_7d)) extra = "Watch hours " + (fmtNum(watch.last_7d, "hours") || "—");
    else if (watch) extra = "Watch hours Unknown";
    else if (spend) extra = isNil(spend.last_7d) ? "Spend Unknown" : ("Spend " + fmtNum(spend.last_7d, "usd"));
    return (
      '<div class="src' + (yt ? " yt" : "") + '">' +
        "<h3>" + esc(src.label || src.id) + (yt ? " · highlight" : "") + "</h3>" +
        '<div class="sv">' + (fmtVal(primary.last_7d, src.views ? null : null) == null && isNil(primary.last_7d) ? "Unknown" : esc(fmtNum(primary.last_7d, null) || "Unknown")) + "</div>" +
        '<div class="sd">' + esc((src.views ? "Views" : "Sessions / users") + " · last 7d") + "</div>" +
        '<div class="sd">' + esc(extra) + "</div>" +
        '<div class="stamp" style="margin-top:6px">' + metricStamp(primary) + "</div>" +
      "</div>"
    );
  }

  function render(data) {
    const w = data.windows || {};
    const ran = data.last_run_at_et;
    const st = data.statuses || {};
    const traffic = data.traffic || {};
    const leads = data.leads || {};
    const money = data.money || {};
    const answer = data.answer || {};
    const context = data.context || {};
    const days = (traffic.series && traffic.series.days) || [];
    const ov = traffic.overall || {};
    const notices = data.notices || [];
    const steady = data.steady_checks || [];
    const changes = data.notable_changes || [];
    const blockers = data.blockers || [];
    const trends = context.google_trends || {};
    const tuan = context.tuan_messages || {};

    const banner = ran ? "" : (
      '<div class="banner">Weekly board is <strong>scaffolded for the first pull</strong>. Every KPI is <strong>Unknown</strong> on purpose — do not treat empty as zero. ' +
      'Fill <code>LAST-RUN.json</code> using <a href="WEEKLY-PLAYBOOK.md">WEEKLY-PLAYBOOK.md</a>. ' +
      'A 10-day audit from Sep 8 sits in JSON as <code>legacy_10d_audit</code> and is <em>not</em> copied into these 7-day slots.</div>'
    );

    const hero = (
      '<div class="hero">' +
        "<h1>EMC · Weekly funnel check</h1>" +
        '<p class="sub">Easy Massage Chair · Traffic → leads → money/answer. Prefer <strong>YoY same dates</strong> for seasonality. Ads conversions are weak — unique sales calls + checklist GP are the truth. ' +
        '<a href="WEEKLY-PLAYBOOK.md">Weekly playbook</a></p>' +
        '<div class="meta">' +
          '<span class="chip">Last run <strong>' + esc(ran || "not yet") + "</strong></span>" +
          '<span class="chip">Last 7d <strong>' + esc(winLabel(w.last_7d)) + "</strong></span>" +
          '<span class="chip">Prior 7d <strong>' + esc(winLabel(w.prior_7d)) + "</strong></span>" +
          '<span class="chip">YoY 7d <strong>' + esc(winLabel(w.yoy_7d)) + "</strong></span>" +
          '<span class="chip">Charts <strong>' + esc((w.chart_30_50d && w.chart_30_50d.days) ? (w.chart_30_50d.days + "d") : "30–50d") + "</strong></span>" +
        "</div>" +
        '<div class="pills">' +
          pill(st.traffic, "Traffic " + (normStatus(st.traffic) === "steady" ? "✓ Steady" : (st.traffic || "Unknown"))) +
          pill(st.leads, "Leads " + (normStatus(st.leads) === "steady" ? "✓ Steady" : (st.leads || "Unknown"))) +
          pill(st.money, "Money " + (normStatus(st.money) === "steady" ? "✓ Steady" : (st.money || "Unknown"))) +
          pill(st.answer, "Answer " + (normStatus(st.answer) === "steady" ? "✓ Steady" : (st.answer || "Unknown"))) +
          pill(st.context, "Context " + (normStatus(st.context) === "steady" ? "✓ Steady" : (st.context || "Unknown"))) +
        "</div>" +
      "</div>"
    );

    const trafficSec = (
      '<div class="section-label">1 · Traffic</div>' +
      '<article class="stage highlight-yt">' +
        '<div class="top"><div>' +
          "<h2>Traffic · overall + sources</h2>" +
          '<p class="q">Is demand landing — and are YouTube views + watch hours holding vs last year?</p>' +
        "</div>" + pill(traffic.status) + "</div>" +
        '<p class="ans">' + esc(traffic.status_reason || traffic.cos_note || "Unknown until GA4, YouTube Studio, and Google Ads are pulled for the weekly windows.") + "</p>" +
        '<div class="metrics">' +
          metricCard("Site users", ov.users, null, "") +
          metricCard("Site sessions", ov.sessions, null, "") +
          metricCard("YouTube views", ov.yt_views, null, "yt") +
          metricCard("YouTube watch hours", ov.yt_watch_hours, "hours", "yt") +
        "</div>" +
        '<div class="sources">' + (traffic.sources || []).map(sourceCard).join("") + "</div>" +
        '<div class="charts">' +
          lineChart(days, "users", "Site users · 30–50d", "#0126de") +
          lineChart(days, "yt_views", "YouTube views · 30–50d", "#0f8a0c") +
          lineChart(days, "yt_watch_hours", "YouTube watch hours · 30–50d", "#e018cf") +
        "</div>" +
        '<p class="ux">PMax / retargeting filtered for denominators: <strong>' +
          esc(traffic.pmax_retargeting_filtered ? "Yes" : "No / not noted") + "</strong>" +
          (traffic.pmax_retargeting_note ? " — " + esc(traffic.pmax_retargeting_note) : "") +
        "</p>" +
      "</article>"
    );

    const ux = (leads.ux_review_prompts && leads.ux_review_prompts.length)
      ? '<div class="ux"><strong>UX review prompts:</strong> ' + leads.ux_review_prompts.map(function (x) { return esc(x); }).join(" · ") + "</div>"
      : '<div class="ux"><strong>UX review prompts:</strong> None yet. Trigger when calls/visitor or engagement drop while traffic holds (PDP CTA, DNI, YT description number, landing match, chat overlay).</div>';

    const leadsSec = (
      '<div class="section-label">2 · Leads / conversion</div>' +
      '<article class="stage">' +
        '<div class="top"><div>' +
          "<h2>Leads · unique sales calls vs traffic</h2>" +
          '<p class="q">Are visitors and viewers becoming unique sales calls? Is the site still worth lingering on?</p>' +
        "</div>" + pill(leads.status) + "</div>" +
        '<p class="ans">' + esc(leads.status_reason || leads.cos_note || "Unknown until CallRail unique sales calls and YT-number calls are pulled.") + "</p>" +
        '<div class="metrics">' +
          metricCard("Unique sales calls", leads.unique_sales_calls, null, "") +
          metricCard("Calls / visitor", leads.calls_per_visitor, "ratio", "") +
          metricCard("Calls / YT view", leads.calls_per_yt_view, "ratio", "") +
          metricCard("YT-# calls / watch hour", leads.yt_phone_calls_per_watch_hour, "ratio", "yt") +
          metricCard("YT phone # calls", leads.yt_phone_calls, null, "yt") +
          metricCard("Avg engagement time", leads.avg_engagement_time_sec, "sec", "") +
          metricCard("Bounce rate", leads.bounce_rate, "bounce", "") +
          metricCard("Zoho chats", leads.chats, null, "") +
        "</div>" + ux +
      "</article>"
    );

    const moneySec = (
      '<div class="section-label">3 · Money / answer</div>' +
      '<article class="stage">' +
        '<div class="top"><div>' +
          "<h2>Money · what a call is worth</h2>" +
          '<p class="q">Revenue per call is useful. <strong>Avg GP per sales call is the KEY light.</strong></p>' +
        "</div>" + pill(money.status) + "</div>" +
        '<p class="ans">' + esc(money.status_reason || money.cos_note || "Unknown until Business Checklist sales + GP are pulled for last 7d. Do not apply a guessed margin.") + "</p>" +
        '<div class="metrics">' +
          metricCard("Avg GP / sales call", money.avg_gp_per_sales_call, "usd", "key") +
          metricCard("Avg revenue / sales call", money.avg_revenue_per_sales_call, "usd", "") +
          metricCard("Revenue / visitor", money.revenue_per_visitor, "usd", "") +
          metricCard("Revenue / YT view", money.revenue_per_yt_view, "usd", "") +
          metricCard("Revenue", money.revenue, "usd", "") +
          metricCard("Gross profit", money.gross_profit, "usd", "") +
          metricCard("Closed sales", money.closed_sales, null, "") +
          metricCard("Ads % of sales", money.ads_pct_of_sales, "bounce", "") +
        "</div>" +
      "</article>" +
      '<article class="stage">' +
        '<div class="top"><div>' +
          "<h2>Answer · team vs Answer Connect / VM</h2>" +
          '<p class="q">During business hours, what % of sales-queue calls did the team pick up (not AC, not voicemail)?</p>' +
        "</div>" + pill(answer.status) + "</div>" +
        '<p class="ans">' + esc(answer.status_reason || answer.cos_note || "Unknown until RingCentral Sales EMC is pulled. CallRail is not the answer-rate meter.") + "</p>" +
        '<div class="metrics">' +
          metricCard("% answered by team (BH)", answer.pct_answered_by_team_bh, "pct_bh", "key") +
          metricCard("Team answered (BH)", answer.team_answered_bh, null, "") +
          metricCard("Answer Connect (BH)", answer.answer_connect_bh, null, "") +
          metricCard("Voicemail (BH)", answer.voicemail_bh, null, "") +
          metricCard("Abandoned (BH)", answer.abandoned_bh, null, "") +
        "</div>" +
        '<p class="ux">' + esc(answer.business_hours_note || "Confirm Sales EMC staffed hours in RingCentral.") +
          (answer.shared_queue ? " · Shared queue with another channel — do not blend." : "") +
        "</p>" +
      "</article>"
    );

    const ctxSec = (
      '<div class="section-label">4 · Context</div>' +
      '<article class="stage">' +
        '<div class="top"><div>' +
          "<h2>Category vs us</h2>" +
          '<p class="q">If everything is down, is the industry slow — or only EMC?</p>' +
        "</div>" + pill(context.status) + "</div>" +
        '<div class="ctx-row">' +
          '<div class="src">' +
            "<h3>Google Trends · massage chair</h3>" +
            '<div class="sv">' + esc(trends.direction || "Unknown") + "</div>" +
            '<div class="sd">' + esc(trends.checked ? (trends.note || "Checked") : "Not checked this week") + "</div>" +
            '<div class="sd"><a href="' + esc(trends.url || "https://trends.google.com/trends/explore?geo=US&q=massage%20chair") + '" target="_blank" rel="noopener">Open Trends (US)</a></div>' +
          "</div>" +
          '<div class="src">' +
            "<h3>Tuan · Google Messages</h3>" +
            '<div class="sv">' + esc(tuan.industry_vs_emc || (tuan.checked ? "Checked" : "Unknown")) + "</div>" +
            '<div class="sd">' + esc(tuan.checked ? (tuan.note || "Checked") : "Not checked this week — do not reuse an old vibe") + "</div>" +
          "</div>" +
        "</div>" +
      "</article>"
    );

    const changeItems = changes.length ? changes.map(function (c) {
      return "<li><div class=\"when\">" + esc(c.date_et || "—") + "</div><div><strong>" + esc(c.event || "") + "</strong>" +
        (c.owner ? " · " + esc(c.owner) : "") +
        (c.could_affect && c.could_affect.length ? "<div class=\"sd\">Could affect: " + esc(c.could_affect.join(", ")) + "</div>" : "") +
        "</div></li>";
    }).join("") : "<li><div class=\"when\">—</div><div>No material changes logged this week.</div></li>";

    const chgSec = (
      '<div class="section-label">5 · Notable changes</div>' +
      '<article class="stage">' +
        '<div class="top"><div>' +
          "<h2>What changed (so we don’t blame the wrong stage)</h2>" +
          '<p class="q">DNI, PDP copy, bid cuts, YT uploads, RC/AC routing, promo.</p>' +
        "</div></div>" +
        '<ul class="log">' + changeItems + "</ul>" +
      "</article>"
    );

    let nCards = "";
    if (notices.length) {
      nCards += notices.map(function (n) {
        const text = typeof n === "string" ? n : (n.text || JSON.stringify(n));
        const sev = (typeof n === "object" && n.severity) ? n.severity : "moved";
        const cls = sev === "red" ? "red" : "moved";
        return '<div class="ncard ' + cls + '"><p class="nl">Moved</p><p>' + esc(text) + "</p></div>";
      }).join("");
    }
    if (steady.length) {
      nCards += steady.map(function (n) {
        const text = typeof n === "string" ? n : (n.text || JSON.stringify(n));
        return '<div class="ncard steady"><p class="nl">✓ Steady</p><p>' + esc(text) + "</p></div>";
      }).join("");
    }
    if (!notices.length && !steady.length) {
      nCards = '<div class="ncard unk"><p class="nl">Pending first pull</p><p>No diagnosis yet. Healthy weeks should still show <strong>✓ Steady</strong> on each section — do not hide a green board.</p></div>';
    }

    const noticeSec = (
      '<div class="section-label">6 · Notice this</div>' +
      '<article class="stage">' +
        '<div class="top"><div>' +
          "<h2>Diagnosis cards (or ✓ Steady)</h2>" +
          '<p class="q">Top cards only when something moved. Keep healthy checks visible.</p>' +
        "</div></div>" +
        '<div class="notice-grid">' + nCards + "</div>" +
        (data.leak_callout ? '<p class="ux" style="margin-top:10px"><strong>Where’s the leak?</strong> ' + esc(data.leak_callout) + "</p>" : "") +
        (blockers.length ? '<ul class="blockers">' + blockers.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul>" : "") +
      "</article>"
    );

    const legend = (
      '<div class="legend">' +
        "<strong>How to read:</strong> Prefer YoY same dates over WoW. Line charts = visual steady vs first-half median (not a fake zero). " +
        "Lime <strong>✓ Steady</strong> means that KPI was pulled and held. Yellow/red = moved. Slate = Unknown (not zero). " +
        "KEY money light = avg GP per sales call. KEY answer light = % answered by team during business hours (not Answer Connect / VM). " +
        "Significant WoW/YoY moves → ping CoS 1:1 (see playbook)." +
        "<br/><br/>" +
        '<a href="WEEKLY-PLAYBOOK.md">WEEKLY-PLAYBOOK.md</a> · ' +
        '<a href="PROCESS.md">10-day audit (PROCESS.md)</a> · ' +
        '<a href="https://docs.google.com/document/d/1rYekaYPpaQG6u83GS2DtrXguzEG2BXEvil_9eXlUc4Q/edit" target="_blank" rel="noopener">EMC Planner</a> · ' +
        '<a href="' + esc(trends.url || "https://trends.google.com/trends/explore?geo=US&q=massage%20chair") + '" target="_blank" rel="noopener">Google Trends</a>' +
      "</div>" +
      '<p class="footer">EMC weekly-funnel-v1 · channel ' + esc(data.channel || "easy-massage-chair") +
        " · schema " + esc(data.version || "") +
        " · live " + esc(data.dashboard_published_url || "") +
      "</p>"
    );

    $app.innerHTML = hero + banner + trafficSec + leadsSec + moneySec + ctxSec + chgSec + noticeSec + legend;
  }

  function fail(msg) {
    $app.innerHTML = '<div class="hero"><h1>EMC · Weekly funnel check</h1><p class="sub">' +
      esc(msg) + ' Open <a href="WEEKLY-PLAYBOOK.md">WEEKLY-PLAYBOOK.md</a>.</p></div>';
  }

  fetch(FALLBACK_URL, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      fail("Could not load LAST-RUN.json (" + e.message + "). Serve this folder over HTTP (GitHub Pages) or place LAST-RUN.json beside index.html.");
    });
})();
</script>
</body>
</html>
